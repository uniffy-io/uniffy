version: v2
plugins:
    # Python (pin to the protobuf runtime version in pyproject so regen stays
    # reproducible; an unpinned remote tracks latest and bumps the gencode
    # version guard ahead of the installed runtime)
    - remote: buf.build/protocolbuffers/python:v35.0
      out: src/gen/python/src/uniffy_proto
    - remote: buf.build/protocolbuffers/pyi:v35.0
      out: src/gen/python/src/uniffy_proto
    - local: .venv/bin/protoc-gen-connectrpc
      out: src/gen/python/src/uniffy_proto
      strategy: all

    # TypeScript (v2: protoc-gen-es emits services inline)
    - local: protoc-gen-es
      out: src/gen/typescript
      opt:
        - target=ts
        - import_extension=js

    # Go
    - remote: buf.build/protocolbuffers/go
      out: src/gen/go
      opt: module=github.com/uniffy-io/uniffy-proto-go
    - remote: buf.build/grpc/go
      out: src/gen/go
      opt: module=github.com/uniffy-io/uniffy-proto-go
    - remote: buf.build/connectrpc/go
      out: src/gen/go
      opt: module=github.com/uniffy-io/uniffy-proto-go
