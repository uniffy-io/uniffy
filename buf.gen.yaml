version: v2
plugins:
    # Generated Python code requires a runtime at least as recent as the compiler.
    - remote: buf.build/protocolbuffers/python:v36.2
      out: src/proto/gen/python/src/uniffy_proto
    - remote: buf.build/protocolbuffers/pyi:v36.2
      out: src/proto/gen/python/src/uniffy_proto
    - local: .venv/bin/protoc-gen-connectrpc
      out: src/proto/gen/python/src/uniffy_proto
      strategy: all
      opt: protobuf=google

    - local: protoc-gen-es
      out: src/proto/gen/typescript
      opt:
        - target=ts
        - import_extension=js

    - remote: buf.build/protocolbuffers/go:v1.36.12
      out: src/proto/gen/go
      opt: module=github.com/uniffy-io/uniffy-proto-go
    - remote: buf.build/grpc/go:v1.6.2
      out: src/proto/gen/go
      opt: module=github.com/uniffy-io/uniffy-proto-go
    - remote: buf.build/connectrpc/go:v1.21.0
      out: src/proto/gen/go
      opt: module=github.com/uniffy-io/uniffy-proto-go
