[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uniffy"
version = "0.1.0"
description = "Your Work, connected"
readme = "README.md"
authors = [
  { name = "kaibauniffy", email = "326951564+kaibauniffy@users.noreply.github.com" },
  { name = "yugiuniffy", email = "326952762+yugiuniffy@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
  "aiofiles>=25.1.0",
  "alembic>=1.13.0",
  "asyncpg>=0.30.0",
  "bcrypt>=4.2.1",
  "colorama>=0.4.6",
  "connect-python>=0.7.0",
  "fastapi>=0.128.0",
  "jinja2>=3.1.6",
  "loguru>=0.7.3",
  "meilisearch-python-sdk>=5.5.0",
  "protobuf>=7.34.0",
  "protoc-gen-connect-python>=0.7.0",
  "psycopg2-binary>=2.9.10",
  "pydantic[email]>=2.12.5",
  "pyjwt>=2.10.0",
  "python-dotenv>=1.2.1",
  "python-multipart>=0.0.21",
  "sqlmodel>=0.0.25",
  "hypercorn>=0.17.0",
  "h2>=4.2.0",
  "aioboto3>=13.0.0",
  "types-aiobotocore[s3]>=2.15.0",
  # Background jobs
  "arq>=0.26.0",
  # Image processing
  "pillow>=11.0.0",
  # PDF thumbnail generation
  "pymupdf>=1.25.0",
  # Video thumbnail generation (requires ffmpeg binary on system)
  "ffmpeg-python>=0.2.0",
  # Audio metadata extraction
  "mutagen>=1.47.0",
  # Document text extraction
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "python-pptx>=1.0.0",
  # Web Push notifications (VAPID)
  "pywebpush>=2.0.0",
  # Prometheus metrics
  "prometheus-client>=0.21.0",
  # LLM provider SDKs
  "anthropic>=0.52.0",
  "openai>=2.26.0",
  # Cron expression parsing
  "croniter>=6.0.0",
  "google-genai>=1.20.0",
]

[dependency-groups]
dev = [
  "pip-licenses>=5.5.0",
  "pytest>=8.0.0",
  "pytest-benchmark>=5.0.0",
  "ruff>=0.14.13",
  "ty>=0.0.10",
  # Worker hot reload
  "watchfiles>=1.0.0",
]

# Relax rules for test files
[[tool.ty.overrides]]
include = ["tests/**", "**/test_*.py"]
exclude = ["*.proto"]

[tool.pyright]
exclude = ["**", "./**/**"]
reportCallIssue = false
# analysisIgnore = ["**", "./**/**"]
reportAny = false
reportExplicitAny = false
reportGeneralTypeIssues = false
reportUnknownParameterType = false
reportPrivateImportUsage = false
reportMissingImports = false
reportImplicitStringConcatenation = false
reportFunctionMemberAccess = false
reportUnknownModuleTypes = false
reportPossiblyUnboundVariable = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownAttribute = false
reportUnknownMemberType = false
reportUnknownGlobalVariableType = false
reportUnknownModuleType = false
reportUnknownFunctionType = false
reportReturnType = false
reportOptionalOperand = false
reportAssignmentType = false
reportAttributeAccessIssue = false
reportArgumentType = false
reportIncompatibleVariableOverride = false
reportIncompatibleMethodOverride = false
reportOptionalMemberAccess = false
reportOptionalMethodAccess = false
reportOptionalFunctionAccess = false
reportOptionalType = false
reportOptionalCall = false
reportOptionalSubscript = false
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 101
preview = true
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "**/stanza-cache",
  "**/models-cache",
  "tests/",
]

[tool.ruff.lint]
exclude = ["*.ipynb"]
ignore = ["UP007", "SIM102", "UP042", "E402", "B904"]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

exclude = ["*.ipynb"]
