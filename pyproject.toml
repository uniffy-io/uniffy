[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uniffy"
version = "0.1.0"
description = "Teamwork. simplified, amplified, unified."
readme = "README.md"
authors = [
  { name = "kaibauniffy", email = "326951564+kaibauniffy@users.noreply.github.com" },
  { name = "yugiuniffy", email = "326952762+yugiuniffy@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
  "uniffy-proto",
  "aiofiles>=25.1.0",
  "alembic>=1.18.5",
  "asyncpg>=0.30.0",
  "bcrypt>=4.2.1",
  "argon2-cffi>=25.1.0",
  "cryptography>=49.0.0",
  # MFA (TOTP)
  "pyotp>=2.9.0",
  "segno>=1.6.6",
  "colorama>=0.4.6",
  "aiosmtplib>=5.1.0",
  "fastapi>=0.139.2",
  "starlette>=1.3.1",
  "jinja2>=3.1.6",
  "loguru>=0.7.3",
  "meilisearch-python-sdk[orjson]>=7.5.0",
  "psycopg2-binary>=2.9.10",
  "pydantic[email]>=2.13.4",
  "pyjwt>=2.10.0",
  "python-dotenv>=1.2.1",
  "python-multipart>=0.0.32",
  "sqlmodel>=0.0.39",
  "sqlalchemy>=2.0.51",
  "granian>=2.8.2",
  "aioboto3>=13.0.0",
  "types-aiobotocore[s3]>=2.15.0",
  # Background jobs: arq is vendored under uniffy.vendor.arq (valkey-backed); it needs click.
  "valkey[libvalkey]>=6.1.1",
  "click>=8.0",
  # Image processing
  "pillow>=11.0.0",
  # PDF thumbnail generation
  "pymupdf>=1.28.0",
  # Video: PyAV (in-process libav) decodes thumbnail frames; transcode still shells to the ffmpeg binary
  "av>=18.0.0",
  # Audio metadata extraction
  "mutagen>=1.47.0",
  # Document text extraction
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "python-pptx>=1.0.0",
  # Web Push notifications (VAPID)
  "pywebpush>=2.0.0",
  # Prometheus metrics
  "prometheus-client>=0.21.0",
  # LLM provider SDKs
  "anthropic>=0.117.0",
  "openai>=2.46.0",
  # Cron expression parsing
  "croniter>=6.0.0",
  "google-genai>=2.12.1",
  "connectrpc>=0.10.0",
  "pyqwest>=0.7.0",
  # Realtime collaboration (CRDT)
  "pycrdt>=0.13.0",
  "pycrdt-websocket>=0.16.1",
  "orjson>=3.12.0",
  # iCalendar (RFC 5545) serialization and parsing
  "icalendar>=7.3.0",
]

[dependency-groups]
dev = [
  "import-linter>=2.13",
  "pip-licenses>=5.5.0",
  "protoc-gen-connectrpc>=0.10.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=1.4.0",
  "pytest-benchmark>=5.0.0",
  "ruff>=0.16.3",
  "ty>=0.0.72",
  # Worker hot reload
  "watchfiles>=1.0.0",
]

[tool.uv.workspace]
members = ["src/gen/python"]

[tool.uv.sources]
uniffy-proto = { workspace = true }

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.rules]
all = "ignore"
blanket-ignore-comment = "error"
missing-argument = "error"

[tool.pytest.ini_options]
# Coroutine tests run without a marker; a test that forgets one is a silent
# skip in strict mode, so auto keeps async the default across every suite.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 101
preview = true
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "tests/",
  "src/uniffy/tests",
  "src/gen",
]
# Third-party code and historical migrations stay unchanged; extend-exclude survives
# the CLI --exclude that manage.py passes, unlike exclude.
extend-exclude = ["src/uniffy/migrations", "src/uniffy/tests", "src/uniffy/vendor"]

[tool.ruff.lint]
ignore = ["UP007", "SIM102", "UP042", "E402", "B904"]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # flake8-datetimez - naive datetimes violate the UTC-only backend invariant
  "DTZ",
  # isort
  "I",
  # Product-owned comparison values use enums or named constants.
  "PLR2004",
  # flake8-bandit: reject unsafe code, permissions, transport, parser, process, and template APIs.
  # manage.py repeats selected Bandit and banned-API rules with source suppressions disabled.
  "S102",
  "S103",
  "S113",
  "S2",
  "S30",
  "S310",
  "S312",
  "S313",
  "S314",
  "S315",
  "S316",
  "S317",
  "S318",
  "S319",
  "S321",
  "S323",
  "S324",
  "S4",
  "S5",
  "S601",
  "S602",
  "S603",
  "S604",
  "S605",
  "S606",
  "S607",
  "S609",
  "S610",
  "S611",
  "S612",
  "S702",
  "S704",
  # Backend JSON goes through the shared orjson codec.
  "TID251",
]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "float", "bytes"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio.create_subprocess_shell".msg = "Shell execution is forbidden; use asyncio.create_subprocess_exec with a fixed executable and separate arguments."
"json".msg = "Use uniffy.core.json_codec instead of the stdlib json module."

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.importlinter]
root_package = "uniffy"

[[tool.importlinter.contracts]]
name = "Core must not import domains"
type = "forbidden"
source_modules = ["uniffy.core"]
forbidden_modules = ["uniffy.domains"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Infrastructure must not import domains"
type = "forbidden"
source_modules = ["uniffy.infrastructure"]
forbidden_modules = ["uniffy.domains"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Reusable application layers must not import transport"
type = "forbidden"
source_modules = ["uniffy.core", "uniffy.domains", "uniffy.infrastructure"]
forbidden_modules = ["uniffy.transport"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Transport must not import domains"
type = "forbidden"
source_modules = ["uniffy.transport"]
forbidden_modules = ["uniffy.domains"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Reusable layers must not import process roots"
type = "forbidden"
source_modules = ["uniffy.core", "uniffy.domains", "uniffy.infrastructure", "uniffy.transport"]
forbidden_modules = ["uniffy.factory", "uniffy.main", "uniffy.workers"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Application layers must not import search adapters"
type = "forbidden"
source_modules = ["uniffy.core", "uniffy.domains"]
forbidden_modules = ["uniffy.infrastructure.search"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Application layers must not import storage adapters"
type = "forbidden"
source_modules = ["uniffy.core", "uniffy.domains"]
forbidden_modules = ["uniffy.infrastructure.storage"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Application layers must not import observability adapters"
type = "forbidden"
source_modules = ["uniffy.core", "uniffy.domains"]
forbidden_modules = ["uniffy.infrastructure.observability"]
allow_indirect_imports = true
