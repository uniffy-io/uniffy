[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uwos"
version = "0.1.0"
description = "The Operating System for Work"
readme = "README.md"
authors = [
  { name = "kaibauniffy", email = "326951564+kaibauniffy@users.noreply.github.com" },
  { name = "yugiuniffy", email = "326952762+yugiuniffy@users.noreply.github.com" },
]
requires-python = ">=3.13"
dependencies = [
  "aiofiles>=25.1.0",
  "alembic>=1.13.0",
  "asyncpg>=0.30.0",
  "bcrypt>=4.2.1",
  "colorama>=0.4.6",
  "connect-python>=0.7.0",
  "fastapi>=0.128.0",
  "grpcio>=1.76.0",
  "grpcio-reflection>=1.76.0",
  "grpcio-tools>=1.76.0",
  "jinja2>=3.1.6",
  "loguru>=0.7.3",
  "meilisearch-python-sdk>=5.5.0",
  "protoc-gen-connect-python>=0.7.0",
  "psycopg2-binary>=2.9.10",
  "pydantic[email]>=2.12.5",
  "pyjwt>=2.10.0",
  "python-dotenv>=1.2.1",
  "python-multipart>=0.0.21",
  "sqlmodel>=0.0.25",
  "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.76.0",
    "pip-licenses>=5.5.0",
    "ruff>=0.14.13",
    "ty>=0.0.10",
]

# Relax rules for test files
[[tool.ty.overrides]]
include = ["tests/**", "**/test_*.py"]
exclude = ["*.proto"]

[tool.pyright]
exclude = ["**", "./**/**"]
reportCallIssue = false
# analysisIgnore = ["**", "./**/**"]
reportAny = false
reportExplicitAny = false
reportGeneralTypeIssues = false
reportUnknownParameterType = false
reportMissingImports = false
reportImplicitStringConcatenation = false
reportFunctionMemberAccess = false
reportUnknownModuleTypes = false
reportPossiblyUnboundVariable = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownAttribute = false
reportUnknownMemberType = false
reportUnknownGlobalVariableType = false
reportUnknownModuleType = false
reportUnknownFunctionType = false
reportReturnType = false
reportOptionalOperand = false
reportAssignmentType = false
reportAttributeAccessIssue = false
reportArgumentType = false
reportIncompatibleVariableOverride = false
reportIncompatibleMethodOverride = false
reportOptionalMemberAccess = false
reportOptionalMethodAccess = false
reportOptionalFunctionAccess = false
reportOptionalType = false
reportOptionalCall = false
reportOptionalSubscript = false
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 101
preview = true
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "**/stanza-cache",
  "**/models-cache",
  "tests/",
]

[tool.ruff.lint]
exclude = ["*.ipynb"]
ignore = ["UP007", "SIM102", "UP042", "E402", "B904"]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

exclude = ["*.ipynb"]
