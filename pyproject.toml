[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uniffy"
version = "0.1.0"
description = "Teamwork. simplified, amplified, unified."
readme = "README.md"
authors = [
  { name = "kaibauniffy", email = "326951564+kaibauniffy@users.noreply.github.com" },
  { name = "yugiuniffy", email = "326952762+yugiuniffy@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
  "uniffy-proto",
  "aiofiles>=25.1.0",
  "alembic>=1.18.5",
  "asyncpg>=0.30.0",
  "bcrypt>=4.2.1",
  "argon2-cffi>=25.1.0",
  "cryptography>=49.0.0",
  # MFA (TOTP)
  "pyotp>=2.9.0",
  "segno>=1.6.6",
  "colorama>=0.4.6",
  "aiosmtplib>=5.1.0",
  "fastapi>=0.139.2",
  "starlette>=1.3.1",
  "jinja2>=3.1.6",
  "loguru>=0.7.3",
  "meilisearch-python-sdk>=5.5.0",
  "psycopg2-binary>=2.9.10",
  "pydantic[email]>=2.13.4",
  "pyjwt>=2.10.0",
  "python-dotenv>=1.2.1",
  "python-multipart>=0.0.32",
  "sqlmodel>=0.0.39",
  "sqlalchemy>=2.0.51",
  "granian>=2.7.9",
  "aioboto3>=13.0.0",
  "types-aiobotocore[s3]>=2.15.0",
  # Background jobs: arq is vendored under uniffy.vendor.arq (valkey-backed); it needs click.
  "valkey[libvalkey]>=6.1.1",
  "click>=8.0",
  # Image processing
  "pillow>=11.0.0",
  # PDF thumbnail generation
  "pymupdf>=1.28.0",
  # Video: PyAV (in-process libav) decodes thumbnail frames; transcode still shells to the ffmpeg binary
  "av>=18.0.0",
  # Audio metadata extraction
  "mutagen>=1.47.0",
  # Document text extraction
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "python-pptx>=1.0.0",
  # Web Push notifications (VAPID)
  "pywebpush>=2.0.0",
  # Prometheus metrics
  "prometheus-client>=0.21.0",
  # LLM provider SDKs
  "anthropic>=0.117.0",
  "openai>=2.46.0",
  # Cron expression parsing
  "croniter>=6.0.0",
  "google-genai>=2.12.1",
  "connectrpc>=0.10.0",
  "pyqwest>=0.7.0",
  # Realtime collaboration (CRDT)
  "pycrdt>=0.13.0",
  "pycrdt-websocket>=0.16.1",
]

[dependency-groups]
dev = [
  "pip-licenses>=5.5.0",
  "protoc-gen-connectrpc>=0.10.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=1.4.0",
  "pytest-benchmark>=5.0.0",
  "ruff>=0.14.13",
  "ty>=0.0.10",
  # Worker hot reload
  "watchfiles>=1.0.0",
]

[tool.uv.workspace]
members = ["src/gen/python"]

[tool.uv.sources]
uniffy-proto = { workspace = true }

# Relax rules for test files
[[tool.ty.overrides]]
include = ["tests/**", "**/test_*.py"]
exclude = ["*.proto"]

[tool.pytest.ini_options]
# Coroutine tests run without a marker; a test that forgets one is a silent
# skip in strict mode, so auto keeps async the default across every suite.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 101
preview = true
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "tests/",
  "src/gen",
]
# Vendored third-party code (kept as a clean re-diff against upstream); not held to our style.
# extend-exclude survives the CLI --exclude that manage.py passes, unlike exclude.
extend-exclude = ["src/uniffy/vendor"]

[tool.ruff.lint]
ignore = ["UP007", "SIM102", "UP042", "E402", "B904"]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # flake8-datetimez - naive datetimes violate the UTC-only backend invariant
  "DTZ",
  # isort
  "I",
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
