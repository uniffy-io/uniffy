updateNotifier: false
packages:
  - src/ui
  - src/mobile
  - src/landing
  - src/proto/gen/typescript
  - src/e2e
allowBuilds:
  canvas: false
  esbuild: true
  sharp: true
  unrs-resolver: false
  workerd: false

