default_permissions = "uniffy-workspace"

[features]
hooks = true

[permissions.uniffy-workspace]
description = "Edit this repository while keeping local environment secrets unreadable."
extends = ":workspace"

[permissions.uniffy-workspace.filesystem.":workspace_roots"]
".env" = "deny"
".env.local" = "deny"

[mcp_servers.playwright]
url = "http://localhost:8931/mcp"
enabled = true
required = false
startup_timeout_sec = 5

[mcp_servers.playwright-b]
url = "http://localhost:8932/mcp"
enabled = true
required = false
startup_timeout_sec = 5
