syntax = "proto3";

package randomnum.v1;

// RandomService provides random number generation
service RandomService {
  // GetRandomNumber returns a random number
  rpc GetRandomNumber(GetRandomNumberRequest) returns (GetRandomNumberResponse) {}
}

// Request for getting a random number
message GetRandomNumberRequest {
  // Optional minimum value (default: 0)
  int32 min = 1;
  // Optional maximum value (default: 100)
  int32 max = 2;
}

// Response containing a random number
message GetRandomNumberResponse {
  // The generated random number
  int32 value = 1;
}
