# Docker Compose for testing production builds
# Usage: docker compose -f .docker/prod/docker-compose.yml up --build
# Access: https://localhost

name: uniffy-prod

services:
  caddy:
    image: caddy:2-alpine
    container_name: uniffy-caddy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - ui

  backend:
    build:
      context: ../..
      dockerfile: src/uniffy/Dockerfile
    container_name: uniffy-backend
    restart: unless-stopped
    env_file:
      - ./.env.backend
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  ui:
    build:
      context: ../../src/ui
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://localhost}
        - VITE_ENV=production
    container_name: uniffy-ui
    restart: unless-stopped
    env_file:
      - ./.env.ui
    depends_on:
      - backend

  postgres:
    image: postgres:18-alpine
    container_name: uniffy-postgres-prod
    restart: unless-stopped
    mem_limit: 6g
    mem_reservation: 4g
    environment:
      POSTGRES_USER: uniffy
      POSTGRES_PASSWORD: uniffy
      POSTGRES_DB: uniffy
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
    command:
      - "postgres"
      # Memory (tuned for 6GB container)
      - "-c"
      - "shared_buffers=1536MB"
      - "-c"
      - "effective_cache_size=4608MB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=384MB"
      - "-c"
      - "huge_pages=try"
      # Write-ahead log
      - "-c"
      - "wal_buffers=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      # Query planner (SSD optimized)
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      # Parallelism
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_maintenance_workers=2"
      # Connections
      - "-c"
      - "max_connections=100"
      # Logging (slow queries > 500ms)
      - "-c"
      - "log_min_duration_statement=500"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniffy -d uniffy"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 512mb

  rustfs:
    image: rustfs/rustfs:latest
    container_name: uniffy-rustfs-prod
    restart: unless-stopped
    environment:
      RUSTFS_ROOT_USER: rustfsadmin
      RUSTFS_ROOT_PASSWORD: rustfsadmin
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  rustfs_data:
  rustfs_logs:
