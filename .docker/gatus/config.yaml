storage:
  type: postgres
  path: "postgres://gatus:gatus@postgres:5432/gatus?sslmode=disable"

ui:
  title: "Uniffy Status"
  header: "Uniffy Status"
  description: "Real-time status and uptime monitoring for Uniffy services"
  logo: ""

endpoints:
  # ---- Application ----
  - name: App
    group: Application
    url: "https://cloud.uniffy.io"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"

  - name: Landing Page
    group: Application
    url: "https://uniffy.io"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"

  - name: Documentation
    group: Application
    url: "https://docs.uniffy.io"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"

  - name: Feedback
    group: Application
    url: "https://feedback.uniffy.io"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"

  # ---- Staging ----
  - name: Staging
    group: Staging
    url: "https://staging.uniffy.io"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"

