# Valkey memory variant for the qualification stack. QUAL_VALKEY_POLICY sets maxmemory-policy,
# allkeys-lru by default, which the realtime preflight refuses; QUAL_VALKEY_MAXMEMORY sets
# maxmemory, unlimited by default. A small maxmemory under noeviction reaches the pending budget
# and the OOM refusal. QUAL_PENDING_BUDGET_BYTES overrides the pending budget the preflight
# derives from maxmemory.
#
#   QUAL_VALKEY_POLICY=noeviction QUAL_VALKEY_MAXMEMORY=16mb \
#   docker compose -f .docker/compose/qualification.yaml \
#       -f .docker/compose/qualification-valkey.yaml -p uniffy-qual up -d --wait

x-budget: &budget
    REALTIME_PENDING_BUDGET_BYTES: ${QUAL_PENDING_BUDGET_BYTES:-}

services:
    valkey:
        command:
            - valkey-server
            - --appendonly
            - "yes"
            - --requirepass
            - uniffy-qualification
            - --maxmemory-policy
            - ${QUAL_VALKEY_POLICY:-allkeys-lru}
            - --maxmemory
            - ${QUAL_VALKEY_MAXMEMORY:-0}

    backend-a:
        environment: *budget

    backend-b:
        environment: *budget

    worker-core:
        environment: *budget
