# Containerized dev stack - edge (Caddy), backend, worker-core,
# worker-egress, ui, landing, plus the mobile metro server under its
# own `mobile` profile.
# All services bind-mount the repo, watch for changes, and reload.
# Dependency installs (uv sync, pnpm install) are skipped on subsequent
# starts when the lockfile hash is unchanged.
#
# Behavior (profiles are independent - stack core with dev for a working stack):
#   docker compose --profile core --profile dev up   infra + dev services
#   ./manage.py stack up                              equivalent shortcut
# Infra depends_on is intentionally omitted: dev services carry no health-gate
# on postgres/valkey/meilisearch, so they retry on their own until infra is up.
#
# Entry point is the edge at http://localhost - one origin for UI, API,
# and LiveKit signaling, mirroring the self-host customer topology.
# Direct ports (5173 vite, 8000 backend, 7880 livekit) stay published
# for tooling.
#
# Works identically on:
#   1. native localhost
#   2. SSH'd remote dev box with port forwarding:
#      ssh -L 8080:localhost:80 -L 7881:localhost:7881 dev-machine
#   Browser on your laptop hits http://localhost:8080 and connects through
#   the tunnel. Call media: 7882/udp cannot ride SSH, but LiveKit
#   advertises loopback ICE candidates (node-ip 127.0.0.1), so the browser
#   fails UDP fast and falls back to ICE/TCP on the tunneled 7881 - calls
#   work, just with TCP latency. Use a VPN for real media behavior.

x-backend-base: &backend-base
    build:
        context: ../..
        dockerfile: src/uniffy/dev.Dockerfile
    image: uniffy-dev-backend
    pull_policy: never
    restart: unless-stopped
    networks: [uniffy-network]
    env_file:
        - ../../.env
        - ../dev/backend.env
    environment:
        UV_CACHE_DIR: /uv-cache
    volumes:
        - ../../:/app
        # Shared download/wheel cache; uv syncs in any backend container
        # link from here instead of re-downloading.
        - uv-cache:/uv-cache
        - /app/.venv # anonymous volume hides host venv
        - /app/.ruff_cache
        - /app/.pytest_cache
    depends_on:
        deps-manager:
            condition: service_completed_successfully
    profiles: [dev, all]
    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "3"

services:
    edge:
        image: caddy:2-alpine
        container_name: uniffy-dev-edge
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ../dev/Caddyfile:/etc/caddy/Caddyfile:ro
        depends_on:
            - backend
            - ui
        networks: [uniffy-network]
        profiles: [dev, all]
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    backend:
        <<: *backend-base
        container_name: uniffy-dev-backend
        command: uv run watchfiles --filter python "python -m uniffy --backend" src/uniffy/ src/gen/python/
        ports:
            - "8000:8000"

    worker-core:
        <<: *backend-base
        container_name: uniffy-dev-worker-core
        command: uv run watchfiles --filter python "python -m uniffy --worker-core" src/uniffy/ src/gen/python/
        ports:
            - "9091:9091"

    worker-egress:
        <<: *backend-base
        container_name: uniffy-dev-worker-egress
        command: uv run watchfiles --filter python "python -m uniffy --worker-egress" src/uniffy/ src/gen/python/
        ports:
            - "9092:9092"

    # Shared base for every Node workspace dev container (ui, landing, ...).
    # Each service overrides command, ports, and PNPM_FILTER.
    ui:
        build: &node-build
            context: ../..
            dockerfile: src/ui/dev.Dockerfile
        image: uniffy-dev-node
        container_name: uniffy-dev-ui
        pull_policy: never
        restart: unless-stopped
        # verify-deps-before-run does a slow workspace-wide deps check on every
        # pnpm invocation; the entrypoint already handles installs, so skip it.
        command: pnpm --config.verify-deps-before-run=false --filter uniffy-ui dev
        environment:
            PNPM_FILTER: "uniffy-ui..."
            CI: "true"
            npm_config_store_dir: /pnpm-store
            npm_config_confirm_modules_purge: "false"
            npm_config_strict_dep_builds: "false"
            npm_config_verify_deps_before_run: "false"
        env_file:
            - ../dev/ui.env
        volumes: &node-volumes
            - ../../:/app
            # Shared content-addressable download cache; installs in any node
            # container hardlink from here instead of re-downloading.
            - pnpm-store:/pnpm-store
            - /app/node_modules
            - /app/src/ui/node_modules
            - /app/src/mobile/node_modules
            - /app/src/landing/node_modules
            - /app/src/gen/typescript/node_modules
            - /app/src/e2e/node_modules
        ports:
            - "5173:5173"
        depends_on:
            backend:
                condition: service_started
            deps-manager:
                condition: service_completed_successfully
        networks: [uniffy-network]
        profiles: [dev, all]
        logging: &node-logging
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    landing:
        build: *node-build
        image: uniffy-dev-node
        container_name: uniffy-dev-landing
        pull_policy: never
        restart: unless-stopped
        command: pnpm --config.verify-deps-before-run=false --filter uniffy-landing exec astro dev --host 0.0.0.0
        environment:
            PNPM_FILTER: "uniffy-landing..."
            CI: "true"
            npm_config_store_dir: /pnpm-store
            npm_config_confirm_modules_purge: "false"
            npm_config_strict_dep_builds: "false"
            npm_config_verify_deps_before_run: "false"
        volumes: *node-volumes
        ports:
            - "4321:4321"
        depends_on:
            deps-manager:
                condition: service_completed_successfully
        networks: [uniffy-network]
        profiles: [dev, all]
        logging: *node-logging

    mobile:
        build: *node-build
        image: uniffy-dev-node
        container_name: uniffy-dev-mobile
        pull_policy: never
        restart: unless-stopped
        command: pnpm --config.verify-deps-before-run=false --filter uniffy-mobile exec expo start
        environment:
            PNPM_FILTER: "uniffy-mobile..."
            CI: "true"
            # Skips the React Native DevTools chromium install, which cannot
            # run inside the container (no SUID/userns sandbox available)
            EXPO_UNSTABLE_HEADLESS: "1"
            npm_config_store_dir: /pnpm-store
            npm_config_confirm_modules_purge: "false"
            npm_config_strict_dep_builds: "false"
            npm_config_verify_deps_before_run: "false"
        volumes: *node-volumes
        ports:
            - "8081:8081"
        depends_on:
            deps-manager:
                condition: service_completed_successfully
        networks: [uniffy-network]
        profiles: [mobile, all]
        logging: *node-logging

    # Dependency/codegen toolbox (pnpm, uv, buf) doubling as the stack's init
    # step: on `up` its entrypoint syncs both toolchains (pre-warming the
    # shared pnpm-store/uv-cache) and exits; every app service waits for it
    # via service_completed_successfully. Also invoked one-off through
    # `./manage.py toolbox|proto|licenses`. Named volumes (not anonymous)
    # keep its node_modules/.venv across runs.
    deps-manager:
        build:
            context: ../..
            dockerfile: .docker/dev/deps-manager.Dockerfile
        image: uniffy-dev-deps-manager
        pull_policy: never
        command: ["true"]
        environment:
            CI: "true"
            UV_CACHE_DIR: /uv-cache
            npm_config_store_dir: /pnpm-store
            npm_config_confirm_modules_purge: "false"
            npm_config_strict_dep_builds: "false"
            npm_config_verify_deps_before_run: "false"
        volumes:
            - ../../:/app
            - pnpm-store:/pnpm-store
            - uv-cache:/uv-cache
            - deps-venv:/app/.venv
            - deps-node-modules:/app/node_modules
            - deps-ui-node-modules:/app/src/ui/node_modules
            - deps-mobile-node-modules:/app/src/mobile/node_modules
            - deps-landing-node-modules:/app/src/landing/node_modules
            - deps-gen-ts-node-modules:/app/src/gen/typescript/node_modules
            - deps-e2e-node-modules:/app/src/e2e/node_modules
            - deps-go-cache:/go-cache
        networks: [uniffy-network]
        profiles: [dev, mobile, all]
        logging: *node-logging

networks:
    uniffy-network:
        driver: bridge

volumes:
    pnpm-store:
    uv-cache:
    deps-venv:
    deps-node-modules:
    deps-ui-node-modules:
    deps-mobile-node-modules:
    deps-landing-node-modules:
    deps-gen-ts-node-modules:
    deps-e2e-node-modules:
    deps-go-cache:
