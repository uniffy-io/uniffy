# Core services - postgres, valkey (cache + LiveKit registry), meilisearch,
# livekit (SFU with embedded TURN; room registry on valkey DB 1, app uses DB 0),
# rustfs (S3-compatible object storage for the Files domain).
# Profile: core. Run standalone: docker compose -f .docker/compose/core.yaml --profile core up

x-defaults: &defaults
  restart: unless-stopped
  networks: [uniffy-network]
  profiles: [core, all]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-healthcheck-defaults: &hc-defaults
  interval: 10s
  timeout: 5s
  retries: 5

services:
  rustfs:
    <<: *defaults
    image: rustfs/rustfs:1.0.0-beta.11
    container_name: uniffy-rustfs
    environment:
      RUSTFS_ROOT_USER: rustfsadmin
      RUSTFS_ROOT_PASSWORD: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    <<: *defaults
    image: postgres:18-alpine
    container_name: uniffy-postgres
    environment:
      POSTGRES_USER: uniffy
      POSTGRES_PASSWORD: uniffy
      POSTGRES_DB: uniffy
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      # 18+ images keep the cluster in a major-version subdirectory, so the
      # mount lives one level up from the old /var/lib/postgresql/data -
      # that path makes the entrypoint refuse to start (docker-library/postgres#1259)
      - postgres_data:/var/lib/postgresql
      - ../init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "pg_isready -U uniffy -d uniffy"]

  valkey:
    <<: *defaults
    image: valkey/valkey:9-alpine
    container_name: uniffy-valkey
    environment:
      VALKEY_PASSWORD: uniffy-valkey-dev
    ports:
      - "6380:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes --requirepass uniffy-valkey-dev
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "valkey-cli", "-a", "uniffy-valkey-dev", "ping"]

  meilisearch:
    <<: *defaults
    image: getmeili/meilisearch:v1.53
    container_name: uniffy-meilisearch
    environment:
      MEILI_MASTER_KEY: uniffy-dev-master-key
      MEILI_ENV: production
      MEILI_DB_PATH: /meili_data/data.ms
      MEILI_HTTP_ADDR: 0.0.0.0:7700
      MEILI_NO_ANALYTICS: true
      MEILI_MAX_INDEXING_MEMORY: 3GiB
      MEILI_MAX_INDEXING_THREADS: 4
      MEILI_HTTP_PAYLOAD_SIZE_LIMIT: 104857600
      MEILI_LOG_LEVEL: INFO
      MEILI_EXPERIMENTAL_LOGS_MODE: human
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]

  livekit:
    <<: *defaults
    image: livekit/livekit-server:v1.11.0
    container_name: uniffy-livekit
    # 127.0.0.1 suits same-machine browsers and SSH-tunnel dev. A phone on the
    # LAN needs media candidates it can route to: set LIVEKIT_NODE_IP to the
    # host's LAN IP (e.g. in a .env next to the compose file) before `up`.
    command: --config /etc/livekit.yaml --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "7880:7880" # signaling (HTTP/WebSocket, proxied by the dev edge)
      - "7881:7881" # ICE/TCP fallback
      - "7882:7882/udp" # ICE/UDP media (single-port mux)
      - "3478:3478/udp" # embedded TURN
    configs:
      - source: livekit_config
        target: /etc/livekit.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      <<: *hc-defaults
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:7880",
        ]

configs:
  livekit_config:
    content: |
      port: 7880
      bind_addresses:
        - ""

      rtc:
        tcp_port: 7881
        udp_port: 7882
        use_external_ip: false
        # No loopback candidate: it makes pion bind a second 7882 socket on
        # container lo, and with --node-ip both sockets advertise the same
        # address - ICE then sends from the unroutable loopback socket and
        # ignores inbound checks on the eth0 socket. Docker DNAT delivers to
        # the container IP in every dev mode, so loopback is never needed.

      keys:
        devkey: devsecret-change-me-in-prod-32chars-min

      redis:
        address: valkey:6379
        password: uniffy-valkey-dev
        db: 1

      turn:
        enabled: true
        udp_port: 3478

      webhook:
        api_key: devkey
        urls:
          - http://host.docker.internal:8000/internal/webhooks/livekit

      logging:
        level: info
        json: false

      room:
        empty_timeout: 60
        departure_timeout: 30
        max_participants: 50

      development: true

volumes:
  postgres_data:
  valkey_data:
  meilisearch_data:
  rustfs_data:
  rustfs_logs:

networks:
  uniffy-network:
    driver: bridge
