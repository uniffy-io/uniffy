# Disposable realtime qualification stack: its own PostgreSQL, Valkey,
# Meilisearch and RustFS, two backend replicas and one core worker. The
# project name, network and volumes are separate from the dev stack, so a
# run never reaches uniffy-postgres or uniffy-valkey and `down -v` removes
# every byte it wrote.
#
#   ./manage.py qualify [--keep] [driver flags]   start, run every scenario, tear down
#   docker compose -f .docker/compose/qualification.yaml -p uniffy-qual up -d --wait
#   docker compose -f .docker/compose/qualification.yaml -p uniffy-qual run --rm driver --help
#   docker compose -f .docker/compose/qualification.yaml -p uniffy-qual down -v --remove-orphans
#
# Backend-image services reuse the dev image and entrypoint. The checkout is
# bind-mounted read-write, its .env is never loaded so no developer secret or
# endpoint leaks in, and per-stack random secrets come from the `secrets`
# one-shot. Python dependencies sync into a stack-owned venv from the shared
# uv download cache.

name: uniffy-qual

x-contained: &contained
    security_opt:
        - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 4096

x-logging: &logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

x-healthcheck-defaults: &hc-defaults
    interval: 5s
    timeout: 5s
    retries: 30

x-environment: &environment
    # The checkout's .env belongs to the dev stack.
    PYTHON_DOTENV_DISABLED: "1"
    ENVIRONMENT: development
    HOST_UID: "${HOST_UID:-1000}"
    HOST_GID: "${HOST_GID:-1000}"
    UV_CACHE_DIR: /uv-cache
    CORS_ORIGINS: "*"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: uniffy
    POSTGRES_PASSWORD: uniffy-qualification
    POSTGRES_DB: uniffy
    VALKEY_HOST: valkey
    VALKEY_PORT: "6379"
    VALKEY_PASSWORD: uniffy-qualification
    VALKEY_DATABASE: "0"
    MEILISEARCH_URL: http://meilisearch:7700
    MEILISEARCH_MASTER_KEY: uniffy-qualification-master-key
    S3_ENDPOINT_URL: http://rustfs:9000
    S3_ACCESS_KEY: rustfsadmin
    S3_SECRET_KEY: rustfsadmin
    S3_BUCKET_NAME: uniffy-files
    INITIAL_ADMIN_EMAIL: admin@uniffy.io
    DEFAULT_ORG_NAME: Uniffy Qualification
    # A full run spans several scenarios on one login per user.
    JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    ASSET_COOKIE_SECURE: "false"
    ALLOW_PUBLIC_REGISTRATION: "false"

x-backend: &backend
    <<: *contained
    image: uniffy-dev-backend
    pull_policy: never
    init: true
    restart: unless-stopped
    environment: *environment
    volumes:
        - ../../:/app
        - qual-venv:/app/.venv
        - uv-cache:/uv-cache
        - qual-secrets:/run/qual-secrets:ro
    logging: *logging

services:
    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        # pg_stat_statements gives the driver per-statement counts; the extra
        # connections cover two backend pools, the worker and the driver.
        command:
            - postgres
            - -c
            - shared_preload_libraries=pg_stat_statements
            - -c
            - max_connections=200
            - -c
            - track_io_timing=on
        environment:
            POSTGRES_USER: uniffy
            POSTGRES_PASSWORD: uniffy-qualification
            POSTGRES_DB: uniffy
            POSTGRES_HOST_AUTH_METHOD: trust
        volumes:
            - qual-postgres:/var/lib/postgresql
            - ../init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
        healthcheck:
            <<: *hc-defaults
            test: ["CMD-SHELL", "pg_isready -U uniffy -d uniffy"]
        logging: *logging

    valkey:
        image: valkey/valkey:9-alpine
        restart: unless-stopped
        command: valkey-server --appendonly yes --requirepass uniffy-qualification
        volumes:
            - qual-valkey:/data
        healthcheck:
            <<: *hc-defaults
            test: ["CMD", "valkey-cli", "--no-auth-warning", "-a", "uniffy-qualification", "ping"]
        logging: *logging

    meilisearch:
        image: getmeili/meilisearch:v1.54
        restart: unless-stopped
        environment:
            MEILI_MASTER_KEY: uniffy-qualification-master-key
            MEILI_ENV: production
            MEILI_DB_PATH: /meili_data/data.ms
            MEILI_HTTP_ADDR: 0.0.0.0:7700
            MEILI_NO_ANALYTICS: true
            MEILI_MAX_INDEXING_MEMORY: 1GiB
            MEILI_MAX_INDEXING_THREADS: 2
            MEILI_LOG_LEVEL: WARN
        volumes:
            - qual-meilisearch:/meili_data
        healthcheck:
            <<: *hc-defaults
            test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
        logging: *logging

    rustfs:
        image: rustfs/rustfs:1.0.0-beta.11
        restart: unless-stopped
        environment:
            RUSTFS_ROOT_USER: rustfsadmin
            RUSTFS_ROOT_PASSWORD: rustfsadmin
        volumes:
            - qual-rustfs:/data
            - qual-rustfs-logs:/logs
        healthcheck:
            <<: *hc-defaults
            test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
        logging: *logging

    # Runs as root without the dev entrypoint so it can hand the files to the
    # host uid; the secrets never leave the stack volume.
    secrets:
        <<: *contained
        image: uniffy-dev-backend
        pull_policy: never
        restart: "no"
        entrypoint:
            - /usr/local/bin/python
            - /app/src/uniffy/scripts/realtime_qualification/stack_secrets.py
            - /run/qual-secrets
        environment:
            HOST_UID: "${HOST_UID:-1000}"
            HOST_GID: "${HOST_GID:-1000}"
        volumes:
            - ../../src/uniffy/scripts/realtime_qualification:/app/src/uniffy/scripts/realtime_qualification:ro
            - qual-secrets:/run/qual-secrets
        logging: *logging

    # The dev entrypoint syncs the stack venv once; every other backend-image
    # service then finds the lockfile marker and skips the sync.
    venv:
        <<: *backend
        restart: "no"
        command: ["true"]

    backend-a:
        <<: *backend
        command: ["sh", "-c", ". /run/qual-secrets/stack.env && exec python -m uniffy --backend"]
        ports:
            - "127.0.0.1:${QUAL_BACKEND_A_PORT:-28000}:8000"
        healthcheck: &backend-healthcheck
            interval: 5s
            timeout: 5s
            retries: 120
            test:
                - CMD
                - /usr/local/bin/python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"
        depends_on:
            secrets: { condition: service_completed_successfully }
            venv: { condition: service_completed_successfully }
            postgres: { condition: service_healthy }
            valkey: { condition: service_healthy }
            meilisearch: { condition: service_healthy }
            rustfs: { condition: service_healthy }

    # Starts after backend-a has migrated the schema, so only one replica runs
    # the upgrade.
    backend-b:
        <<: *backend
        command: ["sh", "-c", ". /run/qual-secrets/stack.env && exec python -m uniffy --backend"]
        ports:
            - "127.0.0.1:${QUAL_BACKEND_B_PORT:-28001}:8000"
        healthcheck: *backend-healthcheck
        depends_on:
            backend-a: { condition: service_healthy }

    worker-core:
        <<: *backend
        command: ["sh", "-c", ". /run/qual-secrets/stack.env && exec python -m uniffy --worker-core"]
        depends_on:
            backend-a: { condition: service_healthy }

    seeder:
        <<: *backend
        restart: "no"
        command:
            - sh
            - -c
            - >-
                . /run/qual-secrets/stack.env &&
                exec python -m uniffy.scripts.demo_company --fresh-only --only users
                --password "$$QUAL_USER_PASSWORD"
        depends_on:
            backend-a: { condition: service_healthy }

    driver:
        <<: *backend
        profiles: [driver]
        restart: "no"
        entrypoint:
            - /entrypoint.sh
            - sh
            - -c
            - '. /run/qual-secrets/stack.env && exec python -m uniffy.scripts.realtime_qualification "$$@"'
            - driver
        command: []
        volumes:
            - ../../:/app
            - qual-venv:/app/.venv
            - uv-cache:/uv-cache
            - qual-secrets:/run/qual-secrets:ro
            # Container CPU comes from the same cgroup counters docker stats reads.
            - /sys/fs/cgroup:/host/cgroup:ro
        depends_on:
            seeder: { condition: service_completed_successfully }
            backend-b: { condition: service_healthy }
            worker-core: { condition: service_started }

volumes:
    qual-postgres:
    qual-valkey:
    qual-meilisearch:
    qual-rustfs:
    qual-rustfs-logs:
    qual-venv:
    qual-secrets:
    # Download cache only; sharing it with the dev stack avoids refetching
    # every wheel on each disposable run.
    uv-cache:
        external: true
        name: "${QUAL_UV_CACHE_VOLUME:-uniffy-local_uv-cache}"
