# Sized core fleet for the qualification stack: QUAL_CORE_WORKERS core worker processes,
# four by default, instead of one. Checkpoint throughput is rated per core worker process, so
# the fleet is the capacity lever this override measures.
#
#   docker compose -f .docker/compose/qualification.yaml \
#       -f .docker/compose/qualification-fleet.yaml -p uniffy-qual up -d --wait

services:
    worker-core:
        deploy:
            replicas: ${QUAL_CORE_WORKERS:-4}
