# Root initializes dependency volumes before dropping to the editor's user.
# The home volume lets VS Code install its server with a read-only rootfs.
services:
    devcontainer:
        extends:
            file: .docker/compose/dev.yaml
            service: deps-manager
        container_name: uniffy-devcontainer
        profiles: !override []
        user: "0:0"
        environment:
            HOME: /home/node
            DEPS_HOME: /home/node
            DEPS_USER: node
        volumes:
            - devcontainer-home:/home/node
        command: ["sleep", "infinity"]

volumes:
    devcontainer-home:
