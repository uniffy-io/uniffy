name: uniffy-local

services:
  postgres:
    image: postgres:18-alpine
    container_name: uniffy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uniffy
      POSTGRES_PASSWORD: uniffy
      POSTGRES_DB: uniffy
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.docker/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniffy -d uniffy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uniffy-network

  meilisearch:
    image: getmeili/meilisearch:v1.33
    container_name: uniffy-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: uniffy-dev-master-key
      MEILI_ENV: production
      MEILI_DB_PATH: /meili_data/data.ms
      MEILI_HTTP_ADDR: 0.0.0.0:7700
      # Disable telemetry (Amplitude analytics + Sentry error tracking)
      MEILI_NO_ANALYTICS: true
      # Max RAM for indexing (default: 2/3 of available RAM)
      MEILI_MAX_INDEXING_MEMORY: 3GiB
      # Max OS threads for indexing (default: half of available CPU cores)
      MEILI_MAX_INDEXING_THREADS: 4
      # Max HTTP payload size (default: ~100MB)
      MEILI_HTTP_PAYLOAD_SIZE_LIMIT: 104857600
      # Max concurrent search requests (default: 1000)
      # MEILI_EXPERIMENTAL_SEARCH_QUEUE_SIZE: 1000
      MEILI_LOG_LEVEL: INFO
      MEILI_EXPERIMENTAL_LOGS_MODE: human
      # MEILI_DUMP_DIR: /meili_data/dumps
      # MEILI_SNAPSHOT_DIR: /meili_data/snapshots
      # MEILI_SCHEDULE_SNAPSHOT: 86400
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uniffy-network

  valkey:
    image: valkey/valkey:9-alpine
    container_name: uniffy-valkey
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: uniffy-valkey-dev
    ports:
      - "6380:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes --requirepass uniffy-valkey-dev
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "uniffy-valkey-dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uniffy-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: uniffy-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@uniffy.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - uniffy-network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: uniffy-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ROOT_USER: rustfsadmin
      RUSTFS_ROOT_PASSWORD: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uniffy-network

  # Background worker for thumbnail generation and metadata extraction
  # For local development, run: ./run.sh worker-dev
  # Uncomment below for Docker-based worker deployment
  # worker:
  #   build:
  #     context: .
  #     dockerfile: src/uniffy/Dockerfile
  #   container_name: uniffy-worker
  #   restart: unless-stopped
  #   command: ["python", "-m", "uniffy.worker"]
  #   environment:
  #     POSTGRES_HOST: postgres
  #     POSTGRES_PORT: 5432
  #     POSTGRES_USER: uniffy
  #     POSTGRES_PASSWORD: uniffy
  #     POSTGRES_DB: uniffy
  #     VALKEY_HOST: valkey
  #     VALKEY_PORT: 6379
  #     VALKEY_PASSWORD: uniffy-valkey-dev
  #     S3_ENDPOINT_URL: http://rustfs:9000
  #     S3_ACCESS_KEY: rustfsadmin
  #     S3_SECRET_KEY: rustfsadmin
  #     S3_BUCKET_NAME: uniffy-files
  #     MEILISEARCH_URL: http://meilisearch:7700
  #     MEILISEARCH_MASTER_KEY: uniffy-dev-master-key
  #     LOG_LEVEL: INFO
  #     ENVIRONMENT: development
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     valkey:
  #       condition: service_healthy
  #     meilisearch:
  #       condition: service_healthy
  #     rustfs:
  #       condition: service_healthy
  #   networks:
  #     - uniffy-network

volumes:
  postgres_data:
    driver: local
  meilisearch_data:
    driver: local
  valkey_data:
    driver: local
  pgadmin_data:
    driver: local
  rustfs_data:
    driver: local
  rustfs_logs:
    driver: local

networks:
  uniffy-network:
    driver: bridge
