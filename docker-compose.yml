services:
  postgres:
    image: postgres:18-alpine
    container_name: uwos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uwos
      POSTGRES_PASSWORD: uwos
      POSTGRES_DB: uwos
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.docker/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uwos -d uwos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uwos-network

  # Uncomment to add pgAdmin for database management
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: uwos-pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@uwos.local
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #     PGADMIN_CONFIG_SERVER_MODE: 'False'
  #   ports:
  #     - "5050:80"
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   depends_on:
  #     - postgres
  #   networks:
  #     - uwos-network

volumes:
  postgres_data:
    driver: local
  # pgadmin_data:
  #   driver: local

networks:
  uwos-network:
    driver: bridge
