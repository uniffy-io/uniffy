name: uniffy-local

# Modular compose. Each domain in its own file under .docker/compose/.
# Run any subset directly:  docker compose -f .docker/compose/<name>.yaml up
# Or all at once:           docker compose up
#
# Profiles for opt-in services:
#   --profile mcp           mcp-playwright (Claude Code -> browser)
#   --profile calls-turn    coturn TURN relay
#
# Helpers in run.sh: mcp-up/down/logs, calls-turn-up/down/logs, livekit-logs

include:
  - .docker/compose/core.yaml          # postgres, valkey, meilisearch
  - .docker/compose/storage.yaml       # rustfs (S3-compatible)
  - .docker/compose/admin.yaml         # pgadmin, redisinsight (db inspection UIs)
  - .docker/compose/calls.yaml         # livekit (always on), coturn (profile: calls-turn)
  - .docker/compose/dev-tools.yaml     # mcp-playwright (profile: mcp)
  - .docker/compose/dev.yaml           # backend, worker-core, worker-egress, ui (profile: dev)
