services:
  postgres:
    image: postgres:18-alpine
    container_name: uwos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uwos
      POSTGRES_PASSWORD: uwos
      POSTGRES_DB: uwos
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.docker/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uwos -d uwos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uwos-network

  meilisearch:
    image: getmeili/meilisearch:v1.33
    container_name: uwos-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: uwos-dev-master-key
      MEILI_ENV: production
      MEILI_DB_PATH: /meili_data/data.ms
      MEILI_HTTP_ADDR: 0.0.0.0:7700
      # Disable telemetry (Amplitude analytics + Sentry error tracking)
      MEILI_NO_ANALYTICS: true
      # Max RAM for indexing (default: 2/3 of available RAM)
      MEILI_MAX_INDEXING_MEMORY: 3GiB
      # Max OS threads for indexing (default: half of available CPU cores)
      MEILI_MAX_INDEXING_THREADS: 4
      # Max HTTP payload size (default: ~100MB)
      MEILI_HTTP_PAYLOAD_SIZE_LIMIT: 104857600
      # Max concurrent search requests (default: 1000)
      # MEILI_EXPERIMENTAL_SEARCH_QUEUE_SIZE: 1000
      MEILI_LOG_LEVEL: INFO
      MEILI_EXPERIMENTAL_LOGS_MODE: human
      # MEILI_DUMP_DIR: /meili_data/dumps
      # MEILI_SNAPSHOT_DIR: /meili_data/snapshots
      # MEILI_SCHEDULE_SNAPSHOT: 86400
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uwos-network

  valkey:
    image: valkey/valkey:9-alpine
    container_name: uwos-valkey
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: uwos-valkey-dev
    ports:
      - "6380:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes --requirepass uwos-valkey-dev
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "uwos-valkey-dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uwos-network


volumes:
  postgres_data:
    driver: local
  meilisearch_data:
    driver: local
  valkey_data:
    driver: local

networks:
  uwos-network:
    driver: bridge
