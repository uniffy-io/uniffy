name: uniffy-local

# Modular compose. Each domain in its own file under .docker/compose/.
# Run any subset directly:  docker compose -f .docker/compose/<name>.yaml up
# Or all at once:           docker compose up
#
# Profiles:
#   (none)          infra only: postgres, valkey, meilisearch, livekit, rustfs, admin UIs
#   --profile dev   infra + dev stack: edge, backend, workers, ui, landing, mcp-playwright
#   --profile all   everything
#
# Helpers in run.sh: dev, dev-down, dev-logs, livekit-logs

include:
  - .docker/compose/core.yaml          # postgres, valkey, meilisearch, livekit
  - .docker/compose/storage.yaml       # rustfs (S3-compatible)
  - .docker/compose/admin.yaml         # pgadmin, redisinsight (db inspection UIs)
  - .docker/compose/dev-tools.yaml     # mcp-playwright (profile: mcp)
  - .docker/compose/dev.yaml           # edge, backend, workers, ui (profile: dev)
