name: Build Python Base Image

on:
  push:
    branches: [main]
    paths:
      - ".docker/base/Dockerfile"

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Extract tag from Dockerfile
        id: meta
        run: |
          TAG=$(grep -m1 '^FROM python:' .docker/base/Dockerfile | sed 's/.*python:\([^ ]*\).*/\1/')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: registry.uniffy.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .docker/base
          file: .docker/base/Dockerfile
          push: true
          tags: registry.uniffy.io/uniffy/python-base:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
