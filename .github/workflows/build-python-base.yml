name: Build Python Base Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".docker/base/Dockerfile"
      - ".github/workflows/build-python-base.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Extract tag from Dockerfile
        id: meta
        run: |
          TAG=$(grep -m1 '^FROM python:' .docker/base/Dockerfile | sed 's/.*python:\([^ ]*\).*/\1/')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .docker/base
          file: .docker/base/Dockerfile
          push: true
          tags: ghcr.io/uniffy-io/python-base:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Python base image for the Uniffy backend and workers
          cache-from: type=gha
          cache-to: type=gha,mode=max
