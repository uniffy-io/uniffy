name: Run Linters & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  # pull-requests: write # uncomment if enabling PR comments in the JUnit report action

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: install dependencies
        shell: bash
        run: uv sync --all-extras --all-groups --frozen

      - name: prepare reports dir
        shell: bash
        run: mkdir -p reports

      - name: run python linters
        shell: bash
        run: |
          uv run ruff check src/uniffy/ --exclude src/uniffy/gen

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: src/ui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: src/ui
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: src/ui
        run: pnpm lint

      # - name: run tests
