name: Run Linters & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      proto: ${{ steps.filter.outputs.proto }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/uniffy/**'
              - 'src/gen/python/**'
              - 'pyproject.toml'
              - 'uv.lock'
            frontend:
              - 'src/ui/**'
              - 'src/gen/typescript/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            proto:
              - 'src/proto/**'
              - 'buf.gen.yaml'
              - 'buf.yaml'

  lint-proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: buf lint
        run: buf lint

      - name: buf format check
        run: buf format -d --exit-code

      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"

  lint-python:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        shell: bash
        run: uv sync --all-extras --all-groups --frozen

      - name: Run python linters
        shell: bash
        run: uv run ruff check src/uniffy/ --exclude src/gen

  lint-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter uniffy-ui...

      - name: Run ESLint
        run: pnpm --filter uniffy-ui lint

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter uniffy-ui...

      - name: Build (tsc + vite)
        run: pnpm --filter uniffy-ui build

  test-python:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        shell: bash
        run: uv sync --frozen

      - name: Prepare reports dir
        shell: bash
        run: mkdir -p reports

      - name: Run tests
        shell: bash
        run: |
          uv run pytest src/uniffy/tests/ \
            --ignore=src/uniffy/tests/benchmarks/ \
            --junitxml=reports/pytest-report.xml \
            --color=yes -vv

      - name: Upload pytest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest-report.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish test report (native)
        if: success() || failure()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/pytest-report.xml
          check_name: Pytest Results
          require_tests: true
          detailed_summary: true
          comment: true
          updateComment: true
          job_summary: true

  test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter uniffy-ui...

      - name: Run Vitest
        run: pnpm --filter uniffy-ui test:ci

      - name: Upload Vitest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: reports/vitest-report.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish test report
        if: success() || failure()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/vitest-report.xml
          check_name: Vitest Results
          require_tests: true
          detailed_summary: true
          comment: true
          updateComment: true
          job_summary: true

  benchmark-python:
    needs: changes
    if: >
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.proto == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        shell: bash
        run: uv sync --frozen

      - name: Prepare reports dir
        shell: bash
        run: mkdir -p reports

      - name: Run benchmarks
        shell: bash
        run: |
          uv run pytest src/uniffy/tests/benchmarks/ \
            --benchmark-only \
            --benchmark-group-by=func \
            --benchmark-sort=mean \
            --benchmark-columns=min,max,mean,stddev,rounds \
            --benchmark-json=reports/benchmark.json \
            --color=yes

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: reports/benchmark.json
          if-no-files-found: warn
          retention-days: 14

  all-green:
    name: All checks passed
    if: always()
    needs:
      - changes
      - lint-proto
      - lint-python
      - lint-frontend
      - build-frontend
      - test-python
      - test-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded or were skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
          echo "All required jobs passed."
