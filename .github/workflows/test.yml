name: Run Linters & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

# A new push to a pull request cancels that pull request's in-flight run.
# Pushes to main group per commit, so no run on main is ever cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      proto: ${{ steps.filter.outputs.proto }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/uniffy/**'
              - 'src/gen/python/**'
              - 'manage.py'
              - '.github/workflows/test.yml'
              - 'pyproject.toml'
              - 'uv.lock'
            frontend:
              - 'src/ui/**'
              - 'src/gen/typescript/**'
              - 'lint/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            mobile:
              - 'src/mobile/**'
              - 'src/gen/typescript/**'
              - 'lint/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            proto:
              - 'src/proto/**'
              - 'buf.gen.yaml'
              - 'buf.yaml'

  # No path filter: a secret can land in any file, and the scan covers the
  # full history, so a skipped run would let an old leak ride in unnoticed.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksummed)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.29.0/gitleaks_8.29.0_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          echo "39e07ad810336fd0ae80d0bd61c60d0521f628173e7583583b5df4a38738522c  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      - name: Scan full git history
        run: /tmp/gitleaks git --redact --verbose .

  lint-proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: buf lint
        run: buf lint

      - name: buf format check
        run: buf format -d --exit-code

      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: buf breaking --against ".git#branch=origin/main"

  lint-python:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        shell: bash
        run: uv sync --all-extras --all-groups --frozen

      - name: Run Python linters
        shell: bash
        run: ./manage.py lint -s backend --stack local --check

  lint-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter uniffy-ui...

      - name: Run lint
        run: pnpm --filter uniffy-ui lint

      - name: Check formatting
        run: pnpm --filter uniffy-ui format:check

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter uniffy-ui...

      - name: Build (tsc + vite)
        run: pnpm --filter uniffy-ui build

  lint-mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter uniffy-mobile...

      - name: Run lint
        run: pnpm --filter uniffy-mobile lint

      # `run` is required: bare `pnpm doctor` resolves to pnpm's own builtin,
      # not the expo-doctor script. Advisory for now: the version check tracks
      # the live registry, so Expo patch waves redden it with no repo change.
      - name: Expo doctor (advisory)
        continue-on-error: true
        run: pnpm --filter uniffy-mobile run doctor

  format-mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter uniffy-mobile...

      - name: Check formatting
        run: pnpm --filter uniffy-mobile format:check

  typecheck-mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter uniffy-mobile...

      - name: Typecheck (tsc)
        run: pnpm --filter uniffy-mobile exec tsc --noEmit

  test-python:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        shell: bash
        run: uv sync --frozen

      - name: Prepare reports dir
        shell: bash
        run: mkdir -p reports

      - name: Run tests
        shell: bash
        run: |
          ./manage.py test -s backend --stack local -- \
            --junitxml=reports/pytest-report.xml \
            --color=yes -vv

      - name: Upload pytest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest-report.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish test report (native)
        if: success() || failure()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/pytest-report.xml
          check_name: Pytest Results
          require_tests: true
          detailed_summary: true
          comment: false
          job_summary: true

  test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter uniffy-ui...

      - name: Run Vitest
        run: pnpm --filter uniffy-ui test:ci

      - name: Upload Vitest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: reports/vitest-report.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish test report
        if: success() || failure()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/vitest-report.xml
          check_name: Vitest Results
          require_tests: true
          detailed_summary: true
          comment: false
          job_summary: true

  benchmark-python:
    needs: changes
    if: >
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.proto == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        shell: bash
        run: uv sync --frozen

      - name: Prepare reports dir
        shell: bash
        run: mkdir -p reports

      - name: Run benchmarks
        shell: bash
        run: |
          ./manage.py bench --stack local -- \
            --benchmark-json=reports/benchmark.json \
            --color=yes

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: reports/benchmark.json
          if-no-files-found: warn
          retention-days: 14

  all-green:
    name: All checks passed
    if: always()
    needs:
      - changes
      - secrets-scan
      - lint-proto
      - lint-python
      - lint-frontend
      - build-frontend
      - lint-mobile
      - format-mobile
      - typecheck-mobile
      - test-python
      - test-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded or were skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
          echo "All required jobs passed."
