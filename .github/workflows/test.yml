name: Run Linters & Tests

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow calls this one for the tagged commit and waits for it.
  workflow_call:
    inputs:
      run_all:
        description: Run every job regardless of changed paths.
        type: boolean
        default: false

permissions:
  contents: read
  checks: write
  pull-requests: write

# A new push to a pull request cancels that pull request's in-flight run.
# Pushes to main group per commit, so no run on main is ever cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ inputs.run_all || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ inputs.run_all || steps.filter.outputs.frontend == 'true' }}
      mobile: ${{ inputs.run_all || steps.filter.outputs.mobile == 'true' }}
      proto: ${{ inputs.run_all || steps.filter.outputs.proto == 'true' }}
      docker: ${{ inputs.run_all || steps.filter.outputs.docker == 'true' }}
      media_image: ${{ inputs.run_all || steps.filter.outputs.media_image == 'true' }}
      image_matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ !inputs.run_all }}
      - uses: dorny/paths-filter@v3
        if: ${{ !inputs.run_all }}
        id: filter
        with:
          filters: |
            backend:
              - 'src/uniffy/**'
              - 'src/gen/python/**'
              - 'manage.py'
              - '.github/workflows/test.yml'
              - 'pyproject.toml'
              - 'uv.lock'
            frontend:
              - 'src/ui/**'
              - 'src/gen/typescript/**'
              - 'lint/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            mobile:
              - 'src/mobile/**'
              - 'src/gen/typescript/**'
              - 'lint/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            proto:
              - 'src/proto/**'
              - 'buf.gen.yaml'
              - 'buf.yaml'
            docker:
              - 'src/uniffy/Dockerfile'
              - 'src/ui/Dockerfile'
              - 'src/ui/nginx/**'
              - '.dockerignore'
              - '.docker/prod/**'
              - '.github/actions/**'
              - '.github/workflows/test.yml'
              - 'manage.py'
              - 'uv.lock'
              - 'pnpm-lock.yaml'
            media_image:
              - 'src/uniffy/Dockerfile'
              - '.docker/media/**'
              - '.docker/prod/tests/media-worker.yaml'
              - '.dockerignore'
              - '.github/actions/container-structure-test/**'
              - '.github/workflows/test.yml'
              - 'manage.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'src/gen/python/pyproject.toml'
              - 'docs/LICENSES.md'
              - 'src/uniffy/__main__.py'
              - 'src/uniffy/main.py'
              - 'src/uniffy/factory.py'
              - 'src/uniffy/workers/**'
              - 'src/uniffy/core/jobs/**'
              - 'src/uniffy/infrastructure/valkey/queue.py'
              - 'src/uniffy/domains/files/jobs/**'

      - name: Select image checks
        id: images
        env:
          MEDIA_IMAGE: ${{ inputs.run_all || steps.filter.outputs.media_image == 'true' }}
        run: |
          matrix=$(jq -cn --argjson media "$MEDIA_IMAGE" '{include: ([
            {image: "backend", name: "uniffy", dockerfile: "src/uniffy/Dockerfile", target: "runtime"},
            {image: "frontend", name: "uniffy-frontend", dockerfile: "src/ui/Dockerfile", target: "runtime"}
          ] + (if $media then [
            {image: "media-worker", name: "uniffy-media-worker", dockerfile: "src/uniffy/Dockerfile", target: "media-runtime"}
          ] else [] end))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # No path filter: a secret can land in any file, and the scan covers the
  # full history, so a skipped run would let an old leak ride in unnoticed.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksummed)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.29.0/gitleaks_8.29.0_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          echo "39e07ad810336fd0ae80d0bd61c60d0521f628173e7583583b5df4a38738522c  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      - name: Scan full git history
        run: /tmp/gitleaks git --redact --verbose .

  lint-proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: buf lint
        run: buf lint

      - name: buf format check
        run: buf format -d --exit-code

      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: buf breaking --against ".git#branch=origin/main"

  lint-python:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        shell: bash
        run: uv sync --all-extras --all-groups --frozen

      - name: Run Python linters
        shell: bash
        run: ./manage.py lint -s backend --stack local --check

  lint-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter uniffy-ui...

      - name: Run lint
        run: pnpm --filter uniffy-ui lint

      - name: Check formatting
        run: pnpm --filter uniffy-ui format:check

  lint-mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter uniffy-mobile...

      - name: Run lint
        run: pnpm --filter uniffy-mobile lint

      # `run` is required: bare `pnpm doctor` resolves to pnpm's own builtin,
      # not the expo-doctor script. Advisory for now: the version check tracks
      # the live registry, so Expo patch waves redden it with no repo change.
      - name: Expo doctor (advisory)
        continue-on-error: true
        run: pnpm --filter uniffy-mobile run doctor

  format-mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter uniffy-mobile...

      - name: Check formatting
        run: pnpm --filter uniffy-mobile format:check

  typecheck-mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter uniffy-mobile...

      - name: Typecheck (tsc)
        run: pnpm --filter uniffy-mobile exec tsc --noEmit

  test-python:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        shell: bash
        run: uv sync --frozen

      - name: Prepare reports dir
        shell: bash
        run: mkdir -p reports

      - name: Run tests
        shell: bash
        run: |
          ./manage.py test -s backend --stack local -- \
            --junitxml=reports/pytest-report.xml \
            --color=yes -vv

      - name: Upload pytest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest-report.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish test report (native)
        if: success() || failure()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/pytest-report.xml
          check_name: Pytest Results
          require_tests: true
          detailed_summary: true
          comment: false
          job_summary: true

  test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter uniffy-ui...

      - name: Run Vitest
        run: pnpm --filter uniffy-ui test:ci

      - name: Upload Vitest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: reports/vitest-report.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish test report
        if: success() || failure()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/vitest-report.xml
          check_name: Vitest Results
          require_tests: true
          detailed_summary: true
          comment: false
          job_summary: true

  test-mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter uniffy-mobile...

      - name: Run Vitest
        run: pnpm --filter uniffy-mobile test:ci

      - name: Upload Vitest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-mobile-report
          path: reports/vitest-mobile-report.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish test report
        if: success() || failure()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/vitest-mobile-report.xml
          check_name: Vitest Mobile Results
          require_tests: true
          detailed_summary: true
          comment: false
          job_summary: true

  benchmark-python:
    needs: changes
    if: >
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.proto == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        shell: bash
        run: uv sync --frozen

      - name: Prepare reports dir
        shell: bash
        run: mkdir -p reports

      - name: Run benchmarks
        shell: bash
        run: |
          ./manage.py bench --stack local -- \
            --benchmark-json=reports/benchmark.json \
            --color=yes

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: reports/benchmark.json
          if-no-files-found: warn
          retention-days: 14

  # Media checks follow native build inputs, dependencies, and worker paths.
  # Releases request every image check before building both architectures.
  docker-images:
    name: docker-build-${{ matrix.image }}
    needs: changes
    if: >
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.media_image == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.image_matrix) }}
    env:
      # Mirrors IMAGES in manage.py; local commands and CI use the same names.
      IMAGE: ghcr.io/uniffy-io/${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: hadolint
        run: ./manage.py image lint -s ${{ matrix.image }}

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:ci
          build-args: |
            VERSION=0.0.0-ci
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          # Only main writes the cache. A pull request or a tag reads main's
          # entries anyway; writing a copy under its own ref costs half a
          # minute per run and crowds main's entries out of the cache quota.
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope={0}-amd64', matrix.image) || '' }}

      - uses: ./.github/actions/container-structure-test
        with:
          image: ${{ env.IMAGE }}:ci
          config: .docker/prod/tests/${{ matrix.image }}.yaml
          arch: amd64

      - name: Vulnerability scan
        run: ./manage.py image scan -s ${{ matrix.image }} --tag ci

  all-green:
    name: All checks passed
    if: always()
    needs:
      - changes
      - secrets-scan
      - lint-proto
      - lint-python
      - lint-frontend
      - lint-mobile
      - format-mobile
      - typecheck-mobile
      - test-python
      - test-frontend
      - test-mobile
      - docker-images
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded or were skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
          echo "All required jobs passed."
