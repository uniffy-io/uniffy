name: cosign
description: Install the pinned, checksummed cosign release binary and put it on PATH.

inputs:
  arch:
    description: Runner architecture, amd64 or arm64.
    required: false
    default: amd64

runs:
  using: composite
  steps:
    - name: Install cosign (pinned, checksummed)
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        COSIGN_VERSION: v3.1.3
        COSIGN_SHA256_AMD64: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
        COSIGN_SHA256_ARM64: c5d324e091826b0d7a78eb16fef316450b4eb9aaec045611c08ba06f5e73220a
      run: |
        case "$ARCH" in
          amd64) sum="$COSIGN_SHA256_AMD64" ;;
          arm64) sum="$COSIGN_SHA256_ARM64" ;;
          *) echo "::error::unsupported arch '$ARCH'"; exit 1 ;;
        esac
        mkdir -p "$RUNNER_TEMP/cosign-bin"
        curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-${ARCH}" -o "$RUNNER_TEMP/cosign-bin/cosign"
        echo "$sum  $RUNNER_TEMP/cosign-bin/cosign" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/cosign-bin/cosign"
        echo "$RUNNER_TEMP/cosign-bin" >> "$GITHUB_PATH"
