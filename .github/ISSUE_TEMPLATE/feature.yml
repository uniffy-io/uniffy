name: Feature Request
description: Propose new functionality or a significant enhancement
title: "[FEATURE] "
labels: ["feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to be built and why.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: User need, business driver, or technical gap this addresses.
    validations:
      required: true

  - type: textarea
    id: user_story
    attributes:
      label: User Story
      placeholder: As a <role>, I want <capability> so that <outcome>.
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in and what is out.
      placeholder: |
        In:
        - X
        Out:
        - Y
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Checklist that defines done.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - backend
        - frontend
        - mobile
        - proto
        - infra
        - docs
        - cross-cutting
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches and why they were rejected.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Links to plans, PRDs, related issues, design docs.
    validations:
      required: false
