name: Bug Report
description: Report a defect in existing functionality
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One sentence describing the bug.
      placeholder: Mention chip fails to render when URN contains a colon.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact sequence to trigger the bug.
      placeholder: |
        1. Open Notes
        2. Type `@` and select a user
        3. Save
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Include stack traces, logs, screenshots.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - backend
        - frontend
        - mobile
        - proto
        - infra
        - docs
        - unknown
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - critical (data loss / outage)
        - high (core feature broken)
        - medium (workaround exists)
        - low (cosmetic)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, commit SHA, deployment (local / staging / prod).
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Hypothesis, related issues, suspect files.
    validations:
      required: false
