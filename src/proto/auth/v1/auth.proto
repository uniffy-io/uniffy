syntax = "proto3";

package auth.v1;

option go_package = "uwos/gen/auth/v1;authv1";

// =============================================================================
// AuthService - Authentication only
// =============================================================================

// AuthService handles user authentication (login, register, token refresh).
// For user management, see users.v1.UsersService.
// For organization management, see organizations.v1.OrganizationsService.
// For group management, see groups.v1.GroupsService.
service AuthService {
  // Register a new user account
  rpc Register(RegisterRequest) returns (AuthResponse);

  // Login with email and password
  rpc Login(LoginRequest) returns (AuthResponse);

  // Refresh access token using refresh token
  rpc RefreshToken(RefreshTokenRequest) returns (AuthResponse);

  // Get current authenticated user info
  rpc GetCurrentUser(GetCurrentUserRequest) returns (CurrentUserResponse);

  // Logout (invalidate tokens)
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

// =============================================================================
// Request Messages
// =============================================================================

// Request to register a new user
message RegisterRequest {
  string email = 1;
  string username = 2;
  string password = 3;  // Min 8 characters
  optional string full_name = 4;
  optional string organization_slug = 5;  // Join org after registration
}

// Request to login
message LoginRequest {
  string email = 1;
  string password = 2;
  optional string organization_slug = 3;  // Authenticate into specific org
}

// Request to refresh access token
message RefreshTokenRequest {
  string refresh_token = 1;
  optional string organization_slug = 2;  // Switch org context
}

// Request to get current user info
message GetCurrentUserRequest {}

// Request to logout
message LogoutRequest {
  optional string refresh_token = 1;  // If provided, invalidates specific token
}

// =============================================================================
// Response Messages
// =============================================================================

// Authentication response with tokens
message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;  // Always "bearer"
  string user_id = 4;
  optional string organization_id = 5;  // If authenticated into specific org
  optional string organization_role = 6;  // User's role in the org: MEMBER, ADMIN, or OWNER
}

// Current user info response
message CurrentUserResponse {
  string id = 1;
  string email = 2;
  string username = 3;
  optional string full_name = 4;
  bool is_active = 5;
  bool is_system_admin = 6;
  bool email_verified = 7;
  optional string accent_color = 8;
  optional string font_family = 9;
  optional string avatar_url = 10;
}

// Logout response
message LogoutResponse {
  bool success = 1;
}
