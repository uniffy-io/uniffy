syntax = "proto3";

package auth.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/auth/v1;authv1";

// AuthService - Authentication only

// AuthService handles user authentication (login, register, token refresh).
// For user management, see users.v1.UsersService.
// For organization management, see organizations.v1.OrganizationsService.
// For group management, see groups.v1.GroupsService.
service AuthService {
  // Register a new user account
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Login with email and password
  rpc Login(LoginRequest) returns (LoginResponse);

  // Refresh access token using refresh token
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);

  // Get current authenticated user info
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);

  // Logout (invalidate tokens)
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // List active sessions for the current user
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // Revoke a specific session
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);

  // Revoke all sessions except the current one
  rpc RevokeOtherSessions(RevokeOtherSessionsRequest) returns (RevokeOtherSessionsResponse);

  // Get the cache key seed for client-side storage encryption (called once per session)
  rpc GetCacheKeySeed(GetCacheKeySeedRequest) returns (GetCacheKeySeedResponse);

  // Rotate cache key seed (invalidates all device caches)
  rpc RotateCacheKeySeed(RotateCacheKeySeedRequest) returns (RotateCacheKeySeedResponse);

  // Public auth configuration (e.g. whether registration is open).
  rpc GetAuthConfig(GetAuthConfigRequest) returns (GetAuthConfigResponse);

  // Preview an invitation by token (un-authenticated).
  rpc GetInvitation(GetInvitationRequest) returns (GetInvitationResponse);

  // Accept an invitation by token; creates the user + membership and logs them in.
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);

  // Request a password reset link (always returns success; no enumeration).
  rpc SendPasswordReset(SendPasswordResetRequest) returns (SendPasswordResetResponse);

  // Preview a password reset token before showing the form.
  rpc VerifyPasswordResetToken(VerifyPasswordResetTokenRequest) returns (VerifyPasswordResetTokenResponse);

  // Consume a password reset token to set a new password.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
}

// Request Messages

// Request to register a new user
message RegisterRequest {
  string email = 1;
  string username = 2;
  string password = 3; // Min 8 characters
  optional string full_name = 4;
  optional string organization_slug = 5; // Join org after registration
}

// Request to login
message LoginRequest {
  string email = 1;
  string password = 2;
  optional string organization_slug = 3; // Authenticate into specific org
}

// Request to refresh access token
message RefreshTokenRequest {
  string refresh_token = 1;
  optional string organization_slug = 2; // Switch org context
}

// Request to get current user info
message GetCurrentUserRequest {}

// Request to logout
message LogoutRequest {
  optional string refresh_token = 1; // If provided, invalidates specific token
}

// Request to list active sessions
message ListSessionsRequest {}

// Request to revoke a specific session
message RevokeSessionRequest {
  string session_id = 1;
}

// Request to revoke all other sessions
message RevokeOtherSessionsRequest {}

// Response Messages

// Authentication response with tokens (Register)
message RegisterResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3; // Always "bearer"
  string user_id = 4;
  optional string organization_id = 5; // If authenticated into specific org
  optional string organization_role = 6; // User's role in the org: MEMBER, ADMIN, or OWNER
  optional string session_id = 7; // Server-side session identifier
  repeated common.v1.DomainType domain_admin_domains = 8; // Domains where user is domain admin
}

// Login outcome. One of three variants:
//
// * ``auth_result`` -- password ok, MFA not required, real session
//   tokens returned (today's behaviour).
// * ``mfa_challenge`` -- password ok, user has MFA enabled. Client
//   must complete ``MfaService.VerifyMfa`` with the challenge token.
// * ``enrollment_required`` -- password ok, org/platform policy
//   requires MFA but the user has not enrolled yet AND the grace
//   window has expired. Client must complete enrollment with the
//   short-lived ``enrollment_token`` and try login again.
message LoginResponse {
  oneof result {
    AuthResult auth_result = 1;
    MfaChallenge mfa_challenge = 2;
    EnrollmentRequired enrollment_required = 3;
  }
}

// Successful authentication tokens. Used as the success variant of
// ``LoginResponse`` and (for clarity) the shape every other auth-path
// response carries inline.
message AuthResult {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3; // Always "bearer"
  string user_id = 4;
  optional string organization_id = 5;
  optional string organization_role = 6; // MEMBER / ADMIN / OWNER
  optional string session_id = 7;
  repeated common.v1.DomainType domain_admin_domains = 8;
}

// Mid-login state when password was correct but MFA is enabled.
// ``challenge_token`` is a 5-min JWT (``type=mfa_challenge``) that
// only ``MfaService.VerifyMfa`` accepts.
message MfaChallenge {
  string challenge_token = 1;
  repeated string methods = 2; // "totp", "recovery_code"
}

// Mid-login state when policy requires MFA and the user has not
// enrolled. ``enrollment_token`` is a 30-min JWT (``type=enrollment_only``)
// that authorises only the three MFA enrollment RPCs.
// ``grace_expires_at`` is null when the requirement is hard.
message EnrollmentRequired {
  string enrollment_token = 1;
  optional google.protobuf.Timestamp grace_expires_at = 2;
}

// Authentication response with tokens (RefreshToken)
message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3; // Always "bearer"
  string user_id = 4;
  optional string organization_id = 5; // If authenticated into specific org
  optional string organization_role = 6; // User's role in the org: MEMBER, ADMIN, or OWNER
  optional string session_id = 7; // Server-side session identifier
  repeated common.v1.DomainType domain_admin_domains = 8; // Domains where user is domain admin
}

// Current user info response
message GetCurrentUserResponse {
  string id = 1;
  string email = 2;
  string username = 3;
  optional string full_name = 4;
  bool is_active = 5;
  bool is_system_admin = 6;
  bool email_verified = 7;
  optional string accent_color = 8;
  optional string font_family = 9;
  optional string avatar_url = 10;
  bool has_avatar = 11;
}

// Logout response
message LogoutResponse {
  bool success = 1;
}

// Active session information
message SessionInfo {
  string id = 1;
  string user_agent = 2;
  string device_label = 3;
  string created_at = 4; // ISO 8601 timestamp
  string last_activity = 5; // ISO 8601 timestamp
  bool is_current = 6;
}

// Response containing list of active sessions
message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

// Response after revoking a session
message RevokeSessionResponse {
  bool success = 1;
}

// Response after revoking other sessions
message RevokeOtherSessionsResponse {
  int32 revoked_count = 1;
}

// Request to get cache key seed for client-side storage encryption
message GetCacheKeySeedRequest {}

// Response containing the cache key seed
message GetCacheKeySeedResponse {
  bytes cache_key_seed = 1; // 32-byte seed for deriving encryption keys
}

// Request to rotate cache key seed
message RotateCacheKeySeedRequest {
  // Empty for self-rotation.
  // Admin can set target_user_id to rotate another user's seed.
  optional string target_user_id = 1;
}

// Response containing the new cache key seed after rotation
message RotateCacheKeySeedResponse {
  bytes new_cache_key_seed = 1; // New 32-byte seed
}

// Request public auth configuration (no auth required)
message GetAuthConfigRequest {}

// Public auth configuration the login / register pages need
message GetAuthConfigResponse {
  bool public_registration_enabled = 1;
}

// Preview an invitation before showing the accept form
message GetInvitationRequest {
  string token = 1;
}

message GetInvitationResponse {
  string email = 1;
  string organization_id = 2;
  string organization_name = 3;
  string organization_slug = 4;
  optional string inviter_display_name = 5;
  common.v1.OrganizationRole role = 6;
  google.protobuf.Timestamp expires_at = 7;
}

// Accept an invitation; this creates the user + membership and returns auth tokens.
message AcceptInvitationRequest {
  string token = 1;
  string username = 2;
  string password = 3; // Min 8 characters; complexity rules in password_policy.py
  optional string full_name = 4;
}

// Two-state response. ``auth_result`` is the steady-state success shape.
// ``enrollment_required`` fires when the target org (or the platform)
// mandates MFA - the client must drive the enrollment RPCs with the
// returned short-lived token before the account becomes usable.
message AcceptInvitationResponse {
  oneof result {
    AuthResult auth_result = 1;
    EnrollmentRequired enrollment_required = 2;
  }
}

message SendPasswordResetRequest {
  string email = 1;
}

// Intentionally empty -- the RPC never reveals whether the email exists.
message SendPasswordResetResponse {}

message VerifyPasswordResetTokenRequest {
  string token = 1;
}

message VerifyPasswordResetTokenResponse {
  string email = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2; // Min 8 characters
}

message ResetPasswordResponse {
  // The reset bumps token_version so every existing session is gone;
  // the client should redirect the user to /auth to sign in fresh.
  bool success = 1;
}
