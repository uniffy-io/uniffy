syntax = "proto3";

package agents.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "tags/v1/tags.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/agents/v1;agentsv1";

// AgentsService manages agent configurations for an organization.
service AgentsService {
  // Create a new agent configuration
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse) {}

  // Get an agent by ID
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {}

  // List agents for an organization
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {}

  // Update an agent configuration
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse) {}

  // Delete an agent. The row survives so its past chat messages keep
  // resolving a name and avatar; everything that would keep it acting stops.
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse) {}

  // Bring a deleted agent back. Its automations stay disabled.
  rpc RestoreAgent(RestoreAgentRequest) returns (RestoreAgentResponse) {}

  // Upload agent avatar image (synchronous processing)
  rpc UploadAgentAvatar(UploadAgentAvatarRequest) returns (UploadAgentAvatarResponse) {}

  // Delete agent avatar
  rpc DeleteAgentAvatar(DeleteAgentAvatarRequest) returns (DeleteAgentAvatarResponse) {}

  // Preview the fully assembled system prompt for an agent
  rpc PreviewSystemPrompt(PreviewSystemPromptRequest) returns (PreviewSystemPromptResponse) {}

  // List the shipped agent templates that prefill the create flow
  rpc ListAgentTemplates(ListAgentTemplatesRequest) returns (ListAgentTemplatesResponse) {}
}

// Agent configuration info returned to clients
message AgentInfo {
  string id = 1;
  string organization_id = 2;
  string owner_id = 3;
  string name = 4;
  string soul_prompt = 5;
  string primary_model = 6;
  repeated string fallback_models = 7;
  repeated string enabled_tools = 8;
  string avatar_emoji = 9;
  string theme_color = 10;
  bool is_default = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  repeated string enabled_skills = 14;
  common.v1.AccessMode access_mode = 15;
  // S3 key prefix for avatar images (empty string if none)
  string avatar_key = 16;
  // Image generation model (empty string = disabled)
  string image_model = 17;
  // Provider key ID for the primary model (empty = not assigned)
  string primary_provider_key_id = 18;
  // Provider key ID for the image model (empty = not assigned)
  string image_provider_key_id = 19;
  // Baseline role granted by access mode (when applicable)
  optional common.v1.ContentRole baseline_role = 20;
  // Effective role of the requesting user on this agent (if known).
  // Set by the server so the UI can render edit/share affordances
  // without re-resolving permissions client-side.
  optional common.v1.ContentRole user_role = 21;
  // Hydrated unified-tag rows assigned to this agent. Server-populated
  // via ``TagOperations.get_for_urns``; clients should treat as read-only.
  repeated tags.v1.Tag tags = 22;
  // JSON object of tuned model parameters (knob -> value), validated
  // against the model's parameter schema. "{}" = provider defaults.
  string model_params = 23;
  // JSON object of image-generation defaults (knob -> value), validated
  // against the image model's schema. "{}" = provider defaults.
  string image_params = 24;
  // House style folded into every generated-image prompt.
  string image_style_prompt = 25;
  // Deleted agents are returned only when a listing asks for them. They cannot
  // act: no chat replies, no automation runs.
  bool is_deleted = 26;
  optional google.protobuf.Timestamp deleted_at = 27;
  // JSON object pinning an integration provider to one org connection
  // (provider id -> connection id). "{}" = automatic resolution.
  string integration_connections = 28;
}

// --- Requests and Responses ---

message CreateAgentRequest {
  string organization_id = 1;
  string name = 2;
  optional string soul_prompt = 3;
  optional string primary_model = 4;
  repeated string fallback_models = 5;
  optional string avatar_emoji = 6;
  optional string theme_color = 7;
  optional bool is_default = 8;
  repeated string enabled_skills = 9;
  optional common.v1.AccessMode access_mode = 10;
  repeated string group_ids = 11;
  // Image generation model (empty string = disabled)
  optional string image_model = 12;
  // Provider key ID for the primary model
  optional string primary_provider_key_id = 13;
  // Provider key ID for the image model
  optional string image_provider_key_id = 14;
  optional common.v1.ContentRole baseline_role = 15;
  // Optional unified-tag ids to assign on create.
  repeated string tag_ids = 16;
  // JSON object of tuned model parameters (knob -> value)
  optional string model_params = 17;
  // JSON object of image-generation defaults (knob -> value)
  optional string image_params = 18;
  optional string image_style_prompt = 19;
  // JSON object pinning integration providers to org connections
  optional string integration_connections = 20;
}

message CreateAgentResponse {
  AgentInfo agent = 1;
}

message GetAgentResponse {
  AgentInfo agent = 1;
}

message UpdateAgentResponse {
  AgentInfo agent = 1;
}

message UploadAgentAvatarResponse {
  AgentInfo agent = 1;
}

message DeleteAgentAvatarResponse {
  AgentInfo agent = 1;
}

message GetAgentRequest {
  string organization_id = 1;
  string agent_id = 2;
}

message ListAgentsRequest {
  string organization_id = 1;
  optional common.v1.PaginationRequest pagination = 2;
  optional common.v1.AccessMode access_mode = 3;
  optional string group_id = 4;
  // Filter agents that carry every tag id in this list (logical AND).
  // Empty = no tag filter.
  repeated string tag_ids = 5;
  // Return deleted agents INSTEAD of live ones, for the builder's deleted
  // group. Builder-gated.
  bool deleted_only = 6;
}

message ListAgentsResponse {
  repeated AgentInfo agents = 1;
  common.v1.PaginationResponse pagination = 2;
}

message UpdateAgentRequest {
  // Access-policy changes (access mode, baseline role, group grants) go
  // through permissions.v1.MembersService, never this request.
  string organization_id = 1;
  string agent_id = 2;
  optional string name = 3;
  optional string soul_prompt = 4;
  optional string primary_model = 5;
  repeated string fallback_models = 6;
  optional string avatar_emoji = 7;
  optional string theme_color = 8;
  optional bool is_default = 9;
  repeated string enabled_skills = 10;
  repeated string enabled_tools = 11;
  // Image generation model (empty string = disabled)
  optional string image_model = 12;
  // Provider key ID for the primary model
  optional string primary_provider_key_id = 13;
  // Provider key ID for the image model
  optional string image_provider_key_id = 14;
  // Replacement set of unified-tag ids. Empty list clears all manual
  // tags; field unset (HasField=false) leaves them untouched. Mirrors
  // the NoteTagIds / FileTagIds / EventTagIds / ChannelTagIds wrapper
  // pattern.
  optional AgentTagIds tag_ids = 15;
  // JSON object of tuned model parameters (knob -> value); replaces the
  // stored object wholesale ("{}" resets to provider defaults)
  optional string model_params = 16;
  // JSON object of image-generation defaults; replaces the stored object
  // wholesale ("{}" resets to provider defaults)
  optional string image_params = 17;
  optional string image_style_prompt = 18;
  // JSON object pinning integration providers to org connections; replaces
  // the stored object wholesale ("{}" resets to automatic resolution)
  optional string integration_connections = 19;
}

// Wrapper so callers can distinguish "leave tags alone" from
// "clear all tags" (proto3 cannot tell empty repeated apart from unset).
message AgentTagIds {
  repeated string ids = 1;
}

message DeleteAgentRequest {
  string organization_id = 1;
  string agent_id = 2;
}

message DeleteAgentResponse {
  bool success = 1;
}

message RestoreAgentRequest {
  string organization_id = 1;
  string agent_id = 2;
}

message RestoreAgentResponse {
  AgentInfo agent = 1;
}

message UploadAgentAvatarRequest {
  string organization_id = 1;
  string agent_id = 2;
  bytes image_data = 3;
  string filename = 4;
}

message DeleteAgentAvatarRequest {
  string organization_id = 1;
  string agent_id = 2;
}

message PreviewSystemPromptRequest {
  string organization_id = 1;
  string agent_id = 2;
}

message PreviewSystemPromptResponse {
  string system_prompt = 1;
}

// A shipped starting point for a new agent. Prefill only - a created agent is
// an ordinary row with no link back to its template.
message AgentTemplate {
  string key = 1;
  string name = 2;
  string emoji = 3;
  string description = 4;
  string soul_prompt = 5;
  repeated string enabled_tools = 6;
  // Bundled skill rows resolved by the server; empty when a skill is unseeded.
  repeated string enabled_skill_ids = 7;
  // Model ids the template works best on; empty when the template has no
  // recommendation. Prefill only - clients apply them when the org serves them.
  string recommended_model = 8;
  string recommended_image_model = 9;
}

message ListAgentTemplatesRequest {
  string organization_id = 1;
}

message ListAgentTemplatesResponse {
  repeated AgentTemplate templates = 1;
}
