syntax = "proto3";

package agents.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/agents/v1;agentsv1";

// BudgetsService manages per-organization spend caps, image caps, and
// per-user quotas within an organization. Absent rows mean no cap on
// that axis - the runtime falls through to server-side defaults.
//
// Money values are carried as strings on the wire to preserve Decimal
// precision; clients should parse with their language's Decimal type.
// Each amount is paired with an ISO 4217 currency code so the wire
// never assumes a single currency.
service BudgetsService {
  // Get the organization's budget, if any. Returns an empty message
  // when no budget row exists.
  rpc GetOrgBudget(GetOrgBudgetRequest) returns (GetOrgBudgetResponse) {}

  // Create or update the organization's budget row. Org admin only.
  rpc UpdateOrgBudget(UpdateOrgBudgetRequest) returns (UpdateOrgBudgetResponse) {}

  // Delete the organization's budget row. Caps revert to defaults.
  rpc DeleteOrgBudget(DeleteOrgBudgetRequest) returns (DeleteOrgBudgetResponse) {}

  // Get a single user's quota within an organization. Self-access
  // allowed; editing another user's quota requires org admin.
  rpc GetUserQuota(GetUserQuotaRequest) returns (GetUserQuotaResponse) {}

  // Create or update a per-user quota row. Org admin only.
  rpc UpdateUserQuota(UpdateUserQuotaRequest) returns (UpdateUserQuotaResponse) {}

  // Delete a per-user quota row. Org admin only.
  rpc DeleteUserQuota(DeleteUserQuotaRequest) returns (DeleteUserQuotaResponse) {}

  // List all per-user quota rows for an organization. Org admin only.
  rpc ListUserQuotas(ListUserQuotasRequest) returns (ListUserQuotasResponse) {}

  // Get the current-period spend summary for the org, optionally
  // scoped to a single user. Non-admin callers see only their own.
  rpc GetCurrentSpend(GetCurrentSpendRequest) returns (GetCurrentSpendResponse) {}

  // List the org's manual exchange rates. Org admin only.
  rpc ListCurrencyRates(ListCurrencyRatesRequest) returns (ListCurrencyRatesResponse) {}

  // Create or update a single (from -> to) rate. Org admin only.
  rpc UpsertCurrencyRate(UpsertCurrencyRateRequest) returns (UpsertCurrencyRateResponse) {}

  // Delete a single (from -> to) rate. Org admin only.
  rpc DeleteCurrencyRate(DeleteCurrencyRateRequest) returns (DeleteCurrencyRateResponse) {}

  // Set the org's display currency. Org admin only.
  rpc SetDisplayCurrency(SetDisplayCurrencyRequest) returns (SetDisplayCurrencyResponse) {}

  // Get the org's display currency. Falls back to the module default
  // ("EUR") when no row exists. Any org member can call.
  rpc GetDisplayCurrency(GetDisplayCurrencyRequest) returns (GetDisplayCurrencyResponse) {}
}

message OrgBudget {
  string id = 1;
  string organization_id = 2;
  // Spend cap per billing period in ``currency``. Absent means no cap.
  optional string monthly_limit = 3;
  // Count cap on image generations per billing period. Absent means
  // fall through to defaults.
  optional int32 image_monthly_limit = 4;
  bool hard_limit = 5;
  // Percent thresholds that fire alert notifications.
  repeated int32 alert_thresholds = 6;
  // 1..28 (values beyond 28 are clamped by the server at read time).
  int32 reset_day = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // ISO 4217 currency for ``monthly_limit``.
  string currency = 10;
}

message UserQuota {
  string id = 1;
  string organization_id = 2;
  string user_id = 3;
  optional string daily_limit = 4;
  optional string monthly_limit = 5;
  optional int32 daily_image_limit = 6;
  optional int32 monthly_image_limit = 7;
  bool hard_limit = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // ISO 4217 currency for ``daily_limit`` and ``monthly_limit``.
  string currency = 11;
}

message SpendSummary {
  // Organization in which this summary was computed.
  string organization_id = 1;
  // When the current period began.
  google.protobuf.Timestamp period_start = 2;
  // When the current period ends (half-open: usage from [start, end) is
  // counted).
  google.protobuf.Timestamp period_end = 3;
  // Total spend in the period (string-encoded Decimal) in the org's
  // display currency.
  string spend = 4;
  // Image-generation count in the period.
  int32 image_count = 5;
  // Percent of the configured ``monthly_limit`` used so far. Null when
  // no limit is configured.
  optional int32 pct_of_limit = 6;
  // Optional user filter this summary was scoped to.
  optional string user_id = 7;
  // ISO 4217 currency for ``spend``.
  string currency = 8;
}

message CurrencyRate {
  string id = 1;
  string organization_id = 2;
  string from_currency = 3;
  string to_currency = 4;
  // Decimal as string (10dp precision).
  string rate = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetOrgBudgetRequest {
  string organization_id = 1;
}

message GetOrgBudgetResponse {
  // May be unset if no budget row exists.
  optional OrgBudget budget = 1;
}

message UpdateOrgBudgetRequest {
  string organization_id = 1;
  optional string monthly_limit = 2;
  optional int32 image_monthly_limit = 3;
  bool hard_limit = 4;
  repeated int32 alert_thresholds = 5;
  int32 reset_day = 6;
  // ISO 4217. Defaults to the org's display currency when empty.
  string currency = 7;
}

message UpdateOrgBudgetResponse {
  OrgBudget budget = 1;
}

message DeleteOrgBudgetRequest {
  string organization_id = 1;
}

message DeleteOrgBudgetResponse {
  bool success = 1;
}

message GetUserQuotaRequest {
  string organization_id = 1;
  string user_id = 2;
}

message GetUserQuotaResponse {
  optional UserQuota quota = 1;
}

message UpdateUserQuotaRequest {
  string organization_id = 1;
  string user_id = 2;
  optional string daily_limit = 3;
  optional string monthly_limit = 4;
  optional int32 daily_image_limit = 5;
  optional int32 monthly_image_limit = 6;
  bool hard_limit = 7;
  // ISO 4217. Defaults to the org's display currency when empty.
  string currency = 8;
}

message UpdateUserQuotaResponse {
  UserQuota quota = 1;
}

message DeleteUserQuotaRequest {
  string organization_id = 1;
  string user_id = 2;
}

message DeleteUserQuotaResponse {
  bool success = 1;
}

message ListUserQuotasRequest {
  string organization_id = 1;
  optional common.v1.PaginationRequest pagination = 2;
}

message ListUserQuotasResponse {
  repeated UserQuota quotas = 1;
  common.v1.PaginationResponse pagination = 2;
}

message GetCurrentSpendRequest {
  string organization_id = 1;
  // Optional. When omitted, non-admin callers get their own spend;
  // admin callers get org-wide spend.
  optional string user_id = 2;
}

message GetCurrentSpendResponse {
  SpendSummary summary = 1;
}

message ListCurrencyRatesRequest {
  string organization_id = 1;
}

message ListCurrencyRatesResponse {
  repeated CurrencyRate rates = 1;
}

message UpsertCurrencyRateRequest {
  string organization_id = 1;
  string from_currency = 2;
  string to_currency = 3;
  // Decimal as string.
  string rate = 4;
}

message UpsertCurrencyRateResponse {
  CurrencyRate rate = 1;
}

message DeleteCurrencyRateRequest {
  string organization_id = 1;
  string from_currency = 2;
  string to_currency = 3;
}

message DeleteCurrencyRateResponse {
  bool success = 1;
}

message SetDisplayCurrencyRequest {
  string organization_id = 1;
  // ISO 4217.
  string display_currency = 2;
}

message SetDisplayCurrencyResponse {
  string display_currency = 1;
}

message GetDisplayCurrencyRequest {
  string organization_id = 1;
}

message GetDisplayCurrencyResponse {
  string display_currency = 1;
}
