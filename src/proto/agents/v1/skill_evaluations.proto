syntax = "proto3";

package agents.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/agents/v1;agentsv1";

service SkillEvaluationsService {
  rpc CreateCase(CreateEvaluationCaseRequest) returns (EvaluationCaseResponse) {}
  rpc UpdateCase(UpdateEvaluationCaseRequest) returns (EvaluationCaseResponse) {}
  rpc DeleteCase(DeleteEvaluationCaseRequest) returns (DeleteEvaluationCaseResponse) {}
  rpc ListCases(ListEvaluationCasesRequest) returns (ListEvaluationCasesResponse) {}
  rpc RunCase(RunSkillEvaluationRequest) returns (RunSkillEvaluationResponse) {}
  rpc RunSuite(RunSkillEvaluationRequest) returns (RunSkillEvaluationResponse) {}
  rpc ListRuns(ListEvaluationRunsRequest) returns (ListEvaluationRunsResponse) {}
  rpc GetRun(GetEvaluationRunRequest) returns (EvaluationRunResponse) {}
}

message EvaluationScope {
  oneof scope {
    string skill_id = 1;
    string draft_id = 2;
  }
}

message ToolFixture {
  string tool_name = 1;
  string response = 2;
  bool is_error = 3;
}

message EvaluationCaseFields {
  string name = 1;
  string input = 2;
  string rubric = 3;
  repeated string expected_tools = 4;
  repeated string forbidden_tools = 5;
  repeated ToolFixture fixtures = 6;
}

message EvaluationCase {
  string id = 1;
  EvaluationScope scope = 2;
  EvaluationCaseFields fields = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message CreateEvaluationCaseRequest {
  string organization_id = 1;
  EvaluationScope scope = 2;
  EvaluationCaseFields fields = 3;
}

message UpdateEvaluationCaseRequest {
  string organization_id = 1;
  string case_id = 2;
  EvaluationCaseFields fields = 3;
}

message EvaluationCaseResponse {
  EvaluationCase evaluation_case = 1;
}

message DeleteEvaluationCaseRequest {
  string organization_id = 1;
  string case_id = 2;
}

message DeleteEvaluationCaseResponse {}

message ListEvaluationCasesRequest {
  string organization_id = 1;
  EvaluationScope scope = 2;
}

message ListEvaluationCasesResponse {
  repeated EvaluationCase cases = 1;
}

message EvaluationTarget {
  oneof target {
    string skill_version_id = 1;
    string draft_id = 2;
  }
  // When supplied for a pending draft, evaluate a snapshot of the current editor.
  optional string draft_content = 3;
}

message RunSkillEvaluationRequest {
  string organization_id = 1;
  string request_id = 2;
  string agent_id = 3;
  EvaluationTarget target = 4;
  // RunCase requires exactly one; RunSuite accepts an empty list for the whole suite.
  repeated string case_ids = 5;
  bool judge = 6;
  string model_override = 7;
  string judge_model = 8;
}

enum EvaluationStatus {
  EVALUATION_STATUS_UNSPECIFIED = 0;
  EVALUATION_STATUS_QUEUED = 1;
  EVALUATION_STATUS_RUNNING = 2;
  EVALUATION_STATUS_PASSED = 3;
  EVALUATION_STATUS_FAILED = 4;
  EVALUATION_STATUS_INCONCLUSIVE = 5;
  EVALUATION_STATUS_ERROR = 6;
}

message EvaluationToolAttempt {
  string tool_name = 1;
  string input_json = 2;
  string fixture_response = 3;
  bool fixture_used = 4;
  string issue = 5;
}

message EvaluationAssertion {
  string tool_name = 1;
  string kind = 2;
  bool passed = 3;
}

message EvaluationJudge {
  string status = 1;
  optional double score = 2;
  string rationale = 3;
  string error = 4;
}

message EvaluationRun {
  string id = 1;
  string request_id = 2;
  string case_id = 3;
  string agent_id = 4;
  optional string skill_id = 5;
  optional string skill_version_id = 6;
  int32 version_number = 7;
  optional string draft_id = 8;
  string target_digest = 9;
  EvaluationStatus status = 10;
  string error = 11;
  EvaluationCaseFields case_snapshot = 12;
  string target_content = 13;
  string output = 14;
  repeated EvaluationToolAttempt tool_attempts = 15;
  repeated EvaluationAssertion assertions = 16;
  EvaluationJudge judge = 17;
  string model = 18;
  optional string cost = 19;
  optional string cost_currency = 20;
  int32 input_tokens = 21;
  int32 output_tokens = 22;
  int32 duration_ms = 23;
  google.protobuf.Timestamp created_at = 24;
  google.protobuf.Timestamp completed_at = 25;
  repeated string rule_version_ids = 26;
  string outcome_reason = 27;
  optional string run_log_id = 28;
}

message RunSkillEvaluationResponse {
  repeated EvaluationRun runs = 1;
}

message ListEvaluationRunsRequest {
  string organization_id = 1;
  string agent_id = 2;
  EvaluationScope scope = 3;
  int32 page_size = 4;
  string cursor = 5;
}

message ListEvaluationRunsResponse {
  repeated EvaluationRun runs = 1;
  string next_cursor = 2;
}

message GetEvaluationRunRequest {
  string organization_id = 1;
  string run_id = 2;
}

message EvaluationRunResponse {
  EvaluationRun run = 1;
}
