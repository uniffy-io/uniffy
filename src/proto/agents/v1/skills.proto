syntax = "proto3";

package agents.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/agents/v1;agentsv1";

// SkillsService manages skill definitions for agents.
// Skills are curated instruction sets (markdown) that shape agent behavior.
service SkillsService {
  rpc GenerateSkillDraft(GenerateSkillDraftRequest) returns (GenerateSkillDraftResponse) {}
  rpc RetrySkillDraftGeneration(RetrySkillDraftGenerationRequest) returns (GenerateSkillDraftResponse) {}
  // Create a new organization skill
  rpc CreateSkill(CreateSkillRequest) returns (CreateSkillResponse) {}

  // Get a skill by ID
  rpc GetSkill(GetSkillRequest) returns (GetSkillResponse) {}

  // List skills (bundled + organization)
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse) {}

  // Update an organization skill
  rpc UpdateSkill(UpdateSkillRequest) returns (UpdateSkillResponse) {}

  // Delete an organization skill
  rpc DeleteSkill(DeleteSkillRequest) returns (DeleteSkillResponse) {}

  // List assigned skills compatible with the requested surface and executable tools.
  rpc ListRunnableSkills(ListRunnableSkillsRequest) returns (ListRunnableSkillsResponse) {}

  // Create a pending draft (library "New skill" / "Edit as draft"). The draft
  // is never auto-activated; it becomes a skill only on SaveSkillDraft.
  rpc CreateSkillDraft(CreateSkillDraftRequest) returns (CreateSkillDraftResponse) {}

  // Get a single draft by id.
  rpc GetSkillDraft(GetSkillDraftRequest) returns (GetSkillDraftResponse) {}

  // List pending drafts for review (the drafts inbox).
  rpc ListSkillDrafts(ListSkillDraftsRequest) returns (ListSkillDraftsResponse) {}

  // Save a pending draft: a create draft becomes a new skill at version 1; an
  // edit/evolve draft appends a new version to its target skill.
  rpc SaveSkillDraft(SaveSkillDraftRequest) returns (SaveSkillDraftResponse) {}

  // Discard a pending draft (soft delete; never activates anything).
  rpc DiscardSkillDraft(DiscardSkillDraftRequest) returns (DiscardSkillDraftResponse) {}

  // List a skill's immutable version history (newest first), with the current
  // main-version pointer so the timeline can render the "Main" badge.
  rpc ListSkillVersions(ListSkillVersionsRequest) returns (ListSkillVersionsResponse) {}

  // Get a single version of a skill by version number.
  rpc GetSkillVersion(GetSkillVersionRequest) returns (GetSkillVersionResponse) {}

  // Set the main version the runtime uses: pin a version, or let it follow the
  // latest edit automatically.
  rpc SetMainSkillVersion(SetMainSkillVersionRequest) returns (SetMainSkillVersionResponse) {}

  // Revert a skill to an earlier version by copying that version's content into
  // a new version at the head of the history.
  rpc RevertSkill(RevertSkillRequest) returns (RevertSkillResponse) {}

  // Exact-version invocation observations for the org admin metrics view.
  rpc GetSkillMetrics(GetSkillMetricsRequest) returns (GetSkillMetricsResponse) {}
}

// Source of a skill definition
enum SkillSource {
  SKILL_SOURCE_UNSPECIFIED = 0;
  SKILL_SOURCE_BUNDLED = 1; // shipped with the app, org_id is null
  SKILL_SOURCE_ORGANIZATION = 2; // created by a builder
}

// Skill definition returned to clients
message SkillInfo {
  reserved 8, 11, 13;
  reserved "always_active", "when_to_use", "requires_context";
  string id = 1;
  optional string organization_id = 2; // null for bundled skills
  string name = 3;
  string display_name = 4;
  string description = 5;
  string content = 6; // markdown instructions
  SkillSource source = 7;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // Tool names required in the agent's final executable tool set.
  repeated string requires_tools = 12;
  string status = 14; // active | archived
  string origin = 15; // user | agent_proposed | agent_evolved | bundled
  int32 latest_version_number = 16;
  // The version the agent actually uses (the main version). Defaults to the
  // latest until the user pins one.
  int32 active_version_number = 17;
  bool active_version_pinned = 18;
  repeated string supported_surfaces = 19; // session | chat; empty permits both
}

// One immutable version snapshot of a skill.
message SkillVersion {
  reserved 8, 10;
  reserved "when_to_use", "requires_context";
  string id = 1;
  string skill_id = 2;
  int32 version_number = 3;
  string name = 4;
  string display_name = 5;
  string description = 6;
  string content = 7;
  repeated string requires_tools = 9;
  optional string author_id = 11;
  string author_kind = 12; // user | agent
  string change_summary = 13;
  optional string parent_version_id = 14;
  google.protobuf.Timestamp created_at = 15;
  repeated string supported_surfaces = 16; // session | chat; empty permits both
}

// A pending skill draft awaiting user review. One shape for user-authored and
// agent-proposed drafts; saved only on an explicit user action.
message SkillDraft {
  reserved 16, 18, 19;
  reserved "when_to_use", "requires_context", "suggested_always_active";
  string id = 1;
  string organization_id = 2;
  string owner_id = 3;
  optional string target_skill_id = 4; // null = a create draft
  string kind = 5; // create | edit | evolve
  optional string proposed_by_agent_id = 6;
  optional string session_id = 7;
  optional string channel_id = 8;
  optional string origin_chat_message_id = 9;
  repeated string evidence_message_ids = 10;
  string rationale = 11;
  string name = 12;
  string display_name = 13;
  string description = 14;
  string content = 15;
  repeated string requires_tools = 17;
  string status = 20; // generating | generation_failed | pending | saved | discarded
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
  repeated string supported_surfaces = 23; // session | chat; empty permits both
  optional string invocation_id = 24;
  optional string target_version_id = 25;
  int32 target_version_number = 26;
  int32 generation_attempt = 27;
  string generation_error = 28;
}

message GenerateSkillDraftRequest {
  string organization_id = 1;
  // A client-generated UUID deduplicates retries of the same confirmed action.
  string request_id = 2;
  string agent_id = 3;
  optional string session_id = 4;
  optional string channel_id = 5;
  optional string thread_root_id = 6;
  repeated string evidence_message_ids = 7;
  string rationale = 8;
  // Improve targets the exact invocation, never a client-selected skill.
  optional string invocation_id = 9;
}

message GenerateSkillDraftResponse {
  SkillDraft draft = 1;
}

message RetrySkillDraftGenerationRequest {
  string organization_id = 1;
  string draft_id = 2;
  int32 expected_attempt = 3;
}

message CreateSkillRequest {
  reserved 6;
  reserved "always_active";
  string organization_id = 1;
  string name = 2;
  string display_name = 3;
  string description = 4;
  string content = 5;
}

message CreateSkillResponse {
  SkillInfo skill = 1;
}

message GetSkillResponse {
  SkillInfo skill = 1;
}

message UpdateSkillResponse {
  SkillInfo skill = 1;
}

message GetSkillRequest {
  string organization_id = 1;
  string skill_id = 2;
}

message ListSkillsRequest {
  string organization_id = 1;
  optional common.v1.PaginationRequest pagination = 2;
}

message ListSkillsResponse {
  repeated SkillInfo skills = 1;
  common.v1.PaginationResponse pagination = 2;
}

message UpdateSkillRequest {
  reserved 7, 8;
  reserved "always_active", "when_to_use";
  string organization_id = 1;
  string skill_id = 2;
  // The slug is the stable identifier: it is set at creation and rejected on
  // update. The field stays so a caller resending the current value is a no-op.
  optional string name = 3;
  optional string display_name = 4;
  optional string description = 5;
  optional string content = 6;
}

message DeleteSkillRequest {
  string organization_id = 1;
  string skill_id = 2;
}

message DeleteSkillResponse {
  bool success = 1;
}

// A skill entry for the slash-command menu. Carries only what the menu
// renders and what a follow-up invocation needs (the id); no content.
message RunnableSkill {
  reserved 5;
  reserved "when_to_use";
  string id = 1;
  string name = 2;
  string display_name = 3;
  string description = 4;
}

message ListRunnableSkillsRequest {
  string organization_id = 1;
  string agent_id = 2;
  string surface = 3; // session | chat
}

message ListRunnableSkillsResponse {
  repeated RunnableSkill skills = 1;
}

message CreateSkillDraftRequest {
  reserved 8, 10, 11;
  reserved "when_to_use", "requires_context", "suggested_always_active";
  string organization_id = 1;
  string kind = 2; // create | edit | evolve
  optional string target_skill_id = 3; // required for edit/evolve
  string name = 4;
  string display_name = 5;
  string description = 6;
  string content = 7;
  repeated string requires_tools = 9;
  string rationale = 12;
  repeated string supported_surfaces = 13; // session | chat; empty permits both
}

message CreateSkillDraftResponse {
  SkillDraft draft = 1;
}

message GetSkillDraftRequest {
  string organization_id = 1;
  string draft_id = 2;
}

message GetSkillDraftResponse {
  SkillDraft draft = 1;
}

message ListSkillDraftsRequest {
  string organization_id = 1;
  optional string status = 2; // defaults to "pending"
  optional common.v1.PaginationRequest pagination = 3;
}

message ListSkillDraftsResponse {
  repeated SkillDraft drafts = 1;
  common.v1.PaginationResponse pagination = 2;
}

// The review card sends the full, possibly user-edited field set so the saved
// version reflects the reviewer's edits without a separate update round-trip.
message SaveSkillDraftRequest {
  reserved 7, 9, 10;
  reserved "when_to_use", "requires_context", "suggested_always_active";
  string organization_id = 1;
  string draft_id = 2;
  string name = 3;
  string display_name = 4;
  string description = 5;
  string content = 6;
  repeated string requires_tools = 8;
  string change_summary = 11;
  // Acknowledges that saving replaces an existing skill of the same name.
  bool allow_replace = 12;
  repeated string supported_surfaces = 13; // session | chat; empty permits both
}

message SaveSkillDraftResponse {
  SkillInfo skill = 1;
  SkillVersion version = 2;
}

message DiscardSkillDraftRequest {
  string organization_id = 1;
  string draft_id = 2;
}

message DiscardSkillDraftResponse {
  bool success = 1;
}

message ListSkillVersionsRequest {
  string organization_id = 1;
  string skill_id = 2;
  optional common.v1.PaginationRequest pagination = 3;
}

message ListSkillVersionsResponse {
  repeated SkillVersion versions = 1;
  common.v1.PaginationResponse pagination = 2;
  // The current main-version pointer, echoed so the timeline can mark the main
  // version and drive the follow-latest toggle without a second round-trip.
  int32 active_version_number = 3;
  bool active_version_pinned = 4;
  int32 latest_version_number = 5;
}

message GetSkillVersionRequest {
  string organization_id = 1;
  string skill_id = 2;
  int32 version_number = 3;
}

message GetSkillVersionResponse {
  SkillVersion version = 1;
}

message SetMainSkillVersionRequest {
  string organization_id = 1;
  string skill_id = 2;
  // Pinned as the main version when follow_latest is false; ignored otherwise.
  optional int32 version_number = 3;
  // When true, unpin so the main version tracks the latest edit automatically.
  bool follow_latest = 4;
}

message SetMainSkillVersionResponse {
  SkillInfo skill = 1;
}

message RevertSkillRequest {
  string organization_id = 1;
  string skill_id = 2;
  int32 version_number = 3;
}

message RevertSkillResponse {
  SkillInfo skill = 1;
  SkillVersion version = 2;
}

// Observations of one exact version within the requested time window.
message SkillMetric {
  reserved 3, 4, 5, 6;
  reserved "origin", "injected_count", "viewed_count", "invoked_count";
  string skill_id = 1;
  string display_name = 2;
  string skill_version_id = 7;
  int32 skill_version_number = 8;
  int64 invocation_count = 9;
  int64 started_count = 10;
  int64 completed_count = 11;
  int64 failed_count = 12;
  int64 rejected_count = 13;
  int64 cancelled_count = 14;
  reserved 15 to 20;
  reserved "rated_response_count", "positive_feedback_count", "negative_feedback_count", "rating_count", "positive_feedback_rate", "negative_feedback_rate";
  int64 tool_error_run_count = 21;
  // Fraction of invocations with at least one failed tool call.
  double tool_error_rate = 22;
  int64 unique_users = 23;
  int64 run_log_count = 24;
  int64 duration_ms = 25;
  int64 input_tokens = 26;
  int64 output_tokens = 27;
  repeated SkillMetricCost costs = 28;
}

message SkillMetricCost {
  string currency = 1;
  string amount = 2;
  int64 run_count = 3;
}

message GetSkillMetricsRequest {
  string organization_id = 1;
  // Empty is org-admin reporting; a skill filter is available to builders.
  string skill_id = 2;
  // Defaults to 30, maximum 90.
  int32 window_days = 3;
  // Defaults to 200, maximum 500.
  int32 page_size = 4;
  string cursor = 5;
}

message GetSkillMetricsResponse {
  reserved 2, 3, 4;
  reserved "positive_feedback_count", "negative_feedback_count", "pending_agent_drafts";
  repeated SkillMetric metrics = 1;
  string next_cursor = 5;
  google.protobuf.Timestamp window_start = 6;
  google.protobuf.Timestamp window_end = 7;
}
