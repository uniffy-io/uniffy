syntax = "proto3";

package agents.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/agents/v1;agentsv1";

// SessionsService manages conversation sessions between users and agents.
service SessionsService {
  // Create a new session (find-or-create for DIRECT kind)
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {}

  // Get a session by ID
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {}

  // List sessions for the user in an organization
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {}

  // Update session settings (display name, model override)
  rpc UpdateSession(UpdateSessionRequest) returns (UpdateSessionResponse) {}

  // Archive a session (soft delete)
  rpc ArchiveSession(ArchiveSessionRequest) returns (ArchiveSessionResponse) {}

  // Add a message to a session
  rpc AddMessage(AddMessageRequest) returns (AddMessageResponse) {}

  // List messages in a session
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {}

  // Get recent messages for LLM context assembly
  rpc GetSessionContext(GetSessionContextRequest) returns (GetSessionContextResponse) {}

  // Get session context statistics (message counts, compaction info)
  rpc GetSessionContextStats(GetSessionContextStatsRequest) returns (GetSessionContextStatsResponse) {}

  // Manually trigger session compaction
  rpc CompactSession(CompactSessionRequest) returns (CompactSessionResponse) {}

  // Edit a user message within EDIT_WINDOW_SECONDS. Sets `previous_content`
  // and `edited_at`, then soft-invalidates every later message in the
  // session so the client can re-run the conversation from the edit
  // point. Refused if a run is currently in flight on this session.
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse) {}

  // Soft-delete a user message. The message itself and every later
  // message in the session are marked `is_invalidated=true` so the
  // context loader skips them. Refused if a run is currently in flight.
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse) {}

  // Retry from a message. For a user message, returns its content +
  // file_ids and invalidates every later message so the caller can
  // re-send. For an assistant message, walks back to the most recent
  // preceding user message and returns that. Refused if a run is
  // currently in flight on this session.
  rpc RetryMessage(RetryMessageRequest) returns (RetryMessageResponse) {}
}

// Kind of session
enum SessionKind {
  SESSION_KIND_UNSPECIFIED = 0;
  SESSION_KIND_DIRECT = 1; // 1:1 user<->agent
  SESSION_KIND_GROUP = 2; // multi-user with agent
  SESSION_KIND_GLOBAL = 3; // agent background/automation session
}

// Role of a message in the conversation
enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_ASSISTANT = 2;
  MESSAGE_ROLE_TOOL = 3;
  MESSAGE_ROLE_SYSTEM = 4;
  MESSAGE_ROLE_SUMMARY = 5; // compaction output
}

// Session info returned to clients
message SessionInfo {
  string id = 1;
  string organization_id = 2;
  string agent_id = 3;
  string user_id = 4;
  SessionKind kind = 5;
  optional string display_name = 6;
  optional string model_override = 7;
  int64 total_input_tokens = 8;
  int64 total_output_tokens = 9;
  int32 message_count = 10;
  optional string last_model_used = 11;
  bool is_archived = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

// Message info returned to clients
message MessageInfo {
  string id = 1;
  string session_id = 2;
  MessageRole role = 3;
  optional string content = 4;
  int32 input_tokens = 5;
  int32 output_tokens = 6;
  optional string model = 7;
  optional string tool_name = 8;
  optional string tool_call_id = 9;
  optional string tool_args_json = 10;
  optional string tool_result = 11;
  bool is_thinking = 12;
  bool is_compacted = 13;
  google.protobuf.Timestamp created_at = 14;
  // File IDs attached to this message (for displaying file references in history)
  repeated string file_ids = 15;
  // True if the message has been soft-invalidated by an edit, delete,
  // or retry on this or an earlier message. The context loader skips
  // these; the UI may still show them as struck-through history.
  bool is_invalidated = 16;
  // Set when a user message has been edited. Null otherwise.
  optional google.protobuf.Timestamp edited_at = 17;
  // Pre-edit content. Populated only for messages with edited_at set.
  optional string previous_content = 18;
  // True if this assistant turn was cancelled by the user before
  // completion. The UI renders it as a "cancelled" placeholder.
  bool was_cancelled = 19;
}

// --- Requests and Responses ---

message CreateSessionRequest {
  string organization_id = 1;
  string agent_id = 2;
  SessionKind kind = 3;
  optional string display_name = 4;
  optional string model_override = 5;
}

message CreateSessionResponse {
  SessionInfo session = 1;
}

message GetSessionResponse {
  SessionInfo session = 1;
}

message UpdateSessionResponse {
  SessionInfo session = 1;
}

message GetSessionRequest {
  string organization_id = 1;
  string session_id = 2;
}

message ListSessionsRequest {
  string organization_id = 1;
  optional common.v1.PaginationRequest pagination = 2;
  optional string agent_id = 3;
  optional SessionKind kind = 4;
  optional bool is_archived = 5;
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
  common.v1.PaginationResponse pagination = 2;
}

message UpdateSessionRequest {
  string organization_id = 1;
  string session_id = 2;
  optional string display_name = 3;
  optional string model_override = 4;
}

message ArchiveSessionRequest {
  string organization_id = 1;
  string session_id = 2;
}

message ArchiveSessionResponse {
  bool success = 1;
}

message AddMessageRequest {
  string organization_id = 1;
  string session_id = 2;
  MessageRole role = 3;
  optional string content = 4;
  int32 input_tokens = 5;
  int32 output_tokens = 6;
  optional string model = 7;
  optional string tool_name = 8;
  optional string tool_call_id = 9;
  optional string tool_args_json = 10;
  optional string tool_result = 11;
  bool is_thinking = 12;
}

message AddMessageResponse {
  MessageInfo message = 1;
}

message ListMessagesRequest {
  string organization_id = 1;
  string session_id = 2;
  optional common.v1.PaginationRequest pagination = 3;
  optional bool include_compacted = 4;
}

message ListMessagesResponse {
  repeated MessageInfo messages = 1;
  common.v1.PaginationResponse pagination = 2;
}

message GetSessionContextRequest {
  string organization_id = 1;
  string session_id = 2;
}

message GetSessionContextResponse {
  repeated MessageInfo messages = 1;
  int32 total_messages = 2;
}

message GetSessionContextStatsRequest {
  string organization_id = 1;
  string session_id = 2;
}

message GetSessionContextStatsResponse {
  // Total messages ever created in this session (including compacted)
  int32 total_messages = 1;
  // Messages currently active (not compacted)
  int32 active_messages = 2;
  // Messages that have been compacted
  int32 compacted_messages = 3;
  // Number of summary messages currently in the context window
  int32 summary_count = 4;
  // Provider-reported prompt + completion size of the most recent
  // assistant turn (last_input_tokens + last_output_tokens). Zero
  // before the first reply.
  int32 active_tokens = 5;
  // Token budget for conversation history (65% of context window)
  int32 token_budget = 6;
  // Tokens remaining before compaction triggers
  int32 tokens_until_compaction = 7;
  // Model context window size in tokens
  int32 context_window_tokens = 8;
  // Full prompt size of the most recent assistant turn -- uncached
  // input plus tokens served from the prompt cache. Zero pre-first-turn.
  int32 last_input_tokens = 9;
  // Provider-reported output_tokens of the most recent assistant turn
  // (the assistant's reply). Zero pre-first-turn.
  int32 last_output_tokens = 10;
  // Tokens served from Anthropic's prompt cache on the last turn
  // (`cache_read_input_tokens`). Counted toward last_input_tokens but
  // billed at ~10% of the base input price -- the savings signal.
  int32 last_cache_read_tokens = 11;
}

message CompactSessionRequest {
  string organization_id = 1;
  string session_id = 2;
}

message CompactSessionResponse {
  bool compacted = 1;
  // Updated stats after compaction
  GetSessionContextStatsResponse stats = 2;
  // Compaction-specific results
  int32 messages_compacted = 3;
  int32 tokens_before = 4;
  int32 tokens_after = 5;
  int32 tokens_saved = 6;
  int32 summary_tokens = 7;
}

message EditMessageRequest {
  string organization_id = 1;
  string message_id = 2;
  string new_content = 3;
}

message EditMessageResponse {
  MessageInfo message = 1;
  // Number of later messages marked invalidated as a result.
  int32 downstream_invalidated = 2;
}

message DeleteMessageRequest {
  string organization_id = 1;
  string message_id = 2;
}

message DeleteMessageResponse {
  // Total rows marked invalidated (the deleted message + every later
  // message in the session).
  int32 invalidated_count = 1;
}

message RetryMessageRequest {
  string organization_id = 1;
  string message_id = 2;
}

message RetryMessageResponse {
  // Content of the user message the caller should re-send.
  string content = 1;
  // File ids that were attached to the original user message.
  repeated string file_ids = 2;
}
