syntax = "proto3";

package agents.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/agents/v1;agentsv1";

// SessionsService manages agent sessions: test-drawer conversations plus the
// internal session store the runtime, AI Builder, and cron runs write into.
service SessionsService {
  // Create a new session (find-or-create for DIRECT kind)
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {}

  // Get a session by ID
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {}

  // List messages in a session
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {}

  // Edit a user message within EDIT_WINDOW_SECONDS. Sets `previous_content`
  // and `edited_at`, then soft-invalidates every later message in the
  // session so the client can re-run the conversation from the edit
  // point. Refused if a run is currently in flight on this session.
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse) {}

  // Retry from a message. For a user message, returns its content +
  // file_ids and invalidates every later message so the caller can
  // re-send. For an assistant message, walks back to the most recent
  // preceding user message and returns that. Refused if a run is
  // currently in flight on this session.
  rpc RetryMessage(RetryMessageRequest) returns (RetryMessageResponse) {}

  // Record (or clear) the caller's thumbs up/down on an agent reply, by
  // session message id or by chat message id. The signal feeds the
  // skill-evolution analyzer; an empty rating clears it.
  rpc SubmitMessageFeedback(SubmitMessageFeedbackRequest) returns (SubmitMessageFeedbackResponse) {}
}

// Kind of session
enum SessionKind {
  SESSION_KIND_UNSPECIFIED = 0;
  SESSION_KIND_DIRECT = 1; // 1:1 user<->agent
  SESSION_KIND_GROUP = 2; // multi-user with agent
  SESSION_KIND_GLOBAL = 3; // agent background/automation session
}

// Role of a message in the conversation
enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_ASSISTANT = 2;
  MESSAGE_ROLE_TOOL = 3;
  MESSAGE_ROLE_SYSTEM = 4;
  MESSAGE_ROLE_SUMMARY = 5; // compaction output
}

// Session info returned to clients
message SessionInfo {
  string id = 1;
  string organization_id = 2;
  string agent_id = 3;
  string user_id = 4;
  SessionKind kind = 5;
  optional string display_name = 6;
  optional string model_override = 7;
  int64 total_input_tokens = 8;
  int64 total_output_tokens = 9;
  int32 message_count = 10;
  optional string last_model_used = 11;
  bool is_archived = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  // True for test-drawer sessions: hidden from every session listing and
  // memory writes are disabled during their runs.
  bool is_test = 15;
}

// Message info returned to clients
message MessageInfo {
  string id = 1;
  string session_id = 2;
  MessageRole role = 3;
  optional string content = 4;
  int32 input_tokens = 5;
  int32 output_tokens = 6;
  optional string model = 7;
  optional string tool_name = 8;
  optional string tool_call_id = 9;
  optional string tool_args_json = 10;
  optional string tool_result = 11;
  bool is_thinking = 12;
  bool is_compacted = 13;
  google.protobuf.Timestamp created_at = 14;
  // File IDs attached to this message (for displaying file references in history)
  repeated string file_ids = 15;
  // True if the message has been soft-invalidated by an edit, delete,
  // or retry on this or an earlier message. The context loader skips
  // these; the UI may still show them as struck-through history.
  bool is_invalidated = 16;
  // Set when a user message has been edited. Null otherwise.
  optional google.protobuf.Timestamp edited_at = 17;
  // Pre-edit content. Populated only for messages with edited_at set.
  optional string previous_content = 18;
  // True if this assistant turn was cancelled by the user before
  // completion. The UI renders it as a "cancelled" placeholder.
  bool was_cancelled = 19;
  // The caller's own thumbs rating on this message ("up" | "down" | "").
  // Only assistant messages carry feedback; empty when the caller hasn't rated.
  string feedback_rating = 20;
  // Display name of the skill the user ran via the slash menu for this turn.
  // Only user messages carry it; empty when no skill was invoked.
  string invoked_skill_name = 21;
  // JSON array of persisted reasoning blocks
  // [{block_id, content, elapsed_ms}]; "" when the turn had none
  string thinking_json = 22;
}

message CreateSessionRequest {
  string organization_id = 1;
  string agent_id = 2;
  SessionKind kind = 3;
  optional string display_name = 4;
  optional string model_override = 5;
  // Create as a test session (hidden from listings, memory writes disabled).
  bool is_test = 6;
}

message CreateSessionResponse {
  SessionInfo session = 1;
}

message GetSessionResponse {
  SessionInfo session = 1;
}

message GetSessionRequest {
  string organization_id = 1;
  string session_id = 2;
}

message ListMessagesRequest {
  string organization_id = 1;
  string session_id = 2;
  optional common.v1.PaginationRequest pagination = 3;
  optional bool include_compacted = 4;
}

message ListMessagesResponse {
  repeated MessageInfo messages = 1;
  common.v1.PaginationResponse pagination = 2;
}

message EditMessageRequest {
  string organization_id = 1;
  string message_id = 2;
  string new_content = 3;
}

message EditMessageResponse {
  MessageInfo message = 1;
  // Number of later messages marked invalidated as a result.
  int32 downstream_invalidated = 2;
}

message RetryMessageRequest {
  string organization_id = 1;
  string message_id = 2;
}

message RetryMessageResponse {
  // Content of the user message the caller should re-send.
  string content = 1;
  // File ids that were attached to the original user message.
  repeated string file_ids = 2;
}

// One user's thumbs rating on an agent message.
message MessageFeedback {
  string message_id = 1;
  string rating = 2; // up | down
  string comment = 3;
  google.protobuf.Timestamp created_at = 4;
}

message SubmitMessageFeedbackRequest {
  string organization_id = 1;
  // Session-message target (agents_messages id). Exactly one of message_id
  // and chat_message_id must be set.
  string message_id = 2;
  string rating = 3; // up | down, or "" to clear
  optional string comment = 4;
  // Chat target: an agent reply's chat_messages id.
  string chat_message_id = 5;
}

message SubmitMessageFeedbackResponse {
  // Unset when the rating was cleared.
  optional MessageFeedback feedback = 1;
}
