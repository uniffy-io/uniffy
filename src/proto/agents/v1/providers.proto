syntax = "proto3";

package agents.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/agents/v1;agentsv1";

// ProvidersService manages LLM provider credentials for an organization.
service ProvidersService {
  // Add a new provider API key
  rpc AddProviderKey(AddProviderKeyRequest) returns (AddProviderKeyResponse) {}

  // List all provider keys for the organization (credentials are masked)
  rpc ListProviderKeys(ListProviderKeysRequest) returns (ListProviderKeysResponse) {}

  // Remove a provider key
  rpc RemoveProviderKey(RemoveProviderKeyRequest) returns (RemoveProviderKeyResponse) {}

  // Validate a stored provider key against the provider API
  rpc ValidateProviderKey(ValidateProviderKeyRequest) returns (ValidateProviderKeyResponse) {}

  // List available models based on configured provider keys
  rpc ListAvailableModels(ListAvailableModelsRequest) returns (ListAvailableModelsResponse) {}

  // Enable or disable a provider key
  rpc ToggleProviderKey(ToggleProviderKeyRequest) returns (ToggleProviderKeyResponse) {}

  // List models available through a specific provider key
  rpc ListModelsForKey(ListModelsForKeyRequest) returns (ListModelsForKeyResponse) {}
}

// Provider key info (never includes the actual credential)
message ProviderKeyInfo {
  // Unique key ID
  string id = 1;
  // Provider name (e.g. "anthropic")
  string provider = 2;
  // User-friendly label
  string label = 3;
  // Masked hint of the credential (e.g. "sk-ant-api03-...xyz")
  string key_hint = 4;
  // Whether the key passed its last validation
  bool is_valid = 5;
  // When the key was last validated
  optional google.protobuf.Timestamp last_validated_at = 6;
  // When the key was last used for an API call
  optional google.protobuf.Timestamp last_used_at = 7;
  // Last error message if validation failed
  optional string last_error = 8;
  // When the key was created
  google.protobuf.Timestamp created_at = 9;
  // When the key was last updated
  google.protobuf.Timestamp updated_at = 10;
  // Whether the key is enabled for use
  bool is_enabled = 11;
  // User who created this key
  string created_by = 12;
}

// Model capabilities and metadata
message ModelInfo {
  // Model identifier (e.g. "claude-opus-4-6")
  string id = 1;
  // Human-readable name
  string display_name = 2;
  // Provider name
  string provider = 3;
  // Context window size in tokens
  int32 context_window = 4;
  // Whether the model supports tool use
  bool supports_tools = 5;
  // Whether the model supports image inputs
  bool supports_vision = 6;
  // Whether the model supports extended thinking
  bool supports_thinking = 7;
  // Default max output tokens (0 when unspecified)
  int32 default_max_tokens = 8;
  // Whether the model supports prompt caching
  bool supports_prompt_cache = 9;
  // Whether the model is deprecated
  bool deprecated = 10;
  // Reasoning effort levels the model accepts (e.g. "low", "high"); empty
  // when it has no discrete levels
  repeated string reasoning_levels = 11;
  // Default reasoning effort, when the model has levels
  string default_reasoning_effort = 12;
  // USD price per 1M tokens, as decimal strings ("" when no catalog rate)
  string input_per_1m = 13;
  string output_per_1m = 14;
  string cache_read_per_1m = 15;
  string cache_write_per_1m = 16;
  // Whether the model can generate images (has image pricing in the catalog)
  bool supports_image_generation = 17;
  // Whether the id resolves to a curated catalog entry (vs a live-API model
  // with no catalog row). The chat-model pickers show only catalog-known models.
  bool catalog_known = 18;
  // JSON object describing the model's tunable parameters (knob -> bounded
  // spec, merged from the catalog); "" when the model is not catalog-known
  string parameter_schema_json = 19;
}

// Request to add a new provider key
message AddProviderKeyRequest {
  // Organization ID
  string organization_id = 1;
  // Provider name (e.g. "anthropic")
  string provider = 2;
  // User-friendly label
  string label = 3;
  // The actual credential (API key); write-only, never returned
  string credential = 4;
}

// Response containing a single provider key (Add)
message AddProviderKeyResponse {
  // The provider key info (credential is never included)
  ProviderKeyInfo key = 1;
}

// Response containing a single provider key (Toggle)
message ToggleProviderKeyResponse {
  // The provider key info (credential is never included)
  ProviderKeyInfo key = 1;
}

// Request to list provider keys
message ListProviderKeysRequest {
  // Organization ID
  string organization_id = 1;
  // Optional provider filter
  optional string provider = 2;
}

// Response with list of provider keys
message ListProviderKeysResponse {
  // List of provider keys
  repeated ProviderKeyInfo keys = 1;
}

// Request to remove a provider key
message RemoveProviderKeyRequest {
  // Organization ID
  string organization_id = 1;
  // Key ID to remove
  string key_id = 2;
}

// Response for remove operation
message RemoveProviderKeyResponse {
  bool success = 1;
}

// Request to validate a provider key
message ValidateProviderKeyRequest {
  // Organization ID
  string organization_id = 1;
  // Key ID to validate
  string key_id = 2;
}

// Response for validate operation
message ValidateProviderKeyResponse {
  // Whether the key is valid
  bool is_valid = 1;
  // Error message if not valid
  optional string error = 2;
}

// Request to list available models
message ListAvailableModelsRequest {
  // Organization ID
  string organization_id = 1;
  // Optional provider filter
  optional string provider = 2;
}

// Response with available models
message ListAvailableModelsResponse {
  // Available models
  repeated ModelInfo models = 1;
}

// Response with models for a specific provider key
message ListModelsForKeyResponse {
  // Available models
  repeated ModelInfo models = 1;
}

// Request to list models for a specific provider key
message ListModelsForKeyRequest {
  // Organization ID
  string organization_id = 1;
  // Provider key ID
  string key_id = 2;
}

// Request to toggle a provider key on or off
message ToggleProviderKeyRequest {
  // Organization ID
  string organization_id = 1;
  // Key ID to toggle
  string key_id = 2;
  // Whether to enable (true) or disable (false) the key
  bool enabled = 3;
}
