syntax = "proto3";

package agents.v1;

import "agents/v1/sessions.proto";
import "agents/v1/skills.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/agents/v1;agentsv1";

// RuntimeService handles message execution (send to LLM and store response).
service RuntimeService {
  // Send a user message and get the assistant response
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse) {}
  // Send a user message and stream tokens, tool events, and the final response
  rpc StreamSendMessage(StreamSendMessageRequest) returns (stream StreamSendMessageResponse) {}
  // Re-run the agent against an existing edited user message. The anchor
  // message must be a non-invalidated user-role row whose downstream has
  // already been invalidated (via EditMessage). Streams events in the
  // same shape as StreamSendMessage; no new user message is created.
  rpc RerunFromMessage(RerunFromMessageRequest) returns (stream RerunFromMessageResponse) {}
  // Resume an in-flight run by run_id. Replays the full event stream from
  // the start, then tails live until Done/Error or the 120s wall budget.
  // Used by the frontend after a tab reload to reconnect without
  // re-driving the LLM.
  rpc SubscribeToRun(SubscribeToRunRequest) returns (stream SubscribeToRunResponse) {}
  // Cancel an in-flight run. Flips the run-state hash to "cancelled";
  // the egress worker observes the flag between tool iterations and
  // exits with a synthetic Error event. Idempotent: cancelling an
  // already-finished run is a no-op.
  rpc CancelStream(CancelStreamRequest) returns (CancelStreamResponse) {}
  // Approve or reject a destructive tool call that requires confirmation
  rpc RespondToConfirmation(RespondToConfirmationRequest) returns (RespondToConfirmationResponse) {}
  // Get usage statistics for an organization
  rpc GetUsageStats(GetUsageStatsRequest) returns (GetUsageStatsResponse) {}
  // Re-run the image generation behind a chat message with adjusted
  // parameters. Re-executes the image tool under the CALLER's identity; it
  // does not drive the LLM and writes no user message.
  rpc RegenerateImage(RegenerateImageRequest) returns (RegenerateImageResponse) {}
}

// RuntimeSettingsService manages the per-org agent runtime settings blob.
// Both methods require org admin.
service RuntimeSettingsService {
  rpc GetRuntimeSettings(GetRuntimeSettingsRequest) returns (GetRuntimeSettingsResponse) {}
  rpc UpdateRuntimeSettings(UpdateRuntimeSettingsRequest) returns (UpdateRuntimeSettingsResponse) {}
}

message RuntimeSettings {
  int32 send_deadline_seconds = 1;
  bool failover_enabled = 2;
  bool resume_enabled = 3;
  int32 circuit_breaker_failure_threshold = 4;
  int32 circuit_breaker_recovery_seconds = 5;
  bool personal_memory_bridge_enabled = 6;
  // Org default provider key id (empty string = none)
  string default_provider_key_id = 7;
  // Org default chat model (empty string = none)
  string default_chat_model = 8;
  // Ceilings clamping every agent's resolved image params. Empty = no ceiling.
  // "512px" | "1K" | "2K" | "4K"
  string image_max_resolution = 9;
  // "low" | "medium" | "high"
  string image_max_quality = 10;
}

message GetRuntimeSettingsRequest {
  string organization_id = 1;
}

message UpdateRuntimeSettingsRequest {
  string organization_id = 1;
  RuntimeSettings settings = 2;
}

message GetRuntimeSettingsResponse {
  RuntimeSettings settings = 1;
  // Whether an org-level settings row exists (vs pure code defaults).
  bool configured = 2;
}

message UpdateRuntimeSettingsResponse {
  RuntimeSettings settings = 1;
  bool configured = 2;
}

message RegenerateImageRequest {
  string organization_id = 1;
  string channel_id = 2;
  // The generated-image tool-call row to regenerate from.
  string message_id = 3;
  // JSON object of image knobs to change; merged over the original call's
  // resolved params. Builder-only knobs are rejected.
  string params_patch = 4;
}

message RegenerateImageResponse {
  // The new tool-call row carrying the regenerated image.
  string message_id = 1;
  // JSON object: prompt, params, file_urn, model, cost.
  string result_metadata = 2;
}

message GetUsageStatsRequest {
  string organization_id = 1;
  // Number of days to look back (default 30)
  int32 days = 2;
  // Aggregation interval: "30m", "1h", "2h", "4h", "1d" (default "1d")
  string interval = 3;
}

message GetUsageStatsResponse {
  // Summary totals for the period
  int64 total_runs = 1;
  int64 total_input_tokens = 2;
  int64 total_output_tokens = 3;
  int64 total_sessions = 4;
  int32 avg_duration_ms = 5;

  // Daily usage breakdown
  repeated DailyUsage daily_usage = 6;

  // Per-model token breakdown
  repeated ModelUsage model_usage = 7;

  // Per-agent usage breakdown
  repeated AgentUsageInfo agent_usage = 8;

  // Top tool calls by frequency
  repeated ToolUsage tool_usage = 9;

  // Per-provider-key usage breakdown
  repeated ProviderKeyUsage provider_key_usage = 10;

  // Cron (scheduled tasks) usage breakdown
  repeated CronTaskUsage cron_usage = 11;
  // Cron summary totals
  int64 cron_total_runs = 12;
  int64 cron_total_successes = 13;
  int64 cron_total_failures = 14;
  int64 cron_total_input_tokens = 15;
  int64 cron_total_output_tokens = 16;
  // Tokens served from Anthropic's prompt cache across all runs in
  // the period. Counted toward total_input_tokens (the prompt was that
  // big from the model's POV) but billed at ~10% of base input price.
  int64 total_cache_read_input_tokens = 17;

  // Cost + usage extensions sourced from the run-log columns. Decimal
  // money values are encoded as strings so the wire never loses
  // precision; the org's display currency is carried separately.
  string total_cost = 18;
  int64 total_thinking_tokens = 19;
  int64 total_image_count = 20;
  int64 total_retries = 21;
  int64 total_cancelled = 22;
  int64 total_deadline_exceeded = 23;
  // ISO 4217 currency for ``total_cost`` and per-bucket ``cost``
  // values in DailyUsage / ModelUsage. Defaults to "EUR" when no
  // org row exists.
  string display_currency = 24;
  int64 total_cache_creation_input_tokens = 25;
  int64 cron_total_cache_read_input_tokens = 26;
  int64 cron_total_cache_creation_input_tokens = 27;
}

message DailyUsage {
  string date = 1; // YYYY-MM-DD for 1d buckets; ISO 8601 with offset for sub-daily buckets
  int64 runs = 2;
  int64 input_tokens = 3;
  int64 output_tokens = 4;
  // Cache reads in this bucket; subset of input_tokens.
  int64 cache_read_input_tokens = 5;
  string cost = 6;
  int64 image_count = 7;
  int64 cache_creation_input_tokens = 8;
}

message ModelUsage {
  string model = 1;
  int64 runs = 2;
  int64 input_tokens = 3;
  int64 output_tokens = 4;
  string cost = 5;
  int64 image_count = 6;
  int64 cache_read_input_tokens = 7;
  int64 cache_creation_input_tokens = 8;
}

message AgentUsageInfo {
  string agent_id = 1;
  string agent_name = 2;
  int64 runs = 3;
  int64 input_tokens = 4;
  int64 output_tokens = 5;
  int64 cache_read_input_tokens = 6;
  int64 cache_creation_input_tokens = 7;
}

message ToolUsage {
  string tool_name = 1;
  int64 call_count = 2;
}

message ProviderKeyUsage {
  string provider_key_id = 1;
  string key_label = 2;
  string provider = 3;
  int64 runs = 4;
  int64 input_tokens = 5;
  int64 output_tokens = 6;
  int64 cache_read_input_tokens = 7;
  int64 cache_creation_input_tokens = 8;
}

message CronTaskUsage {
  string cron_task_id = 1;
  string task_name = 2;
  string agent_name = 3;
  int64 total_runs = 4;
  int64 successes = 5;
  int64 failures = 6;
  int64 input_tokens = 7;
  int64 output_tokens = 8;
  int64 cache_read_input_tokens = 9;
  int64 cache_creation_input_tokens = 10;
}

message SendMessageRequest {
  string organization_id = 1;
  // Addresses an isolated AgentSession (used by the builder Test tab and
  // playground surfaces). Mutually exclusive with chat_context.
  string session_id = 2;
  string content = 3;
  // IDs of uploaded files to include (uploaded via FilesService)
  repeated string file_ids = 4;
  // IANA timezone of the user's browser (e.g. "America/New_York")
  string user_timezone = 5;
  // Invokes the agent inside a chat channel. When set, the runtime reads
  // context from chat_messages (scoped per the channel binding) and writes
  // outputs back as chat messages via the AgentChatBridge. Mutually
  // exclusive with session_id at the handler boundary.
  optional ChatChannelContext chat_context = 6;
  // Explicitly invoke one assigned skill's exact active version for this turn.
  // Unavailable skills or unmet tool/surface requirements reject the invocation.
  optional string invoked_skill_id = 7;
}

message RerunFromMessageRequest {
  string organization_id = 1;
  // The user-role message to re-run from. Must already have its downstream
  // invalidated (typically via EditMessage). The runtime treats it as the
  // last message in context and streams a fresh assistant response.
  string message_id = 2;
  // IANA timezone of the user's browser (e.g. "America/New_York")
  string user_timezone = 3;
}

message StreamSendMessageRequest {
  string organization_id = 1;
  // Addresses an isolated AgentSession (used by the builder Test tab and
  // playground surfaces). Mutually exclusive with chat_context.
  string session_id = 2;
  string content = 3;
  // IDs of uploaded files to include (uploaded via FilesService)
  repeated string file_ids = 4;
  // IANA timezone of the user's browser (e.g. "America/New_York")
  string user_timezone = 5;
  // Invokes the agent inside a chat channel. When set, the runtime reads
  // context from chat_messages (scoped per the channel binding) and writes
  // outputs back as chat messages via the AgentChatBridge. Mutually
  // exclusive with session_id at the handler boundary.
  optional ChatChannelContext chat_context = 6;
  // Explicitly invoke one assigned skill's exact active version for this turn.
  // Unavailable skills or unmet tool/surface requirements reject the invocation.
  optional string invoked_skill_id = 7;
}

// ChatChannelContext binds an agent invocation to a chat channel and
// the user message that triggered it. Used by the AgentChatBridge to
// build the scoped context window and route streaming output.
message ChatChannelContext {
  string channel_id = 1;
  string agent_id = 2;
  // The chat message that triggered this invocation (the user's message
  // containing the @mention, reply, or DM payload).
  string trigger_message_id = 3;
  // Optional ephemeral prompt hint for embedded Agent Dock invocations.
  // Format: URN of the resource the user is currently viewing. Injected
  // into the system prompt for THIS invocation only; not persisted as a
  // chat message and does not branch the channel.
  optional string context_urn = 4;
}

message SendMessageResponse {
  agents.v1.MessageInfo user_message = 1;
  agents.v1.MessageInfo assistant_message = 2;
  string model_used = 3;
}

message RespondToConfirmationRequest {
  string organization_id = 1;
  string session_id = 2;
  string tool_call_id = 3;
  bool approved = 4;
}

message SubscribeToRunRequest {
  string run_id = 1;
  string organization_id = 2;
}

message CancelStreamRequest {
  string run_id = 1;
  string organization_id = 2;
}

message CancelStreamResponse {
  // True if the run was active and a cancel flag was set; false if the
  // run had already finished or no longer exists.
  bool cancelled = 1;
}

message RespondToConfirmationResponse {
  bool accepted = 1;
}

// AgentStreamEvent carries one event in the agent-runtime stream. The
// run_id is stamped by the handler from the run state hash so a tab
// reload mid-stream can call SubscribeToRun(run_id) to resume.
//
// The oneof mirrors the backend EventType enum 1:1. Text, thinking,
// and tool-call content is block-framed (START -> DELTA -> END,
// correlated by block_id); deltas are incremental, never cumulative.
// Thinking is a first-class block and never appears in text deltas or
// stored message content.
message AgentStreamEvent {
  oneof event {
    StreamReplyStartEvent reply_start = 1;
    StreamModelCallStartEvent model_call_start = 2;
    StreamModelCallEndEvent model_call_end = 3;
    StreamTextBlockStartEvent text_block_start = 4;
    StreamTextBlockDeltaEvent text_block_delta = 5;
    StreamTextBlockEndEvent text_block_end = 6;
    StreamThinkingBlockStartEvent thinking_block_start = 7;
    StreamThinkingBlockDeltaEvent thinking_block_delta = 8;
    StreamThinkingBlockEndEvent thinking_block_end = 9;
    StreamToolCallStartEvent tool_call_start = 10;
    StreamToolCallDeltaEvent tool_call_delta = 11;
    StreamToolCallEndEvent tool_call_end = 12;
    StreamToolResultStartEvent tool_result_start = 13;
    StreamToolResultDeltaEvent tool_result_delta = 14;
    StreamToolResultEndEvent tool_result_end = 15;
    StreamConfirmationRequiredEvent confirmation_required = 16;
    StreamFailoverEvent failover = 17;
    StreamSkillDraftEvent skill_draft = 18;
    StreamExceedMaxItersEvent exceed_max_iters = 19;
    StreamMessageStoredEvent message_stored = 20;
    StreamDoneEvent done = 21;
    StreamErrorEvent error = 22;
  }
  string run_id = 30;
}

message StreamSendMessageResponse {
  AgentStreamEvent event = 1;
}

message RerunFromMessageResponse {
  AgentStreamEvent event = 1;
}

message SubscribeToRunResponse {
  AgentStreamEvent event = 1;
}

// Opens the assistant turn. Purely a framing hook for clients.
message StreamReplyStartEvent {
  string role = 1;
}

// A model invocation begins; repeats after a failover swap.
message StreamModelCallStartEvent {
  string model = 1;
}

// Per-model-call token accounting, driving live token/cost counters.
message StreamModelCallEndEvent {
  string model = 1;
  int64 input_tokens = 2;
  int64 output_tokens = 3;
  int64 cache_read_input_tokens = 4;
  int64 thinking_tokens = 5;
  int64 cache_creation_input_tokens = 6;
}

// Block events carry the placeholder row id (message_id, chat
// destination only; empty for session streams) plus one monotonic
// per-message sequence shared across all block events so clients can
// drop late deltas after a reorder.
message StreamTextBlockStartEvent {
  string block_id = 1;
  string message_id = 2;
  int32 sequence = 3;
}

message StreamTextBlockDeltaEvent {
  string block_id = 1;
  string delta = 2;
  string message_id = 3;
  int32 sequence = 4;
}

message StreamTextBlockEndEvent {
  string block_id = 1;
  string message_id = 2;
  int32 sequence = 3;
}

message StreamThinkingBlockStartEvent {
  string block_id = 1;
  string message_id = 2;
  int32 sequence = 3;
}

message StreamThinkingBlockDeltaEvent {
  string block_id = 1;
  string delta = 2;
  string message_id = 3;
  int32 sequence = 4;
}

// elapsed_ms is stamped by the runtime (time between the matching
// start and this end) so live view, replay, and history all show the
// same "Thought for Ns" duration.
message StreamThinkingBlockEndEvent {
  string block_id = 1;
  string message_id = 2;
  int32 sequence = 3;
  int32 elapsed_ms = 4;
}

message StreamToolCallStartEvent {
  string block_id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string message_id = 4;
  int32 sequence = 5;
}

// delta is an incremental fragment of the tool-args JSON.
message StreamToolCallDeltaEvent {
  string block_id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string delta = 4;
  string message_id = 5;
  int32 sequence = 6;
}

message StreamToolCallEndEvent {
  string block_id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string tool_args_json = 4;
  string message_id = 5;
  int32 sequence = 6;
}

// Tool execution started; message_id is the persisted tool-call row.
message StreamToolResultStartEvent {
  string tool_call_id = 1;
  string tool_name = 2;
  string tool_args_json = 3;
  string message_id = 4;
}

message StreamToolResultDeltaEvent {
  string tool_call_id = 1;
  string delta = 2;
  string message_id = 3;
}

message StreamToolResultEndEvent {
  string tool_call_id = 1;
  string tool_name = 2;
  bool success = 3;
  string result = 4;
  string message_id = 5;
}

// The run hit the tool-iteration cap; a terminal error event follows.
message StreamExceedMaxItersEvent {}

message StreamMessageStoredEvent {
  agents.v1.MessageInfo message = 1;
}

message StreamDoneEvent {
  agents.v1.MessageInfo assistant_message = 1;
  string model_used = 2;
}

message StreamErrorEvent {
  string message = 1;
}

message StreamConfirmationRequiredEvent {
  string tool_call_id = 1;
  string tool_name = 2;
  string tool_args_json = 3;
  string description = 4;
}

// Emitted once when the runtime swaps to a different provider key or
// model after a retryable failure on the previous candidate. Purely
// informational; clients use it to surface "switched to X" notices.
message StreamFailoverEvent {
  // Provider key id we just moved off (the one that failed).
  string from_provider_key_id = 1;
  // Provider key id we moved onto.
  string to_provider_key_id = 2;
  // Model now in use (may be the same model on a different key, or a
  // different fallback model entirely).
  string to_model = 3;
  // Short reason classifier: "timeout", "5xx", "connection", "other".
  string reason = 4;
  // 1-based attempt counter for the swap (first failover = 1).
  int32 attempt = 5;
}

// Emitted when the agent proposes a skill draft for the user to review. The
// draft is persisted (status=pending) but never auto-activated; the client
// renders an editable review card and saves via SaveSkillDraft.
message StreamSkillDraftEvent {
  SkillDraft draft = 1;
}
