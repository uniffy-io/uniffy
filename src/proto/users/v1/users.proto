syntax = "proto3";

package users.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "uniffy/gen/users/v1;usersv1";

// =============================================================================
// UsersService - User profile and administration
// =============================================================================

service UsersService {
  // Self-service profile operations
  rpc GetMyProfile(GetMyProfileRequest) returns (UserProfile);
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (UserProfile);

  // System Admin operations
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetUser(GetUserRequest) returns (UserProfile);
  rpc CreateUser(CreateUserRequest) returns (UserProfile);
  rpc UpdateUser(UpdateUserRequest) returns (UserProfile);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // User-Organization operations (System Admin)
  rpc ListUserOrganizations(ListUserOrganizationsRequest) returns (ListUserOrganizationsResponse);
  rpc AddUserToOrganization(AddUserToOrganizationRequest) returns (common.v1.MemberInfo);
  rpc RemoveUserFromOrganization(RemoveUserFromOrganizationRequest) returns (RemoveUserFromOrganizationResponse);
}

// =============================================================================
// User Profile Messages
// =============================================================================

message UserProfile {
  string                    id              = 1;
  string                    email           = 2;
  optional string           full_name       = 3;
  optional string           username        = 4;
  optional string           avatar_url      = 5;
  optional string           accent_color    = 6;
  optional string           font_family     = 7;
  bool                      is_active       = 8;
  bool                      is_system_admin = 9;
  google.protobuf.Timestamp created_at      = 10;
  google.protobuf.Timestamp updated_at      = 11;
}

message GetMyProfileRequest {}

message UpdateMyProfileRequest {
  optional string full_name    = 1;
  optional string username     = 2;
  optional string avatar_url   = 3;
  optional string accent_color = 4;
  optional string font_family  = 5;
}

// =============================================================================
// System Admin Operations Messages
// =============================================================================

message ListUsersRequest {
  optional common.v1.PaginationRequest pagination       = 1;
  optional string                      search           = 2;  // Filter by name or email
  optional bool                        include_inactive = 3;
}

message ListUsersResponse {
  repeated UserProfile                  users      = 1;
  optional common.v1.PaginationResponse pagination = 2;
}

message GetUserRequest {
  string user_id = 1;
}

message CreateUserRequest {
  string          email           = 1;
  string          password        = 2;
  optional string full_name       = 3;
  optional string username        = 4;
  bool            is_system_admin = 5;
}

message UpdateUserRequest {
  string          user_id         = 1;
  optional string email           = 2;
  optional string full_name       = 3;
  optional string username        = 4;
  optional bool   is_active       = 5;
  optional bool   is_system_admin = 6;
  optional string password        = 7;  // Reset password
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

// =============================================================================
// User-Organization Operations Messages (System Admin)
// =============================================================================

message ListUserOrganizationsRequest {
  string user_id = 1;
}

message ListUserOrganizationsResponse {
  repeated UserOrganizationMembership memberships = 1;
}

message UserOrganizationMembership {
  common.v1.OrganizationInfo organization = 1;
  common.v1.OrganizationRole role         = 2;
  google.protobuf.Timestamp  joined_at    = 3;
  bool                       is_active    = 4;
}

message AddUserToOrganizationRequest {
  string                     user_id         = 1;
  string                     organization_id = 2;
  common.v1.OrganizationRole role            = 3;
}

message RemoveUserFromOrganizationRequest {
  string user_id         = 1;
  string organization_id = 2;
}

message RemoveUserFromOrganizationResponse {
  bool success = 1;
}
