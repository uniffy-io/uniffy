syntax = "proto3";

package notes.v1;

option go_package = "github.com/uniffy-io/uniffy-proto-go/notes/v1;notesv1";

import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

// Node type for notes hierarchy
enum NodeType {
  NODE_TYPE_UNSPECIFIED = 0;
  // Regular note with content
  NODE_TYPE_NOTE = 1;
  // Folder for organizing notes (can also have content)
  NODE_TYPE_FOLDER = 2;
  // Template note (future use)
  NODE_TYPE_TEMPLATE = 3;
  // Canvas note with infinite 2D surface
  NODE_TYPE_CANVAS = 4;
}

// NotesService provides note management functionality
service NotesService {
  // Create a new note
  rpc CreateNote(CreateNoteRequest) returns (NoteResponse) {}
  
  // Get a note by ID
  rpc GetNote(GetNoteRequest) returns (NoteResponse) {}
  
  // Update an existing note
  rpc UpdateNote(UpdateNoteRequest) returns (NoteResponse) {}
  
  // Delete a note (soft delete)
  rpc DeleteNote(DeleteNoteRequest) returns (DeleteNoteResponse) {}
  
  // List notes in organization with pagination and filters
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse) {}
  
  // Search notes using full-text search
  rpc SearchNotes(SearchNotesRequest) returns (SearchNotesResponse) {}
  
  // Get backlinks for a note (other notes that reference this note)
  rpc GetBacklinks(GetBacklinksRequest) returns (BacklinksResponse) {}

  // Restore a deleted note
  rpc RestoreNote(RestoreNoteRequest) returns (NoteResponse) {}
  
  // Empty trash (permanently delete all soft-deleted notes)
  rpc EmptyTrash(EmptyTrashRequest) returns (EmptyTrashResponse) {}
  
  // Autosave note content (optimized for frequent updates)
  rpc AutosaveNote(AutosaveNoteRequest) returns (AutosaveNoteResponse) {}
  
  // Move note between spaces (personal, group, organization)
  rpc MoveNote(MoveNoteRequest) returns (NoteResponse) {}
  
  // Copy note to another space
  rpc CopyNote(CopyNoteRequest) returns (NoteResponse) {}
  
  // Share note with group(s)
  rpc ShareNoteWithGroup(ShareNoteWithGroupRequest) returns (ShareNoteResponse) {}
  
  // Unshare note from group
  rpc UnshareNoteFromGroup(UnshareNoteFromGroupRequest) returns (ShareNoteResponse) {}
  
  // Get sharing info for a note
  rpc GetNoteSharing(GetNoteSharingRequest) returns (NoteSharingResponse) {}
  
  // Grant permission to user/group for a note
  rpc GrantPermission(GrantPermissionRequest) returns (PermissionResponse) {}
  
  // Revoke permission from user/group for a note
  rpc RevokePermission(RevokePermissionRequest) returns (PermissionResponse) {}
}

// Request to create a new note
message CreateNoteRequest {
  // Organization ID (required for multi-tenancy)
  string organization_id = 1;
  // Note title
  string title = 2;
  // Note content in markdown
  string content = 3;
  // Optional URL-friendly slug (auto-generated if not provided)
  optional string slug = 4;
  // Optional parent note ID for hierarchy
  optional string parent_id = 5;
  // Optional tags
  repeated string tags = 6;
  // Optional metadata
  map<string, string> metadata = 7;
  // Access mode (defaults to OWNER_ONLY)
  optional common.v1.AccessMode access_mode = 8;
  // Optional group ID(s) if using group-based membership
  repeated string group_ids = 9;
  // Node type (defaults to NOTE)
  optional NodeType node_type = 10;
  // Optional custom icon
  optional NoteIcon icon = 11;
  // Baseline role granted by access mode (when applicable)
  optional common.v1.ContentRole baseline_role = 12;
}

// Request to get a note
message GetNoteRequest {
  // Note ID
  string note_id = 1;
  // Organization ID for access control
  string organization_id = 2;
}

// Request to update a note
message UpdateNoteRequest {
  // Note ID
  string note_id = 1;
  // Organization ID for access control
  string organization_id = 2;
  // Updated title (optional)
  optional string title = 3;
  // Updated content (optional)
  optional string content = 4;
  // Updated slug (optional)
  optional string slug = 5;
  // Updated parent ID (optional, use empty string to remove parent)
  optional string parent_id = 6;
  // Updated tags (optional, replaces existing tags)
  repeated string tags = 7;
  // Updated metadata (optional, merges with existing)
  map<string, string> metadata = 8;
  // Updated icon (optional)
  optional NoteIcon icon = 9;
}

// Request to delete a note
message DeleteNoteRequest {
  // Note ID
  string note_id = 1;
  // Organization ID for access control
  string organization_id = 2;
  // Permanent delete flag (default: false for soft delete)
  bool permanent = 3;
}

// Response for delete operation
message DeleteNoteResponse {
  // Success flag
  bool success = 1;
  // Message
  string message = 2;
}

// Response containing a single note
message NoteResponse {
  // The note data
  Note note = 1;
}

// Request to list notes
message ListNotesRequest {
  // Organization ID
  string organization_id = 1;
  // Optional parent ID filter (null = root notes only)
  optional string parent_id = 2;
  // Optional tag filter
  repeated string tags = 3;
  // Include deleted notes
  bool include_deleted = 4;
  // Reserved: was pinned_only (now use BookmarksService)
  reserved 5;
  reserved "pinned_only";
  // Pagination: page number (1-indexed)
  int32 page = 6;
  // Pagination: page size (default: 50, max: 100)
  int32 page_size = 7;
  // Sort by field (created_at, updated_at, title)
  string sort_by = 8;
  // Sort order (asc, desc)
  string sort_order = 9;
  // Optional access mode filter
  optional common.v1.AccessMode access_mode = 10;
  // Optional group ID filter (for group-scoped notes)
  optional string group_id = 11;
  // Show only my personal notes
  bool personal_only = 12;
  // Exclude content field from response (for tree/list views)
  bool exclude_content = 13;
}

// Response for listing notes
message ListNotesResponse {
  // List of notes
  repeated Note notes = 1;
  // Total count of notes matching filters
  int32 total_count = 2;
  // Current page
  int32 page = 3;
  // Page size
  int32 page_size = 4;
  // Total pages
  int32 total_pages = 5;
}

// Request to search notes
message SearchNotesRequest {
  // Organization ID
  string organization_id = 1;
  // Search query (full-text search)
  string query = 2;
  // Optional tag filter
  repeated string tags = 3;
  // Include deleted notes
  bool include_deleted = 4;
  // Pagination: page number (1-indexed)
  int32 page = 5;
  // Pagination: page size (default: 50, max: 100)
  int32 page_size = 6;
}

// Response for searching notes
message SearchNotesResponse {
  // List of notes matching search
  repeated Note notes = 1;
  // Total count of notes matching search
  int32 total_count = 2;
  // Current page
  int32 page = 3;
  // Page size
  int32 page_size = 4;
}

// Request to get backlinks
message GetBacklinksRequest {
  // Note ID to get backlinks for
  string note_id = 1;
  // Organization ID for access control
  string organization_id = 2;
}

// Response with backlinks
message BacklinksResponse {
  // List of notes that reference the target note
  repeated NoteReference backlinks = 1;
  // Total count
  int32 total_count = 2;
}

// Request to restore a deleted note
message RestoreNoteRequest {
  // Note ID
  string note_id = 1;
  // Organization ID for access control
  string organization_id = 2;
}

// Request to empty trash
message EmptyTrashRequest {
  // Organization ID for access control
  string organization_id = 1;
}

// Response for empty trash operation
message EmptyTrashResponse {
  // Number of notes permanently deleted
  int32 deleted_count = 1;
  // Success flag
  bool success = 2;
  // Message
  string message = 3;
}

// Request to autosave note (lightweight, frequent updates)
message AutosaveNoteRequest {
  // Note ID
  string note_id = 1;
  // Organization ID for access control
  string organization_id = 2;
  // Updated content (markdown)
  string content = 3;
  // Optional updated title
  optional string title = 4;
  // Client timestamp for conflict resolution
  int64 client_timestamp = 5;
  // Version the client based this draft on. When set, server rejects with
  // ABORTED if the stored note has advanced past it (concurrent edit).
  optional int64 expected_version = 6;
}

// Response for autosave operation
message AutosaveNoteResponse {
  // Success flag
  bool success = 1;
  // Server timestamp of the save
  google.protobuf.Timestamp saved_at = 2;
  // Note version for conflict detection
  int64 version = 3;
}

// Note icon - can be a heroicon name or emoji
message NoteIcon {
  // Type of icon: "heroicon" or "emoji"
  string icon_type = 1;
  // Icon value: heroicon name (e.g., "StarIcon") or emoji character (e.g., "🚀")
  string value = 2;
}

// Note message
message Note {
  // Note ID
  string id = 1;
  // Organization ID
  string organization_id = 2;
  // Owner user ID (who owns the note)
  string owner_id = 3;
  // Access mode
  common.v1.AccessMode access_mode = 4;
  // Node type (note, folder, template)
  NodeType node_type = 5;
  // Note title
  string title = 6;
  // Note content (markdown)
  string content = 7;
  // URL-friendly slug
  string slug = 8;
  // Is deleted flag
  bool is_deleted = 9;
  // Reserved: was is_pinned (now use BookmarksService)
  reserved 10;
  reserved "is_pinned";
  // Version number for conflict detection
  int64 version = 11;
  // Optional parent note ID
  optional string parent_id = 12;
  // Tags (whole-note tags set explicitly by user)
  repeated string tags = 13;
  // Inline tags extracted from note content (e.g., #tagname in markdown)
  repeated string inline_tags = 24;
  // Metadata
  map<string, string> metadata = 14;
  // Created timestamp
  google.protobuf.Timestamp created_at = 15;
  // Updated timestamp
  google.protobuf.Timestamp updated_at = 16;
  // Deleted timestamp (if soft-deleted)
  optional google.protobuf.Timestamp deleted_at = 17;
  // Group IDs if shared with groups
  repeated string group_ids = 18;
  // User's role on this note
  common.v1.ContentRole user_role = 19;
  // URNs referenced in this note's content (outgoing links)
  repeated string outgoing_references = 20;
  // Custom icon for the note (optional)
  optional NoteIcon icon = 21;

  // Owner information (populated for notes shared with current user)
  optional NoteOwner owner_info = 22;

  // Users/groups this note is shared with (only populated for owner)
  repeated NoteShareTarget shared_with = 23;

  // Baseline role granted by access mode (when applicable)
  optional common.v1.ContentRole baseline_role = 25;
}

// Note reference (lightweight representation for backlinks)
message NoteReference {
  // Note ID
  string id = 1;
  // Note title
  string title = 2;
  // Note slug
  string slug = 3;
  // Owner user ID
  string owner_id = 4;
  // Updated timestamp
  google.protobuf.Timestamp updated_at = 5;
  // Access mode
  common.v1.AccessMode access_mode = 6;
  // Node type
  NodeType node_type = 7;
  // Baseline role granted by access mode (when applicable)
  optional common.v1.ContentRole baseline_role = 8;
}

// Request to move note between spaces
message MoveNoteRequest {
  // Note ID
  string note_id = 1;
  // Organization ID for access control
  string organization_id = 2;
  // Target access mode
  common.v1.AccessMode target_access_mode = 3;
  // Target group ID(s) if using group-based membership
  repeated string target_group_ids = 4;
  // Target baseline role granted by access mode
  optional common.v1.ContentRole target_baseline_role = 5;
}

// Request to copy note to another space
message CopyNoteRequest {
  // Source note ID
  string note_id = 1;
  // Organization ID for access control
  string organization_id = 2;
  // Target access mode
  common.v1.AccessMode target_access_mode = 3;
  // Target group ID(s) if using group-based membership
  repeated string target_group_ids = 4;
  // Optional: new title for the copy
  optional string title = 5;
  // Target baseline role granted by access mode
  optional common.v1.ContentRole target_baseline_role = 6;
}

// Request to share note with group
message ShareNoteWithGroupRequest {
  // Note ID
  string note_id = 1;
  // Organization ID for access control
  string organization_id = 2;
  // Group ID to share with
  string group_id = 3;
}

// Request to unshare note from group
message UnshareNoteFromGroupRequest {
  // Note ID
  string note_id = 1;
  // Organization ID for access control
  string organization_id = 2;
  // Group ID to unshare from
  string group_id = 3;
}

// Response for share/unshare operations
message ShareNoteResponse {
  // Success flag
  bool success = 1;
  // Message
  string message = 2;
  // Updated list of group IDs
  repeated string group_ids = 3;
}

// Request to get note sharing info
message GetNoteSharingRequest {
  // Note ID
  string note_id = 1;
  // Organization ID for access control
  string organization_id = 2;
}

// Response with note sharing information
message NoteSharingResponse {
  // Note access mode
  common.v1.AccessMode access_mode = 1;
  // Owner user ID
  string owner_id = 2;
  // Group IDs if shared with groups
  repeated string group_ids = 3;
  // Explicit permissions granted
  repeated ContentPermission permissions = 4;
  // Baseline role granted by access mode (when applicable)
  optional common.v1.ContentRole baseline_role = 5;
}

// Request to grant permission
message GrantPermissionRequest {
  // Note ID
  string note_id = 1;
  // Organization ID for access control
  string organization_id = 2;
  // Subject type (user or group)
  string subject_type = 3;
  // Subject ID (user or group ID)
  string subject_id = 4;
  // Role to grant
  common.v1.ContentRole role = 5;
  // Optional: fine-grained permissions
  optional bool can_view = 6;
  optional bool can_edit = 7;
  optional bool can_delete = 8;
  optional bool can_share = 9;
  optional bool can_move = 10;
}

// Request to revoke permission
message RevokePermissionRequest {
  // Note ID
  string note_id = 1;
  // Organization ID for access control
  string organization_id = 2;
  // Subject type (user or group)
  string subject_type = 3;
  // Subject ID (user or group ID)
  string subject_id = 4;
}

// Response for permission operations
message PermissionResponse {
  // Success flag
  bool success = 1;
  // Message
  string message = 2;
}

// Content permission details
message ContentPermission {
  // Permission ID
  string id = 1;
  // Subject type (user, group, organization)
  string subject_type = 2;
  // Subject ID
  string subject_id = 3;
  // Role granted
  common.v1.ContentRole role = 4;
  // Fine-grained permissions
  bool can_view = 5;
  bool can_edit = 6;
  bool can_delete = 7;
  bool can_share = 8;
  bool can_move = 9;
  // Granted by user ID
  string granted_by_user_id = 10;
  // Granted timestamp
  google.protobuf.Timestamp granted_at = 11;
  // Optional expiration
  optional google.protobuf.Timestamp expires_at = 12;
}

// Lightweight owner information for shared notes
message NoteOwner {
  // Owner user ID
  string id = 1;
  // Owner display name
  string name = 2;
  // Owner email
  string email = 3;
}

// Share target for display (user or group this note is shared with)
message NoteShareTarget {
  // User or group ID
  string id = 1;
  // Type: "user" or "group"
  string type = 2;
  // Display name
  string name = 3;
  // Email (only for users)
  string email = 4;
  // Member count (only for groups)
  int32 member_count = 5;
  // Role granted
  common.v1.ContentRole role = 6;
}
