syntax = "proto3";

package superadmin.v1;

import "support/v1/support_consent.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/superadmin/v1;superadminv1";

// Operator-side half of the support session contract: requesting a
// session against a tenant org and listing sessions cross-tenant.
// The tenant's consent controls (approve, reject, revoke, per-org
// listing, consent mode) live in ``support.v1.SupportConsentService``
// so this whole namespace can be firewalled off the public edge
// without breaking tenant consent.
//
// Unlike per-tenant memberships, support sessions are temporary,
// audited end-to-end, and surface to the org owner live (in-app
// banner + email + audit rows tagged ``actor_kind=support``).
//
// v1 ships ``READ_ONLY`` scope only -- ``READ_WRITE`` is in the proto
// for forward compatibility but ``RequestSession`` rejects it.
// Existing explicit ``ContentMember`` rows for the support user are
// IGNORED while a session is active so the session is the single
// access path and the audit trail attributes access cleanly.
//
// Hard floors that apply even with an active session:
//
// * ``OrgCipher.decrypt`` is default-deny; callers wishing to bridge
//   through a support session must opt in explicitly (per-call). An
//   audit row is written on every bridge attempt.
// * ``org_settings`` rows with ``is_secret=true`` return the masked
//   placeholder ``"* * * *"`` instead of decrypted plaintext.
service SupportService {
  // Operator-side: open a new session against one org. Returns the
  // row in ``PENDING`` (OWNER_APPROVED mode) or ``ACTIVE``
  // (OPERATOR_JUSTIFIED mode). Caller must have ``is_system_admin``.
  rpc RequestSession(RequestSessionRequest) returns (RequestSessionResponse) {}

  // Operator-side: list sessions where the caller is
  // ``support_user_id``. Most recent first.
  rpc ListMySessions(ListMySessionsRequest) returns (ListMySessionsResponse) {}

  // Operator-side: cross-tenant list of every session in the
  // deployment. Backs ``/platform/sessions``. Caller must have
  // ``is_system_admin``.
  rpc ListAllSessions(ListAllSessionsRequest) returns (ListAllSessionsResponse) {}
}

message RequestSessionRequest {
  string organization_id = 1;
  // Required, free-text. Surfaced in audit + owner notification.
  string reason = 2;
  // READ_ONLY is the only accepted value in v1; READ_WRITE will be
  // rejected with INVALID_ARGUMENT until a future phase ships the
  // write path.
  support.v1.SupportSessionScope scope = 3;
  // Requested duration. Capped by deployment env; default 30min,
  // max 120min.
  int32 duration_minutes = 4;
}

message RequestSessionResponse {
  support.v1.SupportSession session = 1;
}

message ListMySessionsRequest {
  int32 page = 1;
  int32 page_size = 2;
  // When true, include EXPIRED / REVOKED / REJECTED rows. Default
  // returns PENDING + ACTIVE only.
  bool include_inactive = 3;
}

message ListMySessionsResponse {
  repeated support.v1.SupportSession sessions = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListAllSessionsRequest {
  int32 page = 1;
  int32 page_size = 2;
  // Optional state filter (UNSPECIFIED = all states).
  support.v1.SupportSessionState state = 3;
  // Optional substring match on org name/slug or support user email.
  string search = 4;
}

message ListAllSessionsResponse {
  repeated support.v1.SupportSession sessions = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}
