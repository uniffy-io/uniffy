syntax = "proto3";

package superadmin.v1;

option go_package = "github.com/uniffy-io/uniffy-proto-go/superadmin/v1;superadminv1";

// Deployment-wide configuration flags surfaced to the platform admin
// surface. Every flag follows the same resolution: ``deployment_settings``
// row (operator-edited) > env default (set at deploy time) > coded default.
// The first call without an env value or DB row returns the coded default;
// the operator's first edit creates the DB row, after which env becomes
// irrelevant.
//
// All RPCs require ``User.is_system_admin=true``.
service SystemConfigService {
  // Read every known flag's effective value + source.
  rpc GetSystemConfig(GetSystemConfigRequest) returns (GetSystemConfigResponse) {}

  // Set the public-registration flag.
  rpc SetPublicRegistration(SetPublicRegistrationRequest) returns (SetPublicRegistrationResponse) {}
}

// One configuration flag's effective state.
message SystemFlag {
  bool enabled = 1;
  // 'deployment' | 'env' | 'default'
  string source = 2;
}

message SystemConfig {
  // Allow self-service Register RPC to create accounts without an invite.
  SystemFlag public_registration = 1;
}

message GetSystemConfigRequest {}

message GetSystemConfigResponse {
  SystemConfig config = 1;
}

message SetPublicRegistrationRequest {
  bool enabled = 1;
}

message SetPublicRegistrationResponse {
  SystemConfig config = 1;
}
