syntax = "proto3";

package common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/common/v1;commonv1";

// ENUMS - Shared across all services

// ContentType defines the types of content in the system.
// Used for polymorphic references in permission tables.
enum ContentType {
  CONTENT_TYPE_UNSPECIFIED = 0;
  CONTENT_TYPE_NOTE = 1;
  CONTENT_TYPE_FILE = 2;
  CONTENT_TYPE_CALENDAR_EVENT = 3;
  CONTENT_TYPE_CHAT_MESSAGE = 7;
  CONTENT_TYPE_USER = 9;
  CONTENT_TYPE_FOLDER = 10;
  CONTENT_TYPE_PROJECT = 11;
  CONTENT_TYPE_TASK = 12;
  CONTENT_TYPE_AGENT = 13;
  CONTENT_TYPE_PROVIDER_KEY = 14;
  CONTENT_TYPE_PROMPT = 15;
  CONTENT_TYPE_CHAT = 16;
  CONTENT_TYPE_ROOM = 17;
  CONTENT_TYPE_AGENT_CRON_TASK = 18;
}

// SubjectType defines who can be granted permissions.
enum SubjectType {
  SUBJECT_TYPE_UNSPECIFIED = 0;
  SUBJECT_TYPE_USER = 1;
  SUBJECT_TYPE_GROUP = 2;
  SUBJECT_TYPE_ORGANIZATION = 3;
}

// ContentRole defines the role a subject has on a piece of content.
// BLOCKED is an explicit deny that overrides any baseline access.
enum ContentRole {
  CONTENT_ROLE_UNSPECIFIED = 0;
  CONTENT_ROLE_VIEWER = 1;
  CONTENT_ROLE_COMMENTER = 2;
  CONTENT_ROLE_EDITOR = 3;
  CONTENT_ROLE_ADMIN = 4;
  CONTENT_ROLE_OWNER = 5;
  CONTENT_ROLE_BLOCKED = 6;
}

// AccessMode defines the baseline access mode for a piece of content.
// Explicit ContentMember rows always override the baseline (in either
// direction -- higher or BLOCKED).
enum AccessMode {
  ACCESS_MODE_UNSPECIFIED = 0;
  ACCESS_MODE_OWNER_ONLY = 1;
  ACCESS_MODE_EXPLICIT_MEMBERS = 2;
  ACCESS_MODE_OPEN_TO_ORG = 3;
}

// ContentMemberAction is the action recorded in an audit log event.
enum ContentMemberAction {
  CONTENT_MEMBER_ACTION_UNSPECIFIED = 0;
  CONTENT_MEMBER_ACTION_MEMBER_ADDED = 1;
  CONTENT_MEMBER_ACTION_MEMBER_ROLE_CHANGED = 2;
  CONTENT_MEMBER_ACTION_MEMBER_REMOVED = 3;
  CONTENT_MEMBER_ACTION_ACCESS_MODE_CHANGED = 4;
  CONTENT_MEMBER_ACTION_BASELINE_ROLE_CHANGED = 5;
  CONTENT_MEMBER_ACTION_OWNERSHIP_TRANSFERRED = 6;
}

// OrganizationRole defines a user's role within an organization.
enum OrganizationRole {
  ORGANIZATION_ROLE_UNSPECIFIED = 0;
  ORGANIZATION_ROLE_MEMBER = 1;
  ORGANIZATION_ROLE_ADMIN = 2;
  ORGANIZATION_ROLE_OWNER = 3;
}

// GroupRole defines a user's role within a group.
// Note: Only MEMBER and ADMIN are supported by the backend.
enum GroupRole {
  GROUP_ROLE_UNSPECIFIED = 0;
  GROUP_ROLE_MEMBER = 1;
  GROUP_ROLE_ADMIN = 2;
}

// DomainType defines application domains that support domain-level admins.
enum DomainType {
  DOMAIN_TYPE_UNSPECIFIED = 0;
  DOMAIN_TYPE_CHAT = 1;
  DOMAIN_TYPE_FILES = 2;
  DOMAIN_TYPE_NOTES = 3;
  DOMAIN_TYPE_CALENDAR = 4;
  DOMAIN_TYPE_PROJECTS = 5;
  DOMAIN_TYPE_AGENTS = 6;
}

// MESSAGES - Common data structures

// UserInfo represents basic user information.
message UserInfo {
  string id = 1;
  string email = 2;
  optional string full_name = 3;
  optional string username = 4;
  optional string avatar_url = 5;
  google.protobuf.Timestamp created_at = 6;
}

// OrganizationInfo represents basic organization information.
message OrganizationInfo {
  string id = 1;
  string name = 2;
  string slug = 3;
  optional string logo_url = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// GroupInfo represents a group within an organization.
message GroupInfo {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  string slug = 4;
  optional string description = 5;
  bool is_private = 6;
  bool is_default = 7;
  int32 member_count = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// MemberInfo represents a user's membership in an organization.
message MemberInfo {
  string user_id = 1;
  string display_name = 2;
  string email = 3;
  optional string avatar_url = 4;
  OrganizationRole role = 5;
  google.protobuf.Timestamp joined_at = 6;
  bool is_active = 7;
}

// GroupMemberInfo represents a user's membership in a group.
message GroupMemberInfo {
  string user_id = 1;
  string display_name = 2;
  string email = 3;
  optional string avatar_url = 4;
  GroupRole role = 5;
  google.protobuf.Timestamp joined_at = 6;
}

// DomainAdminInfo represents a domain admin assignment.
message DomainAdminInfo {
  string id = 1;
  string user_id = 2;
  string display_name = 3;
  string email = 4;
  optional string avatar_url = 5;
  DomainType domain = 6;
  string granted_by_user_id = 7;
  google.protobuf.Timestamp granted_at = 8;
}

// PAGINATION - Common pagination structures

// PaginationRequest for paginated list requests.
message PaginationRequest {
  int32 page = 1;
  int32 page_size = 2;
}

// PaginationResponse for paginated list responses.
message PaginationResponse {
  int32 page = 1;
  int32 page_size = 2;
  int32 total_count = 3;
  int32 total_pages = 4;
}
