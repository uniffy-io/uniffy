syntax = "proto3";

package attachments.v1;

import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/attachments/v1;attachmentsv1";

// SERVICE

// AttachmentsService provides file attachment management for content.
// Attachments allow files to be linked to notes, chat messages, calendar events, etc.
//
// For uploading new attachments, use the FilesService upload RPCs with the
// Attachments folder ID (from GetAttachmentsFolder), then call AttachFile to link.
service AttachmentsService {
  // Attach a file to content.
  // If the file is not already in the user's Attachments folder, it will be copied there.
  rpc AttachFile(AttachFileRequest) returns (AttachFileResponse);

  // Detach a file from content (deletes the attachment and the file).
  rpc DetachFile(DetachFileRequest) returns (DetachFileResponse);

  // List all attachments for a piece of content.
  rpc ListAttachments(ListAttachmentsRequest) returns (ListAttachmentsResponse);

  // List attachments from content shared with the user.
  rpc ListSharedAttachments(ListSharedAttachmentsRequest) returns (ListSharedAttachmentsResponse);

  // Get the user's Attachments folder ID.
  // Use this folder_id with FilesService.InitiateUpload to upload new attachments.
  rpc GetAttachmentsFolder(GetAttachmentsFolderRequest) returns (GetAttachmentsFolderResponse);
}

// ATTACHMENT MESSAGES

// Attachment represents a file attached to content.
message Attachment {
  string id = 1;
  string organization_id = 2;
  string file_id = 3;
  common.v1.ContentType content_type = 4;
  string content_id = 5;
  string attached_by_user_id = 6;
  google.protobuf.Timestamp attached_at = 7;

  // File details (populated from the linked file)
  string filename = 10;
  string mime_type = 11;
  int64 size_bytes = 12;
  optional AttachedFileOwner owner_info = 13;
}

message AttachedFileOwner {
  string id = 1;
  string name = 2;
  string email = 3;
}

// ATTACH FILE

message AttachFileRequest {
  string organization_id = 1;
  string source_file_id = 2;         // File to copy and attach
  common.v1.ContentType content_type = 3;
  string content_id = 4;             // Content to attach to
}

message AttachFileResponse {
  Attachment attachment = 1;
}

// DETACH FILE

message DetachFileRequest {
  string organization_id = 1;
  string attachment_id = 2;          // Attachment to remove
}

message DetachFileResponse {
  bool success = 1;
  string message = 2;
}

// LIST ATTACHMENTS

message ListAttachmentsRequest {
  string organization_id = 1;
  common.v1.ContentType content_type = 2;
  string content_id = 3;
}

message ListAttachmentsResponse {
  repeated Attachment attachments = 1;
  int32 total_count = 2;
}

// LIST SHARED ATTACHMENTS

message ListSharedAttachmentsRequest {
  string organization_id = 1;
  optional common.v1.ContentType content_type_filter = 2;  // Filter by content type
  int32 page = 3;
  int32 page_size = 4;
}

message ListSharedAttachmentsResponse {
  repeated SharedAttachmentGroup groups = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
  int32 total_pages = 5;
}

// Group attachments by parent content type.
message SharedAttachmentGroup {
  common.v1.ContentType content_type = 1;
  repeated SharedAttachment attachments = 2;
}

// Attachment with parent content info.
message SharedAttachment {
  Attachment attachment = 1;
  string content_title = 2;          // Title of the parent content (note title, etc.)
  string content_owner_name = 3;     // Owner of the parent content
}

// GET ATTACHMENTS FOLDER

message GetAttachmentsFolderRequest {
  string organization_id = 1;
}

message GetAttachmentsFolderResponse {
  string folder_id = 1;
}
