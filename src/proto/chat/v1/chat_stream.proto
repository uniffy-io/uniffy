syntax = "proto3";

package chat.v1;

import "calls/v1/calls.proto";
import "chat/v1/chat.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/chat/v1;chatv1";

// ChatStreamService provides real-time event streaming for chat.
// Wrapped in StreamDisconnectMiddleware for graceful cleanup.
service ChatStreamService {
  // Unified chat stream - user-level events + channel-level events for the active channel.
  // Opens a single persistent connection per user. Channel events are fanned out
  // server-side to each member's Valkey channel, so no reconnection is needed
  // when switching channels - the frontend filters by channel_id.
  rpc StreamUserChatEvents(StreamUserChatEventsRequest) returns (stream StreamUserChatEventsResponse) {}
}

enum ChatEventType {
  CHAT_EVENT_TYPE_UNSPECIFIED = 0;
  CHAT_EVENT_TYPE_MESSAGE_CREATED = 1;
  CHAT_EVENT_TYPE_MESSAGE_UPDATED = 2;
  CHAT_EVENT_TYPE_MESSAGE_DELETED = 3;
  CHAT_EVENT_TYPE_REACTION_ADDED = 4;
  CHAT_EVENT_TYPE_REACTION_REMOVED = 5;
  CHAT_EVENT_TYPE_TYPING_STARTED = 6;
  CHAT_EVENT_TYPE_MEMBER_JOINED = 8;
  CHAT_EVENT_TYPE_MEMBER_LEFT = 9;
  CHAT_EVENT_TYPE_CHANNEL_UPDATED = 10;
  CHAT_EVENT_TYPE_THREAD_UPDATED = 11;
  CHAT_EVENT_TYPE_HEARTBEAT = 12;
  // Batched membership change events. The non-batched MEMBER_JOINED /
  // MEMBER_LEFT remain for single-actor flows (self-join, leave). Batch
  // adds/removes initiated by an admin go through these so the server
  // sends ONE event per call instead of one per affected user.
  CHAT_EVENT_TYPE_MEMBERS_ADDED = 22;
  CHAT_EVENT_TYPE_MEMBERS_REMOVED = 23;
  // Agent runtime events. AGENT_TYPING fires while the runtime is generating
  // tokens (analogous to a human typing). AGENT_TOKEN_DELTA carries
  // incremental content for an in-flight agent message. AGENT_TOOL_CALL
  // signals the runtime is executing a tool. AGENT_CONFIRMATION_REQUESTED
  // and AGENT_CONFIRMATION_RESOLVED bracket destructive-tool approvals.
  CHAT_EVENT_TYPE_AGENT_TYPING = 13;
  CHAT_EVENT_TYPE_AGENT_TOKEN_DELTA = 14;
  CHAT_EVENT_TYPE_AGENT_TOOL_CALL = 15;
  CHAT_EVENT_TYPE_AGENT_CONFIRMATION_REQUESTED = 16;
  CHAT_EVENT_TYPE_AGENT_CONFIRMATION_RESOLVED = 17;
  // Call lifecycle events. STARTED/ENDED carry the call snapshot;
  // PARTICIPANT_* fan out per join/leave/state change so the channel
  // list indicator and in-channel call section stay live without polling.
  // RING targets only the callees being invited (DMs and small channels).
  CHAT_EVENT_TYPE_CALL_STARTED = 24;
  CHAT_EVENT_TYPE_CALL_ENDED = 25;
  CHAT_EVENT_TYPE_CALL_PARTICIPANT_JOINED = 26;
  CHAT_EVENT_TYPE_CALL_PARTICIPANT_LEFT = 27;
  CHAT_EVENT_TYPE_CALL_PARTICIPANT_STATE = 28;
  CHAT_EVENT_TYPE_CALL_RING = 29;
  CHAT_EVENT_TYPE_CALL_HOST_CHANGED = 30;
  // Incremental reasoning for an in-flight agent message. Rendered in a
  // separate collapsible thinking pane, never merged into message content.
  CHAT_EVENT_TYPE_AGENT_THINKING_DELTA = 31;
  // A member's channel role changed; payload is MemberPayload with the new role.
  CHAT_EVENT_TYPE_MEMBER_UPDATED = 32;
  // A channel the recipient belongs to was created. Carries the id only:
  // recipients hydrate through GetChannel so every client applies the same
  // row the channel list would have loaded.
  CHAT_EVENT_TYPE_CHANNEL_CREATED = 33;
}

// ChatEvent is a single channel-level event delivered through the unified stream.
message ChatEvent {
  ChatEventType event_type = 1;
  google.protobuf.Timestamp timestamp = 2;
  // Channel this event belongs to. Used by the frontend to filter events
  // for the active channel (since all channel events arrive on one stream).
  string channel_id = 3;

  oneof payload {
    // MESSAGE_CREATED, MESSAGE_UPDATED: full message
    ChatMessage message = 10;
    // MESSAGE_DELETED
    MessageDeletedPayload message_deleted = 11;
    // REACTION_ADDED, REACTION_REMOVED
    ReactionPayload reaction = 12;
    // TYPING_STARTED
    TypingPayload typing = 13;
    // MEMBER_JOINED, MEMBER_LEFT
    MemberPayload member = 14;
    // CHANNEL_UPDATED
    ChatChannel channel_updated = 15;
    // THREAD_UPDATED
    ThreadUpdatedPayload thread_updated = 16;
    // HEARTBEAT (no payload needed)
    // AGENT_TYPING, AGENT_TOKEN_DELTA, AGENT_TOOL_CALL,
    // AGENT_CONFIRMATION_REQUESTED, AGENT_CONFIRMATION_RESOLVED
    AgentTypingPayload agent_typing = 17;
    AgentTokenDeltaPayload agent_token_delta = 18;
    AgentToolCallPayload agent_tool_call = 19;
    AgentConfirmationRequestedPayload agent_confirmation_requested = 20;
    AgentConfirmationResolvedPayload agent_confirmation_resolved = 21;
    // MEMBERS_ADDED, MEMBERS_REMOVED
    MembersChangedPayload members_changed = 22;
    // CALL_STARTED, CALL_ENDED
    CallLifecyclePayload call_lifecycle = 23;
    // CALL_PARTICIPANT_JOINED, CALL_PARTICIPANT_LEFT, CALL_PARTICIPANT_STATE
    CallParticipantEventPayload call_participant = 24;
    // CALL_RING
    CallRingPayload call_ring = 25;
    // CALL_HOST_CHANGED
    CallHostChangedPayload call_host_changed = 26;
    // AGENT_THINKING_DELTA
    AgentThinkingDeltaPayload agent_thinking_delta = 27;
  }
}

message MessageDeletedPayload {
  string message_id = 1;
  google.protobuf.Timestamp deleted_at = 2;
}

message ReactionPayload {
  string message_id = 1;
  string emoji = 2;
  string user_id = 3;
  string display_name = 4;
}

message TypingPayload {
  string user_id = 1;
  string display_name = 2;
}

message MemberPayload {
  string user_id = 1;
  string display_name = 2;
  optional string avatar_url = 3;
  ChannelRole role = 4;
}

// MembersChangedPayload announces a batched add or remove. A single
// MEMBERS_ADDED or MEMBERS_REMOVED event covers all subjects affected
// by the same admin call so the frontend can refresh the member list
// once instead of per affected user.
message MembersChangedPayload {
  repeated string user_ids = 1;
}

message ThreadUpdatedPayload {
  string root_message_id = 1;
  int32 reply_count = 2;
  google.protobuf.Timestamp last_reply_at = 3;
  string latest_participant_id = 4;
}

// AGENT EVENT PAYLOADS

// AgentTypingPayload announces an agent is generating a response.
// Mirrors TypingPayload but identifies the agent rather than a user.
message AgentTypingPayload {
  string agent_id = 1;
  string display_name = 2;
  // Empty when the agent stops typing (paired AGENT_TYPING events).
  bool started = 3;
  // Set when the trigger was a thread reply. Frontend scopes the typing
  // indicator to the thread panel identified by this root. When unset the
  // indicator renders at the channel root.
  optional string root_id = 4;
}

// AgentTokenDeltaPayload patches an in-flight agent message with new tokens.
// The frontend appends `delta` to the message identified by `message_id`.
// `sequence` is monotonic per message and lets clients drop late deltas.
message AgentTokenDeltaPayload {
  string message_id = 1;
  string agent_id = 2;
  string delta = 3;
  int32 sequence = 4;
  // True on the final delta; clients may persist message state on this edge.
  bool final = 5;
}

// AgentThinkingDeltaPayload streams reasoning for an in-flight agent
// message. Thinking is rendered in a collapsible pane keyed to
// message_id + block_id and never appended to message content.
// `final=true` closes the block and carries the runtime-stamped
// duration for the "Thought for Ns" header.
message AgentThinkingDeltaPayload {
  string message_id = 1;
  string agent_id = 2;
  string block_id = 3;
  string delta = 4;
  // Shares the per-message monotonic sequence with AGENT_TOKEN_DELTA.
  int32 sequence = 5;
  bool final = 6;
  int32 elapsed_ms = 7;
}

// AgentToolCallPayload signals a tool invocation by an agent.
// Status follows: STARTED -> COMPLETED/FAILED.
message AgentToolCallPayload {
  string message_id = 1;
  string agent_id = 2;
  string tool_name = 3;
  // Stable identifier for matching STARTED to COMPLETED.
  string tool_call_id = 4;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_STARTED = 1;
    STATUS_COMPLETED = 2;
    STATUS_FAILED = 3;
  }
  Status status = 5;
  // Arguments preview (truncated JSON) for STARTED; result preview for
  // COMPLETED/FAILED. Heavy payloads are persisted on the message metadata.
  optional string preview = 6;
  optional string error_message = 7;
}

// AgentConfirmationRequestedPayload mirrors the runtime confirmation event
// but is published into the chat stream so the chat UI can render an inline
// approval card. The card is interactive only for `actor_user_id`.
message AgentConfirmationRequestedPayload {
  string message_id = 1;
  string agent_id = 2;
  // Opaque correlation id used by RespondToAgentConfirmation.
  string request_id = 3;
  string tool_name = 4;
  string args_preview = 5;
  // Only this user can approve/deny; others see disabled UI.
  string actor_user_id = 6;
  google.protobuf.Timestamp expires_at = 7;
}

// AgentConfirmationResolvedPayload announces approval/denial.
// Reuses chat.v1.AgentConfirmationDecision via the chat.proto import above.
message AgentConfirmationResolvedPayload {
  string request_id = 1;
  string message_id = 2;
  AgentConfirmationDecision decision = 3;
  string decided_by_user_id = 4;
  google.protobuf.Timestamp decided_at = 5;
}

// CALL EVENT PAYLOADS

// CallLifecyclePayload announces call start and end. The snapshot carries
// active participants so the channel indicator renders without a follow-up
// GetActiveCall.
message CallLifecyclePayload {
  calls.v1.Call call = 1;
}

// CallParticipantEventPayload covers join, leave, and mic/camera/screen
// state changes. `active_participant_count` saves receivers from tracking
// the roster themselves.
message CallParticipantEventPayload {
  string call_id = 1;
  calls.v1.CallParticipant participant = 2;
  int32 active_participant_count = 3;
}

// CallRingPayload invites a specific callee. Fanned out only to users being
// rung, never the whole channel.
message CallRingPayload {
  string call_id = 1;
  string channel_name = 2;
  calls.v1.CallType call_type = 3;
  string caller_user_id = 4;
  string caller_name = 5;
  optional string caller_avatar_url = 6;
  google.protobuf.Timestamp expires_at = 7;
}

message CallHostChangedPayload {
  string call_id = 1;
  string new_host_user_id = 2;
}

// USER-LEVEL EVENT STREAMING

message StreamUserChatEventsRequest {
  string organization_id = 1;
}

enum UserChatEventType {
  USER_CHAT_EVENT_TYPE_UNSPECIFIED = 0;
  USER_CHAT_EVENT_TYPE_UNREAD_COUNT_CHANGED = 1;
  USER_CHAT_EVENT_TYPE_THREAD_ACTIVITY = 2;
  USER_CHAT_EVENT_TYPE_MENTION_RECEIVED = 3;
  USER_CHAT_EVENT_TYPE_HEARTBEAT = 4;
  // Wraps a channel-level ChatEvent (messages, typing, reactions, etc.)
  USER_CHAT_EVENT_TYPE_CHANNEL_EVENT = 5;
  // A draft was saved or deleted on one of the user's devices.
  USER_CHAT_EVENT_TYPE_DRAFT_CHANGED = 6;
}

message StreamUserChatEventsResponse {
  UserChatEventType event_type = 1;
  google.protobuf.Timestamp timestamp = 2;

  oneof payload {
    UnreadCountPayload unread_count = 10;
    ThreadActivityPayload thread_activity = 11;
    MentionReceivedPayload mention_received = 12;
    // Channel-level event forwarded through the unified stream
    ChatEvent channel_event = 13;
    // DRAFT_CHANGED
    DraftChangedPayload draft_changed = 14;
  }
}

// DraftChangedPayload syncs a draft across the user's devices.
// deleted=true (content empty) removes it. Sessions ignore events
// carrying their own client_session_id.
message DraftChangedPayload {
  string channel_id = 1;
  optional string root_message_id = 2;
  string content = 3;
  bool deleted = 4;
  google.protobuf.Timestamp updated_at = 5;
  string client_session_id = 6;
}

message UnreadCountPayload {
  string channel_id = 1;
  int32 unread_count = 2;
  int32 mention_count = 3;
}

message ThreadActivityPayload {
  string root_message_id = 1;
  string channel_id = 2;
  string channel_name = 3;
  int32 reply_count = 4;
  google.protobuf.Timestamp last_reply_at = 5;
}

message MentionReceivedPayload {
  string channel_id = 1;
  string channel_name = 2;
  string message_id = 3;
  string sender_id = 4;
  string sender_name = 5;
  // First 200 chars of message content (plaintext)
  string preview = 6;
}
