// AgentConfirmationDecision is the user's response to a destructive-tool
// confirmation request raised by an agent.
enum AgentConfirmationDecision {
  AGENT_CONFIRMATION_DECISION_UNSPECIFIED = 0;
  AGENT_CONFIRMATION_DECISION_APPROVE = 1;
  AGENT_CONFIRMATION_DECISION_DENY = 2;
}

message RespondToAgentConfirmationRequest {
  string organization_id = 1;
  string channel_id = 2;
  // ID of the agent message that carries the confirmation_request metadata.
  string message_id = 3;
  // Opaque request identifier produced by the agents runtime.
  string request_id = 4;
  AgentConfirmationDecision decision = 5;
  optional string rationale = 6;
}

message RespondToAgentConfirmationResponse {
  // Echo of the resolved status; useful for optimistic UI reconciliation.
  AgentConfirmationDecision decision = 1;
  google.protobuf.Timestamp decided_at = 2;
}

message StopAgentRunRequest {
  string organization_id = 1;
  string channel_id = 2;
  string agent_id = 3;
}

message StopAgentRunResponse {
  // True if an active run was found for the (channel, agent) and a cancel was
  // requested; false if nothing was running.
  bool stopped = 1;
}

// A single pending agent tool-call approval still awaiting a user decision.
// Mirrors the fields the AGENT_CONFIRMATION_REQUESTED stream event carries so
// the frontend can synthesise the same confirmation card shape on reload.
message PendingAgentApproval {
  string request_id = 1;
  string agent_id = 2;
  string message_id = 3;
  string tool_name = 4;
  string args_preview = 5;
  string actor_user_id = 6;
  google.protobuf.Timestamp requested_at = 7;
  optional google.protobuf.Timestamp expires_at = 8;
}

message GetChannelPendingApprovalsRequest {
  string organization_id = 1;
  string channel_id = 2;
}

message GetChannelPendingApprovalsResponse {
  repeated PendingAgentApproval approvals = 1;
}

// CHANNEL AGENT CONTEXT MANAGEMENT
//
// Per-(channel, agent) view of the LLM context window for chat. Mirrors the
// shape of `agents.v1.SessionsService.GetSessionContextStatsResponse` so the
// frontend can render the same meter component for both surfaces.

message ChannelAgentContextStats {
  // Total chat messages in the channel since `manual_reset_at` (or all-time
  // when never reset). Includes messages by other senders, since they may
  // be loaded into the agent's prompt window.
  int32 total_messages = 1;
  // Messages currently active (visible to load_context_messages, post-reset,
  // not yet rolled into a summary).
  int32 active_messages = 2;
  // Count of msg_ids tracked in `binding.compaction_summary_msg_ids`.
  int32 compacted_messages = 3;
  // Count of metadata.kind="summary" rows authored by this agent.
  int32 summary_count = 4;
  // Provider-reported prompt + completion size of the most recent agent
  // turn (last_input_tokens + last_output_tokens). Zero pre-first-turn.
  int32 active_tokens = 5;
  // Token budget for chat history (65% of context window).
  int32 token_budget = 6;
  // Tokens remaining before auto-compaction triggers.
  int32 tokens_until_compaction = 7;
  // Resolved model context window in tokens (from agent.primary_model).
  int32 context_window_tokens = 8;
  // True when the binding has a non-NULL `manual_reset_at`. The UI uses this
  // to render a "Conversation reset on ..." indicator.
  bool was_reset = 9;
  // The timestamp of the last manual reset (NULL when `was_reset=false`).
  optional google.protobuf.Timestamp manual_reset_at = 10;
  // Full prompt size of the most recent agent turn -- uncached input
  // plus tokens served from the prompt cache. Stored on
  // `binding.last_active_token_estimate`. Zero pre-first-turn.
  int32 last_input_tokens = 11;
  // Provider-reported output_tokens of the most recent agent turn
  // (`binding.last_output_token_estimate`). Zero pre-first-turn.
  int32 last_output_tokens = 12;
  // Tokens served from Anthropic's prompt cache on the last turn
  // (`binding.last_cache_read_token_estimate`). Counted toward
  // last_input_tokens but billed at ~10% of base input price.
  int32 last_cache_read_tokens = 13;
}

message GetChannelAgentContextStatsRequest {
  string organization_id = 1;
  string channel_id = 2;
  string agent_id = 3;
}

message GetChannelAgentContextStatsResponse {
  ChannelAgentContextStats stats = 1;
}

message GetChannelAgentContextStatsBatchRequest {
  string organization_id = 1;
  string channel_id = 2;
  // Up to 100 agent ids. The handler rejects larger batches.
  repeated string agent_ids = 3;
}

message GetChannelAgentContextStatsBatchResponse {
  // Keyed by agent_id (string UUID). Agents that were not bound to the
  // channel, soft-deleted, or otherwise unreadable are simply absent from
  // the map. The frontend renders the union of what came back.
  map<string, ChannelAgentContextStats> stats = 1;
}

message CompactChannelAgentContextRequest {
  string organization_id = 1;
  string channel_id = 2;
  string agent_id = 3;
}

message CompactChannelAgentContextResponse {
  bool compacted = 1;
  ChannelAgentContextStats stats = 2;
  int32 messages_compacted = 3;
  int32 tokens_before = 4;
  int32 tokens_after = 5;
  int32 tokens_saved = 6;
}

message ResetChannelAgentContextRequest {
  string organization_id = 1;
  string channel_id = 2;
  string agent_id = 3;
}

message ResetChannelAgentContextResponse {
  // The newly-written kind="context_reset" divider message id, so the
  // frontend can locate it in the message list (it lands in the channel
  // stream too via MESSAGE_CREATED).
  string divider_message_id = 1;
  google.protobuf.Timestamp reset_at = 2;
  ChannelAgentContextStats stats = 3;
}

message ChannelAgentConfig {
  // Model override for this (channel, agent); "" = none (agent default).
  string model_override = 1;
  // JSON object of tuned parameter overrides for this (channel, agent),
  // merged over the agent's own model_params; "" = none.
  string model_params_override = 2;
  // JSON object of image-generation overrides for this (channel, agent),
  // merged over the agent's own image_params; "" = none. Builder-only knobs
  // are rejected here.
  string image_params_override = 3;
}

message GetChannelAgentConfigRequest {
  string organization_id = 1;
  string channel_id = 2;
  string agent_id = 3;
}

message GetChannelAgentConfigResponse {
  ChannelAgentConfig config = 1;
}

message UpdateChannelAgentConfigRequest {
  string organization_id = 1;
  string channel_id = 2;
  string agent_id = 3;
  optional string model_override = 4;
  // Absent = unchanged, "" = clear, otherwise a JSON object.
  optional string model_params_override = 5;
  optional string image_params_override = 6;
}

message UpdateChannelAgentConfigResponse {
  ChannelAgentConfig config = 1;
}

