syntax = "proto3";

package chat.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "tags/v1/tags.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/chat/v1;chatv1";

// ChatService provides channel, message, thread, reaction, and category management.
service ChatService {
  // Channel CRUD
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse) {}
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse) {}
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse) {}
  rpc ArchiveChannel(ArchiveChannelRequest) returns (ArchiveChannelResponse) {}
  rpc UnarchiveChannel(UnarchiveChannelRequest) returns (UnarchiveChannelResponse) {}
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse) {}
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse) {}

  // Membership
  rpc JoinChannel(JoinChannelRequest) returns (JoinChannelResponse) {}
  rpc LeaveChannel(LeaveChannelRequest) returns (LeaveChannelResponse) {}
  rpc AddMembers(AddMembersRequest) returns (AddMembersResponse) {}
  rpc RemoveMembers(RemoveMembersRequest) returns (RemoveMembersResponse) {}
  rpc GetMembers(GetMembersRequest) returns (GetMembersResponse) {}
  rpc UpdateChannelMember(UpdateChannelMemberRequest) returns (UpdateChannelMemberResponse) {}
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse) {}

  // Messages
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse) {}
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse) {}
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse) {}
  rpc UpdateMessage(UpdateMessageRequest) returns (UpdateMessageResponse) {}
  // Prior contents of an edited message. The sender always may read them;
  // other viewers are gated by ChatPolicy.edit_history_visible_to.
  rpc GetMessageRevisions(GetMessageRevisionsRequest) returns (GetMessageRevisionsResponse) {}
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse) {}
  rpc PinMessage(PinMessageRequest) returns (PinMessageResponse) {}
  rpc UnpinMessage(UnpinMessageRequest) returns (UnpinMessageResponse) {}
  rpc GetPinnedMessages(GetPinnedMessagesRequest) returns (GetPinnedMessagesResponse) {}

  // Threads
  rpc GetThread(GetThreadRequest) returns (GetThreadResponse) {}
  rpc GetThreadMessages(GetThreadMessagesRequest) returns (GetThreadMessagesResponse) {}
  rpc GetThreadsInbox(GetThreadsInboxRequest) returns (GetThreadsInboxResponse) {}
  rpc FollowThread(FollowThreadRequest) returns (FollowThreadResponse) {}
  rpc UnfollowThread(UnfollowThreadRequest) returns (UnfollowThreadResponse) {}

  // Reactions
  rpc AddReaction(AddReactionRequest) returns (AddReactionResponse) {}
  rpc RemoveReaction(RemoveReactionRequest) returns (RemoveReactionResponse) {}

  // Typing and read state
  rpc SetTyping(SetTypingRequest) returns (SetTypingResponse) {}
  rpc MarkChannelRead(MarkChannelReadRequest) returns (MarkChannelReadResponse) {}
  rpc MarkChannelUnread(MarkChannelUnreadRequest) returns (MarkChannelUnreadResponse) {}
  rpc MarkThreadRead(MarkThreadReadRequest) returns (MarkThreadReadResponse) {}
  rpc GetUnreadCounts(GetUnreadCountsRequest) returns (GetUnreadCountsResponse) {}

  // Drafts - per-user unsent composer text, synced across devices.
  rpc SaveDraft(SaveDraftRequest) returns (SaveDraftResponse) {}
  rpc DeleteDraft(DeleteDraftRequest) returns (DeleteDraftResponse) {}
  rpc ListDrafts(ListDraftsRequest) returns (ListDraftsResponse) {}

  // Channel resources
  rpc GetChannelResources(GetChannelResourcesRequest) returns (GetChannelResourcesResponse) {}

  // Convert a group DM into a PRIVATE channel (owner only); members and
  // history carry over. Group DMs are capped, channels are not.
  rpc ConvertGroupDmToChannel(ConvertGroupDmToChannelRequest) returns (ConvertGroupDmToChannelResponse) {}

  // Named agent chats - multiple chats per (user, agent) pair, each renamable.
  rpc CreateAgentChat(CreateAgentChatRequest) returns (CreateAgentChatResponse) {}
  rpc RenameAgentChat(RenameAgentChatRequest) returns (RenameAgentChatResponse) {}
  rpc ListAgentChats(ListAgentChatsRequest) returns (ListAgentChatsResponse) {}

  // Categories
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse) {}
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse) {}
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse) {}
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse) {}
  rpc ReorderCategories(ReorderCategoriesRequest) returns (ReorderCategoriesResponse) {}
  rpc MoveChannelToCategory(MoveChannelToCategoryRequest) returns (MoveChannelToCategoryResponse) {}

  // Agent chat folders - per-user sidebar grouping for agent DM chats.
  // Unlike categories (org-wide, admin-managed), folders are private to the
  // requesting user and only apply to their is_agent_dm channels.
  rpc CreateAgentFolder(CreateAgentFolderRequest) returns (CreateAgentFolderResponse) {}
  rpc RenameAgentFolder(RenameAgentFolderRequest) returns (RenameAgentFolderResponse) {}
  rpc DeleteAgentFolder(DeleteAgentFolderRequest) returns (DeleteAgentFolderResponse) {}
  rpc ListAgentFolders(ListAgentFoldersRequest) returns (ListAgentFoldersResponse) {}
  rpc SetAgentChatFolder(SetAgentChatFolderRequest) returns (SetAgentChatFolderResponse) {}

  // Respond to a destructive-tool confirmation request raised by an agent
  // running inside a chat channel. The chat layer is the front door; it
  // forwards the decision to the agents runtime via the bridge.
  rpc RespondToAgentConfirmation(RespondToAgentConfirmationRequest) returns (RespondToAgentConfirmationResponse) {}

  // List pending agent destructive-tool approvals still open for a channel.
  // Used on channel mount so synthetic confirmation cards survive page reloads
  // (the approval state itself lives in Valkey up to its TTL).
  rpc GetChannelPendingApprovals(GetChannelPendingApprovalsRequest) returns (GetChannelPendingApprovalsResponse) {}

  // Per-(channel, agent) context window stats. Drives the chat header meter
  // and group-channel per-agent popover. Mirrors `agents.v1.SessionsService.
  // GetSessionContextStats` but is keyed on the channel/agent binding.
  rpc GetChannelAgentContextStats(GetChannelAgentContextStatsRequest) returns (GetChannelAgentContextStatsResponse) {}

  // Batched variant of `GetChannelAgentContextStats`. Returns per-(channel,
  // agent) stats for N agents in one round-trip. Drives the group-channel
  // ChannelAgentsPopover (one row per agent member) so the popover does not
  // fan out N parallel single-agent fetches. Agents the caller can't see or
  // that are not bound to the channel are simply absent from the response
  // map (not an error).
  rpc GetChannelAgentContextStatsBatch(GetChannelAgentContextStatsBatchRequest) returns (GetChannelAgentContextStatsBatchResponse) {}

  // Force compaction for one (channel, agent) pair. Writes a chat message
  // with metadata.kind="summary" and bumps the binding's compaction pointer
  // so subsequent prompts roll the older history into the summary row.
  rpc CompactChannelAgentContext(CompactChannelAgentContextRequest) returns (CompactChannelAgentContextResponse) {}

  // Reset one agent's view of the channel. Writes a metadata.kind=
  // "context_reset" divider message AND sets binding.manual_reset_at = now()
  // so `load_context_messages` excludes everything older for this agent.
  // Per-agent: resetting agent A in a multi-agent channel does not affect
  // agent B's view.
  rpc ResetChannelAgentContext(ResetChannelAgentContextRequest) returns (ResetChannelAgentContextResponse) {}

  // Per-(channel, agent) model + parameter overrides stored on the binding
  // row. Empty strings mean "no override" - the agent's own configuration
  // applies.
  rpc GetChannelAgentConfig(GetChannelAgentConfigRequest) returns (GetChannelAgentConfigResponse) {}

  // Update the binding's overrides. Absent optional fields leave the value
  // unchanged; present-but-empty clears it (mirrors agents.v1.UpdateSession).
  rpc UpdateChannelAgentConfig(UpdateChannelAgentConfigRequest) returns (UpdateChannelAgentConfigResponse) {}

  // Stop an in-flight agent run in a channel. Cancels the active run for the
  // given agent - whether it is mid tool call, image generation, or text
  // generation - via the run-state cancel flag the egress task observes.
  rpc StopAgentRun(StopAgentRunRequest) returns (StopAgentRunResponse) {}

  // Org-level chat policy. Every member may read it (the composer gates the
  // broadcast typeahead and confirm dialog on it); updates are org-admin only.
  rpc GetChatPolicy(GetChatPolicyRequest) returns (GetChatPolicyResponse) {}
  rpc UpdateChatPolicy(UpdateChatPolicyRequest) returns (UpdateChatPolicyResponse) {}

  rpc ForwardMessage(ForwardMessageRequest) returns (ForwardMessageResponse) {}
}

// Who may send channel-wide broadcast mentions (@channel/@here).
enum ChatBroadcastMinRole {
  CHAT_BROADCAST_MIN_ROLE_UNSPECIFIED = 0;
  CHAT_BROADCAST_MIN_ROLE_MEMBER = 1;
  CHAT_BROADCAST_MIN_ROLE_ADMIN = 2;
}

// Who may view a message's edit history beyond its sender.
enum ChatEditHistoryVisibility {
  CHAT_EDIT_HISTORY_VISIBILITY_UNSPECIFIED = 0;
  CHAT_EDIT_HISTORY_VISIBILITY_ADMINS = 1;
  CHAT_EDIT_HISTORY_VISIBILITY_EVERYONE = 2;
}

message ChatPolicy {
  string organization_id = 1;
  ChatBroadcastMinRole broadcast_min_role = 2;
  // Member count above which the composer asks for confirmation before a
  // broadcast mention is sent.
  int32 broadcast_confirm_threshold = 3;
  // Minutes after send during which the sender may edit a message.
  // Absent = unlimited; 0 disables editing entirely.
  optional int32 edit_window_minutes = 4;
  ChatEditHistoryVisibility edit_history_visible_to = 5;
  // The agents-in-chat integration for this org.
  bool agents_enabled = 6;
}

message GetChatPolicyRequest {
  string organization_id = 1;
}

message GetChatPolicyResponse {
  ChatPolicy policy = 1;
}

message UpdateChatPolicyRequest {
  string organization_id = 1;
  ChatBroadcastMinRole broadcast_min_role = 2;
  int32 broadcast_confirm_threshold = 3;
  // Absent = unlimited editing; 0 disables editing entirely.
  optional int32 edit_window_minutes = 4;
  ChatEditHistoryVisibility edit_history_visible_to = 5;
  bool agents_enabled = 6;
}

message UpdateChatPolicyResponse {
  ChatPolicy policy = 1;
}

// ChatSubject is a polymorphic channel/thread participant.
// Currently supports SUBJECT_TYPE_USER and SUBJECT_TYPE_AGENT. Other subject
// types from common.SubjectType are reserved and will be rejected at the
// handler boundary until first-class support lands.
message ChatSubject {
  common.v1.SubjectType type = 1;
  string id = 2;
}

// ENUMS

enum ChannelType {
  CHANNEL_TYPE_UNSPECIFIED = 0;
  CHANNEL_TYPE_PUBLIC = 1;
  CHANNEL_TYPE_PRIVATE = 2;
  CHANNEL_TYPE_DIRECT = 3;
  CHANNEL_TYPE_GROUP_DM = 4;
}

enum ChannelRole {
  CHANNEL_ROLE_UNSPECIFIED = 0;
  CHANNEL_ROLE_MEMBER = 1;
  CHANNEL_ROLE_ADMIN = 2;
  CHANNEL_ROLE_OWNER = 3;
}

enum SenderType {
  SENDER_TYPE_UNSPECIFIED = 0;
  SENDER_TYPE_USER = 1;
  SENDER_TYPE_AGENT = 2;
  SENDER_TYPE_SYSTEM = 3;
  SENDER_TYPE_GUEST = 4;
}

enum ChatNotificationLevel {
  CHAT_NOTIFICATION_LEVEL_UNSPECIFIED = 0;
  CHAT_NOTIFICATION_LEVEL_ALL = 1;
  CHAT_NOTIFICATION_LEVEL_MENTIONS = 2;
  CHAT_NOTIFICATION_LEVEL_NONE = 3;
}

// MESSAGES

// ChatChannel represents a channel with embedded stats.
message ChatChannel {
  string id = 1;
  string organization_id = 2;
  string owner_id = 3;
  string name = 4;
  string slug = 5;
  string description = 6;
  ChannelType channel_type = 7;
  bool is_archived = 9;
  bool is_default = 10;
  string icon = 11;
  optional string category_id = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  // Embedded stats (from chat_channel_stats)
  int32 message_count = 20;
  int32 root_message_count = 21;
  int32 member_count = 22;
  google.protobuf.Timestamp last_message_at = 23;
  google.protobuf.Timestamp last_root_message_at = 24;
  // User-specific context (populated per-request)
  optional ChannelRole current_user_role = 30;
  optional bool is_member = 31;
  // DM participant user IDs (populated for DIRECT and GROUP_DM channels)
  repeated string dm_member_ids = 32;
  // True when this is a 1:1 DM between a user and an agent (named agent chat).
  bool is_agent_dm = 33;
  // Optional user-supplied display name override for agent chats. When unset,
  // clients should display ``name``.
  optional string custom_name = 34;
  // Denormalised agent participant for ``is_agent_dm=true`` channels.
  optional string agent_id = 35;
  // Hydrated unified-tag rows assigned to this channel. Server-populated
  // via ``TagOperations.get_for_urns``; clients should treat as read-only.
  // Only meaningful for non-DM channels (PUBLIC / PRIVATE); DM channels
  // do not carry tags.
  repeated tags.v1.Tag tags = 36;
  // The requesting user's agent-chat folder holding this channel. Per-user
  // (from the member row), only set on is_agent_dm channels.
  optional string agent_folder_id = 37;
  // The bound agent was deleted, so this chat is frozen: history reads, sends
  // are refused. Only meaningful on is_agent_dm channels.
  bool agent_is_retired = 38;
}

// ThreadInfo holds thread metadata embedded in root messages.
message ThreadInfo {
  int32 reply_count = 1;
  google.protobuf.Timestamp last_reply_at = 2;
  repeated string participant_ids = 3;
  bool has_unread = 4;
}

// ReplyContext holds a snapshot of the quoted message for inline replies.
message ReplyContext {
  string id = 1;
  string sender_name = 2;
  string content_preview = 3;
}

// ChatMessage represents a message in a channel.
message ChatMessage {
  string id = 1;
  string channel_id = 2;
  string sender_id = 3;
  SenderType sender_type = 4;
  string content = 5;
  optional string root_id = 6;
  optional google.protobuf.Timestamp edited_at = 7;
  bool is_deleted = 8;
  bool is_pinned = 9;
  map<string, string> metadata = 10;
  google.protobuf.Timestamp created_at = 11;
  // Inline quote reply reference
  optional string reply_to_id = 12;
  reserved 13;
  reserved "feedback_rating";
  // Populated for root messages that have replies
  optional ThreadInfo thread = 20;
  // Reactions on this message
  repeated ReactionGroup reactions = 21;
  // Sender info (denormalized for display)
  optional string sender_name = 22;
  optional string sender_avatar_url = 23;
  // Snapshot of the quoted message (populated when reply_to_id is set)
  optional ReplyContext reply_context = 24;
  // Source snapshot, present only when the requesting viewer currently has
  // access to the live source message and channel.
  optional ForwardContext forward_context = 25;
  // True for a forwarded row even when forward_context is withheld.
  bool is_forwarded = 26;
  // Set on the channel copy of a thread reply that was broadcast to the
  // channel in one send.
  optional ThreadReplyContext thread_reply_context = 27;
}

// Links a channel message back to the thread reply it was posted alongside.
// Both rows live in the same channel under the same access, so this carries
// ids only - no snapshot and no access-gated projection.
message ThreadReplyContext {
  string root_message_id = 1;
  string reply_message_id = 2;
}

// ReactionGroup represents a unique emoji with its reactors.
message ReactionGroup {
  string emoji = 1;
  int32 count = 2;
  repeated string user_ids = 3;
  bool current_user_reacted = 4;
}

// ChatChannelMember represents a user's membership in a channel.
message ChatChannelMember {
  string channel_id = 1;
  // Legacy: populated when subject.type == SUBJECT_TYPE_USER. For agent
  // members, this is the empty string and `subject` is set.
  string user_id = 2;
  ChannelRole role = 3;
  ChatNotificationLevel notification_level = 4;
  bool is_muted = 5;
  google.protobuf.Timestamp joined_at = 6;
  // Denormalized identity info (works for users and agents).
  optional string display_name = 10;
  optional string email = 11;
  optional string avatar_url = 12;
  // Extended notification preferences
  optional google.protobuf.Timestamp muted_until = 13;
  bool follow_all_threads = 14;
  // Polymorphic identity. Set on every row going forward; user_id stays
  // populated for SUBJECT_TYPE_USER until clients migrate.
  optional ChatSubject subject = 15;
}

// ChatChannelCategory represents a sidebar category for organizing channels.
message ChatChannelCategory {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  int32 position = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// ThreadInboxItem represents a thread in the threads inbox view.
message ThreadInboxItem {
  string root_message_id = 1;
  string channel_id = 2;
  string channel_name = 3;
  ChatMessage root_message = 4;
  int32 reply_count = 5;
  google.protobuf.Timestamp last_reply_at = 6;
  repeated string participant_ids = 7;
  bool has_unread = 8;
  // Preview of the latest reply
  optional ChatMessage latest_reply = 9;
}

// ChatResource represents an auto-tracked content reference in a channel.
message ChatResource {
  string id = 1;
  string channel_id = 2;
  string urn = 3;
  string content_type = 4;
  google.protobuf.Timestamp first_mentioned_at = 5;
  google.protobuf.Timestamp last_mentioned_at = 6;
  int32 mention_count = 7;
  string first_mentioned_by = 8;
  // Resolved metadata for display
  optional string title = 10;
  optional string description = 11;
}

// TypingUser represents a user currently typing.
message TypingUser {
  string user_id = 1;
  string display_name = 2;
}

// CHANNEL REQUESTS/RESPONSES

message CreateChannelRequest {
  string organization_id = 1;
  string name = 2;
  ChannelType channel_type = 3;
  optional string description = 4;
  optional string icon = 5;
  optional bool is_default = 6;
  optional string category_id = 7;
  // For DM/GROUP_DM: user IDs to include (legacy; users only).
  repeated string member_ids = 10;
  // For DM/GROUP_DM: polymorphic initial members (users + agents). Preferred.
  repeated ChatSubject members = 11;
  // Optional unified-tag ids to assign on create. Ignored for DM /
  // GROUP_DM channels (DMs do not carry tags).
  repeated string tag_ids = 12;
}

message CreateChannelResponse {
  ChatChannel channel = 1;
}

message GetChannelRequest {
  string organization_id = 1;
  string channel_id = 2;
}

message GetChannelResponse {
  ChatChannel channel = 1;
}

message UpdateChannelRequest {
  string organization_id = 1;
  string channel_id = 2;
  optional string name = 3;
  optional string description = 4;
  optional string icon = 5;
  optional bool is_default = 6;
  // Replacement set of unified-tag ids. Empty list clears all manual
  // tags; field unset (HasField=false) leaves them untouched. Mirrors
  // the NoteTagIds / FileTagIds / EventTagIds wrapper pattern. Ignored
  // for DM / GROUP_DM channels.
  optional ChannelTagIds tag_ids = 7;
}

// Wrapper so callers can distinguish "leave tags alone" from
// "clear all tags" (proto3 cannot tell empty repeated apart from unset).
message ChannelTagIds {
  repeated string ids = 1;
}

message UpdateChannelResponse {
  ChatChannel channel = 1;
}

message ArchiveChannelRequest {
  string organization_id = 1;
  string channel_id = 2;
}

message ArchiveChannelResponse {}

message UnarchiveChannelRequest {
  string organization_id = 1;
  string channel_id = 2;
}

message UnarchiveChannelResponse {
  ChatChannel channel = 1;
}

message DeleteChannelRequest {
  string organization_id = 1;
  string channel_id = 2;
}

message DeleteChannelResponse {}

message ListChannelsRequest {
  string organization_id = 1;
  // If true, list all public channels (for browse). If false, list user's channels (for sidebar).
  bool browse_public = 2;
  // Opaque cursor for pagination. First page omits this; subsequent pages
  // pass the `next_cursor` returned by the previous response. Cursor encodes
  // the (last_root_message_at, channel_id) tuple for the user's-channels path
  // and the (member_count, channel_id) tuple for browse_public.
  optional string cursor = 3;
  // Max channels to return per page. Server clamps to <= 500. Defaults to 200
  // when unset / zero.
  optional int32 page_size = 4;
  // Filter channels that carry every tag id in this list (logical AND).
  // Empty = no tag filter. Mirrors ``ListNotesRequest`` / ``ListFilesRequest``
  // / ``ListEventsRequest``.
  repeated string tag_ids = 5;
  // Return the caller's archived channels INSTEAD of their active ones, which
  // is what the sidebar's Archived section pages through. Default false, so
  // existing callers keep the active view untouched.
  bool archived_only = 6;
}

message ListChannelsResponse {
  repeated ChatChannel channels = 1;
  // Set when more pages exist. Pass back as `cursor` on the next request.
  optional string next_cursor = 2;
}

// MEMBERSHIP REQUESTS/RESPONSES

message JoinChannelRequest {
  string organization_id = 1;
  string channel_id = 2;
}

message JoinChannelResponse {
  ChatChannel channel = 1;
}

message LeaveChannelRequest {
  string organization_id = 1;
  string channel_id = 2;
}

message LeaveChannelResponse {}

message AddMembersRequest {
  string organization_id = 1;
  string channel_id = 2;
  // Legacy: user-only members. Kept for backward compatibility.
  repeated string user_ids = 3;
  // New: polymorphic subjects (users + agents). Preferred. Server unions
  // user_ids into subjects with SUBJECT_TYPE_USER when both are sent.
  repeated ChatSubject subjects = 4;
}

message AddMembersResponse {
  repeated ChatChannelMember members = 1;
}

message RemoveMembersRequest {
  string organization_id = 1;
  string channel_id = 2;
  // Legacy: user-only.
  repeated string user_ids = 3;
  // New: polymorphic subjects (users + agents).
  repeated ChatSubject subjects = 4;
}

message RemoveMembersResponse {}

message GetMembersRequest {
  string organization_id = 1;
  string channel_id = 2;
  // Opaque cursor for pagination. Cursor encodes (joined_at, subject_id).
  optional string cursor = 3;
  // Max members per page. Server clamps to <= 500. Defaults to 200 when
  // unset / zero.
  optional int32 page_size = 4;
}

message GetMembersResponse {
  repeated ChatChannelMember members = 1;
  // Set when more pages exist. Pass back as `cursor` on the next request.
  optional string next_cursor = 2;
}

message UpdateChannelMemberRequest {
  string organization_id = 1;
  string channel_id = 2;
  string user_id = 3;
  optional bool is_muted = 4;
  optional ChatNotificationLevel notification_level = 5;
  optional google.protobuf.Timestamp muted_until = 6;
  optional bool follow_all_threads = 7;
  optional bool badge_all_messages = 8;
}

message UpdateChannelMemberResponse {
  ChatChannelMember member = 1;
}

message UpdateMemberRoleRequest {
  string organization_id = 1;
  string channel_id = 2;
  // Target user. Role changes apply to USER members only; agents stay MEMBER.
  string user_id = 3;
  ChannelRole role = 4;
}

message UpdateMemberRoleResponse {
  ChatChannelMember member = 1;
}

// MESSAGE REQUESTS/RESPONSES

message SendMessageRequest {
  string organization_id = 1;
  string channel_id = 2;
  string content = 3;
  // Set for thread replies; omit for root messages
  optional string root_id = 4;
  // Optional metadata (e.g., via_agent info)
  map<string, string> metadata = 5;
  // Set when quoting/replying to a specific message
  optional string reply_to_id = 6;
  // File IDs to attach to the message in the same transaction.
  // Attachments are linked before the message-created event is published
  // and before any agent invocation is enqueued, so downstream consumers
  // (notifications, chat-triggered agents) observe a consistent view.
  repeated string attachment_file_ids = 7;
  // Also post this thread reply to the channel as a root message, linked back
  // to the thread. Only valid with root_id set.
  bool also_send_to_channel = 8;
}

message SendMessageResponse {
  ChatMessage message = 1;
}

message GetMessagesRequest {
  string organization_id = 1;
  string channel_id = 2;
  // Cursor-based pagination
  optional string before_id = 3;
  optional string after_id = 4;
  int32 limit = 5;
  // If true, only return root messages (no thread replies)
  bool root_only = 6;
  // Fetch messages around this message (inclusive). Returns limit/2 before + target + limit/2 after.
  optional string around_id = 7;
}

message GetMessagesResponse {
  repeated ChatMessage messages = 1;
  bool has_more = 2;
}

message GetMessageRequest {
  string organization_id = 1;
  string channel_id = 2;
  string message_id = 3;
}

message GetMessageResponse {
  ChatMessage message = 1;
}

message UpdateMessageRequest {
  string organization_id = 1;
  string channel_id = 2;
  string message_id = 3;
  string content = 4;
}

message UpdateMessageResponse {
  ChatMessage message = 1;
}

// One superseded content state of an edited message, ordered by revision_no.
message ChatMessageRevision {
  int32 revision_no = 1;
  // The content the message held before the edit at edited_at replaced it.
  string content = 2;
  string edited_by = 3;
  google.protobuf.Timestamp edited_at = 4;
}

message GetMessageRevisionsRequest {
  string organization_id = 1;
  string channel_id = 2;
  string message_id = 3;
}

message GetMessageRevisionsResponse {
  repeated ChatMessageRevision revisions = 1;
}

message DeleteMessageRequest {
  string organization_id = 1;
  string channel_id = 2;
  string message_id = 3;
}

message DeleteMessageResponse {}

message PinMessageRequest {
  string organization_id = 1;
  string channel_id = 2;
  string message_id = 3;
}

message PinMessageResponse {
  ChatMessage message = 1;
}

message UnpinMessageRequest {
  string organization_id = 1;
  string channel_id = 2;
  string message_id = 3;
}

message UnpinMessageResponse {
  ChatMessage message = 1;
}

message GetPinnedMessagesRequest {
  string organization_id = 1;
  string channel_id = 2;
}

message GetPinnedMessagesResponse {
  repeated ChatMessage messages = 1;
}

// THREAD REQUESTS/RESPONSES

message GetThreadRequest {
  string organization_id = 1;
  string channel_id = 2;
  string root_message_id = 3;
}

message GetThreadResponse {
  ChatMessage root_message = 1;
  int32 reply_count = 2;
  google.protobuf.Timestamp last_reply_at = 3;
  // Capped preview list (up to THREAD_PARTICIPANT_PREVIEW_LIMIT=20 ids).
  // Use total_participants for the absolute count when rendering "+N".
  repeated string participant_ids = 4;
  bool is_following = 5;
  int32 total_participants = 6;
}

message GetThreadMessagesRequest {
  string organization_id = 1;
  string channel_id = 2;
  string root_message_id = 3;
  optional string before_id = 4;
  optional string after_id = 5;
  int32 limit = 6;
}

message GetThreadMessagesResponse {
