  string organization_id = 1;
  string sprint_id = 2;
}

message DeleteSprintRequest {
  string organization_id = 1;
  string sprint_id = 2;
}

message ListSprintsRequest {
  string organization_id = 1;
  string project_id = 2;
  optional bool include_closed = 3;
}

message CreateSprintResponse {
