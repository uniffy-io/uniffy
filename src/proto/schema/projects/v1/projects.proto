syntax = "proto3";

package projects.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "tags/v1/tags.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/projects/v1;projectsv1";

// ============================================================================
// Service Definition
// ============================================================================

service ProjectsService {
  // ----- Projects -----
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);

  // ----- Tasks -----
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc MoveTask(MoveTaskRequest) returns (MoveTaskResponse);
  rpc BulkUpdateTasks(BulkUpdateTasksRequest) returns (BulkUpdateTasksResponse);
  rpc DeleteTasks(DeleteTasksRequest) returns (DeleteTasksResponse);
  // Every task of one project, or of several, as a CSV or a zip bundle of CSVs.
  rpc ExportTasks(ExportTasksRequest) returns (stream ExportTasksResponse);

  // ----- Field Definitions -----
  rpc CreateField(CreateFieldRequest) returns (CreateFieldResponse);
  rpc UpdateField(UpdateFieldRequest) returns (UpdateFieldResponse);
  rpc DeleteField(DeleteFieldRequest) returns (DeleteFieldResponse);

  // ----- View Configs -----
  rpc CreateView(CreateViewRequest) returns (CreateViewResponse);
  rpc UpdateView(UpdateViewRequest) returns (UpdateViewResponse);
  rpc DeleteView(DeleteViewRequest) returns (DeleteViewResponse);
  rpc ReorderViews(ReorderViewsRequest) returns (ReorderViewsResponse);
  rpc GetViewCatalog(GetViewCatalogRequest) returns (GetViewCatalogResponse);

  // ----- Activities -----
  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse);

  // ----- Sprints -----
  rpc CreateSprint(CreateSprintRequest) returns (CreateSprintResponse);
  rpc UpdateSprint(UpdateSprintRequest) returns (UpdateSprintResponse);
  rpc StartSprint(StartSprintRequest) returns (StartSprintResponse);
  rpc CompleteSprint(CompleteSprintRequest) returns (CompleteSprintResponse);
  rpc DeleteSprint(DeleteSprintRequest) returns (DeleteSprintResponse);
  rpc ListSprints(ListSprintsRequest) returns (ListSprintsResponse);

  // ----- Task Watchers -----
  rpc ToggleTaskWatcher(ToggleTaskWatcherRequest) returns (ToggleTaskWatcherResponse);
  rpc ListTaskWatchers(ListTaskWatchersRequest) returns (ListTaskWatchersResponse);
  rpc BulkCheckTaskWatchers(BulkCheckTaskWatchersRequest) returns (BulkCheckTaskWatchersResponse);
}

// ============================================================================
// Enums
// ============================================================================

enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  FIELD_TYPE_TEXT = 1;
  FIELD_TYPE_NUMBER = 2;
  FIELD_TYPE_SINGLE_SELECT = 3;
  FIELD_TYPE_MULTI_SELECT = 4;
  FIELD_TYPE_DATE = 5;
  FIELD_TYPE_PERSON = 6;
  FIELD_TYPE_REFERENCE = 7;
}

enum ViewType {
  VIEW_TYPE_UNSPECIFIED = 0;
  VIEW_TYPE_TABLE = 1;
  VIEW_TYPE_BOARD = 2;
  VIEW_TYPE_ROADMAP = 3;
  VIEW_TYPE_BACKLOG = 4;
  VIEW_TYPE_GRAPH = 5;
  VIEW_TYPE_RESOURCES = 6;
}

enum ViewVisibility {
  VIEW_VISIBILITY_UNSPECIFIED = 0;
  VIEW_VISIBILITY_PERSONAL = 1;
  VIEW_VISIBILITY_SHARED = 2;
}

// Task attributes a view can reference that are not project field definitions.
enum TaskPseudoField {
  TASK_PSEUDO_FIELD_UNSPECIFIED = 0;
  TASK_PSEUDO_FIELD_TAGS = 1;
  TASK_PSEUDO_FIELD_SPRINT = 2;
  TASK_PSEUDO_FIELD_TASK_TYPE = 3;
  TASK_PSEUDO_FIELD_CREATOR = 4;
  TASK_PSEUDO_FIELD_PARENT = 5;
  // Filter: the task or one of its ancestors is a listed epic. Group: nearest epic ancestor.
  TASK_PSEUDO_FIELD_EPIC = 6;
  TASK_PSEUDO_FIELD_HAS_SUBTASKS = 7;
  TASK_PSEUDO_FIELD_DEPTH = 8;
  TASK_PSEUDO_FIELD_IS_MILESTONE = 9;
  // Incomplete, with at least one live incomplete blocker.
  TASK_PSEUDO_FIELD_IS_BLOCKED = 10;
  TASK_PSEUDO_FIELD_BLOCKED_BY = 11;
  TASK_PSEUDO_FIELD_CREATED_AT = 12;
  TASK_PSEUDO_FIELD_UPDATED_AT = 13;
  TASK_PSEUDO_FIELD_COMPLETED_AT = 14;
  TASK_PSEUDO_FIELD_ESTIMATED_MINUTES = 15;
  TASK_PSEUDO_FIELD_TIME_SPENT_MINUTES = 16;
  TASK_PSEUDO_FIELD_NUMBER = 17;
}

enum TaskFilterOperator {
  TASK_FILTER_OPERATOR_UNSPECIFIED = 0;
  TASK_FILTER_OPERATOR_IS = 1;
  TASK_FILTER_OPERATOR_IS_NOT = 2;
  TASK_FILTER_OPERATOR_IS_ANY_OF = 3;
  TASK_FILTER_OPERATOR_IS_NONE_OF = 4;
  TASK_FILTER_OPERATOR_IS_ALL_OF = 5;
  TASK_FILTER_OPERATOR_CONTAINS = 6;
  TASK_FILTER_OPERATOR_NOT_CONTAINS = 7;
  TASK_FILTER_OPERATOR_IS_EMPTY = 8;
  TASK_FILTER_OPERATOR_IS_NOT_EMPTY = 9;
  TASK_FILTER_OPERATOR_GREATER_THAN = 10;
  TASK_FILTER_OPERATOR_LESS_THAN = 11;
  TASK_FILTER_OPERATOR_BETWEEN = 12;
  TASK_FILTER_OPERATOR_BEFORE = 13;
  TASK_FILTER_OPERATOR_AFTER = 14;
  TASK_FILTER_OPERATOR_ON_OR_BEFORE = 15;
  TASK_FILTER_OPERATOR_ON_OR_AFTER = 16;
}

enum FilterLogic {
  FILTER_LOGIC_UNSPECIFIED = 0;
  FILTER_LOGIC_AND = 1;
  FILTER_LOGIC_OR = 2;
}

enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASC = 1;
  SORT_DIRECTION_DESC = 2;
}

enum RelativeDateAnchor {
  RELATIVE_DATE_ANCHOR_UNSPECIFIED = 0;
  RELATIVE_DATE_ANCHOR_TODAY = 1;
  RELATIVE_DATE_ANCHOR_START_OF_WEEK = 2;
  RELATIVE_DATE_ANCHOR_END_OF_WEEK = 3;
  RELATIVE_DATE_ANCHOR_START_OF_MONTH = 4;
  RELATIVE_DATE_ANCHOR_END_OF_MONTH = 5;
}

enum ViewIdFlag {
  VIEW_ID_FLAG_UNSPECIFIED = 0;
  VIEW_ID_FLAG_CURRENT_USER = 1;
  VIEW_ID_FLAG_EMPTY = 2;
  VIEW_ID_FLAG_ACTIVE_SPRINT = 3;
}

enum TaskExportFormat {
  TASK_EXPORT_FORMAT_UNSPECIFIED = 0;
  TASK_EXPORT_FORMAT_CSV = 1;
}

// Row order of a view export: FLAT filters every task; OUTLINE filters root tasks and lists all
// live children depth-first under each, as the outline table shows them.
enum TaskExportLayout {
  TASK_EXPORT_LAYOUT_UNSPECIFIED = 0;
  TASK_EXPORT_LAYOUT_FLAT = 1;
  TASK_EXPORT_LAYOUT_OUTLINE = 2;
}

enum RoadmapZoom {
  ROADMAP_ZOOM_UNSPECIFIED = 0;
  ROADMAP_ZOOM_DAY = 1;
  ROADMAP_ZOOM_WEEK = 2;
  ROADMAP_ZOOM_MONTH = 3;
}

enum ActivityAction {
  ACTIVITY_ACTION_UNSPECIFIED = 0;
  ACTIVITY_ACTION_CREATED = 1;
  ACTIVITY_ACTION_STATUS_CHANGED = 2;
  ACTIVITY_ACTION_PRIORITY_CHANGED = 3;
  ACTIVITY_ACTION_FIELD_UPDATED = 4;
  ACTIVITY_ACTION_BLOCKED_BY_ADDED = 5;
  ACTIVITY_ACTION_BLOCKED_BY_REMOVED = 6;
  ACTIVITY_ACTION_ASSIGNED = 7;
  ACTIVITY_ACTION_TYPE_CHANGED = 8;
  ACTIVITY_ACTION_SPRINT_CHANGED = 9;
}

// ============================================================================
// Core Messages
// ============================================================================

message Project {
  string id = 1;
  string organization_id = 2;
  string owner_id = 3;
  string name = 4;
  string description = 5;
  string icon = 6;
  string color = 7;
  common.v1.AccessMode access_mode = 8;
  repeated FieldDefinition field_definitions = 9;
  repeated ViewConfig views = 10;
  string default_view_id = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  optional google.protobuf.Timestamp deleted_at = 14;
  string urn = 15;
  common.v1.ContentRole user_role = 16;
  string slug = 17;
  map<string, TypeFieldSchema> type_field_schemas = 18;
  optional common.v1.ContentRole baseline_role = 19;
  repeated tags.v1.Tag tags = 20;
  // Rollups so a project list can render progress without fetching every
  // project's tasks. Counts cover live top-level tasks only (no subtasks,
  // no soft-deleted rows).
  int32 task_count = 21;
  int32 completed_task_count = 22;
  // Explicit ``ContentMember`` grants; excludes the owner and anyone who
  // only reaches the project through an ``OPEN_TO_ORG`` baseline.
  int32 member_count = 23;
  // Portfolio rollups. Unlike the two counts above these cover every live task
  // in the project, subtasks included: a subtask can be overdue on its own, and
  // time spent only adds up if the whole tree contributes.
  int32 overdue_task_count = 24;
  int32 estimated_minutes = 25;
  // Named to match Task.time_spent_minutes - one concept, one field name.
  int32 time_spent_minutes = 26;
}

message Task {
  string id = 1;
  string project_id = 2;
  string organization_id = 3;
  string owner_id = 4;
  string title = 5;
  string description = 6;
  string status = 7;
  string priority = 8;
  repeated string assignee_ids = 9;
  optional string start_date = 10;
  optional string due_date = 11;
  optional google.protobuf.Timestamp completed_at = 12;
  optional string parent_id = 13;
  repeated string blocked_by_task_ids = 14;
  bool is_milestone = 15;
  optional string recurrence_rule = 16;
  int32 sort_order = 17;
  map<string, string> field_values = 18;
  repeated string outgoing_references = 19;
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
  optional google.protobuf.Timestamp deleted_at = 22;
  string urn = 23;
  int32 number = 24;
  string task_type = 25;
  optional string sprint_id = 26;
  common.v1.ContentRole user_role = 27;
  int32 subtask_total = 28;
  int32 subtask_completed = 29;
  optional int32 estimated_minutes = 30;
  optional int32 time_spent_minutes = 31;
  repeated tags.v1.Tag tags = 32;
}

message FieldDefinition {
  string id = 1;
  string project_id = 2;
  string name = 3;
  FieldType type = 4;
  bool is_required = 5;
  bool is_system = 6;
  int32 sort_order = 7;
  string config_json = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message TypeFieldSchema {
  repeated string shown_field_ids = 1;
  repeated string required_field_ids = 2;
}

message TaskFieldRef {
  oneof ref {
    // FieldDefinition.id on the project, system or custom.
    string field_id = 1;
    TaskPseudoField pseudo = 2;
  }
}

message TaskFilterIdSet {
  repeated string ids = 1;
  // Person fields and the creator: the caller, resolved at evaluation time.
  bool include_current_user = 2;
  // Unassigned, no sprint, untagged, no value.
  bool include_empty = 3;
  // Sprint only: the project's active sprint at evaluation time.
  bool include_active_sprint = 4;
}

message RelativeDate {
  RelativeDateAnchor anchor = 1;
  int32 offset_days = 2;
}

message TaskFilterDate {
  oneof value {
    // YYYY-MM-DD
    string fixed = 1;
    RelativeDate relative = 2;
  }
}

// Inclusive on both ends.
message TaskFilterDateRange {
  TaskFilterDate start = 1;
  TaskFilterDate end = 2;
}

// Inclusive on both ends.
message TaskFilterNumberRange {
  double min = 1;
  double max = 2;
}

message TaskFilterValue {
  oneof value {
    TaskFilterIdSet ids = 1;
    string text = 2;
    double number = 3;
    TaskFilterNumberRange number_range = 4;
    TaskFilterDate date = 5;
    TaskFilterDateRange date_range = 6;
    bool flag = 7;
  }
}

message TaskFilterCondition {
  TaskFieldRef field = 1;
  TaskFilterOperator operator = 2;
  // Absent for IS_EMPTY and IS_NOT_EMPTY.
  optional TaskFilterValue value = 3;
}

message TaskFilterNode {
  oneof node {
    TaskFilterCondition condition = 1;
    TaskFilterGroup group = 2;
  }
}

message TaskFilterGroup {
  FilterLogic logic = 1;
  repeated TaskFilterNode nodes = 2;
}

message TaskSort {
  TaskFieldRef field = 1;
  SortDirection direction = 2;
}

message TaskGroupBy {
  TaskFieldRef field = 1;
  SortDirection direction = 2;
  bool hide_empty = 3;
}

message TableLayout {
  // Subtasks as flat rows instead of nested under their parent.
  bool flat = 1;
}

message BoardLayout {
  // Single-select field that forms the columns; empty means the status field.
  string column_field_id = 1;
}

message RoadmapLayout {
  RoadmapZoom zoom = 1;
}

message BacklogLayout {}

message GraphLayout {
  bool hide_parent_edges = 1;
}

message ResourcesLayout {}

message ColumnWidth {
  TaskFieldRef field = 1;
  int32 width = 2;
}

message ViewDefinition {
  oneof layout {
    TableLayout table = 1;
    BoardLayout board = 2;
    RoadmapLayout roadmap = 3;
    BacklogLayout backlog = 4;
    GraphLayout graph = 5;
    ResourcesLayout resources = 6;
  }
  TaskFilterGroup filter = 7;
  repeated TaskSort sort = 8;
  optional TaskGroupBy group_by = 9;
  repeated TaskFieldRef visible_fields = 10;
  repeated ColumnWidth column_widths = 11;
  repeated string collapsed_group_keys = 12;
}

message ViewConfig {
  reserved 5, 6;
  reserved "is_default", "config_json";
  string id = 1;
  string project_id = 2;
  string name = 3;
  // Derived from definition.layout; a view's layout never changes.
  ViewType type = 4;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  ViewDefinition definition = 9;
  string owner_id = 10;
  ViewVisibility visibility = 11;
  int32 sort_order = 12;
}

message TaskActivity {
  string id = 1;
  string task_id = 2;
  string actor_id = 3;
  ActivityAction action = 4;
  google.protobuf.Timestamp timestamp = 5;
  optional string field_id = 6;
  optional string previous_value = 7;
  optional string new_value = 8;
}

message SelectOption {
  string id = 1;
  string label = 2;
  string color = 3;
  int32 sort_order = 4;
}

message Sprint {
  string id = 1;
  string project_id = 2;
  string organization_id = 3;
  string name = 4;
  string goal = 5;
  string status = 6;
  optional string start_date = 7;
  optional string end_date = 8;
  int32 sort_order = 9;
  int32 task_count = 10;
  int32 completed_task_count = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

// ============================================================================
// Project Requests/Responses
// ============================================================================

message CreateProjectRequest {
  string organization_id = 1;
  string name = 2;
  optional string description = 3;
  optional string icon = 4;
  optional string color = 5;
  optional common.v1.AccessMode access_mode = 6;
  optional string slug = 7;
  optional common.v1.ContentRole baseline_role = 8;
  // Optional unified-tag ids to assign on create.
  repeated string tag_ids = 9;
}

message GetProjectRequest {
  string organization_id = 1;
  string project_id = 2;
}

message UpdateProjectRequest {
  string organization_id = 1;
  string project_id = 2;
  optional string name = 3;
  optional string description = 4;
  optional string icon = 5;
  optional string color = 6;
  optional common.v1.AccessMode access_mode = 7;
  // Id of a shared view of this project; an empty string clears the default.
  optional string default_view_id = 8;
  optional string slug = 9;
  map<string, TypeFieldSchema> type_field_schemas = 10;
  optional common.v1.ContentRole baseline_role = 11;
  // Replacement set of unified-tag ids. Empty list clears all manual
  // tags; field unset (HasField=false) leaves them untouched. Mirrors
  // the NoteTagIds / FileTagIds / EventTagIds wrapper pattern.
  optional ProjectTagIds tag_ids = 12;
}

// Wrapper so callers can distinguish "leave tags alone" from
// "clear all tags" (proto3 cannot tell empty repeated apart from unset).
message ProjectTagIds {
  repeated string ids = 1;
}

message DeleteProjectRequest {
  string organization_id = 1;
  string project_id = 2;
  bool permanent = 3;
}

message ListProjectsRequest {
  string organization_id = 1;
  optional common.v1.PaginationRequest pagination = 2;
  optional common.v1.AccessMode access_mode = 3;
  optional bool include_deleted = 4;
}

message CreateProjectResponse {
  Project project = 1;
}

message GetProjectResponse {
  Project project = 1;
}

message UpdateProjectResponse {
  Project project = 1;
}

message DeleteProjectResponse {
  bool success = 1;
  string message = 2;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  common.v1.PaginationResponse pagination = 2;
}

// ============================================================================
// Task Requests/Responses
// ============================================================================

message CreateTaskRequest {
  string organization_id = 1;
  string project_id = 2;
  string title = 3;
  optional string description = 4;
  optional string status = 5;
  optional string priority = 6;
  repeated string assignee_ids = 7;
  optional string start_date = 8;
  optional string due_date = 9;
  optional string parent_id = 10;
  repeated string blocked_by_task_ids = 11;
  optional bool is_milestone = 12;
  optional string recurrence_rule = 13;
  map<string, string> field_values = 14;
  optional string task_type = 15;
  optional string sprint_id = 16;
  optional int32 estimated_minutes = 17;
  optional int32 time_spent_minutes = 18;
  // Optional unified-tag ids to assign on create.
  repeated string tag_ids = 19;
}

message GetTaskRequest {
  string organization_id = 1;
  string task_id = 2;
}

message UpdateTaskRequest {
  string organization_id = 1;
  string task_id = 2;
  optional string title = 3;
  optional string description = 4;
  optional string status = 5;
  optional string priority = 6;
  // Replacement set of assignee ids. Empty list clears all assignees;
  // field unset (HasField=false) leaves them untouched.
  optional TaskAssigneeIds assignee_ids = 7;
  optional string start_date = 8;
  optional string due_date = 9;
  optional string parent_id = 10;
  repeated string blocked_by_task_ids = 11;
  optional bool is_milestone = 12;
  optional string recurrence_rule = 13;
  optional int32 sort_order = 14;
  map<string, string> field_values = 15;
  optional string task_type = 16;
  optional string sprint_id = 17;
  optional int32 estimated_minutes = 18;
  optional int32 time_spent_minutes = 19;
  // Replacement set of unified-tag ids. Empty list clears all manual
  // tags; field unset (HasField=false) leaves them untouched.
  optional TaskTagIds tag_ids = 20;
}

// Wrapper so callers can distinguish "leave tags alone" from
// "clear all tags" (proto3 cannot tell empty repeated apart from unset).
message TaskTagIds {
  repeated string ids = 1;
}

// Wrapper so callers can distinguish "leave assignees alone" from
// "clear all assignees" (proto3 cannot tell empty repeated apart from unset).
message TaskAssigneeIds {
  repeated string ids = 1;
}

message MoveTaskRequest {
  string organization_id = 1;
  string task_id = 2;
  string status = 3;
  int32 sort_order = 4;
}

message BulkUpdateTasksRequest {
  string organization_id = 1;
  repeated string task_ids = 2;
  optional string status = 3;
  optional string priority = 4;
  repeated string assignee_ids = 5;
  optional string sprint_id = 6;
}

message DeleteTaskRequest {
  string organization_id = 1;
  string task_id = 2;
  bool permanent = 3;
}

message DeleteTasksRequest {
  string organization_id = 1;
  repeated string task_ids = 2;
  bool permanent = 3;
}

message ListTasksRequest {
  reserved 6 to 14;
  reserved "sprint_id", "backlog_only", "tag_ids", "tag_filter_mode", "in_epic_id", "root_only", "has_subtasks", "min_depth", "max_depth";
  string organization_id = 1;
  string project_id = 2;
  optional common.v1.PaginationRequest pagination = 3;
  optional bool include_deleted = 4;
  // Children of one task, for the subtask list; not a view dimension.
  optional string parent_id = 5;
  // The same tree a saved view holds; validated against the project's fields.
  TaskFilterGroup filter = 15;
  // Empty values sort last in both directions; ties fall back to the manual order.
  repeated TaskSort sort = 16;
  // IANA zone of the caller's clock, for relative dates and timestamp days when the profile
  // names no zone.
  optional string time_zone = 17;
}

message ExportTasksRequest {
  string organization_id = 1;
  repeated string project_ids = 2;
  // filter, sort and view_id narrow a single-project export; a request naming several projects
  // refuses them, since field ids differ per project.
  TaskFilterGroup filter = 3;
  repeated TaskSort sort = 4;
  // A saved view by id; its filter and sort apply where the request carries none.
  optional string view_id = 5;
  TaskExportFormat format = 6;
  // A zip of tasks.csv, sprints.csv, activities.csv, comments.csv and fields.csv.
  bool include_bundle = 7;
  TaskExportLayout layout = 8;
  // IANA zone of the caller's clock, for relative dates when the profile names no zone.
  optional string time_zone = 9;
}

message ExportTasksResponse {
  // CSV: the header row arrives in the first chunk. Bundle: consecutive zip bytes.
  bytes payload = 1;
}

message CreateTaskResponse {
  Task task = 1;
  optional Task updated_parent = 2;
  optional Task spawned_task = 3;
}

message GetTaskResponse {
  Task task = 1;
  optional Task updated_parent = 2;
  optional Task spawned_task = 3;
}

message UpdateTaskResponse {
  Task task = 1;
  optional Task updated_parent = 2;
  optional Task spawned_task = 3;
}

message MoveTaskResponse {
  Task task = 1;
  optional Task updated_parent = 2;
  optional Task spawned_task = 3;
}

message DeleteTaskResponse {
  bool success = 1;
  string message = 2;
}

message DeleteTasksResponse {
  bool success = 1;
  int32 deleted_count = 2;
}

message BulkUpdateTasksResponse {
  repeated Task tasks = 1;
  int32 updated_count = 2;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  common.v1.PaginationResponse pagination = 2;
}

// ============================================================================
// Field Requests/Responses
// ============================================================================

message CreateFieldRequest {
  string organization_id = 1;
  string project_id = 2;
  string name = 3;
  FieldType type = 4;
  optional bool is_required = 5;
  optional int32 sort_order = 6;
  optional string config_json = 7;
}

message UpdateFieldRequest {
  string organization_id = 1;
  string project_id = 2;
  string field_id = 3;
  optional string name = 4;
  optional bool is_required = 5;
  optional int32 sort_order = 6;
  optional string config_json = 7;
}

message DeleteFieldRequest {
  string organization_id = 1;
  string project_id = 2;
  string field_id = 3;
}

message CreateFieldResponse {
  FieldDefinition field = 1;
}

message UpdateFieldResponse {
  FieldDefinition field = 1;
}

message DeleteFieldResponse {
  bool success = 1;
}

// ============================================================================
// View Requests/Responses
// ============================================================================

message CreateViewRequest {
  reserved 4, 5, 6;
  reserved "type", "is_default", "config_json";
  string organization_id = 1;
  string project_id = 2;
  string name = 3;
  ViewDefinition definition = 7;
  ViewVisibility visibility = 8;
}

message UpdateViewRequest {
  reserved 5, 6;
  reserved "is_default", "config_json";
  string organization_id = 1;
  string project_id = 2;
  string view_id = 3;
  optional string name = 4;
  optional ViewDefinition definition = 7;
  optional ViewVisibility visibility = 8;
}

message DeleteViewRequest {
  string organization_id = 1;
  string project_id = 2;
  string view_id = 3;
}

message CreateViewResponse {
  ViewConfig view = 1;
}

message UpdateViewResponse {
  ViewConfig view = 1;
}

message DeleteViewResponse {
  bool success = 1;
}

// view_ids is the complete ordered set of the caller's scope: every shared view
// of the project, or every personal view the caller owns in it.
message ReorderViewsRequest {
  string organization_id = 1;
  string project_id = 2;
  ViewVisibility visibility = 3;
  repeated string view_ids = 4;
}

message ReorderViewsResponse {
  repeated ViewConfig views = 1;
}

// What a view may do with one field; the definition validator enforces the same rules.
message ViewFieldCapabilities {
  repeated TaskFilterOperator operators = 1;
  repeated ViewIdFlag id_flags = 2;
  bool sortable = 3;
  bool groupable = 4;
}

message ViewCatalogFieldType {
  FieldType type = 1;
  ViewFieldCapabilities capabilities = 2;
}

message ViewCatalogPseudoField {
  TaskPseudoField pseudo = 1;
  ViewFieldCapabilities capabilities = 2;
}

message ViewFilterLimits {
  // The top-level group counts as the first level.
  int32 max_depth = 1;
  int32 max_nodes = 2;
  int32 max_ids_per_condition = 3;
  int32 max_text_length = 4;
  int32 max_relative_offset_days = 5;
}

message GetViewCatalogRequest {}

message GetViewCatalogResponse {
  repeated ViewCatalogFieldType field_types = 1;
  repeated ViewCatalogPseudoField pseudo_fields = 2;
  ViewFilterLimits filter_limits = 3;
}

