syntax = "proto3";

package permissions.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/permissions/v1;permissionsv1";

// MembersService - Manage ContentMember rows, access policies, and audit events
// for the new ContentMember / ContentMemberEvent permission system.

service MembersService {
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  rpc SetAccessMode(SetAccessModeRequest) returns (SetAccessModeResponse);
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);
  rpc ListMemberEvents(ListMemberEventsRequest) returns (ListMemberEventsResponse);
  rpc RequestAccess(RequestAccessRequest) returns (RequestAccessResponse);
  rpc GetMyAccessRequestStatuses(GetMyAccessRequestStatusesRequest) returns (GetMyAccessRequestStatusesResponse);
  rpc GetAccessRequest(GetAccessRequestRequest) returns (GetAccessRequestResponse);
  rpc ListAccessRequests(ListAccessRequestsRequest) returns (ListAccessRequestsResponse);
  rpc RespondToAccessRequest(RespondToAccessRequestRequest) returns (RespondToAccessRequestResponse);
  rpc CancelAccessRequest(CancelAccessRequestRequest) returns (CancelAccessRequestResponse);
}

// Data Messages

// A single member row on a piece of content.
message ContentMember {
  common.v1.SubjectType subject_type = 1;
  string subject_id = 2;
  common.v1.ContentRole role = 3;
  string added_by_user_id = 4;
  google.protobuf.Timestamp added_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  optional google.protobuf.Timestamp expires_at = 7;
}

// The access policy for a piece of content (owner + baseline access).
message ContentAccessPolicy {
  string owner_id = 1;
  common.v1.AccessMode access_mode = 2;
  optional common.v1.ContentRole baseline_role = 3;
  // The requesting user's effective role on this content (group-resolved,
  // BLOCKED-aware). Absent means no access. Lets the client gate manage
  // controls without recomputing permissions.
  optional common.v1.ContentRole caller_role = 4;
  // The live resolved access mode after inheriting org defaults (raw
  // ``access_mode`` UNSPECIFIED resolves to the org default). Lets the client
  // act on what the row actually resolves to without recomputing inheritance.
  optional common.v1.AccessMode effective_access_mode = 5;
}

// Audit log entry for a content member change.
message ContentMemberEvent {
  string id = 1;
  common.v1.ContentType content_type = 2;
  string content_id = 3;
  common.v1.ContentMemberAction action = 4;
  optional common.v1.SubjectType subject_type = 5;
  optional string subject_id = 6;
  optional common.v1.ContentRole previous_role = 7;
  optional common.v1.ContentRole new_role = 8;
  optional common.v1.AccessMode previous_access_mode = 9;
  optional common.v1.AccessMode new_access_mode = 10;
  optional common.v1.ContentRole previous_baseline_role = 11;
  optional common.v1.ContentRole new_baseline_role = 12;
  optional string previous_owner_id = 13;
  optional string new_owner_id = 14;
  string actor_user_id = 15;
  common.v1.OrganizationRole actor_org_role = 16;
  string note = 17;
  google.protobuf.Timestamp occurred_at = 18;
}

enum AccessRequestState {
  ACCESS_REQUEST_STATE_UNSPECIFIED = 0;
  ACCESS_REQUEST_STATE_PENDING = 1;
  ACCESS_REQUEST_STATE_APPROVED = 2;
  ACCESS_REQUEST_STATE_DENIED = 3;
  ACCESS_REQUEST_STATE_CANCELED = 4;
}

enum AccessRequestDecision {
  ACCESS_REQUEST_DECISION_UNSPECIFIED = 0;
  ACCESS_REQUEST_DECISION_APPROVE = 1;
  ACCESS_REQUEST_DECISION_DENY = 2;
}

enum RequestAccessOutcome {
  REQUEST_ACCESS_OUTCOME_UNSPECIFIED = 0;
  REQUEST_ACCESS_OUTCOME_CREATED = 1;
  REQUEST_ACCESS_OUTCOME_ALREADY_PENDING = 2;
  REQUEST_ACCESS_OUTCOME_ALREADY_ACCESSIBLE = 3;
  REQUEST_ACCESS_OUTCOME_COOLDOWN = 4;
}

message ContentAccessRequest {
  string id = 1;
  string organization_id = 2;
  string requested_urn = 3;
  common.v1.ContentType original_content_type = 4;
  string original_content_id = 5;
  common.v1.ContentType canonical_content_type = 6;
  string canonical_content_id = 7;
  string requester_id = 8;
  string requester_display_name = 9;
  AccessRequestState state = 10;
  string message = 11;
  string decision_note = 12;
  optional common.v1.ContentRole approved_role = 13;
  optional string responded_by_user_id = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  optional google.protobuf.Timestamp responded_at = 17;
  optional google.protobuf.Timestamp can_request_again_at = 18;
  bool requester_has_access = 19;
}

message AccessRequestStatus {
  string requested_urn = 1;
  AccessRequestState state = 2;
  optional string request_id = 3;
  optional google.protobuf.Timestamp can_request_again_at = 4;
  bool requester_has_access = 5;
}

// Request Messages

message ListMembersRequest {
  string organization_id = 1;
  common.v1.ContentType content_type = 2;
  string content_id = 3;
}

message ListMembersResponse {
  ContentAccessPolicy policy = 1;
  repeated ContentMember members = 2;
}

message AddMemberRequest {
  string organization_id = 1;
  common.v1.ContentType content_type = 2;
  string content_id = 3;
  common.v1.SubjectType subject_type = 4;
  string subject_id = 5;
  common.v1.ContentRole role = 6;
  optional google.protobuf.Timestamp expires_at = 7;
  string note = 8;
}

message UpdateMemberRoleRequest {
  string organization_id = 1;
  common.v1.ContentType content_type = 2;
  string content_id = 3;
  common.v1.SubjectType subject_type = 4;
  string subject_id = 5;
  common.v1.ContentRole new_role = 6;
  string note = 7;
}

message RemoveMemberRequest {
  string organization_id = 1;
  common.v1.ContentType content_type = 2;
  string content_id = 3;
  common.v1.SubjectType subject_type = 4;
  string subject_id = 5;
  string note = 6;
}

message RemoveMemberResponse {
  bool success = 1;
}

message SetAccessModeRequest {
  string organization_id = 1;
  common.v1.ContentType content_type = 2;
  string content_id = 3;
  common.v1.AccessMode access_mode = 4;
  optional common.v1.ContentRole baseline_role = 5;
  bool remove_members_on_narrow = 6;
  string note = 7;
}

message SetAccessModeResponse {
  ContentAccessPolicy policy = 1;
}

message TransferOwnershipRequest {
  string organization_id = 1;
  common.v1.ContentType content_type = 2;
  string content_id = 3;
  string new_owner_user_id = 4;
  string note = 5;
}

message TransferOwnershipResponse {
  ContentAccessPolicy policy = 1;
}

message AddMemberResponse {
  ContentMember member = 1;
}

message UpdateMemberRoleResponse {
  ContentMember member = 1;
}

message ListMemberEventsRequest {
  string organization_id = 1;
  common.v1.ContentType content_type = 2;
  string content_id = 3;
  optional common.v1.PaginationRequest pagination = 4;
  optional string actor_user_id = 5;
  optional common.v1.ContentMemberAction action = 6;
  optional google.protobuf.Timestamp after = 7;
  optional google.protobuf.Timestamp before = 8;
}

message ListMemberEventsResponse {
  repeated ContentMemberEvent events = 1;
  common.v1.PaginationResponse pagination = 2;
}

message RequestAccessRequest {
  string organization_id = 1;
  string requested_urn = 2;
  string message = 3;
}

message RequestAccessResponse {
  RequestAccessOutcome outcome = 1;
  optional ContentAccessRequest access_request = 2;
  optional google.protobuf.Timestamp can_request_again_at = 3;
}

message GetMyAccessRequestStatusesRequest {
  string organization_id = 1;
  repeated string requested_urns = 2;
}

message GetMyAccessRequestStatusesResponse {
  repeated AccessRequestStatus statuses = 1;
}

message GetAccessRequestRequest {
  string organization_id = 1;
  string request_id = 2;
}

message GetAccessRequestResponse {
  ContentAccessRequest access_request = 1;
}

message ListAccessRequestsRequest {
  string organization_id = 1;
  optional common.v1.ContentType canonical_content_type = 2;
  optional string canonical_content_id = 3;
  optional AccessRequestState state = 4;
  optional common.v1.PaginationRequest pagination = 5;
}

message ListAccessRequestsResponse {
  repeated ContentAccessRequest access_requests = 1;
  common.v1.PaginationResponse pagination = 2;
}

message RespondToAccessRequestRequest {
  string organization_id = 1;
  string request_id = 2;
  AccessRequestDecision decision = 3;
  optional common.v1.ContentRole approved_role = 4;
  string decision_note = 5;
}

message RespondToAccessRequestResponse {
  ContentAccessRequest access_request = 1;
}

message CancelAccessRequestRequest {
  string organization_id = 1;
  string request_id = 2;
}

message CancelAccessRequestResponse {
  ContentAccessRequest access_request = 1;
}
