syntax = "proto3";

package organizations.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/organizations/v1;organizationsv1";

// OrganizationsService - Organization CRUD, membership, and settings

service OrganizationsService {
  // User's organizations
  rpc ListMyOrganizations(ListMyOrganizationsRequest) returns (ListMyOrganizationsResponse);
  // Finds which of the caller's own organizations owns the content behind a
  // URN. Unknown content, content the caller cannot view, and content outside
  // the caller's memberships all return the same NOT_FOUND error.
  rpc ResolveContentOrganization(ResolveContentOrganizationRequest) returns (ResolveContentOrganizationResponse);
  // Self-service creation. Allowed when the deployment's org_creation policy
  // admits the caller; the caller becomes OWNER. Rate limited per user and IP.
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);

  // First-run entry flow for the user who created the organization. Pending
  // only while that user is still its active OWNER and has neither finished
  // nor skipped it. Record and Finish are no-ops once the flow is over.
  rpc GetOnboarding(GetOnboardingRequest) returns (GetOnboardingResponse);
  rpc RecordOnboardingStep(RecordOnboardingStepRequest) returns (RecordOnboardingStepResponse);
  rpc FinishOnboarding(FinishOnboardingRequest) returns (FinishOnboardingResponse);

  // Invitations addressed to the caller's email, and the signed-in way to act on them.
  rpc ListMyInvitations(ListMyInvitationsRequest) returns (ListMyInvitationsResponse);
  rpc AcceptMyInvitation(AcceptMyInvitationRequest) returns (AcceptMyInvitationResponse);
  rpc DeclineMyInvitation(DeclineMyInvitationRequest) returns (DeclineMyInvitationResponse);

  // Organization read/update (Org Member / Org Admin). Cross-tenant CRUD
  // is the platform surface: superadmin.v1.SystemOrganizationsService.
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (UpdateOrganizationResponse);

  // Membership lifecycle for the caller's own place in the organization.
  // An OWNER transfers before leaving; deletion is OWNER only and soft, with
  // the same purge window the platform surface applies.
  rpc LeaveOrganization(LeaveOrganizationRequest) returns (LeaveOrganizationResponse);
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (DeleteOrganizationResponse);

  // Organization overview (Org Admin)
  rpc GetOrganizationOverview(GetOrganizationOverviewRequest) returns (GetOrganizationOverviewResponse);

  // Member management (Org Admin)
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);

  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse);
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);
  rpc ResendInvitation(ResendInvitationRequest) returns (ResendInvitationResponse);

  rpc GetSecuritySettings(GetSecuritySettingsRequest) returns (GetSecuritySettingsResponse);
  rpc UpdateSecuritySettings(UpdateSecuritySettingsRequest) returns (UpdateSecuritySettingsResponse);

  // Permission defaults (Org Admin)
  rpc GetPermissionDefaults(GetPermissionDefaultsRequest) returns (GetPermissionDefaultsResponse);
  rpc UpdatePermissionDefaults(UpdatePermissionDefaultsRequest) returns (UpdatePermissionDefaultsResponse);

  // Domain Admin management (Org Admin)
  rpc GrantDomainAdmin(GrantDomainAdminRequest) returns (GrantDomainAdminResponse);
  rpc RevokeDomainAdmin(RevokeDomainAdminRequest) returns (RevokeDomainAdminResponse);
  rpc ListDomainAdmins(ListDomainAdminsRequest) returns (ListDomainAdminsResponse);
  rpc GetUserDomainAdmins(GetUserDomainAdminsRequest) returns (GetUserDomainAdminsResponse);

  // Encryption key rotation (Org Owner only). Generates a fresh Data
  // Encryption Key for the organization, re-encrypts every secret under
  // it, and retires the previous key.
  rpc RotateEncryptionKey(RotateEncryptionKeyRequest) returns (RotateEncryptionKeyResponse);
}

// User's Organizations Messages

message ListMyOrganizationsRequest {}

message ListMyOrganizationsResponse {
  repeated MyOrganization organizations = 1;
  // Whether the deployment's org_creation policy lets this caller create one.
  bool can_create_organization = 2;
}

message MyOrganization {
  common.v1.OrganizationInfo organization = 1;
  common.v1.OrganizationRole role = 2;
  google.protobuf.Timestamp joined_at = 3;
  // Listed but cannot be entered until a platform operator lifts the suspension.
  bool suspended = 4;
}

message CreateOrganizationRequest {
  string name = 1;
  // Derived from the name when empty.
  optional string slug = 2;
}

message CreateOrganizationResponse {
  MyOrganization organization = 1;
}

message ListMyInvitationsRequest {}

message ListMyInvitationsResponse {
  repeated MyInvitation invitations = 1;
}

// A pending invitation addressed to the caller's email.
message MyInvitation {
  string id = 1;
  common.v1.OrganizationInfo organization = 2;
  common.v1.OrganizationRole role = 3;
  optional string inviter_display_name = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp created_at = 6;
}

message AcceptMyInvitationRequest {
  oneof lookup {
    // From the welcome page list.
    string invitation_id = 1;
    // From the mail link while signed in; proves control of the mailbox.
    string token = 2;
  }
}

message AcceptMyInvitationResponse {
  MyOrganization organization = 1;
}

message DeclineMyInvitationRequest {
  string invitation_id = 1;
}

message DeclineMyInvitationResponse {}

message LeaveOrganizationRequest {
  string organization_id = 1;
}

message LeaveOrganizationResponse {}

message TransferOwnershipRequest {
  string organization_id = 1;
  string new_owner_user_id = 2;
}

message TransferOwnershipResponse {
  common.v1.MemberInfo new_owner = 1;
  common.v1.MemberInfo previous_owner = 2;
}

message DeleteOrganizationRequest {
  string organization_id = 1;
  // Must equal the organization's slug.
  string confirm_slug = 2;
}

message DeleteOrganizationResponse {
  google.protobuf.Timestamp purge_at = 1;
}

message ResolveContentOrganizationRequest {
  string urn = 1;
}

message ResolveContentOrganizationResponse {
  common.v1.OrganizationInfo organization = 1;
  common.v1.OrganizationRole role = 2;
}

message OrganizationDetail {
  common.v1.OrganizationInfo organization = 1;
  int32 member_count = 2;
  int32 group_count = 3;
  bool is_active = 4;
}

message GetOrganizationRequest {
  string organization_id = 1;
}

message GetOrganizationResponse {
  OrganizationDetail organization = 1;
}

message UpdateOrganizationResponse {
  common.v1.OrganizationInfo organization = 1;
}

message UpdateOrganizationRequest {
  string organization_id = 1;
  optional string name = 2;
  optional string slug = 3;
  optional string logo_url = 4;
  reserved 5;
  reserved "is_active";
}

// Organization Overview Messages (Org Admin)

message GetOrganizationOverviewRequest {
  string organization_id = 1;
}

message GetOrganizationOverviewResponse {
  OrganizationOverview overview = 1;
}

message OrganizationOverview {
  common.v1.OrganizationInfo organization = 1;
  int32 member_count = 2;
  int32 group_count = 3;
  repeated ContentTypeCount content_counts = 4;
}

message ContentTypeCount {
  common.v1.ContentType content_type = 1;
  int32 count = 2;
}

// Member Management Messages (Org Admin)

message ListMembersRequest {
  string organization_id = 1;
  optional common.v1.PaginationRequest pagination = 2;
  optional common.v1.OrganizationRole role_filter = 3;
  optional string search = 4;
  optional bool include_inactive = 5;
}

message ListMembersResponse {
  repeated common.v1.MemberInfo members = 1;
  optional common.v1.PaginationResponse pagination = 2;
}

message AddMemberRequest {
  string organization_id = 1;
  string user_id = 2;
  common.v1.OrganizationRole role = 3;
}

message AddMemberResponse {
  common.v1.MemberInfo member = 1;
}

message UpdateMemberRoleRequest {
  string organization_id = 1;
  string user_id = 2;
  common.v1.OrganizationRole role = 3;
}

message UpdateMemberRoleResponse {
  common.v1.MemberInfo member = 1;
}

message RemoveMemberRequest {
  string organization_id = 1;
  string user_id = 2;
}

message RemoveMemberResponse {
  bool success = 1;
}

// Permission Defaults Messages (Org Admin)

message GetPermissionDefaultsRequest {
  string organization_id = 1;
}

message GetPermissionDefaultsResponse {
  repeated ContentTypeDefaults defaults = 1;
}

message UpdatePermissionDefaultsResponse {
  ContentTypeDefaults defaults = 1;
}

message UpdatePermissionDefaultsRequest {
  string organization_id = 1;
  common.v1.ContentType content_type = 2;
  optional common.v1.AccessMode default_access_mode = 3;
  optional common.v1.ContentRole default_baseline_role = 8;
}

message ContentTypeDefaults {
  common.v1.ContentType content_type = 1;
  common.v1.AccessMode default_access_mode = 2;
  google.protobuf.Timestamp updated_at = 7;
  optional common.v1.ContentRole default_baseline_role = 8;
}

// Organization Settings Messages (Org Admin)
//
// Domain Admin Messages (Org Admin)

message GrantDomainAdminRequest {
  string organization_id = 1;
  string user_id = 2;
  common.v1.DomainType domain = 3;
}

message GrantDomainAdminResponse {
  common.v1.DomainAdminInfo domain_admin = 1;
}

message RevokeDomainAdminRequest {
  string organization_id = 1;
  string user_id = 2;
  common.v1.DomainType domain = 3;
}

message RevokeDomainAdminResponse {
  bool success = 1;
}

message ListDomainAdminsRequest {
  string organization_id = 1;
  optional common.v1.DomainType domain_filter = 2;
  optional common.v1.PaginationRequest pagination = 3;
}

message ListDomainAdminsResponse {
  repeated common.v1.DomainAdminInfo domain_admins = 1;
  optional common.v1.PaginationResponse pagination = 2;
}

message GetUserDomainAdminsRequest {
  string organization_id = 1;
  string user_id = 2;
}

message GetUserDomainAdminsResponse {
  repeated common.v1.DomainType domains = 1;
}

// Encryption key rotation (Org Owner only)

message RotateEncryptionKeyRequest {
  string organization_id = 1;
}

message RotateEncryptionKeyResponse {
  // New active DEK version after the rotation.
  int32 new_version = 1;
  // Previous DEK version that was retired.
  int32 previous_version = 2;
  // When the rotation finished.
  google.protobuf.Timestamp rotated_at = 3;
}

// Invitation status surfaced to the admin UI. Computed from row state, not stored.
enum InvitationStatus {
  INVITATION_STATUS_UNSPECIFIED = 0;
  INVITATION_STATUS_PENDING = 1;
  INVITATION_STATUS_ACCEPTED = 2;
  INVITATION_STATUS_REVOKED = 3;
  INVITATION_STATUS_EXPIRED = 4;
}

message Invitation {
  string id = 1;
  string organization_id = 2;
  string email = 3;
  common.v1.OrganizationRole role = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp created_at = 6;
  optional google.protobuf.Timestamp accepted_at = 7;
  optional google.protobuf.Timestamp revoked_at = 8;
  optional string invited_by_user_id = 9;
  optional string invited_by_display_name = 10;
  InvitationStatus status = 11;
}

message InviteMemberRequest {
  string organization_id = 1;
  string email = 2;
  common.v1.OrganizationRole role = 3;
}

// Every email gets a pending invitation; an existing account accepts it signed in.
message InviteMemberResponse {
  reserved 1, 2;
  reserved "added_member";
  Invitation invitation = 3;
}

message ListInvitationsRequest {
  string organization_id = 1;
  optional InvitationStatus status = 2;
}

message ListInvitationsResponse {
  repeated Invitation invitations = 1;
}

message RevokeInvitationRequest {
  string invitation_id = 1;
}

message RevokeInvitationResponse {
  Invitation invitation = 1;
}

message ResendInvitationRequest {
  string invitation_id = 1;
}

message ResendInvitationResponse {
  Invitation invitation = 1;
}

message SecuritySettings {
  bool password_reset_enabled = 1;
  // When true, every member of this organization must have MFA
  // enabled to access org content (subject to the per-user grace).
  bool mfa_required_for_members = 2;
  // When true, OWNER / ADMIN role members must have MFA enabled.
  bool mfa_required_for_admins = 3;
}

message GetSecuritySettingsRequest {
  string organization_id = 1;
}

message GetSecuritySettingsResponse {
  SecuritySettings settings = 1;
}

// Partial update: only fields that are explicitly set in the request
// (proto3 ``optional`` semantics) are written. Omit a field to leave
// it untouched. Each field that changes emits its own audit row.
message UpdateSecuritySettingsRequest {
  string organization_id = 1;
  optional bool password_reset_enabled = 2;
  optional bool mfa_required_for_members = 3;
  optional bool mfa_required_for_admins = 4;
}

message UpdateSecuritySettingsResponse {
  SecuritySettings settings = 1;
}

enum OnboardingStep {
  ONBOARDING_STEP_UNSPECIFIED = 0;
  ONBOARDING_STEP_WELCOME = 1;
  ONBOARDING_STEP_MENTIONS = 2;
  ONBOARDING_STEP_SHARING = 3;
  ONBOARDING_STEP_APPEARANCE = 4;
  ONBOARDING_STEP_AGENTS = 5;
  ONBOARDING_STEP_TEAM = 6;
  ONBOARDING_STEP_LAUNCH = 7;
  ONBOARDING_STEP_MENTION_DISPLAY = 8;
}

message OnboardingState {
  // True while the caller still has the entry flow to go through here.
  bool pending = 1;
  // The step the caller last reached, so a reload resumes there.
  OnboardingStep current_step = 2;
}

message GetOnboardingRequest {
  string organization_id = 1;
}

message GetOnboardingResponse {
  OnboardingState state = 1;
}

message RecordOnboardingStepRequest {
  string organization_id = 1;
  OnboardingStep step = 2;
}

message RecordOnboardingStepResponse {
  OnboardingState state = 1;
}

message FinishOnboardingRequest {
  string organization_id = 1;
  // True when the owner skipped the rest of the flow instead of finishing it.
  bool dismissed = 2;
}

message FinishOnboardingResponse {
  OnboardingState state = 1;
}
