syntax = "proto3";

package cal.v1;

import "cal/v1/calendar.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/cal/v1;calv1";

// Connects members' Google and Microsoft calendars to Uniffy
service CalendarConnectionsService {
  // The caller's connected accounts with their calendars
  rpc ListCalendarConnections(ListCalendarConnectionsRequest) returns (ListCalendarConnectionsResponse) {}
  // Begin the provider sign-in; the client opens the returned address
  rpc StartCalendarConnection(StartCalendarConnectionRequest) returns (StartCalendarConnectionResponse) {}
  // Finish the sign-in with what the provider sent back to the callback page
  rpc CompleteCalendarConnection(CompleteCalendarConnectionRequest) returns (CompleteCalendarConnectionResponse) {}
  // Change which provider calendars sync and how
  rpc UpdateConnectedCalendar(UpdateConnectedCalendarRequest) returns (UpdateConnectedCalendarResponse) {}
  rpc PauseCalendarConnection(PauseCalendarConnectionRequest) returns (PauseCalendarConnectionResponse) {}
  rpc ResumeCalendarConnection(ResumeCalendarConnectionRequest) returns (ResumeCalendarConnectionResponse) {}
  // Stop syncing; both calendars keep their events
  rpc DisconnectCalendarConnection(DisconnectCalendarConnectionRequest) returns (DisconnectCalendarConnectionResponse) {}
  // Sync every enabled calendar of the account now
  rpc SyncCalendarConnectionNow(SyncCalendarConnectionNowRequest) returns (SyncCalendarConnectionNowResponse) {}
  // Org admins: the provider apps this organization uses
  rpc GetCalendarProviderSettings(GetCalendarProviderSettingsRequest) returns (GetCalendarProviderSettingsResponse) {}
  rpc UpdateCalendarProviderSettings(UpdateCalendarProviderSettingsRequest) returns (UpdateCalendarProviderSettingsResponse) {}
}

// Health of a connected account
enum CalendarConnectionStatus {
  CALENDAR_CONNECTION_STATUS_UNSPECIFIED = 0;
  CALENDAR_CONNECTION_STATUS_ACTIVE = 1;
  CALENDAR_CONNECTION_STATUS_PAUSED = 2;
  // The provider no longer accepts the sign-in; connect again
  CALENDAR_CONNECTION_STATUS_REAUTH_REQUIRED = 3;
  CALENDAR_CONNECTION_STATUS_DISCONNECTED = 4;
}

// What the account may do with a provider calendar
enum ProviderCalendarAccess {
  PROVIDER_CALENDAR_ACCESS_UNSPECIFIED = 0;
  PROVIDER_CALENDAR_ACCESS_OWNER = 1;
  PROVIDER_CALENDAR_ACCESS_WRITER = 2;
  PROVIDER_CALENDAR_ACCESS_READER = 3;
  PROVIDER_CALENDAR_ACCESS_FREE_BUSY = 4;
}

// Where a provider app's credentials come from
enum ProviderCredentialSource {
  PROVIDER_CREDENTIAL_SOURCE_UNSPECIFIED = 0;
  // Not configured; the provider is hidden
  PROVIDER_CREDENTIAL_SOURCE_NONE = 1;
  // Set by this organization's admins
  PROVIDER_CREDENTIAL_SOURCE_ORGANIZATION = 2;
  // The deployment's own app
  PROVIDER_CREDENTIAL_SOURCE_DEPLOYMENT = 3;
}

// One calendar of a connected account
message ProviderCalendar {
  string id = 1;
  string name = 2;
  // The provider's colour (hex), shown until a Uniffy calendar exists
  string provider_color = 3;
  ProviderCalendarAccess access = 4;
  bool is_primary = 5;
  // Generated by the provider, such as holidays
  bool is_system = 6;
  bool sync_enabled = 7;
  CalendarSyncDirection direction = 8;
  // Two-way is possible: the account may write and organization policy allows it
  bool can_write = 9;
  bool counts_as_busy = 10;
  // The Uniffy calendar it syncs into, once enabled
  optional string calendar_id = 11;
  ConnectedCalendarState state = 12;
  CalendarSyncError last_error = 13;
  optional google.protobuf.Timestamp last_success_at = 14;
  int32 event_count = 15;
  int32 skipped_count = 16;
}

// A member's linked Google or Microsoft account
message CalendarConnection {
  string id = 1;
  CalendarProvider provider = 2;
  string account_email = 3;
  CalendarConnectionStatus status = 4;
  repeated ProviderCalendar calendars = 5;
  optional google.protobuf.Timestamp last_synced_at = 6;
  google.protobuf.Timestamp created_at = 7;
}

// Whether members can connect a provider in this organization
message ProviderAvailability {
  CalendarProvider provider = 1;
  bool configured = 2;
  ProviderCredentialSource credential_source = 3;
  // Two-way sync is allowed by organization policy
  bool writes_enabled = 4;
}

message ListCalendarConnectionsRequest {
  string organization_id = 1;
}

message ListCalendarConnectionsResponse {
  repeated CalendarConnection connections = 1;
  repeated ProviderAvailability providers = 2;
  bool can_connect = 3;
}

message StartCalendarConnectionRequest {
  string organization_id = 1;
  CalendarProvider provider = 2;
  // Connect the same account again after the provider revoked access
  optional string reconnect_connection_id = 3;
  // An app path to return to afterwards, such as /calendar
  string return_path = 4;
}

message StartCalendarConnectionResponse {
  string authorize_url = 1;
}

message CompleteCalendarConnectionRequest {
  string organization_id = 1;
  string code = 2;
  string state = 3;
  // Set when the provider reported a refusal instead of a code
  string error = 4;
  string error_description = 5;
}

message CompleteCalendarConnectionResponse {
  CalendarConnection connection = 1;
  string return_path = 2;
}

message UpdateConnectedCalendarRequest {
  string organization_id = 1;
  string connected_calendar_id = 2;
  optional bool sync_enabled = 3;
  optional CalendarSyncDirection direction = 4;
  optional bool counts_as_busy = 5;
}

message UpdateConnectedCalendarResponse {
  CalendarConnection connection = 1;
}

message PauseCalendarConnectionRequest {
  string organization_id = 1;
  string connection_id = 2;
}

message PauseCalendarConnectionResponse {
  CalendarConnection connection = 1;
}

message ResumeCalendarConnectionRequest {
  string organization_id = 1;
  string connection_id = 2;
}

message ResumeCalendarConnectionResponse {
  CalendarConnection connection = 1;
}

message DisconnectCalendarConnectionRequest {
  string organization_id = 1;
  string connection_id = 2;
}

message DisconnectCalendarConnectionResponse {}

message SyncCalendarConnectionNowRequest {
  string organization_id = 1;
  string connection_id = 2;
}

message SyncCalendarConnectionNowResponse {
  CalendarConnection connection = 1;
}

// An organization's own provider app; the secret never leaves the server
message ProviderAppSettings {
  CalendarProvider provider = 1;
  ProviderCredentialSource source = 2;
  // Set only when the organization supplies its own app
  string client_id = 3;
  // The last characters of the stored secret, for recognition
  string client_secret_hint = 4;
  // Microsoft only: a tenant id restricts sign-in to one organization
  string tenant = 5;
  // The deployment has its own app this organization can fall back to
  bool deployment_configured = 6;
}

message GetCalendarProviderSettingsRequest {
  string organization_id = 1;
}

message GetCalendarProviderSettingsResponse {
  repeated ProviderAppSettings providers = 1;
  // Where the provider sends people back; register it with the app
  string redirect_uri = 2;
}

message UpdateCalendarProviderSettingsRequest {
  string organization_id = 1;
  CalendarProvider provider = 2;
  string client_id = 3;
  // Empty keeps the stored secret
  string client_secret = 4;
  string tenant = 5;
  // Remove this organization's app and fall back to the deployment's
  bool clear = 6;
}

message UpdateCalendarProviderSettingsResponse {
  repeated ProviderAppSettings providers = 1;
  string redirect_uri = 2;
}
