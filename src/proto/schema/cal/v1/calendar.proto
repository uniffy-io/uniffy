syntax = "proto3";

package cal.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "tags/v1/tags.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/cal/v1;calv1";

// Enums

// Recurrence patterns for repeating events
enum RecurrencePattern {
  RECURRENCE_PATTERN_UNSPECIFIED = 0;
  RECURRENCE_PATTERN_NONE = 1;
  RECURRENCE_PATTERN_DAILY = 2;
  RECURRENCE_PATTERN_WEEKLY = 3;
  RECURRENCE_PATTERN_BIWEEKLY = 4;
  RECURRENCE_PATTERN_MONTHLY = 5;
  RECURRENCE_PATTERN_YEARLY = 6;
}

// Days of the week
enum DayOfWeek {
  DAY_OF_WEEK_UNSPECIFIED = 0;
  DAY_OF_WEEK_MONDAY = 1;
  DAY_OF_WEEK_TUESDAY = 2;
  DAY_OF_WEEK_WEDNESDAY = 3;
  DAY_OF_WEEK_THURSDAY = 4;
  DAY_OF_WEEK_FRIDAY = 5;
  DAY_OF_WEEK_SATURDAY = 6;
  DAY_OF_WEEK_SUNDAY = 7;
}

// Attendee response status
enum AttendeeStatus {
  ATTENDEE_STATUS_UNSPECIFIED = 0;
  ATTENDEE_STATUS_PENDING = 1;
  ATTENDEE_STATUS_ACCEPTED = 2;
  ATTENDEE_STATUS_TENTATIVE = 3;
  ATTENDEE_STATUS_DECLINED = 4;
}

// What an entry in an event's activity log records
enum EventActivityAction {
  EVENT_ACTIVITY_ACTION_UNSPECIFIED = 0;
  EVENT_ACTIVITY_ACTION_CREATED = 1;
  EVENT_ACTIVITY_ACTION_TITLE_CHANGED = 2;
  EVENT_ACTIVITY_ACTION_SCHEDULE_CHANGED = 3;
  EVENT_ACTIVITY_ACTION_LOCATION_CHANGED = 4;
  EVENT_ACTIVITY_ACTION_MEETING_CHANGED = 5;
  EVENT_ACTIVITY_ACTION_DESCRIPTION_CHANGED = 6;
  EVENT_ACTIVITY_ACTION_CATEGORY_CHANGED = 7;
  EVENT_ACTIVITY_ACTION_CALENDAR_CHANGED = 8;
  EVENT_ACTIVITY_ACTION_RECURRENCE_CHANGED = 9;
  EVENT_ACTIVITY_ACTION_REMINDERS_CHANGED = 10;
  EVENT_ACTIVITY_ACTION_ATTENDEES_ADDED = 11;
  EVENT_ACTIVITY_ACTION_ATTENDEES_REMOVED = 12;
  EVENT_ACTIVITY_ACTION_RESPONSE_CHANGED = 13;
  EVENT_ACTIVITY_ACTION_FIELD_UPDATED = 14;
}

// Attendee role in the event
enum AttendeeRole {
  ATTENDEE_ROLE_UNSPECIFIED = 0;
  ATTENDEE_ROLE_ORGANIZER = 1;
  ATTENDEE_ROLE_REQUIRED = 2;
  ATTENDEE_ROLE_OPTIONAL = 3;
}

// Linked resource types
enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  RESOURCE_TYPE_NOTE = 1;
  RESOURCE_TYPE_FILE = 2;
  RESOURCE_TYPE_CHAT = 3;
}

// Scope for editing or deleting recurring events
enum RecurrenceEditScope {
  RECURRENCE_EDIT_SCOPE_UNSPECIFIED = 0;
  RECURRENCE_EDIT_SCOPE_THIS_EVENT = 1;
  RECURRENCE_EDIT_SCOPE_ALL_EVENTS = 2;
  RECURRENCE_EDIT_SCOPE_THIS_AND_FOLLOWING = 3;
}

// Lifecycle status of an event; cancelled events stay visible
enum EventStatus {
  EVENT_STATUS_UNSPECIFIED = 0;
  EVENT_STATUS_CONFIRMED = 1;
  EVENT_STATUS_TENTATIVE = 2;
  EVENT_STATUS_CANCELLED = 3;
}

// Detail visibility to viewers who are not the organizer or an attendee
enum EventVisibility {
  EVENT_VISIBILITY_UNSPECIFIED = 0;
  EVENT_VISIBILITY_STANDARD = 1;
  EVENT_VISIBILITY_PRIVATE = 2;
}

// Whether the event blocks the attendee's time in free/busy answers
enum EventTransparency {
  EVENT_TRANSPARENCY_UNSPECIFIED = 0;
  EVENT_TRANSPARENCY_OPAQUE = 1;
  EVENT_TRANSPARENCY_TRANSPARENT = 2;
}

// Kind of calendar; a team calendar belongs to the people it is shared with
enum CalendarType {
  CALENDAR_TYPE_UNSPECIFIED = 0;
  CALENDAR_TYPE_PERSONAL = 1;
  CALENDAR_TYPE_WORK = 2;
  CALENDAR_TYPE_TEAM = 3;
  CALENDAR_TYPE_SHARED = 4;
}

// Where a calendar sits in the caller's calendar list
enum CalendarListSection {
  CALENDAR_LIST_SECTION_UNSPECIFIED = 0;
  // Calendars the caller owns
  CALENDAR_LIST_SECTION_MINE = 1;
  // Calendars shared with the caller directly or through a group
  CALENDAR_LIST_SECTION_SHARED = 2;
  // Calendars the caller reaches only because they are open to the organization
  CALENDAR_LIST_SECTION_ORGANIZATION = 3;
}

// What happens to a deleted calendar's events
enum CalendarEventDisposition {
  CALENDAR_EVENT_DISPOSITION_UNSPECIFIED = 0;
  // Move every event to another calendar
  CALENDAR_EVENT_DISPOSITION_MOVE = 1;
  // Delete every event, notifying attendees as a normal delete would
  CALENDAR_EVENT_DISPOSITION_DELETE = 2;
}

// Service Definition

// CalendarService provides calendar and event management functionality
service CalendarService {
  // === Calendar Operations ===

  // List the calendars the caller can see, with their per-member visibility
  rpc ListCalendars(ListCalendarsRequest) returns (ListCalendarsResponse) {}

  // Get a calendar by ID
  rpc GetCalendar(GetCalendarRequest) returns (GetCalendarResponse) {}

  // Create a calendar; sharing afterwards goes through permissions.v1.MembersService
  rpc CreateCalendar(CreateCalendarRequest) returns (CreateCalendarResponse) {}

  // Rename, recolour, or describe a calendar
  rpc UpdateCalendar(UpdateCalendarRequest) returns (UpdateCalendarResponse) {}

  // Delete a calendar, moving or deleting its events
  rpc DeleteCalendar(DeleteCalendarRequest) returns (DeleteCalendarResponse) {}

  // Show or hide a calendar for the caller only
  rpc SetCalendarVisibility(SetCalendarVisibilityRequest) returns (SetCalendarVisibilityResponse) {}

  // Read the organization's calendar policy and what it allows the caller
  rpc GetCalendarPolicy(GetCalendarPolicyRequest) returns (GetCalendarPolicyResponse) {}

  // Change the organization's calendar policy; org admins only
  rpc UpdateCalendarPolicy(UpdateCalendarPolicyRequest) returns (UpdateCalendarPolicyResponse) {}

  // === Event Operations ===

  // Create a new calendar event
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse) {}

  // Get an event by ID
  rpc GetEvent(GetEventRequest) returns (GetEventResponse) {}

  // Update an existing event
  rpc UpdateEvent(UpdateEventRequest) returns (UpdateEventResponse) {}

  // Delete an event (soft delete)
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse) {}

  // List events with filters (date range, calendar, category, etc.)
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {}

  // Get events for a specific date range (optimized for calendar views)
  rpc GetEventsInRange(GetEventsInRangeRequest) returns (GetEventsInRangeResponse) {}

  // === Interop Operations ===

  // Export one event, with its whole series, as an iCalendar document
  rpc ExportEvent(ExportEventRequest) returns (ExportEventResponse) {}

  // Export every accessible event on a calendar as an iCalendar document
  rpc ExportCalendar(ExportCalendarRequest) returns (ExportCalendarResponse) {}

  // Read an iCalendar document and report what importing it would do
  rpc PreviewCalendarImport(PreviewCalendarImportRequest) returns (PreviewCalendarImportResponse) {}

  // Import an iCalendar document into a calendar
  rpc ApplyCalendarImport(ApplyCalendarImportRequest) returns (ApplyCalendarImportResponse) {}

  // Read the caller's own subscribe URL for a calendar, if one has been minted
  rpc GetCalendarFeedUrl(GetCalendarFeedUrlRequest) returns (GetCalendarFeedUrlResponse) {}

  // Mint a subscribe URL, retiring any the caller already holds for this calendar
  rpc RegenerateCalendarFeed(RegenerateCalendarFeedRequest) returns (RegenerateCalendarFeedResponse) {}

  // Stop the caller's subscribe URL for a calendar
  rpc RevokeCalendarFeed(RevokeCalendarFeedRequest) returns (RevokeCalendarFeedResponse) {}

  // === Category Operations ===

  // Create a new category
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse) {}

  // Get a category by ID
  rpc GetCategory(GetCategoryRequest) returns (GetCategoryResponse) {}

  // Update a category
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse) {}

  // Delete a category
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse) {}

  // List categories
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse) {}

  // === Attendee Operations ===

  // Update attendee response status
  rpc UpdateAttendeeStatus(UpdateAttendeeStatusRequest) returns (UpdateAttendeeStatusResponse) {}

  // Add attendees to an event
  rpc AddAttendees(AddAttendeesRequest) returns (AddAttendeesResponse) {}

  // Change an existing attendee between required and optional
  rpc UpdateAttendeeRole(UpdateAttendeeRoleRequest) returns (UpdateAttendeeRoleResponse) {}

  // Remove attendees from an event
  rpc RemoveAttendees(RemoveAttendeesRequest) returns (RemoveAttendeesResponse) {}

  // === Scheduling Operations ===

  // Per-user busy intervals for the availability grid. Returns only
  // (start, end, out_of_office) spans - never titles or details.
  rpc GetFreeBusy(GetFreeBusyRequest) returns (GetFreeBusyResponse) {}

  // Meeting-time suggestions honoring every required attendee's working
  // hours and timezone, ranked by optional-attendee availability.
  rpc SuggestMeetingTimes(SuggestMeetingTimesRequest) returns (SuggestMeetingTimesResponse) {}

  // === Activity Operations ===

  // List the activity log for an event, newest first
  rpc ListEventActivities(ListEventActivitiesRequest) returns (ListEventActivitiesResponse) {}

  // === Template Operations ===

  // Create a new event template
  rpc CreateEventTemplate(CreateEventTemplateRequest) returns (CreateEventTemplateResponse) {}

  // Get an event template by ID
  rpc GetEventTemplate(GetEventTemplateRequest) returns (GetEventTemplateResponse) {}

  // Update an existing event template
  rpc UpdateEventTemplate(UpdateEventTemplateRequest) returns (UpdateEventTemplateResponse) {}

  // Delete an event template
  rpc DeleteEventTemplate(DeleteEventTemplateRequest) returns (DeleteEventTemplateResponse) {}

  // List event templates
  rpc ListEventTemplates(ListEventTemplatesRequest) returns (ListEventTemplatesResponse) {}
}

// Event Messages

// Calendar event
message CalendarEvent {
  // Unique event identifier
  string id = 1;
  // Organization ID (multi-tenancy)
  string organization_id = 2;
  // Event title
  string title = 3;
  // Event description (markdown with URN mentions)
  string description = 4;
  // Start time
  google.protobuf.Timestamp start_time = 5;
  // End time
  google.protobuf.Timestamp end_time = 6;
  // Whether this is an all-day event
  bool is_all_day = 7;
  // Timezone identifier (e.g., 'America/New_York')
  string timezone = 8;
  // Event location (physical or virtual)
  string location = 9;
  // Meeting URL (Zoom, Google Meet, etc.)
  optional string meeting_url = 10;
  // Calendar ID this event belongs to
  string calendar_id = 11;
  // Category ID for color coding
  string category_id = 12;
  // List of attendees
  repeated Attendee attendees = 13;
  // User ID of the event creator/organizer
  string organizer_id = 14;
  // Recurrence configuration
  optional RecurrenceConfig recurrence = 15;
  // Whether this event is marked as focus/deep work time
  bool is_focus_time = 16;
  // Linked resources (notes, files, chats)
  repeated LinkedResource linked_resources = 17;
  // Is deleted flag (soft delete)
  bool is_deleted = 19;
  // URNs referenced in this event's description (outgoing links)
  repeated string outgoing_references = 20;
  // Created timestamp
  google.protobuf.Timestamp created_at = 21;
  // Updated timestamp
  google.protobuf.Timestamp updated_at = 22;
  // Deleted timestamp (if soft-deleted)
  optional google.protobuf.Timestamp deleted_at = 23;
  // Reminder intervals in minutes before event (e.g., 15, 30, 60, 1440)
  repeated int32 reminders = 24;
  // Whether this is a recurring event (has recurrence pattern other than NONE)
  bool is_recurring = 25;
  // If this is an override of a recurring occurrence, the master event ID
  optional string recurrence_id = 26;
  // For expanded instances: the specific occurrence date (YYYY-MM-DD)
  optional string occurrence_date = 27;
  // Room booking fields (read-only, populated by handler)
  optional string room_id = 28;
  optional string room_name = 29;
  optional string room_location = 30;
  optional int32 room_capacity = 31;
  repeated string room_amenities = 32;
  // Hydrated tags applied to this event (server-side from TagOperations).
  repeated tags.v1.Tag tags = 34;
  // Bound chat channel for a Uniffy online meeting. When set, this event is a
  // Uniffy meeting and join resolves to this channel's call. Mutually exclusive
  // with meeting_url.
  optional string channel_id = 35;
  // True when channel_id points at a room auto-created for this event.
  bool channel_auto_created = 36;
  // Caller's effective role on this event, so the client can render read-only
  // affordances instead of controls every write would reject.
  common.v1.ContentRole user_role = 37;
  // Lifecycle status; cancelled events render struck through and stop blocking time
  EventStatus status = 38;
  // Detail visibility; PRIVATE events are redacted for non-privileged viewers
  EventVisibility visibility = 39;
  // Free/busy transparency; TRANSPARENT events never count as busy
  EventTransparency transparency = 40;
  // Out-of-office period, rendered distinctly on every surface
  bool is_out_of_office = 41;
  // True when the server redacted this payload for the caller (private event,
  // caller is not organizer/attendee/editor): title, description, location,
  // meeting, channel, category, and attendees are stripped.
  bool details_hidden = 42;
}

// Event attendee
message Attendee {
  // User ID
  string id = 1;
  // Display name
  string name = 2;
  // Email address
  string email = 3;
  // Avatar URL
  optional string avatar_url = 4;
  // Initials for avatar fallback
  string initials = 5;
  // Response status
  AttendeeStatus status = 6;
  // Role in the event
  AttendeeRole role = 7;
  // Timezone
  optional string timezone = 8;
  // Group that produced this attendee row at invite time (snapshot; empty for direct invites)
  optional string invited_via_group_id = 9;
}

// Recurrence configuration
message RecurrenceConfig {
  // The recurrence pattern
  RecurrencePattern pattern = 1;
  // Interval between recurrences (e.g., every 2 weeks)
  int32 interval = 2;
  // Days of the week for weekly recurrence
  repeated DayOfWeek days_of_week = 3;
  // Day of the month for monthly recurrence
  optional int32 day_of_month = 4;
  // End date for recurrence
  optional google.protobuf.Timestamp end_date = 5;
  // Maximum number of occurrences
  optional int32 max_occurrences = 6;
}

// Linked resource (note, file, or chat)
message LinkedResource {
  // Resource ID (URN)
  string id = 1;
  // Resource type
  ResourceType type = 2;
  // Display name
  string name = 3;
  // URL for navigation
  optional string url = 4;
}

// Request to create an event
message CreateEventRequest {
  // Organization ID
  string organization_id = 1;
  // Event title
  string title = 2;
  // Event description (optional)
  optional string description = 3;
  // Start time
  google.protobuf.Timestamp start_time = 4;
  // End time
  google.protobuf.Timestamp end_time = 5;
  // Whether this is an all-day event
  bool is_all_day = 6;
  // Timezone identifier
  optional string timezone = 7;
  // Event location
  optional string location = 8;
  // Meeting URL
  optional string meeting_url = 9;
  // Calendar ID
  string calendar_id = 10;
  // Category ID
  optional string category_id = 11;
  // Attendee user IDs
  repeated string attendee_ids = 12;
  // Recurrence configuration
  optional RecurrenceConfig recurrence = 13;
  // Whether this event is focus time
  bool is_focus_time = 14;
  // Linked resource URNs
  repeated string linked_resource_urns = 15;
  // Reminder intervals in minutes before event (e.g., 15, 30, 60, 1440)
  repeated int32 reminders = 17;
  // Optional room ID to book alongside the event
  optional string room_id = 18;
  // Optional unified-tag ids to assign on create
  repeated string tag_ids = 20;
  // Optional channel to bind as a Uniffy online meeting. Mutually exclusive
  // with meeting_url.
  optional string channel_id = 21;
  // Set when channel_id points at a room auto-created for this event.
  optional bool channel_auto_created = 22;
  // Lifecycle status (UNSPECIFIED defaults to CONFIRMED)
  EventStatus status = 23;
  // Detail visibility (UNSPECIFIED defaults to STANDARD)
  EventVisibility visibility = 24;
  // Free/busy transparency (UNSPECIFIED lets the server default: all-day
  // non-out-of-office events are TRANSPARENT, everything else OPAQUE)
  EventTransparency transparency = 25;
  // Marks the event as an out-of-office period
  bool is_out_of_office = 26;
  // Attendees with explicit roles; merged with attendee_ids (which imply REQUIRED)
  repeated AttendeeInput attendees = 27;
  // Create the event with no reminders at all. Otherwise an empty `reminders`
  // list falls back to the member's default intervals.
  bool no_reminders = 28;
}

// An attendee to invite, with the role to invite them under
message AttendeeInput {
  string user_id = 1;
  AttendeeRole role = 2;
}

// Request to get an event
message GetEventRequest {
  // Event ID
  string event_id = 1;
  // Organization ID
  string organization_id = 2;
}

// Request to update an event
message UpdateEventRequest {
  // Event ID
  string event_id = 1;
  // Organization ID
  string organization_id = 2;
  // Updated title
  optional string title = 3;
  // Updated description
  optional string description = 4;
  // Updated start time
  optional google.protobuf.Timestamp start_time = 5;
  // Updated end time
  optional google.protobuf.Timestamp end_time = 6;
  // Updated all-day flag
  optional bool is_all_day = 7;
  // Updated timezone
  optional string timezone = 8;
  // Updated location
  optional string location = 9;
  // Updated meeting URL
  optional string meeting_url = 10;
  // Updated calendar ID
  optional string calendar_id = 11;
  // Updated category ID
  optional string category_id = 12;
  // Updated recurrence
  optional RecurrenceConfig recurrence = 13;
  // Updated focus time flag
  optional bool is_focus_time = 14;
  // Updated linked resource URNs (replaces existing)
  repeated string linked_resource_urns = 15;
  // Updated attendee IDs (replaces existing list)
  repeated string attendee_ids = 17;
  // Updated reminder intervals in minutes before event
  repeated int32 reminders = 18;
  // Edit scope for recurring events
  optional RecurrenceEditScope recurrence_edit_scope = 19;
  // For THIS_EVENT scope: the specific occurrence date being edited (YYYY-MM-DD)
  optional string occurrence_date = 20;
  // Optional room ID to book/change for this event
  optional string room_id = 21;
  // Replacement set of unified-tag ids. Empty list clears all manual tags.
  // Field is unset (HasField=false) to leave manual tags untouched.
  optional EventTagIds tag_ids = 23;
  // Channel binding. Empty string (HasField true) clears the binding; unset
  // leaves it untouched. Mirrors room_id set/clear handling.
  optional string channel_id = 24;
  // Marks the bound channel as a room auto-created for this event. Sent
  // alongside a new channel_id; unset leaves the flag untouched.
  optional bool channel_auto_created = 25;
  // Updated lifecycle status; unset leaves it untouched
  optional EventStatus status = 26;
  // Updated detail visibility; unset leaves it untouched
  optional EventVisibility visibility = 27;
  // Updated free/busy transparency; unset leaves it untouched
  optional EventTransparency transparency = 28;
  // Updated out-of-office flag; unset leaves it untouched
  optional bool is_out_of_office = 29;
  // Remove every reminder. Otherwise an empty `reminders` list leaves them
  // untouched, since proto3 cannot tell an empty repeated apart from an unset one.
  bool clear_reminders = 30;
}

// Wrapper so the caller can distinguish "leave tags alone" from
// "clear all tags" (proto3 cannot tell an empty repeated apart from
// an unset one). Mirrors NoteTagIds / FileTagIds.
message EventTagIds {
  repeated string ids = 1;
}

// Request to delete an event
message DeleteEventRequest {
  // Event ID
  string event_id = 1;
  // Organization ID
  string organization_id = 2;
  // Permanent delete flag (default: false for soft delete)
  bool permanent = 3;
  // Edit scope for recurring events
  optional RecurrenceEditScope recurrence_edit_scope = 4;
  // For THIS_EVENT scope: the specific occurrence date being deleted (YYYY-MM-DD)
  optional string occurrence_date = 5;
}

// Response for delete event operation
message DeleteEventResponse {
  bool success = 1;
  string message = 2;
}

// Response containing an event (Create)
message CreateEventResponse {
  CalendarEvent event = 1;
}

// Response containing an event (Get)
message GetEventResponse {
  CalendarEvent event = 1;
}

// Response containing an event (Update)
message UpdateEventResponse {
  CalendarEvent event = 1;
}

// Response containing an event (AddAttendees)
message AddAttendeesResponse {
  CalendarEvent event = 1;
}

// Request to change an attendee's role (REQUIRED <-> OPTIONAL only)
message UpdateAttendeeRoleRequest {
  // Event ID
  string event_id = 1;
  // Organization ID
  string organization_id = 2;
  // The attendee to change
  string user_id = 3;
  // The new role; ORGANIZER is not assignable
  AttendeeRole role = 4;
}

// Response containing the event (UpdateAttendeeRole)
message UpdateAttendeeRoleResponse {
  CalendarEvent event = 1;
}

// Response containing an event (RemoveAttendees)
message RemoveAttendeesResponse {
  CalendarEvent event = 1;
}

// Request to list events
message ListEventsRequest {
  // Organization ID
  string organization_id = 1;
  // Optional calendar ID filter
  optional string calendar_id = 2;
  // Optional category ID filter
  optional string category_id = 3;
  // Optional start date filter
  optional google.protobuf.Timestamp start_date = 4;
  // Optional end date filter
  optional google.protobuf.Timestamp end_date = 5;
  // Include deleted events
  bool include_deleted = 6;
  // Pagination: page number (1-indexed)
  int32 page = 7;
  // Pagination: page size (default: 50, max: 100)
  int32 page_size = 8;
  // Sort by field (start_time, created_at, title)
  string sort_by = 9;
  // Sort order (asc, desc)
  string sort_order = 10;
  // Filter events that have ALL of the provided tag ids (logical AND).
  repeated string tag_ids = 11;
  // Opaque cursor from a previous response. Supplying it pages by cursor and
  // ignores `page`; it requires the default start_time sort.
  optional string page_token = 12;
}

// Response for listing events
message ListEventsResponse {
  repeated CalendarEvent events = 1;
  // Only meaningful when paging by `page`; cursor paging leaves it at zero
  // rather than counting the whole result set on every request.
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
  int32 total_pages = 5;
  // Cursor for the next page, empty when this is the last one.
  string next_page_token = 6;
}

// Request to get events in a date range (optimized for calendar views)
message GetEventsInRangeRequest {
  // Organization ID
  string organization_id = 1;
  // Start of range
  google.protobuf.Timestamp start_date = 2;
  // End of range
  google.protobuf.Timestamp end_date = 3;
  // Optional calendar IDs to filter by (empty = all visible calendars)
  repeated string calendar_ids = 4;
  // Optional category IDs to filter by
  repeated string category_ids = 5;
  // Optional chat channel filter: only events bound to this channel as an
  // online meeting. Used by the channel next-meeting strip.
  optional string channel_id = 6;
}

// Response for events in range
message GetEventsInRangeResponse {
  repeated CalendarEvent events = 1;
}

// Calendar Messages

// A calendar as the caller sees it
message Calendar {
  string id = 1;
  string organization_id = 2;
  string owner_id = 3;
  string name = 4;
  string description = 5;
  // Colour (hex)
  string color = 6;
  CalendarType calendar_type = 7;
  // The owner's default calendar; never deletable
  bool is_default = 8;
  common.v1.AccessMode access_mode = 9;
  optional common.v1.ContentRole baseline_role = 10;
  // The caller's effective role on the calendar
  common.v1.ContentRole user_role = 11;
  // Hidden for the caller only; events stay where they are
  bool is_hidden = 12;
  CalendarListSection section = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  // The owner's display name; every default calendar is named alike, so
  // clients label a colleague's default by whose it is
  string owner_name = 16;
}

message ListCalendarsRequest {
  string organization_id = 1;
}

message ListCalendarsResponse {
  repeated Calendar calendars = 1;
}

message GetCalendarRequest {
  string calendar_id = 1;
  string organization_id = 2;
}

message GetCalendarResponse {
  Calendar calendar = 1;
}

message CreateCalendarRequest {
  string organization_id = 1;
  string name = 2;
  optional string description = 3;
  // Colour (hex)
  string color = 4;
  CalendarType calendar_type = 5;
  // Omitted means private to the creator
  optional common.v1.AccessMode access_mode = 6;
  optional common.v1.ContentRole baseline_role = 7;
  // Granted ADMIN at creation, so a team calendar does not depend on one person
  repeated string admin_user_ids = 8;
  repeated string admin_group_ids = 9;
}

message CreateCalendarResponse {
  Calendar calendar = 1;
}

message UpdateCalendarRequest {
  string calendar_id = 1;
  string organization_id = 2;
  optional string name = 3;
  optional string description = 4;
  optional string color = 5;
}

message UpdateCalendarResponse {
  Calendar calendar = 1;
}

message DeleteCalendarRequest {
  string calendar_id = 1;
  string organization_id = 2;
  CalendarEventDisposition disposition = 3;
  // Required with CALENDAR_EVENT_DISPOSITION_MOVE
  optional string target_calendar_id = 4;
}

message DeleteCalendarResponse {
  int32 events_moved = 1;
  int32 events_deleted = 2;
}

message SetCalendarVisibilityRequest {
  string calendar_id = 1;
  string organization_id = 2;
  bool hidden = 3;
}

message SetCalendarVisibilityResponse {
  Calendar calendar = 1;
}

// Who a calendar policy capability is open to
enum CalendarPolicyAudience {
  CALENDAR_POLICY_AUDIENCE_UNSPECIFIED = 0;
  // Every member of the organization
  CALENDAR_POLICY_AUDIENCE_EVERYONE = 1;
  // Org admins and calendar domain admins
  CALENDAR_POLICY_AUDIENCE_ADMINS = 2;
}

message CalendarPolicy {
  string organization_id = 1;
  // Who may create team calendars
  CalendarPolicyAudience team_calendar_creators = 2;
  // Who may open a calendar to the whole organization
  CalendarPolicyAudience org_wide_calendar_sharers = 3;
}

message GetCalendarPolicyRequest {
  string organization_id = 1;
}

message GetCalendarPolicyResponse {
  CalendarPolicy policy = 1;
  bool can_create_team_calendars = 2;
  bool can_share_calendars_org_wide = 3;
}

message UpdateCalendarPolicyRequest {
  string organization_id = 1;
  CalendarPolicyAudience team_calendar_creators = 2;
  CalendarPolicyAudience org_wide_calendar_sharers = 3;
}

message UpdateCalendarPolicyResponse {
  CalendarPolicy policy = 1;
  bool can_create_team_calendars = 2;
  bool can_share_calendars_org_wide = 3;
}

// Category Messages

// Event category for color coding and filtering
message Category {
  // Unique category identifier
  string id = 1;
  // Organization ID
  string organization_id = 2;
  // Category display name
  string name = 3;
  // Category color (hex)
  string color = 4;
  // Optional icon or emoji
  optional string icon = 5;
  // Whether this is a default/system category
  bool is_default = 6;
  // Display order
  int32 sort_order = 7;
  // Created timestamp
  google.protobuf.Timestamp created_at = 8;
  // Updated timestamp
  google.protobuf.Timestamp updated_at = 9;
}

// Request to create a category
message CreateCategoryRequest {
  // Organization ID
  string organization_id = 1;
  // Category name
  string name = 2;
  // Color (hex)
  string color = 3;
  // Icon or emoji
  optional string icon = 4;
}

// Request to get a category
message GetCategoryRequest {
  // Category ID
  string category_id = 1;
  // Organization ID
  string organization_id = 2;
}

// Request to update a category
message UpdateCategoryRequest {
  // Category ID
  string category_id = 1;
  // Organization ID
  string organization_id = 2;
  // Updated name
  optional string name = 3;
  // Updated color
  optional string color = 4;
  // Updated icon
  optional string icon = 5;
  // Updated sort order
  optional int32 sort_order = 6;
}

// Request to delete a category
message DeleteCategoryRequest {
  // Category ID
  string category_id = 1;
  // Organization ID
  string organization_id = 2;
}

// Response for delete category operation
message DeleteCategoryResponse {
  bool success = 1;
  string message = 2;
}

// Response containing a category (Create)
message CreateCategoryResponse {
  Category category = 1;
}

// Response containing a category (Get)
message GetCategoryResponse {
  Category category = 1;
}

// Response containing a category (Update)
message UpdateCategoryResponse {
  Category category = 1;
}

// Request to list categories
message ListCategoriesRequest {
  // Organization ID
  string organization_id = 1;
}

// Response for listing categories
message ListCategoriesResponse {
  repeated Category categories = 1;
}

// Attendee Messages

// Request to update attendee status
message UpdateAttendeeStatusRequest {
  // Event ID
  string event_id = 1;
  // Organization ID
  string organization_id = 2;
  // New status
  AttendeeStatus status = 3;
}

// Response for update attendee status
message UpdateAttendeeStatusResponse {
  bool success = 1;
  string message = 2;
}

// Request to add attendees
message AddAttendeesRequest {
  // Event ID
  string event_id = 1;
  // Organization ID
  string organization_id = 2;
  // User IDs to add
  repeated string user_ids = 3;
  // Role for new attendees
  AttendeeRole role = 4;
}

// Request to remove attendees
message RemoveAttendeesRequest {
  // Event ID
  string event_id = 1;
  // Organization ID
  string organization_id = 2;
  // User IDs to remove
  repeated string user_ids = 3;
}

// Activity Messages

// One entry in an event's activity log
message EventActivity {
  // Unique activity identifier
  string id = 1;
  // Event the entry belongs to
  string event_id = 2;
  // User who performed the action
  string actor_id = 3;
  // What happened
  EventActivityAction action = 4;
  // When it happened
  google.protobuf.Timestamp timestamp = 5;
  // Field the change applies to, when the action is field-scoped
  optional string field_id = 6;
  // Value before the change
  optional string previous_value = 7;
  // Value after the change
  optional string new_value = 8;
}

// Request to list an event's activity log
message ListEventActivitiesRequest {
  // Organization ID
  string organization_id = 1;
  // Event ID (an occurrence id resolves to its series master)
  string event_id = 2;
  // Optional pagination
  optional common.v1.PaginationRequest pagination = 3;
}

// Response with the event's activity log, newest first
message ListEventActivitiesResponse {
  // Activity entries
  repeated EventActivity activities = 1;
  // Pagination info
  common.v1.PaginationResponse pagination = 2;
}

// Template Messages

// Event template
message EventTemplate {
  // Unique template identifier
  string id = 1;
  // Organization ID
  string organization_id = 2;
  // Template title
  string title = 3;
  // Template description
  string description = 4;
  // Default duration in minutes
  int32 duration_minutes = 5;
  // Location
  string location = 6;
  // Meeting URL
  string meeting_url = 7;
  // Category ID
  string category_id = 8;
  // Tags
  repeated string tags = 9;
  // Access mode
  common.v1.AccessMode access_mode = 10;
  // Creator ID
  string created_by = 11;
  // Created timestamp
  google.protobuf.Timestamp created_at = 12;
  // Updated timestamp
  google.protobuf.Timestamp updated_at = 13;
  // Baseline role granted by access mode (when applicable)
  optional common.v1.ContentRole baseline_role = 14;
}

message CreateEventTemplateRequest {
  string organization_id = 1;
  string title = 2;
  string description = 3;
  int32 duration_minutes = 4;
  string location = 5;
  string meeting_url = 6;
  string category_id = 7;
  repeated string tags = 8;
  common.v1.AccessMode access_mode = 9;
  optional common.v1.ContentRole baseline_role = 10;
}

message GetEventTemplateRequest {
  string template_id = 1;
  string organization_id = 2;
}

message UpdateEventTemplateRequest {
  string template_id = 1;
  string organization_id = 2;
  optional string title = 3;
  optional string description = 4;
  optional int32 duration_minutes = 5;
  optional string location = 6;
  optional string meeting_url = 7;
  optional string category_id = 8;
  repeated string tags = 9;
  optional common.v1.AccessMode access_mode = 10;
  optional common.v1.ContentRole baseline_role = 11;
}

message DeleteEventTemplateRequest {
  string template_id = 1;
  string organization_id = 2;
}

message DeleteEventTemplateResponse {
  bool success = 1;
  string message = 2;
}

message CreateEventTemplateResponse {
  EventTemplate template = 1;
}

message GetEventTemplateResponse {
  EventTemplate template = 1;
}

message UpdateEventTemplateResponse {
  EventTemplate template = 1;
}

message ListEventTemplatesRequest {
  string organization_id = 1;
}

message ListEventTemplatesResponse {
  repeated EventTemplate templates = 1;
}

// Scheduling Messages

// A blocked span in someone's calendar; no details beyond the kind
message BusyInterval {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
  // The span comes from an out-of-office event
  bool is_out_of_office = 3;
}

// One user's availability facts for the grid
message UserFreeBusy {
  string user_id = 1;
  repeated BusyInterval intervals = 2;
  // IANA zone the working hours below are expressed in
  string timezone = 3;
  // Workday bounds on that user's own clock (24h HH:MM)
  string workday_start = 4;
  string workday_end = 5;
  // Lowercase day names ("monday".."sunday")
  repeated string workdays = 6;
}

message GetFreeBusyRequest {
  string organization_id = 1;
  // At most 20 users per query
  repeated string user_ids = 2;
  google.protobuf.Timestamp window_start = 3;
  google.protobuf.Timestamp window_end = 4;
  // Include this room's booked spans in the response
  optional string room_id = 5;
}

message GetFreeBusyResponse {
  repeated UserFreeBusy users = 1;
  // Booked spans for the requested room, empty when no room_id was sent
  repeated BusyInterval room_busy = 2;
}

message SuggestMeetingTimesRequest {
  string organization_id = 1;
  repeated string required_user_ids = 2;
  repeated string optional_user_ids = 3;
  google.protobuf.Timestamp window_start = 4;
  google.protobuf.Timestamp window_end = 5;
  // Meeting length in minutes (5-480)
  int32 duration_minutes = 6;
  // A suggestion never overlaps this room's confirmed bookings
  optional string room_id = 7;
  // 1-10, default 5
  int32 max_results = 8;
}

message MeetingTimeSuggestion {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
  // Optional attendees who cannot make this slot (busy or outside their hours)
  repeated string unavailable_optional_user_ids = 3;
}

message SuggestMeetingTimesResponse {
  repeated MeetingTimeSuggestion suggestions = 1;
}

// Request to export a single event
message ExportEventRequest {
  // Event ID; an occurrence id exports the series it belongs to
  string event_id = 1;
  // Organization ID
  string organization_id = 2;
}

// An iCalendar document ready to be written to a file
message ExportEventResponse {
  // The iCalendar document itself
  bytes content = 1;
  // Suggested filename, extension included
  string filename = 2;
}

// Request to export a whole calendar
message ExportCalendarRequest {
  // Organization ID
  string organization_id = 1;
  // Calendar ID
  string calendar_id = 2;
  // Only events ending at or after this instant; omit for the whole calendar
  optional google.protobuf.Timestamp start_time = 3;
  // Only events starting at or before this instant
  optional google.protobuf.Timestamp end_time = 4;
}

// An iCalendar document ready to be written to a file
message ExportCalendarResponse {
  // The iCalendar document itself
  bytes content = 1;
  // Suggested filename, extension included
  string filename = 2;
  // How many events the document carries
  int32 event_count = 3;
}

// An entry the file describes that is not already on the calendar
message ImportedEventPreview {
  string title = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  bool is_all_day = 4;
  // Whether the entry repeats
  bool repeats = 5;
}

// An entry that could not be imported, and why
message SkippedImportEntry {
  // The entry's own title, or a placeholder when it states none
  string label = 1;
  // Human-readable explanation, safe to show the importer
  string reason = 2;
}

// Request to read a file without importing it
message PreviewCalendarImportRequest {
  // Organization ID
  string organization_id = 1;
  // Calendar the entries would be created on
  string calendar_id = 2;
  // The iCalendar document
  bytes content = 3;
}

// What importing the supplied document would do
message PreviewCalendarImportResponse {
  // Entries that would be created
  repeated ImportedEventPreview creatable = 1;
  // Entries already on this calendar, which a second import would not duplicate
  int32 duplicate_count = 2;
  // Entries that cannot be imported, each with its reason
  repeated SkippedImportEntry skipped = 3;
}

// Request to import a file
message ApplyCalendarImportRequest {
  // Organization ID
  string organization_id = 1;
  // Calendar to create the entries on
  string calendar_id = 2;
  // The iCalendar document
  bytes content = 3;
}

// The result of an import
message ApplyCalendarImportResponse {
  // How many events were created
  int32 created_count = 1;
  // How many entries were already present and therefore left alone
  int32 duplicate_count = 2;
  // Entries that could not be imported, each with its reason
  repeated SkippedImportEntry skipped = 3;
}

// Request for the caller's own subscribe URL
message GetCalendarFeedUrlRequest {
  // Organization ID
  string organization_id = 1;
  // Calendar the feed reads from
  string calendar_id = 2;
}

// A subscribe URL, or nothing when none has been minted
message GetCalendarFeedUrlResponse {
  // The URL a calendar client subscribes to; empty when no feed exists
  string url = 1;
  // When the current URL was minted
  optional google.protobuf.Timestamp created_at = 2;
  // Last time a client fetched it, absent when it never has
  optional google.protobuf.Timestamp last_used_at = 3;
}

// Request to mint a fresh subscribe URL
message RegenerateCalendarFeedRequest {
  // Organization ID
  string organization_id = 1;
  // Calendar the feed reads from
  string calendar_id = 2;
}

// The newly minted URL; every URL previously issued for this calendar stops working
message RegenerateCalendarFeedResponse {
  // The URL a calendar client subscribes to
  string url = 1;
  // When it was minted
  google.protobuf.Timestamp created_at = 2;
}

// Request to stop the caller's subscribe URL
message RevokeCalendarFeedRequest {
  // Organization ID
  string organization_id = 1;
  // Calendar the feed reads from
  string calendar_id = 2;
}

// Whether a feed was there to stop
message RevokeCalendarFeedResponse {
  // False when the caller had no feed for this calendar
  bool revoked = 1;
}
