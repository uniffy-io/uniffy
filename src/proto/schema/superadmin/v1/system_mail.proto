syntax = "proto3";

package superadmin.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/superadmin/v1;superadminv1";

// Cross-tenant view of mail infrastructure for platform operators
// (cloud admins / self-hosted owners). Every RPC requires the caller
// to have ``User.is_system_admin=true``. The service is read-only
// except for two narrowly-scoped destructive operations: removing
// a global suppression entry, and force-clearing one org's mail
// config.
service SystemMailService {
  // Read the effective system mail config. Resolves deployment-tier
  // rows then env defaults, with the source surfaced on the response.
  // Secrets are masked.
  rpc GetSystemMailConfig(GetSystemMailConfigRequest) returns (GetSystemMailConfigResponse) {}

  // Upsert the deployment-tier system mail config. Secrets are
  // encrypted server-side via ``DeploymentCipher`` and stored in
  // ``deployment_settings`` under ``namespace='mail'``. An empty
  // ``smtp_password`` means "leave current value untouched"; explicit
  // clear is via ``ClearSystemMailConfig``. Lets operators bring up the
  // deployment with zero mail env, then configure SMTP from the UI.
  rpc UpdateSystemMailConfig(UpdateSystemMailConfigRequest) returns (UpdateSystemMailConfigResponse) {}

  // Drop every deployment-tier mail row, reverting to the env default
  // (or "unconfigured" when env is also empty). Reason is recorded in
  // the audit log.
  rpc ClearSystemMailConfig(ClearSystemMailConfigRequest) returns (ClearSystemMailConfigResponse) {}

  // Paginated list of every org's mail config summary. No secrets are
  // surfaced; only presence booleans and the test-status metadata.
  rpc ListOrgMailConfigs(ListOrgMailConfigsRequest) returns (ListOrgMailConfigsResponse) {}

  // Wipe every ``mail.*`` setting for one org. Used by operators when
  // a tenant's per-org mail config is broken and the tenant cannot
  // reach the admin UI to fix it themselves. Subsequent sends fall
  // back to the env default.
  rpc ForceClearOrgConfig(ForceClearOrgConfigRequest) returns (ForceClearOrgConfigResponse) {}

  // Paginated list of suppressed addresses across the deployment.
  rpc ListGlobalSuppressions(ListGlobalSuppressionsRequest) returns (ListGlobalSuppressionsResponse) {}

  // Drop one address from the global suppression list. Used to recover
  // a hard-bounced address that has been fixed externally.
  rpc RemoveGlobalSuppression(RemoveGlobalSuppressionRequest) returns (RemoveGlobalSuppressionResponse) {}

  // Paginated feed of mail-send events across the deployment, read
  // from the audit log (``mail.sent`` / ``mail.send_failed`` /
  // ``mail.suppressed``).
  rpc ListGlobalDeliveries(ListGlobalDeliveriesRequest) returns (ListGlobalDeliveriesResponse) {}
}

// Effective system mail config view. Secrets ("smtp_password") are
// reduced to a presence boolean so the UI can render a masked field
// without round-tripping plaintext.
message SystemMailConfigView {
  // True when either a deployment-tier row or an env default supplies
  // at least the required keys (``from_address`` + ``smtp_host``).
  bool configured = 1;

  // Where the effective config came from:
  //   'deployment' -- editable rows in ``deployment_settings``
  //   'env'        -- env defaults at deploy time
  //   'none'       -- nothing configured anywhere
  string effective_source = 11;

  string from_address = 2;
  string from_name = 3;
  string reply_to = 4;
  string smtp_host = 5;
  int32 smtp_port = 6;
  string smtp_username = 7;
  bool smtp_password_set = 8;
  bool smtp_use_tls = 9;
  int32 rate_limit_per_min = 10;
}

message GetSystemMailConfigRequest {}

message GetSystemMailConfigResponse {
  SystemMailConfigView config = 1;
}

message UpdateSystemMailConfigRequest {
  string from_address = 1;
  string from_name = 2;
  string reply_to = 3;
  string smtp_host = 4;
  int32 smtp_port = 5;
  string smtp_username = 6;
  // Empty string = leave existing password untouched. Use
  // ``ClearSystemMailConfig`` to wipe the whole config (or send a
  // non-empty string to overwrite).
  string smtp_password = 7;
  bool smtp_use_tls = 8;
  int32 rate_limit_per_min = 9;
}

message UpdateSystemMailConfigResponse {
  SystemMailConfigView config = 1;
}

message ClearSystemMailConfigRequest {
  // Free-text reason. Recorded in the audit row.
  string reason = 1;
}

message ClearSystemMailConfigResponse {
  // Number of ``mail.*`` deployment_settings rows that were dropped.
  int32 deleted_keys = 1;
}

// One row in the cross-tenant mail-config table.
message OrgMailConfigSummary {
  string organization_id = 1;
  string organization_name = 2;
  string organization_slug = 3;

  // 'org' when the org has its own row, 'env' when it falls back.
  string effective_source = 4;

  // From the org's row (empty when effective_source == 'env').
  string from_address = 5;
  string smtp_host = 6;
  bool smtp_password_set = 7;

  // Last-test metadata (None until the org runs a test send).
  optional google.protobuf.Timestamp verified_at = 8;
  optional google.protobuf.Timestamp last_test_at = 9;
  optional string last_test_status = 10; // 'ok' | 'failed'
}

message ListOrgMailConfigsRequest {
  // 0-indexed page; default 0.
  int32 page = 1;
  // Default 50, max 200.
  int32 page_size = 2;
  // Optional case-insensitive substring filter on org name or slug.
  string search = 3;
  // When true, return only orgs that have a per-org row.
  bool only_with_org_config = 4;
}

message ListOrgMailConfigsResponse {
  repeated OrgMailConfigSummary configs = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ForceClearOrgConfigRequest {
  string organization_id = 1;
  // Free-text reason. Recorded in the audit log row.
  string reason = 2;
}

message ForceClearOrgConfigResponse {
  // Number of ``mail.*`` rows that were dropped.
  int32 deleted_keys = 1;
}

message GlobalSuppressionEntry {
  string id = 1;
  string email = 2;
  // BOUNCED | COMPLAINED | MANUAL
  string reason = 3;
  // Origin tag, e.g. 'smtp_bounce', 'admin:<user-id>'.
  string source = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListGlobalSuppressionsRequest {
  int32 page = 1;
  int32 page_size = 2;
  // Optional case-insensitive substring filter on email.
  string search = 3;
}

message ListGlobalSuppressionsResponse {
  repeated GlobalSuppressionEntry entries = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message RemoveGlobalSuppressionRequest {
  string email = 1;
  string reason = 2;
}

message RemoveGlobalSuppressionResponse {
  bool removed = 1;
}

message GlobalDeliveryEntry {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  // 'mail.sent' | 'mail.send_failed' | 'mail.suppressed'
  string action = 3;
  // 'env' or 'org' depending on which config dispatched.
  string config_source = 4;
  optional string organization_id = 5;
  optional string organization_name = 6;
  optional string recipient = 7;
  optional string template = 8;
  optional string provider_message_id = 9;
  optional string error = 10;
}

message ListGlobalDeliveriesRequest {
  int32 page = 1;
  int32 page_size = 2;
  // Optional org id filter (empty = all orgs).
  string organization_id = 3;
  // Optional outcome filter: 'sent' | 'failed' | 'suppressed' | '' (all).
  string outcome = 4;
}

message ListGlobalDeliveriesResponse {
  repeated GlobalDeliveryEntry entries = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}
