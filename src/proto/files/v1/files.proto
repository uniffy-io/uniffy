syntax = "proto3";

package files.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "tags/v1/tags.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/files/v1;filesv1";

// SERVICE

// FilesService provides file management with streaming upload/download.
service FilesService {
  // === Upload ===

  // Initialize a new upload session, returns upload_id and chunk parameters.
  rpc InitiateUpload(InitiateUploadRequest) returns (InitiateUploadResponse);

  // Upload a single chunk (browser-compatible unary RPC).
  // Call this for each chunk, then call CompleteUpload when done.
  rpc UploadChunk(UploadChunkRequest) returns (UploadChunkResponse);

  // Complete an upload after all chunks have been sent.
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);

  // Stream file chunks to backend (client streaming RPC - server-to-server only).
  // NOTE: This does not work in browsers due to Fetch API limitations.
  rpc UploadChunks(stream UploadChunksRequest) returns (UploadChunksResponse);

  // Get status of an in-progress upload (for resuming after disconnect).
  rpc GetUploadStatus(GetUploadStatusRequest) returns (GetUploadStatusResponse);

  // Abort an in-progress upload.
  rpc AbortUpload(AbortUploadRequest) returns (AbortUploadResponse);

  // === Download (Server Streaming) ===

  // Stream file content from backend to client (server streaming RPC).
  rpc DownloadFile(DownloadFileRequest) returns (stream DownloadFileResponse);

  // Stream file with byte range support for Service Worker media streaming.
  // This RPC supports HTTP Range-like semantics for video/audio seeking.
  rpc StreamFileRange(StreamFileRangeRequest) returns (stream StreamFileRangeResponse);

  // === File CRUD ===

  // Get a file by ID.
  rpc GetFile(GetFileRequest) returns (GetFileResponse);

  // Update file metadata (rename, tags, description).
  rpc UpdateFile(UpdateFileRequest) returns (UpdateFileResponse);

  // Delete a file (soft delete by default).
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);

  // Restore a soft-deleted file.
  rpc RestoreFile(RestoreFileRequest) returns (RestoreFileResponse);

  // List files with pagination and filters.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);

  // === Folders ===

  // Create a new folder.
  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResponse);

  // Update a folder.
  rpc UpdateFolder(UpdateFolderRequest) returns (UpdateFolderResponse);

  // Delete a folder.
  rpc DeleteFolder(DeleteFolderRequest) returns (DeleteFolderResponse);

  // Get the full file/folder tree.
  rpc GetFilesTree(GetFilesTreeRequest) returns (GetFilesTreeResponse);

  // === Batch Folder Creation ===

  // Create a folder tree in a single transaction (for recursive folder upload).
  rpc CreateFolderTree(CreateFolderTreeRequest) returns (CreateFolderTreeResponse);

  // Lazily create or fetch the per-user "Recordings" folder. Idempotent under
  // concurrent invocations across backend instances. Used by the screen
  // recording feature to resolve the upload destination on first record.
  rpc EnsureRecordingsFolder(EnsureRecordingsFolderRequest) returns (EnsureRecordingsFolderResponse);

  // === Bulk Operations ===

  // Move files/folders to a different parent.
  rpc MoveItems(MoveItemsRequest) returns (MoveItemsResponse);

  // Copy files (not folders) to a different location.
  rpc CopyItems(CopyItemsRequest) returns (CopyItemsResponse);

  // Bulk delete multiple files/folders.
  rpc BulkDelete(BulkDeleteRequest) returns (BulkDeleteResponse);

  // Empty trash (permanently delete all soft-deleted files).
  rpc EmptyTrash(EmptyTrashRequest) returns (EmptyTrashResponse);

  // List deleted files and folders (trash).
  rpc ListTrash(ListTrashRequest) returns (ListTrashResponse);

  // Restore a soft-deleted folder (and its contents) back to its parent.
  rpc RestoreFolder(RestoreFolderRequest) returns (RestoreFolderResponse);

  // === Versions ===

  // List version history for a file.
  rpc ListFileVersions(ListFileVersionsRequest) returns (ListFileVersionsResponse);

  // Restore a previous version of a file.
  rpc RestoreFileVersion(RestoreFileVersionRequest) returns (RestoreFileVersionResponse);

  // === Storage Quotas ===

  // Get the organization storage quota configuration.
  rpc GetOrgStorageQuota(GetOrgStorageQuotaRequest) returns (GetOrgStorageQuotaResponse);

  // Set or update the organization storage quota configuration.
  rpc SetOrgStorageQuota(SetOrgStorageQuotaRequest) returns (SetOrgStorageQuotaResponse);

  // Get a user's effective storage quota and current usage.
  rpc GetUserStorageQuota(GetUserStorageQuotaRequest) returns (GetUserStorageQuotaResponse);

  // Set or update a per-user quota override.
  rpc SetUserStorageQuotaOverride(SetUserStorageQuotaOverrideRequest) returns (SetUserStorageQuotaOverrideResponse);

  // Remove a per-user quota override (reverts to org default).
  rpc RemoveUserStorageQuotaOverride(RemoveUserStorageQuotaOverrideRequest) returns (RemoveUserStorageQuotaOverrideResponse);

  // List all per-user quota overrides in an organization.
  rpc ListUserStorageQuotaOverrides(ListUserStorageQuotaOverridesRequest) returns (ListUserStorageQuotaOverridesResponse);

  // Get storage usage for a specific user (own usage for regular users).
  rpc GetStorageUsage(GetStorageUsageRequest) returns (GetStorageUsageResponse);

  // List storage usage for all users in an organization (admin only).
  rpc ListOrgStorageUsage(ListOrgStorageUsageRequest) returns (ListOrgStorageUsageResponse);

  // Recalculate storage usage from actual files (admin, drift correction).
  rpc RecalculateStorageUsage(RecalculateStorageUsageRequest) returns (RecalculateStorageUsageResponse);

  // Pre-check whether an upload of a given size is allowed under quota.
  rpc CheckStorageQuota(CheckStorageQuotaRequest) returns (CheckStorageQuotaResponse);

  // === Saved Filters ===

  // Create a new saved filter.
  rpc CreateSavedFilter(CreateSavedFilterRequest) returns (CreateSavedFilterResponse);

  // Get a saved filter by ID.
  rpc GetSavedFilter(GetSavedFilterRequest) returns (GetSavedFilterResponse);

  // Update a saved filter.
  rpc UpdateSavedFilter(UpdateSavedFilterRequest) returns (UpdateSavedFilterResponse);

  // Delete a saved filter.
  rpc DeleteSavedFilter(DeleteSavedFilterRequest) returns (DeleteSavedFilterResponse);

  // List saved filters for the current user.
  rpc ListSavedFilters(ListSavedFiltersRequest) returns (ListSavedFiltersResponse);
}

// ENUMS

// Upload status for tracking multipart uploads.
enum UploadStatus {
  UPLOAD_STATUS_UNSPECIFIED = 0;
  UPLOAD_STATUS_ACTIVE = 1;
  UPLOAD_STATUS_COMPLETED = 2;
  UPLOAD_STATUS_ABORTED = 3;
  UPLOAD_STATUS_EXPIRED = 4;
}

// Extraction status for full-text search (future feature).
enum ExtractionStatus {
  EXTRACTION_STATUS_UNSPECIFIED = 0;
  EXTRACTION_STATUS_PENDING = 1;
  EXTRACTION_STATUS_PROCESSING = 2;
  EXTRACTION_STATUS_COMPLETED = 3;
  EXTRACTION_STATUS_FAILED = 4;
  EXTRACTION_STATUS_SKIPPED = 5;
}

// Server-side transcode pipeline state. Drives the download gate so the
// browser does not hand the user a `.mp4` labelled file whose bytes are
// still WebM. Files that never need a transcode (Safari path, non-video
// uploads) sit at NOT_NEEDED forever.
enum TranscodeStatus {
  TRANSCODE_STATUS_UNSPECIFIED = 0;
  TRANSCODE_STATUS_NOT_NEEDED = 1;
  TRANSCODE_STATUS_PENDING = 2;
  TRANSCODE_STATUS_PROCESSING = 3;
  TRANSCODE_STATUS_COMPLETED = 4;
  TRANSCODE_STATUS_FAILED = 5;
}

// UPLOAD MESSAGES

message InitiateUploadRequest {
  string organization_id = 1;
  string filename = 2;
  string mime_type = 3;
  // Expected total size in bytes. Pass 0 for streaming uploads where the final
  // size is unknown (e.g. screen recording / MediaRecorder). For 0-size
  // streams, the upfront quota check is deferred to CompleteUpload, which
  // verifies the actual byte count before creating the File row.
  int64 total_size = 4;
  optional string folder_id = 5;
  common.v1.AccessMode access_mode = 6;
  optional common.v1.ContentRole baseline_role = 7;
}

message InitiateUploadResponse {
  string upload_id = 1;
  int32 chunk_size = 2; // Recommended chunk size in bytes
  // Expected number of chunks. 0 when total_size was 0 (unknown). Clients
  // streaming an unknown-size upload must not rely on this for progress UI.
  int32 total_chunks = 3;
}

message UploadChunkRequest {
  string upload_id = 1;
  int32 chunk_number = 2; // 1-indexed
  bytes data = 3;
  bool is_last = 4;
}

message UploadChunksRequest {
  string upload_id = 1;
  int32 chunk_number = 2; // 1-indexed
  bytes data = 3;
  bool is_last = 4;
}

message UploadChunkResponse {
  bool success = 1;
  int32 chunk_number = 2; // Confirmed chunk number
  int32 chunks_received = 3; // Total chunks received so far
}

message CompleteUploadRequest {
  string upload_id = 1;
  // Optional unified-tag ids to assign on upload completion (manual source).
  repeated string tag_ids = 2;
}

message UploadChunksResponse {
  File file = 1; // The completed file
}

message CompleteUploadResponse {
  File file = 1; // The completed file
}

message GetUploadStatusRequest {
  string upload_id = 1;
}

message GetUploadStatusResponse {
  string upload_id = 1;
  repeated int32 completed_chunks = 2;
  int32 total_chunks = 3;
  UploadStatus status = 4;
  string filename = 5;
  int64 total_size = 6;
}

message AbortUploadRequest {
  string upload_id = 1;
}

message AbortUploadResponse {
  bool success = 1;
  string message = 2;
}

// DOWNLOAD MESSAGES

message DownloadFileRequest {
  string file_id = 1;
  string organization_id = 2;
  optional string version_id = 3; // Download specific version
}

message DownloadFileResponse {
  bytes data = 1;
  int32 chunk_number = 2;
  int32 total_chunks = 3;
  // First chunk includes metadata
  optional string filename = 4;
  optional string mime_type = 5;
  optional int64 total_size = 6;
}

// Request for range-based file streaming (used by Service Worker for media).
message StreamFileRangeRequest {
  string file_id = 1;
  string organization_id = 2;
  optional int64 start_byte = 3; // Range start (inclusive), default 0
  optional int64 end_byte = 4; // Range end (inclusive), default EOF
}

// Response for range-based file streaming.
message StreamFileRangeResponse {
  bytes data = 1;
  int64 total_size = 2; // Total file size (for Content-Length)
  int64 range_start = 3; // Actual range start returned
  int64 range_end = 4; // Actual range end returned
  string mime_type = 5; // For Content-Type header
  string filename = 6; // For Content-Disposition
  bool is_first_chunk = 7; // Metadata only meaningful in first chunk
}

// FILE MESSAGES

message File {
  string id = 1;
  string urn = 2;
  string organization_id = 3;
  string owner_id = 4;
  common.v1.AccessMode access_mode = 5;
  string filename = 6;
  string original_filename = 7;
  string mime_type = 8;
  int64 size_bytes = 9;
  optional string folder_id = 10;
  optional string description = 11;
  int32 version = 12;
  ExtractionStatus extraction_status = 13;
  bool is_deleted = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  optional google.protobuf.Timestamp deleted_at = 17;

  // Sharing info (populated based on context)
  repeated string group_ids = 18;
  common.v1.ContentRole user_role = 19;
  optional FileOwner owner_info = 20;

  // Media metadata (extracted from file content)
  optional FileMetadata metadata = 21;

  // Baseline role granted by access mode (when applicable)
  optional common.v1.ContentRole baseline_role = 22;

  // Unified tags assigned to this file (manual source, hydrated server-side).
  repeated tags.v1.Tag tags = 23;

  // Server-side transcode pipeline state. UI uses this to gate the download
  // button while a WebM screen recording is being remuxed to MP4.
  TranscodeStatus transcode_status = 24;
}

// Wrapper so the caller can distinguish "leave tags alone" from
// "clear all tags" on partial updates. Mirrors NoteTagIds.
message FileTagIds {
  repeated string ids = 1;
}

// Metadata extracted from media files (images, videos, PDFs).
message FileMetadata {
  bool has_thumbnail = 1;
  optional int32 width = 2; // Image/video width in pixels
  optional int32 height = 3; // Image/video height in pixels
  optional string format = 4; // Format details (e.g., "JPEG", "PNG")
  optional string color_mode = 5; // Color mode (e.g., "RGB", "CMYK")
  optional float duration_seconds = 6; // Video/audio duration
  optional int32 page_count = 7; // PDF page count
  map<string, string> exif = 8; // EXIF data for images
  optional string error = 9; // Error message if extraction failed
  optional int32 bitrate = 10; // Audio bitrate in bits/sec
  optional int32 sample_rate = 11; // Audio sample rate in Hz
  optional int32 channels = 12; // Number of audio channels
}

message FileOwner {
  string id = 1;
  string name = 2;
  string email = 3;
}

message GetFileResponse {
  File file = 1;
}

message UpdateFileResponse {
  File file = 1;
}

message RestoreFileResponse {
  File file = 1;
}

message RestoreFileVersionResponse {
  File file = 1;
}

message GetFileRequest {
  string file_id = 1;
  string organization_id = 2;
}

message UpdateFileRequest {
  string file_id = 1;
  string organization_id = 2;
  optional string filename = 3;
  optional string description = 4;
  optional common.v1.AccessMode access_mode = 5;
  optional common.v1.ContentRole baseline_role = 6;
  // Replacement set of unified-tag ids. Empty list clears all manual tags.
  // Field unset (HasField=false) leaves manual tags untouched.
  optional FileTagIds tag_ids = 7;
}

message DeleteFileRequest {
  string file_id = 1;
  string organization_id = 2;
  bool permanent = 3;
}

message DeleteFileResponse {
  bool success = 1;
  string message = 2;
}

message RestoreFileRequest {
  string file_id = 1;
  string organization_id = 2;
}

message ListFilesRequest {
  string organization_id = 1;
  optional string folder_id = 2; // null = root, "all" = all files
  bool include_deleted = 3;
  bool personal_only = 4;
  optional common.v1.AccessMode access_mode = 5;
  optional string group_id = 6;
  int32 page = 7;
  int32 page_size = 8;
  string sort_by = 9; // created_at, updated_at, filename, size
  string sort_order = 10; // asc, desc
  bool shared_only = 11; // Filter for files shared with user (not owned)
  // Filter to files carrying every tag id in this list (logical AND).
  // Empty = no tag filter.
  repeated string tag_ids = 12;
}

message ListFilesResponse {
  repeated File files = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
  int32 total_pages = 5;
}

// FOLDER MESSAGES

message Folder {
  string id = 1;
  string urn = 2;
  string organization_id = 3;
  string owner_id = 4;
  common.v1.AccessMode access_mode = 5;
  string name = 6;
  optional string parent_id = 7;
  bool is_deleted = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  bool is_system = 11; // System folders (e.g., Attachments) cannot be deleted
  optional common.v1.ContentRole baseline_role = 12;
}

message CreateFolderResponse {
  Folder folder = 1;
}

message UpdateFolderResponse {
  Folder folder = 1;
}

message EnsureRecordingsFolderResponse {
  Folder folder = 1;
}

message RestoreFolderResponse {
  Folder folder = 1;
}

message CreateFolderRequest {
  string organization_id = 1;
  string name = 2;
  optional string parent_id = 3;
  common.v1.AccessMode access_mode = 4;
  optional common.v1.ContentRole baseline_role = 5;
}

message UpdateFolderRequest {
  string folder_id = 1;
  string organization_id = 2;
  optional string name = 3;
  optional string parent_id = 4; // "" to move to root
  optional common.v1.AccessMode access_mode = 5;
  optional common.v1.ContentRole baseline_role = 6;
}

message DeleteFolderRequest {
  string folder_id = 1;
  string organization_id = 2;
  bool permanent = 3;
  bool recursive = 4; // Also delete contents
}

message DeleteFolderResponse {
  bool success = 1;
  string message = 2;
  int32 files_deleted = 3;
  int32 folders_deleted = 4;
}

// TREE MESSAGES

message GetFilesTreeRequest {
  string organization_id = 1;
  optional string root_folder_id = 2; // null = entire tree
  bool include_files = 3; // Include files in tree nodes
  bool personal_only = 4;
}

message GetFilesTreeResponse {
  repeated TreeNode nodes = 1;
}

message TreeNode {
  string id = 1;
  string name = 2;
  bool is_folder = 3;
  optional string parent_id = 4;
  common.v1.AccessMode access_mode = 5;
  int32 child_count = 6; // For folders: number of children
  optional int64 size_bytes = 7; // For files: file size
  optional string mime_type = 8; // For files: MIME type
  repeated TreeNode children = 9; // Nested children (if requested)
  optional common.v1.ContentRole baseline_role = 10;
}

// BULK OPERATION MESSAGES

message MoveItemsRequest {
  string organization_id = 1;
  repeated string file_ids = 2;
  repeated string folder_ids = 3;
  optional string target_folder_id = 4; // null = root
  optional common.v1.AccessMode target_access_mode = 5; // Change access mode
  optional common.v1.ContentRole target_baseline_role = 6;
}

message MoveItemsResponse {
  bool success = 1;
  string message = 2;
  int32 files_moved = 3;
  int32 folders_moved = 4;
}

message CopyItemsRequest {
  string organization_id = 1;
  repeated string file_ids = 2; // Only files can be copied
  optional string target_folder_id = 3;
}

message CopyItemsResponse {
  bool success = 1;
  string message = 2;
  repeated File copied_files = 3;
}

message BulkDeleteRequest {
  string organization_id = 1;
  repeated string file_ids = 2;
  repeated string folder_ids = 3;
  bool permanent = 4;
}

message BulkDeleteResponse {
  bool success = 1;
  string message = 2;
  int32 files_deleted = 3;
  int32 folders_deleted = 4;
}

message EmptyTrashRequest {
  string organization_id = 1;
}

message EmptyTrashResponse {
  bool success = 1;
  string message = 2;
  int32 files_deleted = 3;
  int32 folders_deleted = 4;
}

message ListTrashRequest {
  string organization_id = 1;
}

message ListTrashResponse {
  repeated File files = 1;
  repeated Folder folders = 2;
}

message RestoreFolderRequest {
  string folder_id = 1;
  string organization_id = 2;
}

// VERSION MESSAGES

message FileVersion {
  string id = 1;
  string file_id = 2;
  int32 version_number = 3;
  int64 size_bytes = 4;
  optional string checksum_sha256 = 5;
  string uploaded_by = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListFileVersionsRequest {
  string file_id = 1;
  string organization_id = 2;
}

message ListFileVersionsResponse {
  repeated FileVersion versions = 1;
}

message RestoreFileVersionRequest {
  string file_id = 1;
  string organization_id = 2;
  string version_id = 3;
}

// SAVED FILTER MESSAGES

// Filter criteria for file search/filtering.
message FilterCriteria {
  repeated string extensions = 1; // File extensions without dot (pdf, docx)
  repeated string mime_categories = 2; // document, image, video, audio, archive
  repeated string owner_ids = 3; // Filter by owner user IDs
  optional common.v1.AccessMode access_mode = 4; // Filter by access mode
  optional int64 size_min_bytes = 5; // Minimum file size
  optional int64 size_max_bytes = 6; // Maximum file size
  optional google.protobuf.Timestamp created_after = 7; // Created after date
  optional google.protobuf.Timestamp created_before = 8; // Created before date
  // Filter to files carrying every tag id in this list (logical AND).
  repeated string tag_ids = 9;
}

// Icon value for saved filters (Phosphor icon or emoji).
message IconValue {
  string type = 1; // "icon" for Phosphor icons, "emoji" for emojis
  string value = 2; // Icon name (e.g., "Funnel") or emoji character
}

// A saved file filter configuration.
message SavedFilter {
  string id = 1;
  string user_id = 2;
  string organization_id = 3;
  string name = 4;
  optional string description = 5;
  optional IconValue icon = 12; // Optional icon for the filter
  FilterCriteria criteria = 6;
  bool is_preset = 7;
  optional string sort_by = 8;
  optional string sort_order = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message CreateSavedFilterResponse {
  SavedFilter filter = 1;
}

message GetSavedFilterResponse {
  SavedFilter filter = 1;
}

message UpdateSavedFilterResponse {
  SavedFilter filter = 1;
}

message CreateSavedFilterRequest {
  string organization_id = 1;
  string name = 2;
  optional string description = 3;
  optional IconValue icon = 7; // Optional icon for the filter
  FilterCriteria criteria = 4;
  optional string sort_by = 5;
  optional string sort_order = 6;
}

message GetSavedFilterRequest {
  string filter_id = 1;
  string organization_id = 2;
}

message UpdateSavedFilterRequest {
  string filter_id = 1;
  string organization_id = 2;
  optional string name = 3;
  optional string description = 4;
  optional IconValue icon = 8; // Optional icon for the filter
  optional FilterCriteria criteria = 5;
  optional string sort_by = 6;
  optional string sort_order = 7;
}

message DeleteSavedFilterRequest {
  string filter_id = 1;
  string organization_id = 2;
}

message DeleteSavedFilterResponse {
  bool success = 1;
  string message = 2;
}

message ListSavedFiltersRequest {
  string organization_id = 1;
  bool include_presets = 2; // Include system presets in results
}

message ListSavedFiltersResponse {
  repeated SavedFilter filters = 1;
}

// STORAGE QUOTA MESSAGES

// Organization-level quota configuration.
message OrgStorageQuota {
  string id = 1;
  string organization_id = 2;
  optional int64 org_quota_bytes = 3;
  optional int64 default_user_quota_bytes = 4;
  int32 warn_at_percent = 5;
  bool enforce = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message GetOrgStorageQuotaRequest {
  string organization_id = 1;
}

message GetOrgStorageQuotaResponse {
  OrgStorageQuota quota = 1;
  int64 total_used_bytes = 2;
  int32 total_file_count = 3;
}

message SetOrgStorageQuotaRequest {
  string organization_id = 1;
  optional int64 org_quota_bytes = 2;
  optional int64 default_user_quota_bytes = 3;
  optional int32 warn_at_percent = 4;
  optional bool enforce = 5;
}

message SetOrgStorageQuotaResponse {
  OrgStorageQuota quota = 1;
}

// Per-user quota override.
message UserStorageQuotaOverrideInfo {
  string id = 1;
  string organization_id = 2;
  string user_id = 3;
  int64 quota_bytes = 4;
  optional string note = 5;
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message GetUserStorageQuotaRequest {
  string organization_id = 1;
  string user_id = 2;
}

message GetUserStorageQuotaResponse {
  optional int64 effective_quota_bytes = 1;
  int64 used_bytes = 2;
  int32 file_count = 3;
  float usage_percent = 4;
  optional UserStorageQuotaOverrideInfo override = 5;
}

message SetUserStorageQuotaOverrideRequest {
  string organization_id = 1;
  string user_id = 2;
  int64 quota_bytes = 3;
  optional string note = 4;
}

message SetUserStorageQuotaOverrideResponse {
  UserStorageQuotaOverrideInfo override = 1;
}

message RemoveUserStorageQuotaOverrideRequest {
  string organization_id = 1;
  string user_id = 2;
}

message RemoveUserStorageQuotaOverrideResponse {
  bool success = 1;
}

message ListUserStorageQuotaOverridesRequest {
  string organization_id = 1;
}

message ListUserStorageQuotaOverridesResponse {
  repeated UserStorageQuotaOverrideInfo overrides = 1;
}

// Storage usage tracking.
message StorageUsageInfo {
  string user_id = 1;
  string organization_id = 2;
  int64 used_bytes = 3;
  int32 file_count = 4;
  optional int64 effective_quota_bytes = 5;
  float usage_percent = 6;
  bool has_override = 7;
  optional google.protobuf.Timestamp last_recalculated_at = 8;
}

message GetStorageUsageRequest {
  string organization_id = 1;
  optional string user_id = 2;
}

message GetStorageUsageResponse {
  StorageUsageInfo usage = 1;
}

message ListOrgStorageUsageRequest {
  string organization_id = 1;
}

message ListOrgStorageUsageResponse {
  repeated StorageUsageInfo users = 1;
  int64 total_used_bytes = 2;
  int32 total_file_count = 3;
}

message RecalculateStorageUsageRequest {
  string organization_id = 1;
  optional string user_id = 2;
}

message RecalculateStorageUsageResponse {
  repeated StorageUsageInfo recalculated = 1;
}

message CheckStorageQuotaRequest {
  string organization_id = 1;
  int64 additional_bytes = 2;
}

message CheckStorageQuotaResponse {
  bool allowed = 1;
  string reason = 2;
  int64 current_used_bytes = 3;
  optional int64 quota_bytes = 4;
  optional int64 remaining_bytes = 5;
  float usage_percent = 6;
}

// Batch folder creation for recursive folder upload.
message FolderTreeNode {
  string name = 1;
  repeated FolderTreeNode children = 2;
}

message CreatedFolderInfo {
  string id = 1;
  string name = 2;
  string path = 3;
  optional string parent_id = 4;
}

message CreateFolderTreeRequest {
  string organization_id = 1;
  optional string parent_folder_id = 2;
  repeated FolderTreeNode tree = 3;
  common.v1.AccessMode access_mode = 4;
  optional common.v1.ContentRole baseline_role = 5;
}

message CreateFolderTreeResponse {
  repeated CreatedFolderInfo folders = 1;
}

message EnsureRecordingsFolderRequest {
  string organization_id = 1;
}
