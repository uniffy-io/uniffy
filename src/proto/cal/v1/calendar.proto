syntax = "proto3";

package cal.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "tags/v1/tags.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/cal/v1;calv1";

// Enums

// Recurrence patterns for repeating events
enum RecurrencePattern {
  RECURRENCE_PATTERN_UNSPECIFIED = 0;
  RECURRENCE_PATTERN_NONE = 1;
  RECURRENCE_PATTERN_DAILY = 2;
  RECURRENCE_PATTERN_WEEKLY = 3;
  RECURRENCE_PATTERN_BIWEEKLY = 4;
  RECURRENCE_PATTERN_MONTHLY = 5;
  RECURRENCE_PATTERN_YEARLY = 6;
}

// Days of the week
enum DayOfWeek {
  DAY_OF_WEEK_UNSPECIFIED = 0;
  DAY_OF_WEEK_MONDAY = 1;
  DAY_OF_WEEK_TUESDAY = 2;
  DAY_OF_WEEK_WEDNESDAY = 3;
  DAY_OF_WEEK_THURSDAY = 4;
  DAY_OF_WEEK_FRIDAY = 5;
  DAY_OF_WEEK_SATURDAY = 6;
  DAY_OF_WEEK_SUNDAY = 7;
}

// Attendee response status
enum AttendeeStatus {
  ATTENDEE_STATUS_UNSPECIFIED = 0;
  ATTENDEE_STATUS_PENDING = 1;
  ATTENDEE_STATUS_ACCEPTED = 2;
  ATTENDEE_STATUS_TENTATIVE = 3;
  ATTENDEE_STATUS_DECLINED = 4;
}

// What an entry in an event's activity log records
enum EventActivityAction {
  EVENT_ACTIVITY_ACTION_UNSPECIFIED = 0;
  EVENT_ACTIVITY_ACTION_CREATED = 1;
  EVENT_ACTIVITY_ACTION_TITLE_CHANGED = 2;
  EVENT_ACTIVITY_ACTION_SCHEDULE_CHANGED = 3;
  EVENT_ACTIVITY_ACTION_LOCATION_CHANGED = 4;
  EVENT_ACTIVITY_ACTION_MEETING_CHANGED = 5;
  EVENT_ACTIVITY_ACTION_DESCRIPTION_CHANGED = 6;
  EVENT_ACTIVITY_ACTION_CATEGORY_CHANGED = 7;
  EVENT_ACTIVITY_ACTION_CALENDAR_CHANGED = 8;
  EVENT_ACTIVITY_ACTION_RECURRENCE_CHANGED = 9;
  EVENT_ACTIVITY_ACTION_REMINDERS_CHANGED = 10;
  EVENT_ACTIVITY_ACTION_ATTENDEES_ADDED = 11;
  EVENT_ACTIVITY_ACTION_ATTENDEES_REMOVED = 12;
  EVENT_ACTIVITY_ACTION_RESPONSE_CHANGED = 13;
  EVENT_ACTIVITY_ACTION_FIELD_UPDATED = 14;
}

// Attendee role in the event
enum AttendeeRole {
  ATTENDEE_ROLE_UNSPECIFIED = 0;
  ATTENDEE_ROLE_ORGANIZER = 1;
  ATTENDEE_ROLE_REQUIRED = 2;
  ATTENDEE_ROLE_OPTIONAL = 3;
}

// Linked resource types
enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  RESOURCE_TYPE_NOTE = 1;
  RESOURCE_TYPE_FILE = 2;
  RESOURCE_TYPE_CHAT = 3;
}

// Scope for editing or deleting recurring events
enum RecurrenceEditScope {
  RECURRENCE_EDIT_SCOPE_UNSPECIFIED = 0;
  RECURRENCE_EDIT_SCOPE_THIS_EVENT = 1;
  RECURRENCE_EDIT_SCOPE_ALL_EVENTS = 2;
  RECURRENCE_EDIT_SCOPE_THIS_AND_FOLLOWING = 3;
}

// Service Definition

// CalendarService provides calendar and event management functionality
service CalendarService {
  // === Event Operations ===

  // Create a new calendar event
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse) {}

  // Get an event by ID
  rpc GetEvent(GetEventRequest) returns (GetEventResponse) {}

  // Update an existing event
  rpc UpdateEvent(UpdateEventRequest) returns (UpdateEventResponse) {}

  // Delete an event (soft delete)
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse) {}

  // List events with filters (date range, calendar, category, etc.)
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {}

  // Get events for a specific date range (optimized for calendar views)
  rpc GetEventsInRange(GetEventsInRangeRequest) returns (GetEventsInRangeResponse) {}

  // === Category Operations ===

  // Create a new category
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse) {}

  // Get a category by ID
  rpc GetCategory(GetCategoryRequest) returns (GetCategoryResponse) {}

  // Update a category
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse) {}

  // Delete a category
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse) {}

  // List categories
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse) {}

  // === Attendee Operations ===

  // Update attendee response status
  rpc UpdateAttendeeStatus(UpdateAttendeeStatusRequest) returns (UpdateAttendeeStatusResponse) {}

  // Add attendees to an event
  rpc AddAttendees(AddAttendeesRequest) returns (AddAttendeesResponse) {}

  // Remove attendees from an event
  rpc RemoveAttendees(RemoveAttendeesRequest) returns (RemoveAttendeesResponse) {}

  // === Activity Operations ===

  // List the activity log for an event, newest first
  rpc ListEventActivities(ListEventActivitiesRequest) returns (ListEventActivitiesResponse) {}

  // === Template Operations ===

  // Create a new event template
  rpc CreateEventTemplate(CreateEventTemplateRequest) returns (CreateEventTemplateResponse) {}

  // Get an event template by ID
  rpc GetEventTemplate(GetEventTemplateRequest) returns (GetEventTemplateResponse) {}

  // Update an existing event template
  rpc UpdateEventTemplate(UpdateEventTemplateRequest) returns (UpdateEventTemplateResponse) {}

  // Delete an event template
  rpc DeleteEventTemplate(DeleteEventTemplateRequest) returns (DeleteEventTemplateResponse) {}

  // List event templates
  rpc ListEventTemplates(ListEventTemplatesRequest) returns (ListEventTemplatesResponse) {}
}

// Event Messages

// Calendar event
message CalendarEvent {
  // Unique event identifier
  string id = 1;
  // Organization ID (multi-tenancy)
  string organization_id = 2;
  // Event title
  string title = 3;
  // Event description (markdown with URN mentions)
  string description = 4;
  // Start time
  google.protobuf.Timestamp start_time = 5;
  // End time
  google.protobuf.Timestamp end_time = 6;
  // Whether this is an all-day event
  bool is_all_day = 7;
  // Timezone identifier (e.g., 'America/New_York')
  string timezone = 8;
  // Event location (physical or virtual)
  string location = 9;
  // Meeting URL (Zoom, Google Meet, etc.)
  optional string meeting_url = 10;
  // Calendar ID this event belongs to
  string calendar_id = 11;
  // Category ID for color coding
  string category_id = 12;
  // List of attendees
  repeated Attendee attendees = 13;
  // User ID of the event creator/organizer
  string organizer_id = 14;
  // Recurrence configuration
  optional RecurrenceConfig recurrence = 15;
  // Whether this event is marked as focus/deep work time
  bool is_focus_time = 16;
  // Linked resources (notes, files, chats)
  repeated LinkedResource linked_resources = 17;
  // Is deleted flag (soft delete)
  bool is_deleted = 19;
  // URNs referenced in this event's description (outgoing links)
  repeated string outgoing_references = 20;
  // Created timestamp
  google.protobuf.Timestamp created_at = 21;
  // Updated timestamp
  google.protobuf.Timestamp updated_at = 22;
  // Deleted timestamp (if soft-deleted)
  optional google.protobuf.Timestamp deleted_at = 23;
  // Reminder intervals in minutes before event (e.g., 15, 30, 60, 1440)
  repeated int32 reminders = 24;
  // Whether this is a recurring event (has recurrence pattern other than NONE)
  bool is_recurring = 25;
  // If this is an override of a recurring occurrence, the master event ID
  optional string recurrence_id = 26;
  // For expanded instances: the specific occurrence date (YYYY-MM-DD)
  optional string occurrence_date = 27;
  // Room booking fields (read-only, populated by handler)
  optional string room_id = 28;
  optional string room_name = 29;
  optional string room_location = 30;
  optional int32 room_capacity = 31;
  repeated string room_amenities = 32;
  // Hydrated tags applied to this event (server-side from TagOperations).
  repeated tags.v1.Tag tags = 34;
  // Bound chat channel for a Uniffy online meeting. When set, this event is a
  // Uniffy meeting and join resolves to this channel's call. Mutually exclusive
  // with meeting_url.
  optional string channel_id = 35;
  // True when channel_id points at a room auto-created for this event.
  bool channel_auto_created = 36;
  // Caller's effective role on this event, so the client can render read-only
  // affordances instead of controls every write would reject.
  common.v1.ContentRole user_role = 37;
}

// Event attendee
message Attendee {
  // User ID
  string id = 1;
  // Display name
  string name = 2;
  // Email address
  string email = 3;
  // Avatar URL
  optional string avatar_url = 4;
  // Initials for avatar fallback
  string initials = 5;
  // Response status
  AttendeeStatus status = 6;
  // Role in the event
  AttendeeRole role = 7;
  // Timezone
  optional string timezone = 8;
  // Group that produced this attendee row at invite time (snapshot; empty for direct invites)
  optional string invited_via_group_id = 9;
}

// Recurrence configuration
message RecurrenceConfig {
  // The recurrence pattern
  RecurrencePattern pattern = 1;
  // Interval between recurrences (e.g., every 2 weeks)
  int32 interval = 2;
  // Days of the week for weekly recurrence
  repeated DayOfWeek days_of_week = 3;
  // Day of the month for monthly recurrence
  optional int32 day_of_month = 4;
  // End date for recurrence
  optional google.protobuf.Timestamp end_date = 5;
  // Maximum number of occurrences
  optional int32 max_occurrences = 6;
}

// Linked resource (note, file, or chat)
message LinkedResource {
  // Resource ID (URN)
  string id = 1;
  // Resource type
  ResourceType type = 2;
  // Display name
  string name = 3;
  // URL for navigation
  optional string url = 4;
}

// Request to create an event
message CreateEventRequest {
  // Organization ID
  string organization_id = 1;
  // Event title
  string title = 2;
  // Event description (optional)
  optional string description = 3;
  // Start time
  google.protobuf.Timestamp start_time = 4;
  // End time
  google.protobuf.Timestamp end_time = 5;
  // Whether this is an all-day event
  bool is_all_day = 6;
  // Timezone identifier
  optional string timezone = 7;
  // Event location
  optional string location = 8;
  // Meeting URL
  optional string meeting_url = 9;
  // Calendar ID
  string calendar_id = 10;
  // Category ID
  optional string category_id = 11;
  // Attendee user IDs
  repeated string attendee_ids = 12;
  // Recurrence configuration
  optional RecurrenceConfig recurrence = 13;
  // Whether this event is focus time
  bool is_focus_time = 14;
  // Linked resource URNs
  repeated string linked_resource_urns = 15;
  // Reminder intervals in minutes before event (e.g., 15, 30, 60, 1440)
  repeated int32 reminders = 17;
  // Optional room ID to book alongside the event
  optional string room_id = 18;
  // Optional unified-tag ids to assign on create
  repeated string tag_ids = 20;
  // Optional channel to bind as a Uniffy online meeting. Mutually exclusive
  // with meeting_url.
  optional string channel_id = 21;
  // Set when channel_id points at a room auto-created for this event.
  optional bool channel_auto_created = 22;
}

// Request to get an event
message GetEventRequest {
  // Event ID
  string event_id = 1;
  // Organization ID
  string organization_id = 2;
}

// Request to update an event
message UpdateEventRequest {
  // Event ID
  string event_id = 1;
  // Organization ID
  string organization_id = 2;
  // Updated title
  optional string title = 3;
  // Updated description
  optional string description = 4;
  // Updated start time
  optional google.protobuf.Timestamp start_time = 5;
  // Updated end time
  optional google.protobuf.Timestamp end_time = 6;
  // Updated all-day flag
  optional bool is_all_day = 7;
  // Updated timezone
  optional string timezone = 8;
  // Updated location
  optional string location = 9;
  // Updated meeting URL
  optional string meeting_url = 10;
  // Updated calendar ID
  optional string calendar_id = 11;
  // Updated category ID
  optional string category_id = 12;
  // Updated recurrence
  optional RecurrenceConfig recurrence = 13;
  // Updated focus time flag
  optional bool is_focus_time = 14;
  // Updated linked resource URNs (replaces existing)
  repeated string linked_resource_urns = 15;
  // Updated attendee IDs (replaces existing list)
  repeated string attendee_ids = 17;
  // Updated reminder intervals in minutes before event
  repeated int32 reminders = 18;
  // Edit scope for recurring events
  optional RecurrenceEditScope recurrence_edit_scope = 19;
  // For THIS_EVENT scope: the specific occurrence date being edited (YYYY-MM-DD)
  optional string occurrence_date = 20;
  // Optional room ID to book/change for this event
  optional string room_id = 21;
  // Replacement set of unified-tag ids. Empty list clears all manual tags.
  // Field is unset (HasField=false) to leave manual tags untouched.
  optional EventTagIds tag_ids = 23;
  // Channel binding. Empty string (HasField true) clears the binding; unset
  // leaves it untouched. Mirrors room_id set/clear handling.
  optional string channel_id = 24;
  // Marks the bound channel as a room auto-created for this event. Sent
  // alongside a new channel_id; unset leaves the flag untouched.
  optional bool channel_auto_created = 25;
}

// Wrapper so the caller can distinguish "leave tags alone" from
// "clear all tags" (proto3 cannot tell an empty repeated apart from
// an unset one). Mirrors NoteTagIds / FileTagIds.
message EventTagIds {
  repeated string ids = 1;
}

// Request to delete an event
message DeleteEventRequest {
  // Event ID
  string event_id = 1;
  // Organization ID
  string organization_id = 2;
  // Permanent delete flag (default: false for soft delete)
  bool permanent = 3;
  // Edit scope for recurring events
  optional RecurrenceEditScope recurrence_edit_scope = 4;
  // For THIS_EVENT scope: the specific occurrence date being deleted (YYYY-MM-DD)
  optional string occurrence_date = 5;
}

// Response for delete event operation
message DeleteEventResponse {
  bool success = 1;
  string message = 2;
}

// Response containing an event (Create)
message CreateEventResponse {
  CalendarEvent event = 1;
}

// Response containing an event (Get)
message GetEventResponse {
  CalendarEvent event = 1;
}

// Response containing an event (Update)
message UpdateEventResponse {
  CalendarEvent event = 1;
}

// Response containing an event (AddAttendees)
message AddAttendeesResponse {
  CalendarEvent event = 1;
}

// Response containing an event (RemoveAttendees)
message RemoveAttendeesResponse {
  CalendarEvent event = 1;
}

// Request to list events
message ListEventsRequest {
  // Organization ID
  string organization_id = 1;
  // Optional calendar ID filter
  optional string calendar_id = 2;
  // Optional category ID filter
  optional string category_id = 3;
  // Optional start date filter
  optional google.protobuf.Timestamp start_date = 4;
  // Optional end date filter
  optional google.protobuf.Timestamp end_date = 5;
  // Include deleted events
  bool include_deleted = 6;
  // Pagination: page number (1-indexed)
  int32 page = 7;
  // Pagination: page size (default: 50, max: 100)
  int32 page_size = 8;
  // Sort by field (start_time, created_at, title)
  string sort_by = 9;
  // Sort order (asc, desc)
  string sort_order = 10;
  // Filter events that have ALL of the provided tag ids (logical AND).
  repeated string tag_ids = 11;
}

// Response for listing events
message ListEventsResponse {
  repeated CalendarEvent events = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
  int32 total_pages = 5;
}

// Request to get events in a date range (optimized for calendar views)
message GetEventsInRangeRequest {
  // Organization ID
  string organization_id = 1;
  // Start of range
  google.protobuf.Timestamp start_date = 2;
  // End of range
  google.protobuf.Timestamp end_date = 3;
  // Optional calendar IDs to filter by (empty = all visible calendars)
  repeated string calendar_ids = 4;
  // Optional category IDs to filter by
  repeated string category_ids = 5;
}

// Response for events in range
message GetEventsInRangeResponse {
  repeated CalendarEvent events = 1;
}

// Category Messages

// Event category for color coding and filtering
message Category {
  // Unique category identifier
  string id = 1;
  // Organization ID
  string organization_id = 2;
  // Category display name
  string name = 3;
  // Category color (hex)
  string color = 4;
  // Optional icon or emoji
  optional string icon = 5;
  // Whether this is a default/system category
  bool is_default = 6;
  // Display order
  int32 sort_order = 7;
  // Created timestamp
  google.protobuf.Timestamp created_at = 8;
  // Updated timestamp
  google.protobuf.Timestamp updated_at = 9;
}

// Request to create a category
message CreateCategoryRequest {
  // Organization ID
  string organization_id = 1;
  // Category name
  string name = 2;
  // Color (hex)
  string color = 3;
  // Icon or emoji
  optional string icon = 4;
}

// Request to get a category
message GetCategoryRequest {
  // Category ID
  string category_id = 1;
  // Organization ID
  string organization_id = 2;
}

// Request to update a category
message UpdateCategoryRequest {
  // Category ID
  string category_id = 1;
  // Organization ID
  string organization_id = 2;
  // Updated name
  optional string name = 3;
  // Updated color
  optional string color = 4;
  // Updated icon
  optional string icon = 5;
  // Updated sort order
  optional int32 sort_order = 6;
}

// Request to delete a category
message DeleteCategoryRequest {
  // Category ID
  string category_id = 1;
  // Organization ID
  string organization_id = 2;
}

// Response for delete category operation
message DeleteCategoryResponse {
  bool success = 1;
  string message = 2;
}

// Response containing a category (Create)
message CreateCategoryResponse {
  Category category = 1;
}

// Response containing a category (Get)
message GetCategoryResponse {
  Category category = 1;
}

// Response containing a category (Update)
message UpdateCategoryResponse {
  Category category = 1;
}

// Request to list categories
message ListCategoriesRequest {
  // Organization ID
  string organization_id = 1;
}

// Response for listing categories
message ListCategoriesResponse {
  repeated Category categories = 1;
}

// Attendee Messages

// Request to update attendee status
message UpdateAttendeeStatusRequest {
  // Event ID
  string event_id = 1;
  // Organization ID
  string organization_id = 2;
  // New status
  AttendeeStatus status = 3;
}

// Response for update attendee status
message UpdateAttendeeStatusResponse {
  bool success = 1;
  string message = 2;
}

// Request to add attendees
message AddAttendeesRequest {
  // Event ID
  string event_id = 1;
  // Organization ID
  string organization_id = 2;
  // User IDs to add
  repeated string user_ids = 3;
  // Role for new attendees
  AttendeeRole role = 4;
}

// Request to remove attendees
message RemoveAttendeesRequest {
  // Event ID
  string event_id = 1;
  // Organization ID
  string organization_id = 2;
  // User IDs to remove
  repeated string user_ids = 3;
}

// Activity Messages

// One entry in an event's activity log
message EventActivity {
  // Unique activity identifier
  string id = 1;
  // Event the entry belongs to
  string event_id = 2;
  // User who performed the action
  string actor_id = 3;
  // What happened
  EventActivityAction action = 4;
  // When it happened
  google.protobuf.Timestamp timestamp = 5;
  // Field the change applies to, when the action is field-scoped
  optional string field_id = 6;
  // Value before the change
  optional string previous_value = 7;
  // Value after the change
  optional string new_value = 8;
}

// Request to list an event's activity log
message ListEventActivitiesRequest {
  // Organization ID
  string organization_id = 1;
  // Event ID (an occurrence id resolves to its series master)
  string event_id = 2;
  // Optional pagination
  optional common.v1.PaginationRequest pagination = 3;
}

// Response with the event's activity log, newest first
message ListEventActivitiesResponse {
  // Activity entries
  repeated EventActivity activities = 1;
  // Pagination info
  common.v1.PaginationResponse pagination = 2;
}

// Template Messages

// Event template
message EventTemplate {
  // Unique template identifier
  string id = 1;
  // Organization ID
  string organization_id = 2;
  // Template title
  string title = 3;
  // Template description
  string description = 4;
  // Default duration in minutes
  int32 duration_minutes = 5;
  // Location
  string location = 6;
  // Meeting URL
  string meeting_url = 7;
  // Category ID
  string category_id = 8;
  // Tags
  repeated string tags = 9;
  // Access mode
  common.v1.AccessMode access_mode = 10;
  // Creator ID
  string created_by = 11;
  // Created timestamp
  google.protobuf.Timestamp created_at = 12;
  // Updated timestamp
  google.protobuf.Timestamp updated_at = 13;
  // Baseline role granted by access mode (when applicable)
  optional common.v1.ContentRole baseline_role = 14;
}

message CreateEventTemplateRequest {
  string organization_id = 1;
  string title = 2;
  string description = 3;
  int32 duration_minutes = 4;
  string location = 5;
  string meeting_url = 6;
  string category_id = 7;
  repeated string tags = 8;
  common.v1.AccessMode access_mode = 9;
  optional common.v1.ContentRole baseline_role = 10;
}

message GetEventTemplateRequest {
  string template_id = 1;
  string organization_id = 2;
}

message UpdateEventTemplateRequest {
  string template_id = 1;
  string organization_id = 2;
  optional string title = 3;
  optional string description = 4;
  optional int32 duration_minutes = 5;
  optional string location = 6;
  optional string meeting_url = 7;
  optional string category_id = 8;
  repeated string tags = 9;
  optional common.v1.AccessMode access_mode = 10;
  optional common.v1.ContentRole baseline_role = 11;
}

message DeleteEventTemplateRequest {
  string template_id = 1;
  string organization_id = 2;
}

message DeleteEventTemplateResponse {
  bool success = 1;
  string message = 2;
}

message CreateEventTemplateResponse {
  EventTemplate template = 1;
}

message GetEventTemplateResponse {
  EventTemplate template = 1;
}

message UpdateEventTemplateResponse {
  EventTemplate template = 1;
}

message ListEventTemplatesRequest {
  string organization_id = 1;
}

message ListEventTemplatesResponse {
  repeated EventTemplate templates = 1;
}
