syntax = "proto3";

package support.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/uniffy-io/uniffy-proto-go/support/v1;supportv1";

// Tenant-side consent controls for platform support sessions.
//
// A support session is a time-bound, owner-consented grant that lets a
// platform operator step into a single tenant org. The operator-side
// RPCs (request, cross-tenant listing) live under ``superadmin.v1`` so
// a deployment can firewall the whole operator namespace; the RPCs
// here are the TENANT's half of the contract and must stay reachable
// from the public edge, or org admins lose the ability to approve,
// reject, and revoke sessions.
//
// Two consent modes (deployment policy, per-org tighten-only override):
//
// * ``OWNER_APPROVED`` (default for cloud) -- operator creates a row
//   in ``PENDING``. Org owner must approve before it goes ``ACTIVE``.
// * ``OPERATOR_JUSTIFIED`` -- session goes ``ACTIVE`` immediately;
//   org owner sees the banner and may revoke at any time.
service SupportConsentService {
  // Owner-side: approve a ``PENDING`` session in OWNER_APPROVED mode.
  // Caller must be org OWNER or ADMIN of the target org; a platform
  // admin explicitly does NOT bypass this gate.
  rpc ApproveSession(ApproveSessionRequest) returns (ApproveSessionResponse) {}

  // Owner-side: reject a ``PENDING`` session. Same gate as approve.
  rpc RejectSession(RejectSessionRequest) returns (RejectSessionResponse) {}

  // Either side: revoke an ``ACTIVE`` or ``PENDING`` session early.
  // Org OWNER/ADMIN can always revoke; the support user can always
  // end their own session.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse) {}

  // Owner-side: list sessions targeting one org. Caller must be that
  // org's OWNER or ADMIN. Used by the in-org admin audit view.
  rpc ListOrgSessions(ListOrgSessionsRequest) returns (ListOrgSessionsResponse) {}

  // Read the effective consent policy for one org: deployment
  // default, per-org override (if any), and resolved effective
  // value. Caller must be org OWNER/ADMIN of the target org OR
  // a platform admin.
  rpc GetOrgConsentMode(GetOrgConsentModeRequest) returns (GetOrgConsentModeResponse) {}

  // Set the per-org override. Caller must be org OWNER/ADMIN of
  // the target org. Override can only TIGHTEN the deployment
  // default; attempts to loosen (OWNER_APPROVED -> OPERATOR_JUSTIFIED
  // when deployment is OWNER_APPROVED) are silently coerced back to
  // OWNER_APPROVED.
  rpc SetOrgConsentMode(SetOrgConsentModeRequest) returns (SetOrgConsentModeResponse) {}
}

// Read vs read-write access during a session. v1 ships READ_ONLY
// only; the enum is here for forward compatibility.
enum SupportSessionScope {
  SUPPORT_SESSION_SCOPE_UNSPECIFIED = 0;
  SUPPORT_SESSION_SCOPE_READ_ONLY = 1;
  SUPPORT_SESSION_SCOPE_READ_WRITE = 2;
}

// Lifecycle of a single session row.
enum SupportSessionState {
  SUPPORT_SESSION_STATE_UNSPECIFIED = 0;
  // Operator created the row; awaiting org owner approval.
  SUPPORT_SESSION_STATE_PENDING = 1;
  // Approved (or operator-justified mode) and within ``expires_at``.
  SUPPORT_SESSION_STATE_ACTIVE = 2;
  // ``expires_at`` reached; ARQ cron flipped the row.
  SUPPORT_SESSION_STATE_EXPIRED = 3;
  // Org owner or support user ended it early.
  SUPPORT_SESSION_STATE_REVOKED = 4;
  // Org owner declined the request.
  SUPPORT_SESSION_STATE_REJECTED = 5;
}

message SupportSession {
  string id = 1;
  string organization_id = 2;
  string organization_name = 3;
  string organization_slug = 4;
  string support_user_id = 5;
  string support_user_email = 6;
  optional string support_user_full_name = 7;
  string requested_by_user_id = 8;
  optional string granted_by_user_id = 9;
  optional string granted_by_email = 10;
  optional string revoked_by_user_id = 11;
  optional string revoked_by_email = 12;
  string reason = 13;
  SupportSessionScope scope = 14;
  SupportSessionState state = 15;
  google.protobuf.Timestamp requested_at = 16;
  optional google.protobuf.Timestamp granted_at = 17;
  google.protobuf.Timestamp expires_at = 18;
  optional google.protobuf.Timestamp revoked_at = 19;
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
}

message ApproveSessionRequest {
  string session_id = 1;
}

message ApproveSessionResponse {
  SupportSession session = 1;
}

message RejectSessionRequest {
  string session_id = 1;
  // Optional free-text shown in audit.
  string reason = 2;
}

message RejectSessionResponse {
  SupportSession session = 1;
}

message RevokeSessionRequest {
  string session_id = 1;
  // Optional free-text shown in audit.
  string reason = 2;
}

message RevokeSessionResponse {
  SupportSession session = 1;
}

message ListOrgSessionsRequest {
  string organization_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  bool include_inactive = 4;
}

message ListOrgSessionsResponse {
  repeated SupportSession sessions = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// How a support session goes ACTIVE for a given org. UNSPECIFIED
// when the per-org override is cleared.
enum SupportConsentMode {
  SUPPORT_CONSENT_MODE_UNSPECIFIED = 0;
  SUPPORT_CONSENT_MODE_OWNER_APPROVED = 1;
  SUPPORT_CONSENT_MODE_OPERATOR_JUSTIFIED = 2;
}

message SupportConsentModeView {
  // Deployment-wide policy (env-driven).
  SupportConsentMode deployment_mode = 1;
  // Per-org override row, if one is set.
  SupportConsentMode org_override = 2;
  // Resolved effective mode after the tighten-only rule applies.
  SupportConsentMode effective = 3;
  // True when the org cannot loosen the deployment policy (i.e.
  // deployment is OWNER_APPROVED). UI shows the toggle as locked.
  bool locked_by_deployment = 4;
}

message GetOrgConsentModeRequest {
  string organization_id = 1;
}

message GetOrgConsentModeResponse {
  SupportConsentModeView view = 1;
}

message SetOrgConsentModeRequest {
  string organization_id = 1;
  // Pass UNSPECIFIED to clear the per-org override (fall back to
  // deployment default).
  SupportConsentMode mode = 2;
}

message SetOrgConsentModeResponse {
  SupportConsentModeView view = 1;
}
