syntax = "proto3";

package search.v1;

option go_package = "github.com/uniffy-io/uniffy-proto-go/search/v1;searchv1";

// The unified search service handling global search and URN resolution.
// Index writes happen server-side in domain operations; there is no
// client-facing indexing RPC.
service SearchService {
  // Perform a global search across all entities (Spotlight-like)
  rpc Search(SearchRequest) returns (SearchResponse) {}

  // Get all content that references a specific URN (universal backlinks)
  rpc GetReferences(GetReferencesRequest) returns (GetReferencesResponse) {}

  // Resolve metadata for a batch of URNs
  rpc ResolveUrns(ResolveUrnsRequest) returns (ResolveUrnsResponse) {}

  // Org-wide mention graph: URN reference edges from content the caller can access
  rpc GetContentGraph(GetContentGraphRequest) returns (GetContentGraphResponse) {}
}

enum SearchResultType {
  SEARCH_RESULT_TYPE_UNSPECIFIED = 0;
  SEARCH_RESULT_TYPE_NOTE = 1;
  SEARCH_RESULT_TYPE_FILE = 2;
  SEARCH_RESULT_TYPE_CHAT = 3;
  SEARCH_RESULT_TYPE_USER = 4;
  SEARCH_RESULT_TYPE_CALENDAR_EVENT = 5;
  SEARCH_RESULT_TYPE_PROJECT = 6;
  SEARCH_RESULT_TYPE_TASK = 7;
  SEARCH_RESULT_TYPE_AGENT = 8;
  SEARCH_RESULT_TYPE_CHAT_MESSAGE = 9;
  SEARCH_RESULT_TYPE_ROOM = 10;
  SEARCH_RESULT_TYPE_AGENT_CHAT = 11;
  SEARCH_RESULT_TYPE_TAG = 12;
  SEARCH_RESULT_TYPE_FOLDER = 13;
  SEARCH_RESULT_TYPE_AGENT_FOLDER = 14;
  SEARCH_RESULT_TYPE_TEAM = 15;
  SEARCH_RESULT_TYPE_AGENT_CRON_TASK = 16;
}

enum UrnAvailability {
  URN_AVAILABILITY_UNSPECIFIED = 0;
  URN_AVAILABILITY_AVAILABLE = 1;
  URN_AVAILABILITY_RESTRICTED = 2;
  URN_AVAILABILITY_DELETED = 3;
  URN_AVAILABILITY_UNAVAILABLE = 4;
}

message SearchRequest {
  string organization_id = 1;
  string query = 2;
  repeated SearchResultType type_filters = 3;
  int32 limit = 4;

  // Advanced filters (parsed from query or set explicitly)
  repeated string tag_filters = 5;
  repeated string project_filters = 6;
  bool my_content_only = 7;
  string owner_filter = 8;

  // Metadata field filters (e.g., {"channel_id": "uuid"} for chat message scoping)
  map<string, string> metadata_filters = 9;

  // Pagination offset into the result set (max_total_hits caps the window)
  int32 offset = 10;

  // Client ranking context: listed types float to the top in this order.
  // Applied within match-strength buckets, so a weak (typo/partial) match
  // never outranks a full match via its type alone.
  repeated SearchResultType type_priority = 11;

  // Match against titles/names only, skipping content, description, and tags.
  // Mention pickers use this so a shared email domain or body text does not
  // pull in every document; general search leaves it off.
  bool name_matches_only = 12;
}

message SearchResponse {
  repeated SearchResultItem items = 1;
  reserved 2;
  reserved "total_count";
  // True only when another PostgreSQL-authorized result exists inside the bounded scan horizon.
  bool has_more = 3;
  // Authorized-stream offset to send in the next SearchRequest.
  int32 next_offset = 4;
}

message SearchResultItem {
  string urn = 1; // Universal Resource Name (urn:uniffy:note:uuid)
  string title = 2;
  string description = 3; // Snippet or subtitle
  SearchResultType type = 4;
  string url = 5; // Frontend route path
  double score = 6; // Relevance score
  map<string, string> metadata = 7; // Extra icon info, etc.
  repeated string tags = 8; // Tags associated with the content
  // Match-highlighted variants: matched spans wrapped in U+E000/U+E001
  // markers, description cropped around the match. Empty without a text query.
  string title_highlighted = 9;
  string description_highlighted = 10;
}

// Request to get content that references a specific URN
message GetReferencesRequest {
  string organization_id = 1;
  // URN to find references to (e.g., urn:uniffy:content:NOTE:uuid)
  string target_urn = 2;
  // Optional: filter by content type
  repeated SearchResultType type_filters = 3;
  // Max results (default: 50)
  int32 limit = 4;
}

// Response with content that references the target URN
message GetReferencesResponse {
  // Content items that reference the target URN
  repeated SearchResultItem items = 1;
  // Total count of references
  int32 total_count = 2;
}

// Request with batch of URNs to resolve
message ResolveUrnsRequest {
  string organization_id = 1;
  // URNs to resolve (max 100)
  repeated string urns = 2;
}

// Response with resolved URN metadata
message ResolveUrnsResponse {
  // Map of URN -> resolved metadata (missing URNs omitted)
  map<string, UrnMetadata> resolved = 1;
}

message GetContentGraphRequest {
  string organization_id = 1;
}

// One outgoing mention: source content references target content
message ContentGraphEdge {
  string source_urn = 1;
  string target_urn = 2;
}

message GetContentGraphResponse {
  repeated ContentGraphEdge edges = 1;
  // True when a per-type row cap clipped the edge set
  bool truncated = 2;
}

// Lightweight metadata for a URN
message UrnMetadata {
  string title = 1;
  string description = 2;
  SearchResultType type = 3;
  string url = 4;
  map<string, string> metadata = 5;

  // Live state fields for mention enrichment
  string status = 10; // task status, project status
  string due_date = 11; // task due date (ISO date string)
  string assignee_name = 12; // task assignee display name
  string processing_status = 15; // file extraction/processing status
  int32 completed_tasks = 16; // project completed task count
  int32 total_tasks = 17; // project total task count
  int32 member_count = 18; // group/chat member count
  string updated_by_name = 19; // who last modified the content

  // Task enrichment
  string priority = 20; // task priority option ID
  string priority_label = 21; // resolved label (e.g., "High")
  string priority_color = 22; // resolved hex color (e.g., "#ef4444")
  string status_label = 23; // resolved label (e.g., "In Progress")
  string status_color = 24; // resolved hex color (e.g., "#3b82f6")
  string task_type = 25; // task/bug/feature/story/epic
  int32 task_number = 26; // sequential number within project
  string project_name = 27; // parent project name
  string project_slug = 28; // parent project slug for "SLUG-123" display
  string project_color = 29; // parent project hex color
  int32 subtask_completed = 30; // completed subtask count
  int32 subtask_total = 31; // total subtask count
  int32 blocked_by_count = 32; // number of blocking tasks

  // Calendar enrichment
  string event_start_time = 33; // ISO datetime
  string event_end_time = 34; // ISO datetime
  bool event_is_all_day = 35; // all-day flag
  string event_location = 36; // location text
  string event_meeting_url = 37; // video call URL
  string event_channel_id = 49; // bound chat channel for a Uniffy online meeting

  // File enrichment
  string file_mime_type = 38; // MIME type
  int64 file_size = 39; // size in bytes

  // Note enrichment
  string note_node_type = 40; // NOTE/FOLDER/TEMPLATE/CANVAS

  // Chat enrichment
  string channel_type = 41; // PUBLIC/PRIVATE/DIRECT/GROUP_DM

  // Agent enrichment
  string agent_emoji = 42; // avatar emoji
  string agent_theme_color = 43; // theme color hex

  // User enrichment
  string user_avatar_url = 44; // avatar image URL
  string user_email = 45; // email address

  // Shared
  repeated string assignee_ids = 46; // user IDs for avatar rendering
  repeated string content_tags = 47; // content tags

  // Deprecated compatibility projection. "DELETED" is emitted only when
  // availability is URN_AVAILABILITY_DELETED.
  string urn_status = 48;

  // Authorization-safe state of the referenced resource. Restricted results
  // contain no title, description, URL, metadata, or owner information.
  UrnAvailability availability = 50;
  bool can_request_access = 51;
}
