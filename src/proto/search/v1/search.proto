syntax = "proto3";

package search.v1;

option go_package = "github.com/uniffy-io/uniffy-proto-go/search/v1;searchv1";

import "google/protobuf/timestamp.proto";

// The unified search service handling global search and indexing
service SearchService {
  // Perform a global search across all entities (Spotlight-like)
  rpc Search(SearchRequest) returns (SearchResponse) {}

  // Index an item (Internal use, or called by other services)
  rpc IndexItem(IndexItemRequest) returns (IndexItemResponse) {}

  // Remove an item from the index
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse) {}

  // Get all content that references a specific URN (universal backlinks)
  rpc GetReferences(GetReferencesRequest) returns (GetReferencesResponse) {}

  // Resolve metadata for a batch of URNs
  rpc ResolveUrns(ResolveUrnsRequest) returns (ResolveUrnsResponse) {}
}

enum SearchResultType {
  SEARCH_RESULT_TYPE_UNSPECIFIED    = 0;
  SEARCH_RESULT_TYPE_NOTE           = 1;
  SEARCH_RESULT_TYPE_FILE           = 2;
  SEARCH_RESULT_TYPE_CHAT           = 3;
  SEARCH_RESULT_TYPE_USER           = 4;
  SEARCH_RESULT_TYPE_CALENDAR_EVENT = 5;
  SEARCH_RESULT_TYPE_PROJECT        = 6;
  SEARCH_RESULT_TYPE_TASK           = 7;
  SEARCH_RESULT_TYPE_AGENT          = 8;
  SEARCH_RESULT_TYPE_PROMPT         = 9;
}

message SearchRequest {
  string                    organization_id = 1;
  string                    query           = 2;
  repeated SearchResultType type_filters    = 3;
  int32                     limit           = 4;

  // Advanced filters (parsed from query or set explicitly)
  repeated string tag_filters     = 5;
  repeated string project_filters = 6;
  bool            my_content_only = 7;
  string          owner_filter    = 8;
}

message SearchResponse {
  repeated SearchResultItem items = 1;
}

message SearchResultItem {
  string              urn         = 1; // Universal Resource Name (urn:uniffy:note:uuid)
  string              title       = 2;
  string              description = 3; // Snippet or subtitle
  SearchResultType    type        = 4;
  string              url         = 5; // Frontend route path
  double              score       = 6; // Relevance score
  map<string, string> metadata    = 7; // Extra icon info, etc.
  repeated string     tags        = 8; // Tags associated with the content
}

message IndexItemRequest {
  string              organization_id = 1;
  string              urn             = 2;
  SearchResultType    type            = 3;
  string              title           = 4;
  string              content         = 5; // Content to be indexed for full text
  string              url             = 6;
  map<string, string> metadata        = 7;
}

message IndexItemResponse {
  bool success = 1;
}

message DeleteItemRequest {
  string urn             = 1;
  string organization_id = 2;
}

message DeleteItemResponse {
  bool success = 1;
}

// Request to get content that references a specific URN
message GetReferencesRequest {
  string organization_id = 1;
  // URN to find references to (e.g., urn:uniffy:content:NOTE:uuid)
  string target_urn = 2;
  // Optional: filter by content type
  repeated SearchResultType type_filters = 3;
  // Max results (default: 50)
  int32 limit = 4;
}

// Response with content that references the target URN
message GetReferencesResponse {
  // Content items that reference the target URN
  repeated SearchResultItem items = 1;
  // Total count of references
  int32 total_count = 2;
}

// Request with batch of URNs to resolve
message ResolveUrnsRequest {
  string organization_id = 1;
  // URNs to resolve (max 100)
  repeated string urns = 2;
}

// Response with resolved URN metadata
message ResolveUrnsResponse {
  // Map of URN -> resolved metadata (missing URNs omitted)
  map<string, UrnMetadata> resolved = 1;
}

// Lightweight metadata for a URN
message UrnMetadata {
  string              title       = 1;
  string              description = 2;
  SearchResultType    type        = 3;
  string              url         = 4;
  map<string, string> metadata    = 5;

  // Live state fields for mention enrichment
  string status             = 10;  // task status, project status
  string due_date           = 11;  // task due date (ISO date string)
  string assignee_name      = 12;  // task assignee display name
  string processing_status  = 15;  // file extraction/processing status
  int32  completed_tasks    = 16;  // project completed task count
  int32  total_tasks        = 17;  // project total task count
  int32  member_count       = 18;  // group/chat member count
  string updated_by_name    = 19;  // who last modified the content
}
