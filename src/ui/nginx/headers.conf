# Response headers for every static response. nginx drops inherited
# add_header lines as soon as a location adds its own, so each location
# that sets Cache-Control includes this file again.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# frame-ancestors cannot live in the app's CSP meta tag; the rest of the
# policy is owned by that tag and must not be repeated here.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
