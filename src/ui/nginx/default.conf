# Frontend server: static assets only. The gateway in front owns /api,
# /livekit, and the backend's /healthz. Listens on 8080 as the unprivileged
# nginx user; pid and temp paths under /tmp come from the base image.

# Merged into the stock mime.types, which lacks both.
types {
    application/javascript mjs;
    application/manifest+json webmanifest;
}

map $http_user_agent $loggable {
    ~^kube-probe 0;
    default 1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    access_log /var/log/nginx/access.log combined if=$loggable;

    include /etc/nginx/uniffy-headers.conf;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/manifest+json application/wasm;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Misrouted API traffic gets a clear 404 instead of the app shell.
    location ^~ /api/ {
        return 404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/uniffy-headers.conf;
    }

    # Service worker: always revalidate so a new version is picked up on the
    # next update check.
    location = /notification-worker.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/uniffy-headers.conf;
    }

    # The shell is revalidated on every load so a deploy is visible at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/uniffy-headers.conf;
    }

    location ~* \.(ico|png|svg|jpg|jpeg|gif|webp|woff|woff2|ttf|eot|webmanifest|json|txt|xml)$ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public";
        include /etc/nginx/uniffy-headers.conf;
    }

    location / {
        try_files $uri /index.html;
    }
}
