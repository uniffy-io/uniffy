<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for service boxes -->
    <linearGradient id="notesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="filesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="spacesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="calendarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="booksGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DB2777;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="passwordsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="workflowsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    
    <!-- Glow filter for center -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#F8FAFC"/>
  
  <!-- Connection lines (behind everything) -->
  <g stroke="#CBD5E1" stroke-width="2" fill="none">
    <!-- Notes connections -->
    <path d="M 300 180 Q 380 250 450 290" stroke-dasharray="5,5"/>
    <path d="M 280 200 Q 200 280 150 340"/>
    <path d="M 320 200 Q 400 320 420 400"/>
    
    <!-- Files connections -->
    <path d="M 150 380 Q 280 350 450 320"/>
    <path d="M 150 420 Q 200 480 280 520"/>
    
    <!-- Chat connections -->
    <path d="M 320 520 Q 380 450 450 350"/>
    <path d="M 360 500 Q 500 480 620 460"/>
    
    <!-- Spaces connections (thicker, to AI) -->
    <path d="M 660 420 Q 580 380 500 340" stroke="#F59E0B" stroke-width="3"/>
    <path d="M 700 440 Q 720 350 700 260"/>
    <path d="M 680 480 Q 600 540 500 560"/>
    
    <!-- Calendar connections -->
    <path d="M 700 220 Q 580 250 500 300"/>
    <path d="M 750 240 Q 780 320 780 420"/>
    
    <!-- Books connections -->
    <path d="M 780 480 Q 680 500 580 520"/>
    <path d="M 800 520 Q 700 580 580 600"/>
    
    <!-- Passwords connections -->
    <path d="M 540 600 Q 500 550 470 400"/>
    
    <!-- Workflows connections -->
    <path d="M 200 600 Q 300 550 400 400"/>
    <path d="M 180 560 Q 150 480 150 400"/>
  </g>
  
  <!-- Center hub: Universal Reference System -->
  <g filter="url(#glow)">
    <circle cx="450" cy="350" r="70" fill="url(#centerGrad)"/>
    <text x="450" y="340" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold">@</text>
    <text x="450" y="365" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="11">Universal</text>
    <text x="450" y="380" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="11">Reference</text>
  </g>
  
  <!-- Service: Notes -->
  <g filter="url(#shadow)" transform="translate(220, 120)">
    <rect width="140" height="80" rx="16" fill="url(#notesGrad)"/>
    <text x="70" y="35" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">📝</text>
    <text x="70" y="55" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Notes</text>
    <text x="70" y="70" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="10">Wiki + Backlinks</text>
  </g>
  
  <!-- Service: Files -->
  <g filter="url(#shadow)" transform="translate(60, 340)">
    <rect width="140" height="80" rx="16" fill="url(#filesGrad)"/>
    <text x="70" y="35" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">📁</text>
    <text x="70" y="55" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Files</text>
    <text x="70" y="70" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="10">Storage + Preview</text>
  </g>
  
  <!-- Service: Chat -->
  <g filter="url(#shadow)" transform="translate(220, 480)">
    <rect width="140" height="80" rx="16" fill="url(#chatGrad)"/>
    <text x="70" y="35" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">💬</text>
    <text x="70" y="55" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Chat</text>
    <text x="70" y="70" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="10">Real-time Messaging</text>
  </g>
  
  <!-- Service: AI Spaces -->
  <g filter="url(#shadow)" transform="translate(600, 380)">
    <rect width="140" height="80" rx="16" fill="url(#spacesGrad)"/>
    <text x="70" y="35" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">🤖</text>
    <text x="70" y="55" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">AI Spaces</text>
    <text x="70" y="70" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="10">RAG + Knowledge</text>
  </g>
  
  <!-- Service: Calendar -->
  <g filter="url(#shadow)" transform="translate(620, 180)">
    <rect width="140" height="80" rx="16" fill="url(#calendarGrad)"/>
    <text x="70" y="35" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">📅</text>
    <text x="70" y="55" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Calendar</text>
    <text x="70" y="70" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="10">Events + Scheduling</text>
  </g>
  
  <!-- Service: Books -->
  <g filter="url(#shadow)" transform="translate(700, 480)">
    <rect width="140" height="80" rx="16" fill="url(#booksGrad)"/>
    <text x="70" y="35" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">📚</text>
    <text x="70" y="55" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Books</text>
    <text x="70" y="70" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="10">Reading + Highlights</text>
  </g>
  
  <!-- Service: Passwords -->
  <g filter="url(#shadow)" transform="translate(440, 560)">
    <rect width="140" height="80" rx="16" fill="url(#passwordsGrad)"/>
    <text x="70" y="35" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">🔐</text>
    <text x="70" y="55" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Passwords</text>
    <text x="70" y="70" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="10">Secure Vault</text>
  </g>
  
  <!-- Service: Workflows -->
  <g filter="url(#shadow)" transform="translate(60, 540)">
    <rect width="140" height="80" rx="16" fill="url(#workflowsGrad)"/>
    <text x="70" y="35" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">⚡</text>
    <text x="70" y="55" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Workflows</text>
    <text x="70" y="70" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="10">Automation</text>
  </g>
  
  <!-- Title -->
  <text x="450" y="50" text-anchor="middle" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold">UWOS</text>
  <text x="450" y="75" text-anchor="middle" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="14">Unified Work Operating System</text>
  
  <!-- Legend -->
  <g transform="translate(30, 660)">
    <text x="0" y="0" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="11">MVP Services</text>
    <circle cx="100" cy="-4" r="5" fill="#8B5CF6"/>
    <circle cx="115" cy="-4" r="5" fill="#3B82F6"/>
    <circle cx="130" cy="-4" r="5" fill="#10B981"/>
    <circle cx="145" cy="-4" r="5" fill="#F59E0B"/>
    
    <text x="200" y="0" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="11">Phase 2+</text>
    <circle cx="270" cy="-4" r="5" fill="#EF4444"/>
    <circle cx="285" cy="-4" r="5" fill="#EC4899"/>
    <circle cx="300" cy="-4" r="5" fill="#6366F1"/>
    <circle cx="315" cy="-4" r="5" fill="#14B8A6"/>
  </g>
  
  <!-- Tagline -->
  <text x="870" y="680" text-anchor="end" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic">Everything connected. Everyone aligned.</text>
</svg>
